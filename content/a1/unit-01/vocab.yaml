- id: frau
  de: Frau
  en: Ms, Mrs; woman
  pos: noun
  gender: f
  plural: Frauen
  example: { de: "Das ist Frau Keller.", en: "This is Ms Keller." }
  gswZh: Frau
  tags: [introductions, formal]

- id: wer
  de: wer
  en: who
  pos: pron
  example: { de: "Wer ist das?", en: "Who is that?" }
