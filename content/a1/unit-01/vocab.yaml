- id: wie
  de: wie
  en: how
  pos: adv
  example: { de: "Wie heißen Sie?", en: "What is your name? (literally: How are you called?)" }
  gswZh: wie
  tags: [questions]

- id: wo
  de: wo
  en: where
  pos: adv
  example: { de: "Wo wohnst du?", en: "Where do you live?" }
  gswZh: wo
  tags: [questions]

- id: woher
  de: woher
  en: where from
  pos: adv
  example: { de: "Woher kommen Sie?", en: "Where do you come from?" }
