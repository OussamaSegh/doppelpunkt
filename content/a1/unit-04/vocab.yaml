# ---------- meals and everyday things ----------
- id: mittagessen
  de: Mittagessen
  en: lunch
  pos: noun
  gender: n
  plural: Mittagessen
  example: { de: "Das Mittagessen ist um zwölf.", en: "Lunch is at twelve." }
  gswZh: Zmittag (de Zmittag)
  tags: [meals]

- id: abendessen
  de: Abendessen
  en: dinner, supper
  pos: noun
  gender: n
  plural: Abendessen
  example: { de: "Das Abendessen kocht Anna.", en: "Anna cooks dinner." }
  chStd: Nachtessen
  gswZh: Znacht (s Znacht)
  gswBe: Znacht / Zaabe (ds Zaabe)
  tags: [meals, helvetism]

- id: pause
  de: Pause
  en: break
  pos: noun
  gender: f
  plural: Pausen
  example: { de: "Um zehn Uhr ist Pause.", en: "There's a break at ten o'clock." }
  chStd: Pause; the snack in it is the Znüni (morning) or Zvieri (afternoon)
  gswZh: Pause / Znünipause
  tags: [routine, meals, helvetism]

- id: zeitung
  de: Zeitung
  en: newspaper
  pos: noun
  gender: f
  plural: Zeitungen
  example: { de: "Tom liest die Zeitung.", en: "Tom reads the newspaper." }
  gswZh: Ziitig
  tags: [routine]
