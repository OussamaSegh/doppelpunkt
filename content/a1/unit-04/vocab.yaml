- id: tag
  de: Tag
  en: day
  pos: noun
  gender: m
  plural: Tage
  example: { de: "Mein Tag fängt früh an.", en: "My day starts early." }
  gswZh: Tag
  tags: [time, day]

- id: woche
  de: Woche
  en: week
  pos: noun
  gender: f
  plural: Wochen
  example: { de: "Die Woche hat sieben Tage.", en: "The week has seven days." }
