- id: dienstag
  de: Dienstag
  en: Tuesday
  pos: noun
  gender: m
  plural: Dienstage
  example: { de: "Am Dienstag arbeite ich bis sechs.", en: "On Tuesday I work until six." }
  gswZh: Ziischtig
  gswBe: Zyschtig / Zyschti
  tags: [days]

- id: mittwoch
  de: Mittwoch
  en: Wednesday
  pos: noun
  gender: m
  plural: Mittwoche
  example: { de: "Am Mittwoch kaufe ich ein.", en: "On Wednesday I go shopping." }
