- id: montag
  de: Montag
  en: Monday
  pos: noun
  gender: m
  plural: Montage
  example: { de: "Am Montag fängt der Kurs an.", en: "The course starts on Monday." }
  gswZh: Mäntig
  gswBe: Mänti / Määndi
