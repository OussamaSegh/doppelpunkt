# ---------- verbs ----------
- id: einsteigen
  de: einsteigen
  en: to get on (a bus, train)
  pos: verb
  example: { de: "Im Tram steigen Sie vorne ein.", en: "On the tram you get on at the front." }
  gswZh: iistiige
  tags: [transport, separable]

- id: aussteigen
  de: aussteigen
  en: to get off
  pos: verb
  example: { de: "Steigen Sie an der dritten Haltestelle aus.", en: "Get off at the third stop." }
  gswZh: uusstiige
  tags: [transport, separable]

- id: umsteigen
  de: umsteigen
  en: to change (trains, buses)
  pos: verb
  example: { de: "Muss ich umsteigen?", en: "Do I have to change?" }
  gswZh: umstiige
  tags: [transport, separable]

- id: abfahren
  de: abfahren
  en: to leave, to depart
  pos: verb
  example: { de: "Der Bus fährt um acht ab.", en: "The bus leaves at eight." }
  gswZh: abfahre (de Zug fahrt ab)
  tags: [transport, separable, stem-change]

- id: dauern
  de: dauern
  en: to take (time), to last
  pos: verb
  example: { de: "Wie lange dauert die Fahrt?", en: "How long does the journey take?" }
  gswZh: duure
  tags: [time, verbs]

- id: muessen
  de: müssen
  en: must, to have to
  pos: verb
  example: { de: "Ich muss am Bahnhof umsteigen.", en: "I have to change at the station." }
  gswZh: müese (ich mues, du muesch, mir müend)
  gswBe: müesse (i mues, mir müesse)
  tags: [modal, verbs]

- id: duerfen
  de: dürfen
  en: may, to be allowed to
  pos: verb
  example: { de: "Hier darf man nicht parken.", en: "You mustn't park here." }
  gswZh: dörfe (ich dörf, du dörfsch, mir dörfed; darf is also heard)
  tags: [modal, verbs]

