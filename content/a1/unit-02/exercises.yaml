  prompt: "Recognition: how would the Zurich waitress ask this? (Common spellings are accepted.)"
  from: de
  to: gsw-zh
  source: Zusammen oder getrennt?
  answers: ["Zäme oder separat?", "Zäme oder getrännt?", "Zäme oder separaat?"]
  explanation: >-
    zusammen → zäme. For "separately" Swiss speakers usually say separat (from French) or getrännt.
    zäme is one of the most frequent Swiss words: mir gönd zäme = we go together.

- id: a1-u02-ch-mcq-schale
