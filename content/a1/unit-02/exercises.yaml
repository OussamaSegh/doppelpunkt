  prompt: "Sandra orders \"e Schale\". What does she get?"
  options: ["A coffee with lots of milk", "A bowl of soup", "A glass of beer", "A cup of tea"]
  answer: 0
  explanation: >-
    In Swiss cafés e Schale (eine Schale) is coffee with lots of milk – like a café au lait. A Kafi Crème
    is a normal coffee with a little cream, and e Stange is a small glass of draught beer.

- id: a1-u02-roleplay-reto
  type: roleplay
  skill: listening
  variety: gsw-zh
  grammar: [moechte, numbers]
  tutor: reto
  prompt: "Listening roleplay with Reto: he's the waiter in a Zurich café."
  scenario: >-
    Reto works in a café in Zurich and speaks Zurich German. You answer in Standard German. Understand
    his questions and the price.
  goals:
    - Understand "Was dörfs sii?" and order something.
    - Understand "Suscht no öppis?" and answer.
    - Understand "Zäme oder separat?" and the price in dialect.
  model: |
    Reto: Grüezi! Was dörfs sii?
    Du: Guten Tag! Ich hätte gern einen Kaffee, bitte.
    Reto: En Kafi Crème? Gärn. Suscht no öppis?
    Du: Ja, ein Gipfeli, bitte.
    Reto: Es Gipfeli, guet. … So, bitte schön. Wänd Sie grad zahle?
    Du: Ja, gern.
    Reto: Das macht sibe Franke.
    Du: Hier sind zehn Franken.
    Reto: Merci vilmal! Drü Franke zrugg. En schöne Tag no!
    Du: Danke, auf Wiedersehen!
  explanation: >-
    Decoding: dörfs sii = darf es sein; suscht no öppis = sonst noch etwas; wänd Sie = wollen Sie;
    grad = gleich/jetzt; sibe = sieben; drü Franke zrugg = drei Franken zurück. Numbers and prices are
    the hardest part to catch – ask "Wie viel, bitte?" if needed.
