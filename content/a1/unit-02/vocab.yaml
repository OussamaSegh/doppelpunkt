# Numbers
- id: eins
  de: eins
  en: one
  pos: num
  example: { de: "Eins, zwei, drei – los!", en: "One, two, three – go!" }
  gswZh: eis / eins
  gswBe: eis
  tags: [numbers]

- id: zwei
  de: zwei
  en: two
  pos: num
  example: { de: "Zwei Kaffee, bitte.", en: "Two coffees, please." }
  gswZh: "zwei (older forms: zwee m. / zwo f. / zwei n.)"
  gswBe: zwöi
  tags: [numbers]

- id: drei
  de: drei
  en: three
  pos: num
  example: { de: "Das macht drei Franken.", en: "That's three francs." }
  gswZh: drü
  gswBe: drü
  tags: [numbers]

- id: vier
  de: vier
  en: four
  pos: num
  example: { de: "Ein Kaffee kostet vier Franken achtzig.", en: "A coffee costs four francs eighty." }
  gswZh: vier
  tags: [numbers]

- id: fuenf
  de: fünf
  en: five
  pos: num
  example: { de: "Der Kuchen kostet fünf Franken siebzig.", en: "The cake costs five francs seventy." }
  gswZh: föif
  gswBe: füf
  tags: [numbers]

- id: sechs
  de: sechs
  en: six
  pos: num
  example: { de: "Wir sind sechs Personen.", en: "There are six of us." }
  gswZh: sächs
  tags: [numbers]

- id: sieben
  de: sieben
  en: seven
  pos: num
  example: { de: "Das macht sieben Franken.", en: "That's seven francs." }
  gswZh: sibe
  tags: [numbers]

- id: acht
  de: acht
  en: eight
  pos: num
  example: { de: "Acht Gipfeli, bitte!", en: "Eight croissants, please!" }
  gswZh: acht
  tags: [numbers]

- id: neun
  de: neun
  en: nine
  pos: num
  example: { de: "Das Bier kostet neun Franken.", en: "The beer costs nine francs." }
  gswZh: nüün
  gswBe: nün
  tags: [numbers]

- id: zehn
  de: zehn
  en: ten
  pos: num
  example: { de: "Hier sind zehn Franken.", en: "Here are ten francs." }
  gswZh: zää / zäh / zä
  gswBe: zäh
  tags: [numbers]

- id: zwanzig
  de: zwanzig
  en: twenty
  pos: num
  example: { de: "Hier sind zwanzig Franken. Stimmt so.", en: "Here are twenty francs. Keep the change." }
  gswZh: zwänzg
  tags: [numbers]

- id: fuenfzig
  de: fünfzig
  en: fifty
  pos: num
  example: { de: "Das macht zwölf Franken fünfzig.", en: "That's twelve francs fifty." }
  gswZh: füfzg
  tags: [numbers]

- id: hundert
  de: hundert
  en: (one) hundred
  pos: num
  example: { de: "Das kostet hundert Franken!", en: "That costs a hundred francs!" }
  gswZh: hundert
  tags: [numbers]

# Café
- id: kaffee
  de: Kaffee
  en: coffee
  pos: noun
  gender: m
  plural: Kaffees
  example: { de: "Ich möchte einen Kaffee, bitte.", en: "I'd like a coffee, please." }
  gswZh: Kafi (en Kafi; en Kafi Crème = coffee with cream)
  gswBe: Kafi
  tags: [cafe, drinks]

- id: tee
  de: Tee
  en: tea
  pos: noun
  gender: m
  plural: Tees
  example: { de: "Ich nehme einen Tee.", en: "I'll have a tea." }
  gswZh: Tee (en Tee)
  tags: [cafe, drinks]

- id: wasser
  de: Wasser
  en: water
  pos: noun
  gender: n
  plural: Wasser
  example: { de: "Möchten Sie ein Wasser?", en: "Would you like some water?" }
  chStd: Mineralwasser / Mineral (bottled); Hahnenwasser (tap water)
  gswZh: Wasser / Mineral (es Mineral mit oder ohni = sparkling or still); Hahnewasser (tap water)
  tags: [cafe, drinks]

- id: milch
  de: Milch
  en: milk
  pos: noun
  gender: f
  plural: "-"
  example: { de: "Einen Tee mit Milch, bitte.", en: "A tea with milk, please." }
  gswZh: Milch
