# Verbs and phrases
- id: moechten
  de: möchten
  en: would like
  pos: verb
  example: { de: "Was möchtest du?", en: "What would you like?" }
  gswZh: möchte (ich möcht, du möchtsch / möchtisch, mir möchted)
  tags: [ordering]

- id: nehmen
  de: nehmen
  en: to take; to have (when ordering)
  pos: verb
  example: { de: "Ich nehme einen Tee. Was nimmst du?", en: "I'll have a tea. What are you having?" }
  gswZh: näh (ich nimm, du nimmsch, er nimmt)
  tags: [ordering]

- id: trinken
  de: trinken
  en: to drink
  pos: verb
  example: { de: "Was trinkst du?", en: "What are you drinking?" }
  gswZh: trinke
  tags: [ordering]

- id: kosten
  de: kosten
  en: to cost
  pos: verb
  example: { de: "Was kostet ein Kaffee?", en: "How much is a coffee?" }
  gswZh: choschte (Was choschtet das?)
  tags: [money]

- id: zahlen
  de: zahlen
  en: to pay
  pos: verb
  example: { de: "Wir möchten zahlen, bitte.", en: "We'd like to pay, please." }
  gswZh: zahle
  tags: [money]

- id: ich-haette-gern
  de: Ich hätte gern ...
  en: I'd like ... (very polite)
  pos: phrase
  example: { de: "Ich hätte gern ein Wasser.", en: "I'd like a water." }
  gswZh: Ich hett gärn ... / Ich hett gern ...
  tags: [ordering]

- id: das-macht
  de: Das macht ...
  en: That comes to ... / That's ...
  pos: phrase
  example: { de: "Das macht neun Franken fünfzig.", en: "That's nine francs fifty." }
  gswZh: Das macht ...
  tags: [money]

- id: sonst-noch-etwas
  de: Sonst noch etwas?
  en: Anything else?
  pos: phrase
  example: { de: "Ein Kaffee. Sonst noch etwas?", en: "One coffee. Anything else?" }
  gswZh: Suscht no öppis? / Süscht no öppis?
  gswBe: Süsch no öppis?
  tags: [ordering]

- id: zusammen
  de: zusammen
  en: together
  pos: adv
  example: { de: "Zusammen oder getrennt?", en: "Together or separately?" }
  gswZh: zäme
  tags: [money]

- id: stimmt-so
  de: Stimmt so.
  en: Keep the change.
  pos: phrase
  example: { de: "Hier sind zehn Franken. Stimmt so.", en: "Here are ten francs. Keep the change." }
  gswZh: Stimmt so. / Isch guet so.
  tags: [money]
