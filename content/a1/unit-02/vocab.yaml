  tags: [cafe, drinks]

- id: bier
  de: Bier
  en: beer
  pos: noun
  gender: n
  plural: Biere
  example: { de: "Ein Bier, bitte!", en: "A beer, please!" }
  gswZh: Bier (es Bier; e Stange = a small draught beer)
  tags: [cafe, drinks]

- id: croissant
  de: Croissant
  en: croissant
