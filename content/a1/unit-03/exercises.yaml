# ---------- speaking ----------
- id: a1-u03-speak-family
  type: speak
  skill: speaking
  variety: de
  grammar: [possessives]
  prompt: Read aloud, then describe your own family photo in the same way.
  target: Das ist meine Familie. Das sind meine Eltern, und das ist mein Bruder. Er ist zwanzig.
  explanation: >-
    Das ist + singular, Das sind + plural. Point and name: Das ist mein/meine ... This frame works for any
    photo.

- id: a1-u03-speak-umlaut
  type: speak
  skill: speaking
  variety: de
  grammar: [plural-nouns]
  prompt: "Pronunciation: the umlaut makes the plural. Read each pair aloud."
  target: der Vater – die Väter, die Mutter – die Mütter, der Bruder – die Brüder, der Sohn – die Söhne
  explanation: >-
    In many plurals the umlaut is the only difference you hear: Bruder [u] → Brüder [ü]. ä sounds like e
    in "bet" (long in Väter), ö like a rounded e, ü like a rounded ee.

- id: a1-u03-roleplay-photo
  type: roleplay
  skill: speaking
  variety: de
  grammar: [haben-present, possessives, plural-nouns]
  tutor: lena
  prompt: "Roleplay with Lena: talk about your families."
  scenario: >-
    You and Lena, your classmate, show each other family photos on your phones. Use du.
  goals:
    - Say who is in your photo with Das ist / Das sind + mein/meine.
    - Say how many siblings you have and how old they are.
    - Ask Lena at least two questions about her family.
    - Use sein or ihr correctly when talking about another person's family.
  model: |
    Lena: Ist das deine Familie?
    Du: Ja! Das sind meine Eltern, und das ist meine Schwester Kate.
    Lena: Wie alt ist deine Schwester?
    Du: Sie ist zweiundzwanzig. Hast du Geschwister?
    Lena: Ja, ich habe einen Bruder, Max. Er hat zwei Kinder.
    Du: Oh, wie heißen seine Kinder?
    Lena: Ben und Lara. Sie sind sehr süß!
    Du: Und deine Eltern? Wo wohnen sie?
    Lena: In Graz, in Österreich.
  explanation: >-
    Useful frames: Das ist mein/meine ... / Das sind meine ... / Ich habe einen/eine/ein ... /
    Er/Sie ist ... Jahre alt. For someone else's family, switch to sein (his) or ihr (her): seine Kinder.

