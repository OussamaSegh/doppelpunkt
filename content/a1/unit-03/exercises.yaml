- id: a1-u03-translate-geschwister
  type: translate
  skill: writing
  variety: de
  grammar: [haben-present]
  prompt: Translate into German.
  source: Do you have any brothers or sisters?
  answers: ["Hast du Geschwister?", "Haben Sie Geschwister?", "Habt ihr Geschwister?"]
  explanation: >-
    "Brothers or sisters" = Geschwister, one word. No word for "any" is needed. Verb first in a yes/no
    question.

- id: a1-u03-translate-seine-frau
  type: translate
  skill: writing
  variety: de
  grammar: [possessives]
  prompt: Translate into German.
  source: His wife comes from Bern.
  answers: ["Seine Frau kommt aus Bern.", "Seine Frau ist aus Bern."]
  explanation: >-
    his → sein-, die Frau (wife) is feminine → seine. The usual word for wife in everyday German is just
    Frau (Ehefrau is more formal); husband is Mann.

- id: a1-u03-write-family
  type: write
  skill: writing
  variety: de
  grammar: [haben-present, possessives, plural-nouns]
  prompt: Write about your family.
  task: >-
    Write 5–7 sentences about your family for your course blog: who is in your family, what they are called,
    how old they are, where they live. Mention at least one person's partner or children using sein or ihr.
  minWords: 40
  model: >-
    Meine Familie ist klein. Meine Mutter heißt Helen und mein Vater heißt John. Sie wohnen in Leeds.
    Ich habe eine Schwester. Sie heißt Kate und ist zweiundzwanzig Jahre alt. Ihr Freund heißt Sam.
    Ich habe auch einen Hund. Sein Name ist Max. Er ist sehr süß!
  checklist:
    - I use mein/meine with the right ending (mein Vater, meine Mutter, meine Eltern).
    - I use sein or ihr for another person's family, chosen by the owner.
    - I use haben with einen/eine/ein (Ich habe einen Bruder).
    - I give ages with sein (Sie ist zweiundzwanzig).
    - My plurals are correct (Brüder, Schwestern, Kinder).
    - The verb is in position 2 in every sentence.
  explanation: >-
    A family text is a chain of short sentences built from three frames: [Possessive + noun] heißt ...;
    Ich habe + accusative; Er/Sie ist ... (Jahre alt). Using sein/ihr links the sentences (Ihr Freund heißt Sam).

# ---------- Swiss Standard German ----------
- id: a1-u03-chstd-goetti
  type: mcq
  skill: vocabulary
  variety: ch-std
  prompt: "In a Swiss newspaper: \"Der Götti von Noah bringt ein Geschenk.\" Who is the Götti?"
  options: ["Noah's godfather", "Noah's grandfather", "Noah's teacher", "Noah's older brother"]
  answer: 0
  explanation: >-
    Götti (godfather) and Gotte (godmother) are Swiss words used in Swiss Standard German too; in Germany
    they're der Pate / die Patin. In Switzerland the Götti or Gotte is an important family figure for a child.

# ---------- Swiss lane (gsw-zh) ----------
- id: a1-u03-ch-match-haben
  type: match
  skill: grammar
  variety: gsw-zh
  grammar: [haben-present]
  prompt: Match the Zurich German forms of haben with Standard German.
  pairs:
    - ["ich ha", "ich habe"]
    - ["du häsch", "du hast"]
    - ["er hät", "er hat"]
    - ["mir händ", "wir haben"]
  explanation: >-
    Zurich German: ich ha, du häsch, er/si/es hät, mir/ihr/si händ. As with sein (bisch, isch), the du-form
    ends in -sch, and all plural persons share one form.

- id: a1-u03-ch-match-family
  type: match
  skill: vocabulary
  variety: gsw-zh
  prompt: Match the Zurich German family words with Standard German.
  pairs:
    - ["d Muetter", "die Mutter"]
    - ["de Brüeder", "der Bruder"]
    - ["d Schwöschter", "die Schwester"]
    - ["s Chind", "das Kind"]
    - ["d Gschwüschterti", "die Geschwister"]
  explanation: >-
    Sound patterns you can reuse: u → ue (Mutter → Muetter, Bruder → Brüeder, gut → guet), k → ch
    (Kind → Chind), st → scht (Schwester → Schwöschter). Articles shrink: de, d, s.

- id: a1-u03-ch-transform-schwoeschter
  type: transform
  skill: reading
  variety: gsw-zh
  grammar: [haben-present]
  prompt: What does this mean in Standard German?
  from: gsw-zh
  to: de
  source: Ich ha e Schwöschter. Si wohnt z Bärn.
  answers: ["Ich habe eine Schwester. Sie wohnt in Bern.", "Ich hab eine Schwester. Sie wohnt in Bern."]
  explanation: >-
    ha = habe, e = eine, Schwöschter = Schwester, si = sie, z Bärn = in Bern. Note that Swiss German
    e (eine) doesn't change in the accusative, and Standard German eine doesn't either – it's feminine.

- id: a1-u03-ch-mcq-goetti
  type: mcq
  skill: listening
  variety: gsw-zh
  prompt: "In the Swiss lane dialogue Reto says: \"Ich bi de Götti vom Noah.\" What is Reto?"
  options: ["Noah's godfather", "Noah's father", "Noah's grandfather", "Noah's cousin"]
  answer: 0
  explanation: >-
    Götti = Pate (godfather); vom Noah = von Noah (Noah's). Swiss German expresses possession with
    vo(m) + name rather than with -s: de Götti vom Noah = Noahs Pate.

- id: a1-u03-ch-mcq-mis
  type: mcq
  skill: grammar
  variety: gsw-zh
  grammar: [possessives]
  prompt: "Zurich German: min Brüeder, mini Schwöschter ... and for s Chind (neuter)?"
  options: ["mis Chind", "min Chind", "mini Chind", "mein Chind"]
  answer: 0
  explanation: >-
    Zurich possessives have three forms: min (masculine), mini (feminine and plural), mis (neuter).
    So: min Papi, mini Muetter, mini Eltere, mis Chind, mis Mami (s Mami is neuter).

- id: a1-u03-ch-transform-gschwuester
  type: transform
  skill: vocabulary
  variety: gsw-zh
  grammar: [haben-present]
  prompt: "Recognition: how would Reto ask this in Zurich German? (Common spellings are accepted.)"
  from: de
  to: gsw-zh
  source: Hast du Geschwister?
  answers: ["Häsch du Gschwüschterti?", "Häsch Gschwüschterti?", "Hesch du Gschwüschterti?", "Häsch du Gschwüschter?"]
  explanation: >-
    hast → häsch (Zurich; hesch in Bern). Geschwister → Gschwüschterti: Swiss German drops the e in ge-
    (Gschwüschter, gsi, gha) and often adds -ti. Swiss speakers often leave out du after the verb: Häsch ...?

