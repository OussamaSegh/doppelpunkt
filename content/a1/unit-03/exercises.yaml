# A1 unit 3 – Meine Familie

# ---------- vocabulary ----------
- id: a1-u03-match-pairs
  type: match
  skill: vocabulary
  variety: de
  prompt: Match each male family member with the female one.
  pairs:
    - ["der Bruder", "die Schwester"]
    - ["der Vater", "die Mutter"]
    - ["der Sohn", "die Tochter"]
    - ["der Onkel", "die Tante"]
    - ["der Neffe", "die Nichte"]
  explanation: >-
    Most family words come in male/female pairs that look different. Only some form the female with
    -in (der Cousin – die Cousine is French; der Pate – die Patin, der Freund – die Freundin use -in).

- id: a1-u03-mcq-onkel
  type: mcq
  skill: vocabulary
  variety: de
  prompt: "Mein Vater hat einen Bruder. Er ist mein ..."
  options: ["Onkel", "Neffe", "Cousin", "Großvater"]
  answer: 0
  explanation: >-
    The brother of your father or mother is your Onkel; his children are your Cousins/Cousinen. You are
    his Neffe (nephew) or Nichte (niece).

- id: a1-u03-mcq-geschwister
  type: mcq
  skill: vocabulary
  variety: de
  prompt: "\"Hast du Geschwister?\" What is the question?"
  options: ["Do you have brothers or sisters?", "Do you have children?", "Do you have a partner?", "Do you have parents?"]
  answer: 0
  explanation: >-
    die Geschwister = brothers and sisters together (siblings). It's a plural-only word in everyday German,
    like die Eltern (parents). Answer: Ja, ich habe einen Bruder. / Nein, ich habe keine Geschwister.

- id: a1-u03-match-english
  type: match
  skill: vocabulary
  variety: de
  prompt: Match the German words with their English meaning.
  pairs:
    - ["die Eltern", "parents"]
    - ["das Kind", "child"]
    - ["verheiratet", "married"]
    - ["ledig", "single"]
    - ["der Junge", "boy"]
  explanation: >-
    die Eltern has no singular in everyday use (for one parent say der Vater / die Mutter or ein Elternteil).
    das Kind is neuter for boys and girls alike. ledig is the official word for unmarried.

# ---------- grammar: haben ----------
- id: a1-u03-gap-haben-1
  type: gap
  skill: grammar
  variety: de
  grammar: [haben-present]
  prompt: Fill in the correct forms of haben.
  text: Ich ___ einen Bruder. ___ du Geschwister? Anna ___ zwei Schwestern.
  answers: [["habe"], ["Hast", "hast"], ["hat"]]
  explanation: >-
    haben: ich habe, du hast, er/sie/es hat. The b disappears in hast and hat. In the yes/no question the
    verb comes first: Hast du ...?

- id: a1-u03-gap-haben-2
  type: gap
  skill: grammar
  variety: de
  grammar: [haben-present]
  prompt: Fill in the correct forms of haben.
  text: Wir ___ einen Hund. ___ ihr auch einen Hund? – Nein, aber meine Eltern ___ eine Katze.
  answers: [["haben"], ["Habt", "habt"], ["haben"]]
  explanation: >-
    Plural: wir haben, ihr habt, sie haben. meine Eltern = sie (they), so the verb is haben. ihr habt
    follows the regular -t ending for ihr.

- id: a1-u03-mcq-age
  type: mcq
  skill: grammar
  variety: de
  grammar: [haben-present]
  prompt: "How do you say \"I am thirty years old\"?"
  options: ["Ich bin dreißig Jahre alt.", "Ich habe dreißig Jahre.", "Ich habe dreißig Jahre alt.", "Ich bin dreißig Jahren."]
  answer: 0
  rationales:
    - Correct. Age uses sein, as in English. You can also just say Ich bin dreißig.
    - This is the French/Spanish pattern (j'ai trente ans). German uses sein.
    - Mixes haben with alt – not possible.
    - The plural of Jahr is Jahre.
  explanation: >-
    Age: Ich bin ... (Jahre alt). Question: Wie alt bist du? / Wie alt sind Sie? Swiss spelling: dreissig.

- id: a1-u03-gap-haben-acc
  type: gap
  skill: grammar
  variety: de
  grammar: [haben-present, plural-nouns]
  prompt: "Fill in einen, eine or ein. (der Sohn, die Tochter, das Kind)"
  text: Herr Keller hat ___ Sohn, ___ Tochter und ___ Enkelkind.
  answers: [["einen"], ["eine"], ["ein"]]
  explanation: >-
    What you have is the direct object, so it's accusative. der Sohn → einen Sohn; die Tochter → eine
    Tochter; das Enkelkind (grandchild) → ein Enkelkind. Only the masculine article changes.

# ---------- grammar: possessives ----------
- id: a1-u03-gap-mein
  type: gap
  skill: grammar
  variety: de
  grammar: [possessives]
  prompt: "Fill in mein or meine. (der Bruder, die Schwester, die Eltern)"
  text: Das ist ___ Bruder und das ist ___ Schwester. Das sind ___ Eltern.
  answers: [["mein"], ["meine"], ["meine"]]
  explanation: >-
    Possessives take the endings of ein: masculine and neuter no ending (mein Bruder), feminine -e (meine
    Schwester), plural -e (meine Eltern) – even though ein has no plural.

- id: a1-u03-mcq-ihr
  type: mcq
  skill: grammar
  variety: de
  grammar: [possessives]
  prompt: Choose the correct word for "her".
  question: Das ist Anna und ___ Bruder Jonas.
  options: ["ihr", "sein", "ihre", "seine"]
  answer: 0
  rationales:
    - Correct. Owner = Anna (a woman) → ihr-; noun = der Bruder (masculine) → no ending.
    - sein- would mean his.
    - The -e ending would be for a feminine or plural noun (ihre Schwester).
    - Wrong owner and wrong ending.
  explanation: >-
    Two decisions: the owner picks the word (man → sein, woman → ihr), the noun picks the ending
    (der Bruder → ihr, die Schwester → ihre). English only makes the first decision.

- id: a1-u03-mcq-seine
  type: mcq
  skill: grammar
  variety: de
  grammar: [possessives]
  prompt: Choose the correct word for "his".
  question: Tom und ___ Nichte Emily wohnen in England.
  options: ["seine", "sein", "ihre", "ihr"]
  answer: 0
  explanation: >-
    Owner = Tom → sein-. Noun = die Nichte (feminine) → ending -e: seine Nichte. English speakers often
    pick ihre because Nichte is female – but the possessor, not the noun, decides between sein and ihr.

- id: a1-u03-gap-ihr-polite
  type: gap
  skill: grammar
  variety: de
  grammar: [possessives]
  prompt: Ask Frau Keller politely. Fill in the possessive for "your" (Sie).
  text: Frau Keller, wie heißt ___ Sohn? Und wie alt ist ___ Tochter?
  answers: [["Ihr"], ["Ihre"]]
  explanation: >-
    The polite possessive is Ihr/Ihre with a capital I, matching polite Sie. der Sohn → Ihr Sohn;
    die Tochter → Ihre Tochter. Lower-case ihr would mean her or their.

- id: a1-u03-gap-meinen
  type: gap
  skill: grammar
  variety: de
  grammar: [possessives, haben-present]
  prompt: "Accusative after a verb. Fill in meinen or meine. (fragen = to ask)"
  text: Ich frage ___ Vater und ___ Mutter.
  answers: [["meinen"], ["meine"]]
  explanation: >-
    der Vater is the object of fragen, so it's accusative: mein → meinen (just like ein → einen).
    die Mutter stays meine. Same pattern as unit 2: only masculine changes.

- id: a1-u03-transform-ihr
  type: transform
  skill: grammar
  variety: de
  grammar: [possessives]
  prompt: Rewrite with a possessive article.
  from: de
  to: de
  source: Das ist der Hund von Anna.
  answers: ["Das ist ihr Hund.", "Das ist Annas Hund."]
  explanation: >-
    Anna is a woman → ihr; der Hund is masculine nominative → no ending: ihr Hund. You can also use the
    name with -s and no apostrophe: Annas Hund.

- id: a1-u03-transform-euer
  type: transform
  skill: grammar
  variety: de
  grammar: [possessives, plural-nouns]
  prompt: "Ask two friends the same question: change du to ihr."
  from: de
  to: de
  source: Wo wohnen deine Kinder?
  answers: ["Wo wohnen eure Kinder?"]
  explanation: >-
    dein (your, one person) → euer (your, several people you say du to). With an ending, euer drops the
    second e: eure Kinder, not euere Kinder.

# ---------- grammar: plurals ----------
- id: a1-u03-match-plurals
  type: match
  skill: grammar
  variety: de
  grammar: [plural-nouns]
  prompt: Match each singular with its plural.
  pairs:
    - ["der Bruder", "die Brüder"]
    - ["die Schwester", "die Schwestern"]
    - ["das Kind", "die Kinder"]
    - ["der Sohn", "die Söhne"]
    - ["die Oma", "die Omas"]
  explanation: >-
    Five patterns: umlaut only (Brüder), -n (Schwestern), -er (Kinder), umlaut + -e (Söhne), -s (Omas).
    The plural article is always die. Learn each noun as a trio: der Sohn, die Söhne.

- id: a1-u03-gap-plurals
  type: gap
  skill: grammar
  variety: de
  grammar: [plural-nouns, haben-present]
  prompt: Write the plural of the noun in brackets.
  text: Ich habe zwei ___ (Bruder) und drei ___ (Schwester). Meine Eltern haben fünf ___ (Kind)!
  answers: [["Brüder", "Brueder"], ["Schwestern"], ["Kinder"]]
  explanation: >-
    der Bruder → die Brüder (-er noun: no ending, but umlaut). Feminine nouns usually add -(e)n:
    Schwestern. Many neuter nouns add -er: Kinder.

- id: a1-u03-mcq-muetter
  type: mcq
  skill: grammar
  variety: de
  grammar: [plural-nouns]
  prompt: "die Mutter → die ..."
  options: ["Mütter", "Muttern", "Mutters", "Mutter"]
  answer: 0
  explanation: >-
    Mutter and Tochter are the big exceptions to "feminine adds -n": they take only an umlaut (die Mütter,
    die Töchter). (Muttern exists, but it means nuts – the ones for bolts!)

# ---------- grammar: word order ----------
- id: a1-u03-order-schwestern
  type: order
  skill: grammar
  variety: de
  grammar: [haben-present, plural-nouns]
  prompt: Put the words in order.
  tokens: ["hat", "Anna", "Schwestern", "zwei"]
  answers: ["Anna hat zwei Schwestern.", "Zwei Schwestern hat Anna."]
  explanation: >-
    Verb in position 2. The normal order is subject – verb – object; putting the object first
    (Zwei Schwestern hat Anna) is possible for emphasis.

- id: a1-u03-order-geschwister
  type: order
  skill: grammar
  variety: de
  grammar: [haben-present]
  prompt: Make a yes/no question.
  tokens: ["Geschwister", "du", "Hast"]
  answers: ["Hast du Geschwister?"]
  explanation: >-
    Yes/no question: verb first, then subject, then the rest. No article is needed with Geschwister
    (like English "Do you have siblings?").

# ---------- reading ----------
- id: a1-u03-mcq-reading-siblings
  type: mcq
  skill: reading
  variety: de
  grammar: [plural-nouns]
  prompt: "Read \"Meine Familie\". How many brothers and sisters does Paul have?"
  options: ["Three", "Two", "One", "Four"]
  answer: 0
  explanation: >-
    "Ich habe zwei Brüder und eine Schwester." Brüder is the plural of Bruder (umlaut ü), so two brothers
    + one sister = three siblings (Geschwister).

- id: a1-u03-mcq-reading-leo
  type: mcq
  skill: reading
  variety: de
  grammar: [possessives]
  prompt: "Who is Leo?"
  options: ["David's son – Paul's nephew", "Paul's brother", "Paul's son", "The cat"]
  answer: 0
  explanation: >-
    "Mein Bruder David ist verheiratet. Seine Frau heißt Sarah, und sie haben ein Baby. Das Baby heißt Leo."
    So Leo is David and Sarah's baby – Paul's Neffe. seine Frau = David's wife.

- id: a1-u03-mcq-reading-emma
  type: mcq
  skill: reading
  variety: de
  prompt: "Read the text again. Richtig oder falsch? \"Pauls Eltern wohnen in Berlin.\""
  options: ["Falsch", "Richtig"]
  answer: 0
  explanation: >-
    Falsch. The parents live in Montreal ("Sie wohnen in Montreal"); Emma, Paul's sister, lives in Berlin.
    Check who sie refers to: here sie = meine Eltern (they), because the verb is wohnen, not wohnt.

- id: a1-u03-mcq-reading-minou
  type: mcq
  skill: reading
  variety: de
  grammar: [possessives]
  prompt: "\"Wir haben auch eine Katze. Ihr Name ist Minou.\" What does Ihr mean here?"
  options: ["Her (the cat's)", "Your (polite)", "Their", "You (plural)"]
  answer: 0
  explanation: >-
    die Katze is feminine, so the owner is "she" → ihr Name. It has a capital I only because it starts the
    sentence. In mid-sentence, Ihr with a capital means polite your; ihr in lower case means her/their.

- id: a1-u03-translate-reading
  type: translate
  skill: reading
  variety: de
  grammar: [possessives]
  prompt: Translate into English.
  source: Seine Frau heißt Sarah, und sie haben ein Baby.
  answers: ["His wife is called Sarah, and they have a baby.", "His wife's name is Sarah, and they have a baby.", "His wife is named Sarah and they have a baby."]
  explanation: >-
    seine = his (owner David), die Frau = woman or wife (from context: wife). sie haben = they have –
    the -en form of the verb shows sie is plural here.

