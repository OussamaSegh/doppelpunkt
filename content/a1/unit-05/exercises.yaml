# ---------- speaking ----------
- id: a1-u05-speak-order
  type: speak
  skill: speaking
  variety: de
  grammar: [quantities]
  prompt: Read aloud, then ask for three things you need this week.
  target: Guten Tag! Ich hätte gern ein Kilo Äpfel, 200 Gramm Käse und eine Flasche Wasser, bitte.
  explanation: >-
    Ich hätte gern (unit 2) + quantity + noun. Say the numbers clearly – the stallholder will repeat them.

- id: a1-u05-speak-doch
  type: speak
  skill: speaking
  variety: de
  grammar: [ja-nein-doch, nicht-kein]
  prompt: "Intonation: say doch with energy – it contradicts. Read aloud."
  target: Hast du kein Geld? – Doch, ich habe Geld! Ist das Brot nicht frisch? – Doch, es ist frisch!
  explanation: >-
    doch is stressed and often a little louder: DOCH! It signals "you're wrong, it's the opposite". das
    Geld = money.

- id: a1-u05-roleplay-lena
  type: roleplay
  skill: speaking
  variety: de
  grammar: [nicht-kein, accusative-definite, quantities, ja-nein-doch]
  tutor: lena
  prompt: "Roleplay with Lena: plan the shopping for a dinner."
  scenario: >-
    You and Lena are cooking pasta together tonight. Check what you have and what you still need, and write
    a shopping list together. Use du.
  goals:
    - Say what you have and don't have with kein (Ich habe keine Tomaten).
    - Ask for quantities (Wie viel ...?) and answer with Kilo, Gramm, Flasche, Packung.
    - Answer a negative question with doch.
    - Use den with a masculine object at least once.
  model: |
    Lena: Also, Nudeln mit Tomaten. Hast du Nudeln?
    Du: Ja, eine Packung. Aber ich habe keine Tomaten.
    Lena: Gut, ich kaufe ein Kilo Tomaten. Und Zwiebeln?
    Du: Eine Zwiebel habe ich. Hast du keinen Käse?
    Lena: Doch, ich habe Parmesan. Brauchen wir Wein?
    Du: Nein, ich trinke keinen Wein. Aber ich nehme den Apfelsaft.
    Lena: Okay, einen Liter Apfelsaft. Das ist alles!
  explanation: >-
    Frames: Hast du ...? – Ja / Nein, ich habe kein(e/en) ... / Doch! Quantities go before the noun with no
    "of": ein Kilo Tomaten.

# ---------- writing ----------
- id: a1-u05-translate-tuete
  type: translate
  skill: writing
  variety: de
  grammar: [nicht-kein]
  prompt: Translate into German.
  source: I don't need a bag, thank you.
  answers: ["Ich brauche keine Tüte, danke.", "Danke, ich brauche keine Tüte.", "Ich brauche keinen Sack, danke.", "Ich brauche kein Säckli, danke."]
  explanation: >-
    "don't need a bag" = keine Tüte (die Tüte → keine). In Switzerland you'll hear der Sack or das Säckli.

- id: a1-u05-translate-kosten
  type: translate
  skill: writing
  variety: de
  grammar: [quantities]
  prompt: Translate into German.
  source: How much does a kilo of potatoes cost?
  answers: ["Was kostet ein Kilo Kartoffeln?", "Wie viel kostet ein Kilo Kartoffeln?", "Wieviel kostet ein Kilo Kartoffeln?"]
  explanation: >-
    Was kostet ...? / Wie viel kostet ...? The verb is singular because the subject is ein Kilo, not the
    potatoes. No "of": ein Kilo Kartoffeln.

- id: a1-u05-write-list
  type: write
  skill: writing
  variety: de
  grammar: [nicht-kein, accusative-definite, quantities]
  prompt: Write a message to your flatmate.
  task: >-
    Your flatmate is going shopping. Write a short message (5–7 sentences): what you need, in which
    quantities, what you still have, and one thing they should NOT buy.
  minWords: 40
  model: >-
    Hallo Sam! Gehst du heute einkaufen? Wir brauchen ein Kilo Kartoffeln, drei Karotten und eine Packung
    Nudeln. Wir haben keine Milch mehr – bitte einen Liter Milch. Butter haben wir noch. Kauf bitte keinen
    Wein, ich habe zwei Flaschen. Und nimm den Käse aus Appenzell, er ist super! Danke! Mia
  checklist:
    - I use quantities without "of" (ein Kilo Kartoffeln).
    - I use kein / keine / keinen before nouns and nicht elsewhere.
    - I use den for masculine objects (den Käse, den Wein).
    - Units stay singular after numbers (zwei Kilo, 500 Gramm).
  explanation: >-
    A shopping message combines needs (Wir brauchen + accusative), negation (keine Milch mehr) and
    quantities. Kauf bitte / nimm bitte are informal requests (imperative, unit 8) – use them as chunks.

# ---------- Swiss Standard German ----------
- id: a1-u05-chstd-match
  type: match
  skill: vocabulary
  variety: ch-std
  prompt: Match the Swiss Standard German words (on Swiss price tags) with the German-German words.
  pairs:
    - ["Rüebli", "Karotten"]
    - ["Peperoni", "Paprika"]
    - ["Rahm", "Sahne"]
    - ["Poulet", "Hähnchen"]
    - ["Teigwaren", "Nudeln"]
  explanation: >-
    These Helvetisms are standard in Switzerland: on price tags, in recipes and newspapers. Peperoni is
    the vegetable – a false friend for English speakers who think of salami.

# ---------- Swiss lane (gsw-zh) ----------
- id: a1-u05-ch-match-food
  type: match
  skill: vocabulary
  variety: gsw-zh
  prompt: Match the Zurich German food words with Standard German.
  pairs:
    - ["Härdöpfel", "Kartoffeln"]
    - ["Anke", "Butter"]
    - ["Chäs", "Käse"]
    - ["Öpfel", "Äpfel"]
    - ["Bölle", "Zwiebeln"]
  explanation: >-
    Härdöpfel = "earth apples" (compare French pommes de terre). k → ch again in Chäs. Anke and Bölle are
    old words with no Standard German look-alike – just learn them.

- id: a1-u05-ch-mcq-moll
  type: mcq
  skill: listening
  variety: gsw-zh
  grammar: [ja-nein-doch]
  prompt: "In the Swiss lane dialogue Sandra asks about cream and Reto answers. What does he mean?"
  transcript: |-
    Sandra: Bruuchsch du kei Rahm für de Chueche?
    Reto: Moll, natürli!
  options: ["No, I don't need cream.", "I don't know.", "Yes, of course I need cream.", "The cream is too expensive."]
  answer: 2
  explanation: >-
    moll (or momoll) = doch: it contradicts the negative question. Then he buys some: "Dänn nimm ich no Rahm."

- id: a1-u05-ch-mcq-eier
  type: mcq
  skill: listening
  variety: gsw-zh
  grammar: [nicht-kein]
  prompt: "Listen to the stallholder. What does she mean?"
  transcript: |-
    Verkäuferin: Nei, leider kei Eier meh.
  options: ["Sorry, there are no eggs left.", "The eggs are not fresh.", "Eggs are more expensive.", "She has only a few eggs."]
  answer: 0
  explanation: >-
    kei = kein(e), meh = mehr, leider = unfortunately. Zurich kei usually has one form for all genders:
    kei Rahm, kei Milch, kei Eier.

- id: a1-u05-ch-transform-noed
  type: transform
  skill: reading
  variety: gsw-zh
  grammar: [nicht-kein]
  prompt: What does this mean in Standard German?
  from: gsw-zh
  to: de
  source: Peperoni äss ich nöd so gärn.
  answers: ["Paprika esse ich nicht so gern.", "Paprika esse ich nicht so gerne.", "Ich esse Paprika nicht so gern.", "Ich esse Paprika nicht so gerne.", "Peperoni esse ich nicht so gern.", "Peperoni esse ich nicht so gerne."]
  explanation: >-
    nöd = nicht, äss = esse, gärn = gern. nöd goes in the same place as nicht: before gern. Peperoni is
    also the Swiss Standard German word, so it's fine in your answer.

- id: a1-u05-ch-mcq-poschte
  type: mcq
  skill: vocabulary
  variety: gsw-zh
  prompt: "Reto says: \"Ich gang am Samschtig go poschte.\" What will he do on Saturday?"
  options: ["Go to the post office", "Post a letter", "Go (grocery) shopping", "Go to work"]
  answer: 2
  explanation: >-
    poschte = einkaufen, a false friend for "post". The pattern gang go + infinitive (= gehe ... gehen) is
    typical Swiss German: Ich gang go poschte = Ich gehe einkaufen.

- id: a1-u05-ch-transform-saeckli
  type: transform
  skill: vocabulary
  variety: gsw-zh
  grammar: [nicht-kein]
  prompt: "Recognition: how would a Zurich cashier say this? (Common spellings are accepted.)"
  from: de
  to: gsw-zh
  source: Möchten Sie eine Tüte?
  answers: ["Wänd Sie es Säckli?", "Wänd Sie e Täsche?", "Möchted Sie es Säckli?", "Wänd Si es Säckli?"]
  explanation: >-
    wänd = wollen (Sie), the usual polite offer in Zurich; es Säckli = ein Tütchen (a small bag). Literally
    "Do you want a little bag?" – it isn't rude in Swiss German.

- id: a1-u05-roleplay-reto
  type: roleplay
  skill: listening
  variety: gsw-zh
  grammar: [quantities, nicht-kein]
  tutor: reto
  prompt: "Listening roleplay with Reto: buying cheese at the market."
  scenario: >-
    Reto is helping out at his uncle's cheese stall at the Saturday market. He speaks Zurich German. Buy some
    cheese in Standard German, ask the price, and pay.
  goals:
    - Understand "Was dörfs sii?" and order a quantity (200 Gramm, ein Stück).
