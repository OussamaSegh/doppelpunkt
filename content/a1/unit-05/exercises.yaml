# A1 unit 5 – Einkaufen

# ---------- vocabulary ----------
- id: a1-u05-match-food
  type: match
  skill: vocabulary
  variety: de
  prompt: Match the food words with English.
  pairs:
    - ["die Kartoffel", "potato"]
    - ["die Karotte", "carrot"]
    - ["die Zwiebel", "onion"]
    - ["der Käse", "cheese"]
    - ["die Sahne", "cream"]
  explanation: >-
    Most fruit and vegetables ending in -e or -el are feminine (die Tomate, die Banane, die Kartoffel,
    die Zwiebel). der Apfel and der Käse are masculine exceptions – learn the article with the noun.

- id: a1-u05-match-quantities
  type: match
  skill: vocabulary
  variety: de
  prompt: Match each quantity with the food it usually goes with.
  pairs:
    - ["eine Flasche", "Wein"]
    - ["eine Packung", "Nudeln"]
    - ["200 Gramm", "Käse"]
    - ["ein Kilo", "Kartoffeln"]
    - ["ein Liter", "Saft"]
  explanation: >-
    German puts the quantity straight before the noun, with no "of": eine Flasche Wein, ein Kilo Kartoffeln.

- id: a1-u05-mcq-obst
  type: mcq
  skill: vocabulary
  variety: de
  prompt: "Which word does NOT belong in the group \"Obst\"?"
  options: ["der Apfel", "die Banane", "die Zwiebel", "die Orange"]
  answer: 2
  explanation: >-
    das Obst = fruit (Apfel, Banane, Orange); das Gemüse = vegetables (Zwiebel, Karotte, Kartoffel,
    Tomate). Both are uncountable in German: das Gemüse ist frisch (singular verb).

- id: a1-u05-mcq-teuer
  type: mcq
  skill: vocabulary
  variety: de
  prompt: "\"Das Brot kostet 9 Franken!\" – \"Das ist sehr ...\""
  options: ["billig", "teuer", "frisch", "gut"]
  answer: 1
  explanation: >-
    teuer = expensive, billig = cheap. Careful: teuer drops its e when it gets an ending later (ein teures
    Brot). In Switzerland many people say günstig rather than billig, which can sound like "low quality".

# ---------- grammar: nicht / kein ----------
- id: a1-u05-gap-kein-1
  type: gap
  skill: grammar
  variety: de
  grammar: [nicht-kein]
  prompt: Fill in nicht or the correct form of kein.
  text: Ich esse ___ Fleisch. Der Wein ist ___ teuer. Wir haben ___ Eier mehr.
  answers: [["kein"], ["nicht"], ["keine"]]
  explanation: >-
    Fleisch has no article → kein Fleisch. teuer is an adjective → nicht teuer. Eier (plural, no article) →
    keine Eier. Rule of thumb: a noun with ein or no article takes kein; everything else takes nicht.

- id: a1-u05-gap-kein-2
  type: gap
  skill: grammar
  variety: de
  grammar: [nicht-kein, accusative-definite]
  prompt: "Fill in kein, keine or keinen. (der Käse, die Butter, das Brot)"
  text: Ich habe ___ Käse, ___ Butter und ___ Brot.
  answers: [["keinen"], ["keine"], ["kein"]]
  explanation: >-
    kein has the endings of ein. After haben it's the accusative, so the masculine is keinen Käse;
    feminine keine Butter and neuter kein Brot don't change.

- id: a1-u05-mcq-kein-fleisch
  type: mcq
  skill: grammar
  variety: de
  grammar: [nicht-kein]
  prompt: "How do you say \"I don't eat meat\"?"
  options: ["Ich esse nicht Fleisch.", "Ich nicht esse Fleisch.", "Ich esse keinen Fleisch.", "Ich esse kein Fleisch."]
  answer: 3
  rationales:
    - "English \"don't\" suggests nicht, but before a noun without an article German uses kein."
    - "nicht never goes between the subject and the verb."
    - "das Fleisch is neuter, so it's kein, not keinen."
    - "Correct. Fleisch has no article, so it is negated with kein."
  explanation: >-
    English negates the verb (don't eat); German negates the noun (kein Fleisch = no meat).

- id: a1-u05-mcq-nicht-position
  type: mcq
  skill: grammar
  variety: de
  grammar: [nicht-kein, separable-verbs]
  prompt: "Say \"I'm not going shopping today\"."
  options: ["Ich kaufe heute nicht ein.", "Ich kaufe nicht heute ein.", "Ich nicht kaufe heute ein.", "Ich kaufe heute ein nicht."]
  answer: 0
  rationales:
    - "Correct. nicht goes after the time expression and before the separable prefix."
    - "nicht heute would mean \"not today (but another day)\" – a contrast, not the normal sentence."
    - "nicht comes after the conjugated verb."
    - "The prefix ein closes the sentence; nicht goes before it."
  explanation: >-
    When nicht negates the whole sentence it goes near the end – but before a separable prefix,
    an adjective or a place.

- id: a1-u05-transform-kein
  type: transform
  skill: grammar
  variety: de
  grammar: [nicht-kein]
  prompt: Make the sentence negative.
  from: de
  to: de
  source: Wir brauchen eine Tüte.
  answers: ["Wir brauchen keine Tüte."]
  explanation: >-
    eine Tüte → keine Tüte. Just put k- in front of the indefinite article: ein → kein, eine → keine,
    einen → keinen.

- id: a1-u05-transform-nicht
  type: transform
  skill: grammar
  variety: de
  grammar: [nicht-kein]
  prompt: Make the sentence negative.
  from: de
  to: de
  source: Die Tomaten sind frisch.
  answers: ["Die Tomaten sind nicht frisch."]
  explanation: >-
    frisch is an adjective after sein, so it takes nicht, placed right before it. kein would be wrong:
    it only replaces ein or "no article" before a noun.

# ---------- grammar: definite accusative ----------
- id: a1-u05-gap-den
  type: gap
  skill: grammar
  variety: de
  grammar: [accusative-definite]
  prompt: "Fill in den, die or das. (der Käse, die Butter, das Brot, die Eier)"
  text: Ich nehme ___ Käse, ___ Butter, ___ Brot und ___ Eier.
  answers: [["den"], ["die"], ["das"], ["die"]]
  explanation: >-
    In the accusative only the masculine article changes: der → den. die, das and plural die stay the same.

- id: a1-u05-mcq-den-kaese
  type: mcq
  skill: grammar
  variety: de
  grammar: [accusative-definite]
  prompt: Choose the correct article.
  question: Ich suche ___ Apfelsaft. Wo ist er?
  options: ["der", "den", "dem", "die"]
  answer: 1
  rationales:
    - "der is the nominative (subject) form."
    - "Correct. der Apfelsaft is the object of suchen → den."
    - "dem is the dative – it comes later in the course."
    - "die would be feminine or plural; Saft is masculine."
  explanation: >-
    A compound noun takes the gender of its last part: der Saft → der Apfelsaft → Ich suche den Apfelsaft.

- id: a1-u05-mcq-der-den
  type: mcq
  skill: grammar
  variety: de
  grammar: [accusative-definite]
  prompt: Which sentence is correct?
  options: ["Den Käse ist teuer, aber ich nehme den Käse.", "Der Käse ist teuer, aber ich nehme der Käse.", "Den Käse ist teuer, aber ich nehme der Käse.", "Der Käse ist teuer, aber ich nehme den Käse."]
  answer: 3
  rationales:
    - "After sein there is no object – the noun is the subject (nominative)."
    - "nehmen has an object, so the masculine article must be den."
    - "Both articles are in the wrong case."
    - "Correct. Subject of ist → der; object of nehme → den."
  explanation: >-
    Ask who or what does the action. Der Käse ist teuer: the cheese is the subject. Ich nehme den Käse: I am
    the subject, the cheese is the object.

- id: a1-u05-order-den
  type: order
  skill: grammar
  variety: de
  grammar: [accusative-definite]
  prompt: Put the words in order.
  tokens: ["nehme", "Ich", "den", "Käse"]
  answers: ["Ich nehme den Käse.", "Den Käse nehme ich."]
  explanation: >-
    Verb in position 2. Because den shows that Käse is the object, you can also start with it for emphasis:
    Den Käse nehme ich (the cheese is the one I'll take).

# ---------- grammar: doch ----------
- id: a1-u05-mcq-doch
  type: mcq
  skill: grammar
  variety: de
  grammar: [ja-nein-doch]
  prompt: "\"Brauchen wir keinen Wein?\" – You think you DO need wine. What do you say?"
  options: ["Ja!", "Nein!", "Doch!", "Nicht!"]
  answer: 2
  rationales:
    - "After a negative question ja is ambiguous – it can sound as if you agree with the negative."
    - "Nein agrees with the negative – it means \"No, we don't need any.\""
    - "Correct. doch contradicts a negative question."
    - "nicht is not an answer word."
  explanation: >-
    Negative question + you mean yes = doch. Positive question + yes = ja. Either question + no = nein.

- id: a1-u05-gap-ja-nein-doch
  type: gap
  skill: grammar
  variety: de
  grammar: [ja-nein-doch, nicht-kein]
  prompt: Answer with ja, nein or doch.
  text: "Isst du Fleisch? – ___, ich esse kein Fleisch. Hast du keine Tüte? – ___, ich habe eine Tüte."
  answers: [["Nein", "nein"], ["Doch", "doch"]]
  explanation: >-
    The first question is positive and the answer is negative → Nein. The second question is negative
    (keine) and the answer is positive → Doch.

# ---------- grammar: quantities ----------
- id: a1-u05-mcq-kilo
  type: mcq
  skill: grammar
  variety: de
  grammar: [quantities]
  prompt: "Ask for 2 kg of apples."
  options: ["Zwei Kilo Äpfel, bitte.", "Zwei Kilos Äpfel, bitte.", "Zwei Kilo von Äpfeln, bitte.", "Zwei Kilo Apfel, bitte."]
  answer: 0
  rationales:
    - "Correct. Units stay singular after numbers, and there's no \"of\"."
    - "Kilo doesn't take -s after a number."
    - "German has no \"of\" in quantities."
    - "Two kilos means many apples – the noun itself is plural (Äpfel)."
  explanation: >-
    Pattern: number + unit (singular) + noun (plural if countable): zwei Kilo Äpfel, 500 Gramm Tomaten.

- id: a1-u05-gap-quantities
  type: gap
  skill: grammar
  variety: de
  grammar: [quantities]
  prompt: "Fill in the quantity word: Flasche(n), Packung(en), Gramm, Liter."
  text: Ich brauche zwei ___ Wein, eine ___ Nudeln, 300 ___ Käse und einen ___ Saft.
  answers: [["Flaschen"], ["Packung"], ["Gramm"], ["Liter"]]
  explanation: >-
    Containers (Flasche, Packung) are normal nouns and form a plural: zwei Flaschen. Units of measurement
    (Gramm, Kilo, Liter) don't: 300 Gramm. der Liter is masculine, so it's einen Liter in the accusative.

# ---------- reading ----------
- id: a1-u05-mcq-reading-tomaten
  type: mcq
  skill: reading
  variety: de
  grammar: [nicht-kein]
  prompt: "Read \"Samstag ist Markttag\". Why doesn't the writer buy tomatoes?"
  options: ["They are too expensive.", "There are no tomatoes at the market.", "They aren't good at the moment.", "The writer doesn't like tomatoes."]
  answer: 2
  explanation: >-
    "Tomaten kaufe ich nicht – sie sind im Moment nicht gut." Note the two nicht: one negates the verb
    (kaufe ... nicht), one the adjective (nicht gut).

- id: a1-u05-mcq-reading-kaese
  type: mcq
  skill: reading
  variety: de
  grammar: [quantities]
  prompt: How much cheese does the writer buy?
  options: ["200 grams", "300 grams", "One kilo", "A piece"]
  answer: 1
  explanation: >-
    "Ich nehme 300 Gramm." The saleswoman recommends den Bergkäse (mountain cheese) – den, because it's
    the object of möchten.

- id: a1-u05-mcq-reading-fleisch
  type: mcq
  skill: reading
  variety: de
  prompt: "Richtig oder falsch? \"Die Person kauft Fleisch und Eier.\""
  options: ["Richtig", "Falsch"]
  answer: 1
  explanation: >-
    Falsch. "Fleisch kaufe ich nicht, ich esse nur Fisch." But: "ich habe keine Eier mehr, also nehme ich
    sechs Eier." So eggs yes, meat no.

- id: a1-u05-mcq-reading-brot
  type: mcq
  skill: reading
  variety: de
  prompt: Where does the writer buy bread, and why?
  options: ["In the supermarket, because the bread at the market is expensive.", "At the market, because it is fresh.", "At the market, because it is cheap.", "Nowhere – there is no bread."]
  answer: 0
  explanation: >-
    "Brot gibt es auf dem Markt auch, aber das Brot hier ist teuer. Ich kaufe es im Supermarkt." es refers
    back to das Brot (neuter, accusative).

- id: a1-u05-translate-reading
  type: translate
  skill: reading
  variety: de
  grammar: [nicht-kein]
  prompt: Translate into English.
  source: Ich habe keine Eier mehr.
  answers: ["I don't have any eggs left.", "I haven't got any eggs left.", "I have no eggs left.", "I have no more eggs.", "I don't have any more eggs."]
  explanation: >-
    kein ... mehr = no ... left / not any more. German needs no extra verb: the negation sits in keine.

