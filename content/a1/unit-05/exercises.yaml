- id: a1-u05-mcq-listening-wein
  type: mcq
  skill: listening
  variety: de
  grammar: [ja-nein-doch]
  prompt: "Listen again: Tom asks about wine and Anna answers. What does she mean?"
  transcript: |-
    Tom: Brauchen wir keinen Wein?
    Anna: Doch!
  options: ["No, we don't need wine.", "Maybe.", "The wine is expensive.", "Yes, we do need wine."]
  answer: 3
  explanation: >-
