# ---------- Bernese (gsw-be, recognition) ----------
- id: a1-u05-ch-be-mcq-miuch
  type: mcq
  skill: listening
  variety: gsw-be
  prompt: "Listen to Sandra's mother. What doesn't she need?"
  transcript: |-
    Mami: Nei, Miuch hei mer gnue.
  options: ["Butter", "Milk", "Potatoes", "Money"]
  answer: 1
  explanation: >-
    Bernese turns l into u before a consonant: Milch → Miuch (also Härdöpfu, viu = viel). hei mer = haben wir,
    gnue = genug: "We have enough milk."

- id: a1-u05-ch-be-transform-chouf
  type: transform
  skill: reading
  variety: gsw-be
  prompt: What does Sandra's mother ask her to buy? Write it in Standard German.
  from: gsw-be
  to: de
  source: Chouf no Härdöpfu u Anke!
  answers: ["Kauf noch Kartoffeln und Butter!", "Kaufe noch Kartoffeln und Butter!", "Kauf auch Kartoffeln und Butter!", "Kauf noch Kartoffeln und Butter."]
  explanation: >-
    chouf = kauf (Bernese choufe, Zurich chaufe), no = noch, Härdöpfu = Kartoffeln, u = und, Anke = Butter.

- id: a1-u05-ch-be-match
  type: match
  skill: vocabulary
  variety: gsw-be
  prompt: Match the Bernese words with Standard German.
  pairs:
    - ["Miuch", "Milch"]
    - ["Härdöpfu", "Kartoffeln"]
    - ["Nidle", "Sahne"]
    - ["choufe", "kaufen"]
  explanation: >-
    Two Bernese sound habits: l → u (Miuch, Härdöpfu) and au → ou (choufe; Zurich chaufe). Nidle (also
    Nydle) is the Bernese word for Rahm.
