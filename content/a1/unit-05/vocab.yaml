# A1 unit 5 – Einkaufen

# ---------- places and shopping ----------
- id: supermarkt
  de: Supermarkt
  en: supermarket
  pos: noun
  gender: m
  plural: Supermärkte
  example: { de: "Ich kaufe im Supermarkt ein.", en: "I do my shopping in the supermarket." }
  gswZh: Supermarkt / Lade (de Migros, de Coop)
  tags: [shopping, places]

- id: markt
  de: Markt
  en: market
  pos: noun
  gender: m
  plural: Märkte
  example: { de: "Am Samstag ist Markt.", en: "There's a market on Saturday." }
  gswZh: Märt (de Wuchemärt = weekly market)
  tags: [shopping, places]

- id: kasse
  de: Kasse
  en: till, checkout
  pos: noun
  gender: f
  plural: Kassen
  example: { de: "Die Kasse ist hier.", en: "The checkout is here." }
  gswZh: Kasse
  tags: [shopping]

- id: tuete
  de: Tüte
  en: (shopping) bag
  pos: noun
  gender: f
  plural: Tüten
  example: { de: "Brauchen Sie eine Tüte?", en: "Do you need a bag?" }
  chStd: Sack / Säckli (der Sack, das Säckli)
  gswZh: Säckli / Sack
  tags: [shopping, helvetism]

- id: preis
  de: Preis
  en: price
  pos: noun
  gender: m
  plural: Preise
  example: { de: "Der Preis ist gut.", en: "The price is good." }
  gswZh: Priis
  tags: [shopping, money]

