# ---------- verbs and adjectives ----------
- id: brauchen
  de: brauchen
  en: to need
  pos: verb
  example: { de: "Was brauchen wir für heute Abend?", en: "What do we need for this evening?" }
  gswZh: bruuche (ich bruuch, du bruuchsch, er bruucht)
  tags: [shopping]

- id: kaufen
  de: kaufen
  en: to buy
  pos: verb
  example: { de: "Ich kaufe das Brot im Supermarkt.", en: "I buy the bread in the supermarket." }
  gswZh: chaufe
  gswBe: choufe (participle gchouft)
  tags: [shopping]

- id: suchen
  de: suchen
  en: to look for
  pos: verb
  example: { de: "Ich suche den Käse.", en: "I'm looking for the cheese." }
  gswZh: sueche
  tags: [shopping]

- id: billig
  de: billig
  en: cheap
  pos: adj
  example: { de: "Das Obst ist billig.", en: "The fruit is cheap." }
  chStd: billig / günstig
  gswZh: billig / günschtig
  tags: [shopping, money]

- id: teuer
  de: teuer
  en: expensive
  pos: adj
  example: { de: "Der Wein ist nicht teuer.", en: "The wine isn't expensive." }
  gswZh: tüür
  tags: [shopping, money]

- id: frisch
  de: frisch
  en: fresh
  pos: adj
  example: { de: "Die Eier sind frisch.", en: "The eggs are fresh." }
  gswZh: frisch
  tags: [food]

# ---------- negation ----------
- id: nicht
  de: nicht
  en: not
  pos: adv
  example: { de: "Der Käse ist nicht teuer.", en: "The cheese isn't expensive." }
  gswZh: nöd / nid
  gswBe: nid
  tags: [negation]

- id: kein
  de: kein / keine
  en: no, not a, not any
  pos: pron
  example: { de: "Ich habe kein Brot.", en: "I haven't got any bread." }
  gswZh: kei (kei Ziit, kei Eier); neuter also keis
  gswBe: ke / kei; neuter kes (Mach kes Ghei!)
  tags: [negation]

- id: doch
  de: doch
  en: yes (contradicting a negative question)
  pos: other
  example: { de: "Brauchen wir keinen Wein? – Doch!", en: "Don't we need wine? – Yes, we do!" }
  gswZh: moll / momoll
  tags: [negation]
