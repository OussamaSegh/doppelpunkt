# A1 unit 9 – Termine und Verabredungen

# ---------- vocabulary ----------
- id: a1-u09-match-phone-verbs
  type: match
  skill: vocabulary
  variety: de
  prompt: Match the verbs with English.
  pairs:
    - ["anrufen", "to phone"]
    - ["absagen", "to cancel"]
    - ["verschieben", "to postpone"]
    - ["vorbeikommen", "to drop by"]
    - ["mitbringen", "to bring along"]
  explanation: >-
    Four of them are separable (an-, ab-, vorbei-, mit-): Ich rufe an, ich sage ab, ich komme vorbei, ich
    bringe mit. verschieben is not: ver- never splits.

- id: a1-u09-mcq-month-order
  type: mcq
  skill: vocabulary
  variety: de
  prompt: "Nach dem Juni kommt der ..."
  options: ["Mai", "August", "Juli", "September"]
  answer: 2
  explanation: >-
    Juni (June) → Juli (July). Say them clearly: JU-ni, JU-li. On the phone, many Germans say Juno for Juni
    and Julei for Juli to avoid confusion.

- id: a1-u09-mcq-termin
  type: mcq
  skill: vocabulary
  variety: de
  prompt: "\"Ich habe am Freitag einen Termin beim Friseur.\" What does it mean?"
  options: ["I have a hair appointment on Friday.", "I work at the hairdresser's on Friday.", "My hairdresser is coming on Friday.", "I'm meeting a friend on Friday."]
  answer: 0
  explanation: >-
    der Termin = appointment (official or professional). A private meeting with a friend is eine Verabredung.
    In Switzerland the hairdresser is der Coiffeur.

- id: a1-u09-match-ordinals
  type: match
  skill: vocabulary
  variety: de
  grammar: [dates-ordinals]
  prompt: Match the written dates with how you say them.
  pairs:
    - ["1. Mai", "der erste Mai"]
    - ["3. Mai", "der dritte Mai"]
    - ["7. Mai", "der siebte Mai"]
    - ["12. Mai", "der zwölfte Mai"]
    - ["20. Mai", "der zwanzigste Mai"]
  explanation: >-
    The full stop after the number marks an ordinal. 1–19 add -te (erste, dritte and siebte are irregular),
    from 20 add -ste: zwanzigste.

# ---------- grammar: separable verbs ----------
- id: a1-u09-gap-separable
  type: gap
  skill: grammar
  variety: de
  grammar: [separable-verbs-modal]
  prompt: "Fill in the verb and the prefix. (anrufen, vorbeikommen)"
  text: "Ich ___ dich morgen ___. Kommst du heute Abend ___?"
  answers: [["rufe"], ["an"], ["vorbei"]]
  explanation: >-
    In a statement or question the separable verb splits: the verb is in position 2 (or 1), the prefix goes
    to the end: Ich rufe ... an. Kommst du ... vorbei?

- id: a1-u09-gap-separable-modal
  type: gap
  skill: grammar
  variety: de
  grammar: [separable-verbs-modal, modal-muessen-duerfen]
  prompt: "Fill in absagen or mitbringen as one word."
  text: "Ich muss den Termin leider ___. Soll ich einen Kuchen ___?"
  answers: [["absagen"], ["mitbringen"]]
  explanation: >-
    With a modal verb (muss, soll), the separable verb is an infinitive at the end and stays in one piece:
    absagen, mitbringen.

- id: a1-u09-mcq-separable
  type: mcq
  skill: grammar
  variety: de
  grammar: [separable-verbs-modal]
  prompt: Which sentence is correct?
  options: ["Ich anrufe dich heute.", "Ich rufe an dich heute.", "Ich rufe heute an dich.", "Ich rufe dich heute an."]
  answer: 3
  rationales:
    - "The prefix can't stay on the verb in position 2."
    - "The object (dich) comes before the prefix."
    - "an goes to the very end of the sentence."
    - "Correct. Verb second, everything else in the middle, the prefix at the end."
  explanation: >-
    Separable verbs make a bracket like modal verbs: rufe ... an. Objects and time words go inside the
    bracket.

- id: a1-u09-mcq-verschieben
  type: mcq
  skill: grammar
  variety: de
  grammar: [separable-verbs-modal]
  prompt: Choose the correct sentence.
  options: ["Wir schieben den Termin ver.", "Wir verschieben den Termin.", "Wir verschieben den Termin ver.", "Wir schieben ver den Termin."]
  answer: 1
  explanation: >-
    ver- is an inseparable prefix: it never splits and it is never stressed (ver-SCHIE-ben). Separable
    prefixes like an-, ab-, mit- are stressed and split.

- id: a1-u09-order-modal-separable
  type: order
  skill: grammar
  variety: de
  grammar: [separable-verbs-modal, modal-koennen-wollen]
  prompt: Make a yes/no question.
  tokens: ["du", "morgen", "Kannst", "vorbeikommen"]
  answers: ["Kannst du morgen vorbeikommen?"]
  explanation: >-
    Modal verb first, subject second, time word in the middle, the whole separable infinitive at the end.

- id: a1-u09-order-separable-statement
  type: order
  skill: grammar
  variety: de
  grammar: [separable-verbs-modal, time-inversion]
  prompt: Start with "Heute Abend".
  tokens: ["Heute", "Abend", "rufe", "ich", "dich", "an"]
  answers: ["Heute Abend rufe ich dich an."]
  explanation: >-
    Time phrase in position 1, verb second, subject third (unit 4). The prefix an closes the sentence.

- id: a1-u09-transform-modal-separable
  type: transform
  skill: grammar
  variety: de
  grammar: [separable-verbs-modal, modal-muessen-duerfen]
  prompt: "Add the modal verb in brackets: Ich sage die Party ab. (müssen)"
  from: de
  to: de
  source: Ich sage die Party ab.
  answers: ["Ich muss die Party absagen."]
  explanation: >-
    muss takes position 2; sage ... ab becomes one infinitive at the end: absagen.

# ---------- grammar: sollen ----------
- id: a1-u09-gap-sollen
  type: gap
  skill: grammar
  variety: de
  grammar: [sollen]
  prompt: Fill in the correct form of sollen.
  text: "Der Arzt sagt, ich ___ viel schlafen. ___ ich dich morgen anrufen? Ihr ___ nichts kaufen."
  answers: [["soll"], ["Soll"], ["sollt"]]
  explanation: >-
    sollen: ich soll, ihr sollt. ich and er/sie/es have no ending. Soll ich ...? is an offer: Shall I ...?

- id: a1-u09-mcq-soll-ich
  type: mcq
  skill: grammar
  variety: de
  grammar: [sollen]
  prompt: "\"Soll ich etwas mitbringen?\" What is Tom doing?"
  options: ["He's saying he must bring something.", "He's refusing to bring something.", "He's offering to bring something.", "He's asking someone to bring something."]
  answer: 2
  explanation: >-
    Soll ich ...? = Shall I ...? – an offer. The typical answers: Ja, gern! / Nein, danke, du musst nichts
    mitbringen.

- id: a1-u09-transform-sollen
  type: transform
  skill: grammar
  variety: de
  grammar: [sollen, separable-verbs-modal]
  prompt: "Lena tells you: \"Bring bitte Wein mit!\" Tell another friend what Lena wants. Start with \"Ich soll ...\"."
  from: de
  to: de
  source: Bring bitte Wein mit!
  answers: ["Ich soll Wein mitbringen.", "Ich soll bitte Wein mitbringen."]
  explanation: >-
    sollen reports an instruction from someone else: Lena says "Bring Wein mit!" → Ich soll Wein mitbringen.
    The separable verb becomes one infinitive at the end.

# ---------- grammar: dates ----------
- id: a1-u09-gap-dates
  type: gap
  skill: grammar
  variety: de
  grammar: [dates-ordinals]
  prompt: "Write the ordinal numbers in words. (3. – 12.)"
  text: Heute ist der ___ Mai. Mein Termin ist am ___ Juni.
  answers: [["dritte"], ["zwölften"]]
  explanation: >-
    der + -e: der dritte Mai. am + -en: am zwölften Juni. dritte is irregular; zwölf + -te = zwölfte.

- id: a1-u09-mcq-am-erster-august
  type: mcq
  skill: grammar
  variety: de
  grammar: [dates-ordinals]
  prompt: "How do you say \"on 1 August\" (the Swiss national day)?"
  options: ["am eins August", "am ersten August", "im ersten August", "am erste August"]
  answer: 1
  rationales:
    - "Dates need ordinal numbers."
    - "Correct. am + ordinal + -en."
    - "im is for a month alone (im August)."
    - "After am the ending is -en."
  explanation: >-
    am ersten August. erste is irregular (like first). On 1 August the Swiss celebrate their national day
    with bonfires and fireworks.

- id: a1-u09-mcq-im-am
  type: mcq
  skill: grammar
  variety: de
  grammar: [dates-ordinals]
  prompt: Choose the correct preposition.
  question: Mein Geburtstag ist ___ Juli, ___ siebten Juli.
  options: ["am – im", "im – im", "am – am", "im – am"]
  answer: 3
  explanation: >-
    im + month alone (im Juli), am + date (am siebten Juli). Both are contractions: im = in dem, am = an dem.

- id: a1-u09-translate-birthday
  type: translate
  skill: writing
  variety: de
  grammar: [dates-ordinals]
  prompt: Translate into German.
  source: My birthday is on the fourth of July.
  answers: ["Mein Geburtstag ist am vierten Juli.", "Mein Geburtstag ist am 4. Juli.", "Ich habe am vierten Juli Geburtstag.", "Ich habe am 4. Juli Geburtstag."]
  explanation: >-
    am + ordinal + -en: am vierten Juli. Germans also say Ich habe am ... Geburtstag (I have my birthday on
    ...).

# ---------- grammar: time words ----------
- id: a1-u09-mcq-uebermorgen
  type: mcq
  skill: grammar
  variety: de
  grammar: [time-adverbs]
  prompt: "Heute ist Montag. Wann ist übermorgen?"
  options: ["Am Sonntag", "Am Dienstag", "Am Donnerstag", "Am Mittwoch"]
  answer: 3
  explanation: >-
    morgen = tomorrow (Dienstag), übermorgen = the day after tomorrow (Mittwoch). gestern = yesterday
    (Sonntag).

- id: a1-u09-gap-time-words
  type: gap
  skill: grammar
  variety: de
  grammar: [time-adverbs, time-inversion]
  prompt: "Fill in: tomorrow – next (week)."
  text: ___ habe ich keine Zeit, aber ___ Woche kann ich.
  answers: [["Morgen"], ["nächste"]]
  explanation: >-
    morgen in position 1 is written with a capital only because it starts the sentence – it's still the
    adverb tomorrow. die Woche → nächste Woche. After Morgen, the verb habe comes second.

# ---------- reading ----------
- id: a1-u09-mcq-reading-when
  type: mcq
  skill: reading
  variety: ch-std
  grammar: [dates-ordinals]
  prompt: Read the invitation. When and where is the party?
  options: ["On Sunday 22 June at the Hubers' flat", "On Saturday 21 June in the garden", "On Saturday 14 June in the garden", "On Friday 21 June in the café"]
  answer: 1
  explanation: >-
    "Am Samstag, 21. Juni, machen wir im Garten ein Sommerfest." Sunday 22 June is the rain date; 14 June is
    the deadline for answering.

- id: a1-u09-mcq-reading-bring
  type: mcq
  skill: reading
  variety: ch-std
  grammar: [sollen, separable-verbs-modal]
  prompt: What should the neighbours bring?
  options: ["Drinks for the barbecue", "Nothing, but a salad or a cake is welcome", "Meat for the grill", "Money for the drinks"]
  answer: 1
  explanation: >-
    "Ihr sollt nichts kaufen, aber ihr könnt gern einen Salat oder einen Kuchen mitbringen." The Hubers take
    care of (sorgen für) the barbecue and drinks.

- id: a1-u09-translate-reading
  type: translate
  skill: reading
  variety: ch-std
  grammar: [separable-verbs-modal, imperative]
  prompt: Translate into English.
  source: Ruft uns an oder schreibt eine Nachricht.
  answers: ["Call us or write a message.", "Phone us or send a message.", "Call us or send a message.", "Phone us or write a message."]
  explanation: >-
    Two ihr-imperatives (unit 8): Ruft ... an! Schreibt! The prefix an goes to the end, after the object uns.

