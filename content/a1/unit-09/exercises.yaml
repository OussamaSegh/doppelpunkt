- id: a1-u09-speak-shadow-tom
  type: speak
  skill: speaking
  variety: de
  grammar: [separable-verbs-modal]
  prompt: "Shadowing: speak along with Tom's line from the intro dialogue, then say it alone."
  target: Ich muss den Termin leider absagen. Ich muss am Dienstag arbeiten.
  explanation: >-
    Stress the separable prefix: AB-sagen. leider is slightly slower and lower – it sounds apologetic.

- id: a1-u09-speak-shadow-graf
  type: speak
  skill: speaking
  variety: ch-std
  grammar: [dates-ordinals]
  prompt: "Shadowing: speak along with Frau Graf, then say it alone."
  target: Geht es am elften Mai um halb zehn? Das ist ein Mittwoch.
  explanation: >-
    Listen to the Swiss Standard accent: a clear, tapped r and the ach-sound in Mittwoch's ch. am elften has
    no glottal stop in Swiss speech – the words run together (a-melften).

- id: a1-u09-speak-dates
  type: speak
  skill: speaking
  variety: de
  grammar: [dates-ordinals]
  prompt: "Say the dates aloud: 1.1., 3.3., 7.7., 20.10."
  target: am ersten Januar, am dritten März, am siebten Juli, am zwanzigsten Oktober
  explanation: >-
    am + ordinal + -en. Watch the irregular ones: ersten, dritten, siebten; from 20 it's -sten: zwanzigsten.

- id: a1-u09-speak-pron-stress
  type: speak
  skill: speaking
  variety: de
  grammar: [separable-verbs-modal]
  prompt: "Pronunciation: separable prefixes are stressed, ver- and be- are not. Read aloud."
  target: anrufen, absagen, vorbeikommen, mitbringen – verschieben, besuchen, verstehen
  explanation: >-
    AN-rufen, AB-sagen, vor-BEI-kommen, MIT-bringen – but ver-SCHIE-ben, be-SU-chen, ver-STE-hen. vorbei- is
    stressed on its second syllable. See the drill on word stress.

- id: a1-u09-roleplay-lena
  type: roleplay
  skill: speaking
  variety: de
  grammar: [separable-verbs-modal, sollen, dates-ordinals, time-adverbs]
  tutor: lena
  prompt: "Roleplay with Lena: find a date for dinner."
  scenario: >-
    Lena phones you. She wants to invite you for dinner. You can't on the day she suggests. Find another
    date, agree on a time and offer to bring something. Use du.
  goals:
    - Answer the phone and greet Lena.
    - Say you can't on her day and why (Ich muss ...).
    - Suggest another day or date (übermorgen, am ... ten).
    - Offer to bring something (Soll ich ... mitbringen?).
    - Agree and say goodbye (Bis ...!).
  model: |
    Lena: Hallo, hier ist Lena! Ich koche am Freitag. Kommst du vorbei?
    Du: Hallo Lena! Am Freitag kann ich leider nicht, ich muss arbeiten.
    Lena: Schade. Und am Samstag?
    Du: Am Samstag passt es. Um wie viel Uhr?
    Lena: Um sieben?
    Du: Super. Soll ich etwas mitbringen?
    Lena: Ja, gern einen Salat!
    Du: Gut, mache ich. Bis Samstag!
  explanation: >-
    Useful frames: Am ... kann ich leider nicht. Am ... passt es. Soll ich ... mitbringen? Bis Samstag! /
    Bis bald!

# ---------- writing ----------
- id: a1-u09-translate-call-back
  type: translate
  skill: writing
  variety: de
  grammar: [separable-verbs-modal, time-adverbs]
  prompt: Translate into German (informal).
  source: I'll call you tomorrow.
  answers: ["Ich rufe dich morgen an.", "Morgen rufe ich dich an.", "Ich rufe dich morgen zurück.", "Ich ruf dich morgen an."]
  explanation: >-
    German uses the present tense for plans: Ich rufe dich morgen an (I'll call you tomorrow). The prefix an
    goes to the end.

- id: a1-u09-write-email
  type: write
  skill: writing
  variety: de
  grammar: [separable-verbs-modal, sollen, dates-ordinals, time-adverbs]
  prompt: Write a short email to move an appointment.
  task: >-
    You have an appointment with your German teacher, Frau Keller, on 14 May at 10 o'clock, but you can't
    come. Write an email (5–7 sentences): say which appointment it is, that you must cancel it and why,
    suggest two new dates, and ask whether you should bring anything.
  minWords: 40
  model: >-
    Liebe Frau Keller, ich habe am vierzehnten Mai um zehn Uhr einen Termin bei Ihnen. Ich muss den Termin
    leider absagen, ich muss an dem Tag arbeiten. Können wir den Termin verschieben? Am sechzehnten Mai oder
    am zwanzigsten Mai habe ich Zeit, am Vormittag oder am Nachmittag. Soll ich meine Hausaufgaben
    mitbringen? Viele Grüße, Tom Baker
  checklist:
    - I write dates with am + ordinal + -en (am vierzehnten Mai) or as numbers with a full stop (am 14. Mai).
    - With a modal verb, the separable verb is one word at the end (absagen).
    - I use Soll ich ...? for my offer.
    - I start and end the email politely (Liebe Frau ..., Viele Grüße).
  explanation: >-
    A formal email uses Sie / Ihnen and a polite frame. The core sentences are the unit patterns: Ich muss
    den Termin leider absagen. Können wir ... verschieben? Soll ich ... mitbringen?

# ---------- Swiss Standard German ----------
- id: a1-u09-chstd-match
  type: match
  skill: vocabulary
  variety: ch-std
  prompt: Match the Swiss Standard German words with the German-German words.
  pairs:
    - ["der Coiffeur", "der Friseur"]
    - ["das Natel", "das Handy"]
    - ["die Agenda", "der Terminkalender"]
    - ["das Nachtessen", "das Abendessen"]
  explanation: >-
    der Coiffeur and die Agenda come from French. das Natel was a Swiss brand name; today most people say
    Handy, but Natel is still understood everywhere.

# ---------- Swiss lane (gsw-zh) ----------
- id: a1-u09-ch-match-time
  type: match
  skill: vocabulary
  variety: gsw-zh
  grammar: [time-adverbs]
  prompt: Match the Zurich German words with Standard German.
  pairs:
    - ["morn", "morgen"]
    - ["übermorn", "übermorgen"]
    - ["hüt", "heute"]
    - ["spöter", "später"]
    - ["abgmacht", "abgemacht"]
  explanation: >-
    morn = tomorrow, but am Morge = in the morning – the same trap as in Standard German. abgmacht = agreed,
    it's a deal (no e in ge-).

- id: a1-u09-ch-mcq-when
  type: mcq
  skill: listening
  variety: gsw-zh
  grammar: [time-adverbs]
  prompt: Listen to the Swiss lane dialogue. When will Sandra go to Reto's?
  options: ["Tomorrow at six", "Today at seven", "The day after tomorrow at seven", "Tomorrow at seven"]
  answer: 2
  explanation: >-
    "Morn chan ich nöd ... Übermorn gaht s." – "Am sibni?" übermorn = übermorgen, am sibni = um sieben (unit 4).

- id: a1-u09-ch-transform-ziit
  type: transform
  skill: reading
  variety: gsw-zh
  grammar: [time-adverbs]
  prompt: What does Reto ask? Write it in Standard German.
  from: gsw-zh
  to: de
  source: Häsch morn Ziit?
  answers: ["Hast du morgen Zeit?", "Hast du Zeit morgen?"]
  explanation: >-
    häsch = hast du (du is often dropped after the verb), morn = morgen, Ziit = Zeit (ei → ii).

- id: a1-u09-ch-transform-aaluete
  type: transform
  skill: reading
  variety: gsw-zh
  grammar: [separable-verbs-modal]
  prompt: What does Sandra promise? Write it in Standard German.
  from: gsw-zh
  to: de
  source: Ich lüüt dir morn no aa.
  answers: ["Ich rufe dich morgen noch an.", "Ich rufe dich morgen an.", "Morgen rufe ich dich noch an."]
  explanation: >-
    aalüüte = anrufen, separable as in Standard German (lüüt ... aa). Zurich uses the dative dir, Standard
    German the accusative dich: Ich rufe dich an.

- id: a1-u09-ch-mcq-soell
  type: mcq
  skill: listening
  variety: gsw-zh
  grammar: [sollen]
  prompt: "Sandra asks: \"Söll ich öppis mitbringe?\" What does Reto want her to bring?"
  options: ["A bottle of wine", "Nothing at all", "A cake", "Some bread"]
  answer: 0
  explanation: >-
    "Nei, nüt. Oder doch – e Fläsche Wii!" söll ich = soll ich, öppis = etwas, nüt = nichts, Wii = Wein.

- id: a1-u09-ch-transform-de-gsw
  type: transform
  skill: vocabulary
  variety: gsw-zh
  grammar: [time-adverbs]
  prompt: "Recognition: how do you say this in Zurich German? (Common spellings are accepted.)"
  from: de
  to: gsw-zh
  source: Bis morgen!
  answers: ["Bis morn!", "Bis morn.", "Bis moorn!"]
  explanation: >-
    morgen → morn. A very common goodbye, together with Bis spöter! and Bis bald!

- id: a1-u09-roleplay-reto
  type: roleplay
  skill: listening
  variety: gsw-zh
  grammar: [time-adverbs, separable-verbs-modal, sollen]
  tutor: reto
  prompt: "Listening roleplay with Reto: a phone call."
  scenario: >-
    Your phone rings – it's Reto. He wants to meet up. He speaks Zurich German; you answer in Standard
    German. Find a day that works, agree on a time and offer to bring something.
  goals:
    - Answer the phone with your name and understand who is calling.
    - Understand Häsch morn / übermorn Ziit? and answer.
    - Agree on a day and time and offer to bring something (Soll ich ...?).
  model: |
    Du: Baker.
    Reto: Hoi, da isch de Reto! Häsch morn Ziit? Mir mached es Fondue.
    Du: Morgen kann ich leider nicht. Geht es übermorgen?
    Reto: Übermorn? Ja, das gaht. Am halbi achti?
    Du: Um halb acht, super. Soll ich etwas mitbringen?
    Reto: Nei, nüt. Du muesch nur Hunger mitbringe!
    Du: Gut, bis übermorgen!
  explanation: >-
    Decoding: mir mached = wir machen, gaht = geht, am halbi achti = um halb acht (unit 4), muesch nur Hunger
    mitbringe = you only need to bring an appetite.

# ---------- Bernese (gsw-be, recognition) ----------
- id: a1-u09-ch-be-mcq-birthday
  type: mcq
  skill: listening
  variety: gsw-be
  grammar: [dates-ordinals]
  prompt: "Sandra's mother: \"Am vierte Juli het dr Ätti Geburtstag.\" Whose birthday is it, and when?"
  options: ["Sandra's mother's, on 14 July", "Sandra's grandfather's, on 4 July", "Sandra's father's, on 4 July", "Sandra's father's, on 4 June"]
  answer: 2
  explanation: >-
    dr Ätti = der Vater (Papa) in Bernese; het = hat; am vierte Juli = am vierten Juli. The dialect drops the
    final -n of the ordinal.

