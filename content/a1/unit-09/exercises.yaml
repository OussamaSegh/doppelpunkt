  transcript: Der Termin ist am zweiten Mai um zehn Uhr.
  explanation: >-
    am zweiten Mai: am + ordinal + -en. You may also write am 2. Mai – with a full stop after the number.

- id: a1-u09-mcq-listening-new-date
  type: mcq
  skill: listening
  variety: ch-std
  grammar: [dates-ordinals]
  prompt: Listen to the intro dialogue again. When is Tom's new appointment?
  options: ["Tuesday 3 May at nine", "Wednesday 11 May at 9.30", "Wednesday 11 May at 10.30", "Thursday 12 May at 9.30"]
