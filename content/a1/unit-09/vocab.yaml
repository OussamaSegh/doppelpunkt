- id: naechste-woche
  de: nächste Woche
  en: next week
  pos: phrase
  example: { de: "Nächste Woche kann ich am Vormittag.", en: "Next week I can do mornings." }
  gswZh: nächscht Wuche
  tags: [time]

- id: bald
  de: bald
  en: soon
  pos: adv
  example: { de: "Bis bald!", en: "See you soon!" }
  gswZh: bald
  gswBe: bau
  tags: [time]

- id: spaeter
  de: später
  en: later
  pos: adv
  example: { de: "Ich rufe dich später an.", en: "I'll call you later." }
  gswZh: spöter
  tags: [time]

- id: auf-wiederhoeren
  de: Auf Wiederhören!
  en: Goodbye! (on the phone)
  pos: phrase
  example: { de: "Vielen Dank und auf Wiederhören!", en: "Thank you very much and goodbye!" }
  gswZh: Uf Widerlose! / Tschüss!
  tags: [phone, phrases]

