# ---------- modal verbs and preferences ----------
- id: koennen
  de: können
  en: can, to be able to
  pos: verb
  example: { de: "Kannst du schwimmen?", en: "Can you swim?" }
  gswZh: chöne (ich chan, du chasch, er chan, mir chönd)
  gswBe: chönne (i cha, du chasch, mir chöi)
  tags: [modal, verbs]

- id: wollen
  de: wollen
  en: to want (to)
  pos: verb
  example: { de: "Ich will Ski fahren lernen.", en: "I want to learn to ski." }
  gswZh: wele / welle (ich wott, du wottsch, er wott, mir wänd)
  gswBe: wöue (i wott, mir wei)
  tags: [modal, verbs, false-friend]

- id: gern
  de: gern / gerne
  en: gladly; (verb +) gern = to like doing
  pos: adv
  example: { de: "Ich tanze gern.", en: "I like dancing." }
  gswZh: gärn
  tags: [preferences]

- id: lieber
  de: lieber
  en: rather, preferably
  pos: adv
  example: { de: "Ich trinke lieber Tee.", en: "I prefer tea." }
  gswZh: lieber
  tags: [preferences]

- id: am-liebsten
  de: am liebsten
  en: best of all, most of all
  pos: phrase
  example: { de: "Am liebsten schwimme ich.", en: "Best of all I like swimming." }
  gswZh: am liebschte
  tags: [preferences]

- id: oft
  de: oft
  en: often
  pos: adv
  example: { de: "Ich gehe oft ins Kino.", en: "I often go to the cinema." }
  gswZh: oft / hüüfig
  tags: [frequency]

- id: manchmal
  de: manchmal
  en: sometimes
  pos: adv
  example: { de: "Manchmal spiele ich Gitarre.", en: "Sometimes I play the guitar." }
  gswZh: mängisch
  tags: [frequency]

- id: nie
  de: nie
  en: never
  pos: adv
  example: { de: "Ich tanze nie.", en: "I never dance." }
  gswZh: nie
  tags: [frequency]
