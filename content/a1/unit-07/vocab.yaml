# A1 unit 7 – Freizeit und Hobbys

# ---------- free time ----------
- id: freizeit
  de: Freizeit
  en: free time, leisure
  pos: noun
  gender: f
  plural: "-"
  example: { de: "Was machst du gern in der Freizeit?", en: "What do you like doing in your free time?" }
  gswZh: Freiziit (d Freiziit)
  tags: [leisure]

- id: hobby
  de: Hobby
  en: hobby
  pos: noun
  gender: n
  plural: Hobbys
  example: { de: "Mein Hobby ist Musik.", en: "My hobby is music." }
  gswZh: Hobby (s Hobby)
  tags: [leisure]

- id: sport
  de: Sport
  en: sport, exercise
  pos: noun
  gender: m
  plural: "-"
  example: { de: "Sport macht Spaß.", en: "Sport is fun." }
