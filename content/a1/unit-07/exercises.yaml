# A1 unit 7 – Freizeit und Hobbys

# ---------- vocabulary ----------
- id: a1-u07-match-hobbies
  type: match
  skill: vocabulary
  variety: de
  prompt: Match the activities with English.
  pairs:
    - ["schwimmen", "to swim"]
    - ["wandern", "to hike"]
    - ["tanzen", "to dance"]
    - ["singen", "to sing"]
    - ["reisen", "to travel"]
  explanation: >-
    All five are regular verbs: ich schwimme, du tanzt, er reist. Careful: wandern is hiking or walking in
    the countryside – not "wandering around".

- id: a1-u07-match-seasons
  type: match
  skill: vocabulary
  variety: de
  prompt: Match the seasons and the weather words.
  pairs:
    - ["der Frühling", "spring"]
    - ["der Sommer", "summer"]
    - ["der Herbst", "autumn"]
    - ["der Winter", "winter"]
    - ["der Schnee", "snow"]
  explanation: >-
    All four seasons are masculine (der), and so are der Regen and der Schnee. In summer = im Sommer.

- id: a1-u07-mcq-instrument
  type: mcq
  skill: vocabulary
  variety: de
  prompt: Which one is a musical instrument?
  options: ["das Kino", "der See", "das Klavier", "der Herbst"]
  answer: 2
  explanation: >-
    das Klavier = piano. German says Klavier spielen, Gitarre spielen – without an article, as for sports:
    Fußball spielen.

- id: a1-u07-mcq-season
  type: mcq
  skill: vocabulary
  variety: de
  grammar: [weather-es]
  prompt: "Es ist kalt und es schneit. Welche Jahreszeit ist es? (die Jahreszeit = season)"
  options: ["Sommer", "Frühling", "Herbst", "Winter"]
  answer: 3
  explanation: >-
    es schneit = it's snowing, so it's winter. Weather verbs use es: es schneit, es regnet.

- id: a1-u07-mcq-frequency
  type: mcq
  skill: vocabulary
  variety: de
  prompt: "Tom swims every day. Anna swims once or twice a month. Lena never swims. What does Anna say?"
  options: ["Ich schwimme oft.", "Ich schwimme manchmal.", "Ich schwimme nie.", "Ich schwimme jeden Tag."]
  answer: 1
  explanation: >-
    manchmal = sometimes. The scale: immer (always) – oft (often) – manchmal (sometimes) – nie (never). Like
    gern, these words come after the verb: Ich schwimme manchmal.

# ---------- grammar: gern / lieber / am liebsten ----------
- id: a1-u07-gap-gern-lieber
  type: gap
  skill: grammar
  variety: de
  grammar: [gern-lieber]
  prompt: "Fill in gern, lieber or liebsten. (like – prefer – like best)"
  text: Ich trinke ___ Kaffee, ___ Tee, aber am ___ trinke ich Wasser.
  answers: [["gern", "gerne"], ["lieber"], ["liebsten"]]
  explanation: >-
    gern – lieber – am liebsten is the scale of liking (like – prefer – like best). They are irregular:
    there is no *gerner*.

- id: a1-u07-mcq-gern-position
  type: mcq
  skill: grammar
  variety: de
  grammar: [gern-lieber]
  prompt: Which sentence is correct?
  options: ["Ich gern spiele Gitarre.", "Gern ich spiele Gitarre.", "Ich spiele gern Gitarre.", "Ich spiele Gitarre gern ich."]
  answer: 2
  rationales:
    - "The verb must be in position 2: Ich spiele ..."
    - "If gern is in position 1, the verb comes next: Gern spiele ich Gitarre."
    - "Correct. Verb second, then gern."
    - "The subject can't come at the end."
  explanation: >-
    gern is an adverb that follows the conjugated verb: Ich spiele gern Gitarre. English puts "like" before
    the activity; German puts gern after the verb.

- id: a1-u07-order-gern
  type: order
  skill: grammar
  variety: de
  grammar: [gern-lieber, time-inversion]
  prompt: Put the words in order.
  tokens: ["wandern", "Im", "gern", "Herbst", "wir"]
  answers: ["Im Herbst wandern wir gern.", "Wir wandern im Herbst gern.", "Wir wandern gern im Herbst."]
  explanation: >-
    With Im Herbst in position 1, the verb wandern stays second and wir comes third (unit 4: time
    inversion). Starting with wir is also correct.

- id: a1-u07-transform-lieber
  type: transform
  skill: grammar
  variety: de
  grammar: [gern-lieber]
  prompt: "Anna doesn't like football – she prefers tennis. Rewrite with nicht gern and lieber."
  from: de
  to: de
  source: Anna spielt gern Fußball.
  answers: ["Anna spielt nicht gern Fußball, sie spielt lieber Tennis.", "Anna spielt nicht gern Fußball. Sie spielt lieber Tennis.", "Anna spielt nicht gern Fussball, sie spielt lieber Tennis.", "Anna spielt nicht gern Fußball, lieber spielt sie Tennis.", "Anna spielt nicht gerne Fußball, sie spielt lieber Tennis."]
  explanation: >-
    nicht gern = doesn't like doing. lieber = prefers. Both stand right after the verb: spielt nicht gern,
    spielt lieber.

- id: a1-u07-translate-not-like
  type: translate
  skill: writing
  variety: de
  grammar: [gern-lieber]
  prompt: Translate into German.
  source: I don't like dancing.
  answers: ["Ich tanze nicht gern.", "Ich tanze nicht gerne."]
  explanation: >-
    "I (don't) like + -ing" = verb + (nicht) gern. Not *Ich mag nicht tanzen* – that's possible, but much
    less natural.

# ---------- grammar: können / wollen ----------
- id: a1-u07-gap-koennen
  type: gap
  skill: grammar
  variety: de
  grammar: [modal-koennen-wollen]
  prompt: Fill in the correct form of können.
  text: "___ du schwimmen? – Ja, ich ___ gut schwimmen. Aber mein Bruder ___ nicht schwimmen."
  answers: [["Kannst"], ["kann"], ["kann"]]
  explanation: >-
    können: ich kann, du kannst, er kann. ich and er have the same form with no ending – typical of all
    modal verbs.

- id: a1-u07-gap-wollen
  type: gap
  skill: grammar
  variety: de
  grammar: [modal-koennen-wollen]
  prompt: Fill in the correct form of wollen.
  text: "Wir ___ ins Kino gehen. ___ ihr mitkommen? – Nein, Tom ___ lieber wandern."
  answers: [["wollen"], ["Wollt"], ["will"]]
  explanation: >-
    wollen: wir wollen, ihr wollt, er will. The singular has a vowel change (i): ich will, du willst, er will.

- id: a1-u07-mcq-kann
  type: mcq
  skill: grammar
  variety: de
  grammar: [modal-koennen-wollen]
  prompt: Choose the correct form.
  question: Lena ___ sehr gut singen.
  options: ["kannt", "können", "kann", "kannst"]
  answer: 2
  rationales:
    - "Modal verbs have no -t with er/sie/es."
    - "können is the infinitive, or the form for wir/sie."
    - "Correct. sie kann."
    - "kannst goes with du."
  explanation: >-
    For modal verbs, ich and er/sie/es are the same and have no ending: ich kann, sie kann.

- id: a1-u07-mcq-will-false-friend
  type: mcq
  skill: grammar
  variety: de
  grammar: [modal-koennen-wollen]
  prompt: "\"Ich will einen Kaffee.\" What does it mean?"
  options: ["I want a coffee.", "I will have a coffee tomorrow.", "I'll make a coffee.", "I drink coffee."]
  answer: 0
  explanation: >-
    False friend: ich will = I want. It sounds a bit direct when ordering – say Ich möchte einen Kaffee or
    Ich hätte gern einen Kaffee (unit 2).

- id: a1-u07-order-bracket
  type: order
  skill: grammar
  variety: de
  grammar: [modal-koennen-wollen]
  prompt: Put the words in order.
  tokens: ["Ich", "nicht", "kann", "fahren", "Ski"]
  answers: ["Ich kann nicht Ski fahren.", "Ski fahren kann ich nicht."]
  explanation: >-
    The sentence bracket: kann in position 2, the infinitive (Ski) fahren at the end, nicht before it.

- id: a1-u07-order-question
  type: order
  skill: grammar
  variety: de
  grammar: [modal-koennen-wollen]
  prompt: Make a yes/no question.
  tokens: ["du", "Gitarre", "Kannst", "spielen"]
  answers: ["Kannst du Gitarre spielen?"]
  explanation: >-
    Yes/no questions start with the conjugated verb (here the modal). The infinitive still closes the
    sentence: Kannst du ... spielen?

- id: a1-u07-transform-modal
  type: transform
  skill: grammar
  variety: de
  grammar: [modal-koennen-wollen]
  prompt: "Add the modal verb in brackets: Ich spiele Klavier. (können)"
  from: de
  to: de
  source: Ich spiele Klavier.
  answers: ["Ich kann Klavier spielen."]
  explanation: >-
    The modal verb takes the person ending and position 2 (kann); spielen moves to the end in the
    infinitive.

# ---------- grammar: weather ----------
- id: a1-u07-gap-weather
  type: gap
  skill: grammar
  variety: de
  grammar: [weather-es]
  prompt: "Fill in the gaps. (it snows – cold)"
  text: Im Winter ___ es oft und es ist ___.
  answers: [["schneit"], ["kalt"]]
  explanation: >-
    Im Winter is in position 1, so the verb schneit comes before es. kalt has no ending after ist.

- id: a1-u07-mcq-es-regnet
  type: mcq
  skill: grammar
  variety: de
  grammar: [weather-es]
  prompt: "How do you say \"It's raining\"?"
  options: ["Es ist Regen.", "Es regen.", "Das regnet.", "Es regnet."]
  answer: 3
  explanation: >-
    regnen is a verb: es regnet (like er arbeitet, with -et after the n). der Regen is the noun.

# ---------- reading ----------
- id: a1-u07-mcq-reading-marco
  type: mcq
  skill: reading
  variety: ch-std
  grammar: [gern-lieber]
  prompt: Read "Freizeit in Zürich". What does Marco like doing best in summer?
  options: ["Playing the guitar", "Swimming in the lake", "Skiing", "Going to concerts"]
  answer: 1
  explanation: >-
    "Im Sommer schwimme ich am liebsten im See." am liebsten = best of all. In winter the water is too cold,
    so he skis.

- id: a1-u07-mcq-reading-aylin
  type: mcq
  skill: reading
  variety: ch-std
  grammar: [modal-koennen-wollen]
  prompt: "Richtig oder falsch? \"Aylin kann sehr gut singen.\""
  options: ["Richtig", "Falsch"]
  answer: 1
  explanation: >-
    Falsch. "Ich kann nicht gut singen, aber ich will es lernen." She can't sing well, but she wants to
    learn.

- id: a1-u07-translate-reading
  type: translate
  skill: reading
  variety: ch-std
  grammar: [gern-lieber]
  prompt: Translate into English.
  source: Sport mache ich nicht gern. Ich fahre lieber Velo.
  answers: ["I don't like doing sport. I prefer cycling.", "I don't like sport. I prefer cycling.", "I don't like doing sport. I'd rather ride my bike.", "I don't like doing sport. I prefer riding my bike."]
  explanation: >-
    The object Sport is in position 1 for emphasis; the verb mache stays second. Velo fahren is the Swiss
    word for Rad fahren (cycling). lieber = prefer.

# ---------- listening ----------
- id: a1-u07-dictation-gitarre
