  skill: listening
  variety: de
  grammar: [gern-lieber]
  prompt: Listen and write what you hear.
  transcript: Ich spiele gern Gitarre.
  explanation: >-
    Gitarre is a noun, so it has a capital letter, and it ends in -e (die Gitarre). gern comes right after
    the verb.

- id: a1-u07-dictation-ski
  type: dictation
  skill: listening
  variety: de
  grammar: [modal-koennen-wollen]
  prompt: Listen and write what you hear.
  transcript: Kannst du Ski fahren?
  explanation: >-
    Ski fahren is two words, Ski with a capital letter. Listen for the -st in kannst – it shows du.

- id: a1-u07-mcq-listening-kino
  type: mcq
  skill: listening
  variety: de
  grammar: [gern-lieber]
  prompt: Listen to the intro dialogue again. What will they do if it rains on Sunday?
  options: ["Go hiking anyway", "Go swimming", "Stay at home", "Go to the cinema"]
  answer: 3
  explanation: >-
    "Dann gehen wir lieber ins Kino." lieber = rather. ins Kino = to the cinema (a chunk).

# ---------- speaking ----------
- id: a1-u07-speak-hobbies
  type: speak
  skill: speaking
  variety: de
  grammar: [gern-lieber]
  prompt: Read aloud, then talk about your own hobbies in the same way.
  target: Ich spiele gern Fußball und ich schwimme gern. Am liebsten wandere ich im Herbst.
  explanation: >-
    Three frames: Ich + verb + gern / Am liebsten + verb + ich. Stress gern and am liebsten – they carry the
    meaning.

- id: a1-u07-speak-shadow-anna
  type: speak
  skill: speaking
  variety: de
  grammar: [modal-koennen-wollen]
  prompt: "Shadowing: listen to Anna's line from the intro dialogue and speak along with her, then say it alone."
  target: Ja, ich kann sehr gut Ski fahren. Im Winter fahre ich fast jedes Wochenende.
  explanation: >-
    Shadowing = speaking at the same time as the recording. Copy the rhythm: the stress falls on SKI, WIN-ter
    and WO-chen-en-de. The modal kann is short and light.

- id: a1-u07-speak-shadow-tom
  type: speak
  skill: speaking
  variety: de
  grammar: [modal-koennen-wollen]
  prompt: "Shadowing: speak along with Tom's line, then say it alone."
  target: Ich kann leider nicht Ski fahren. Aber ich will es lernen!
  explanation: >-
    leider = unfortunately – a polite softener. In the second sentence, stress WILL and LER-nen; the
    infinitive at the end is where the meaning lands.

- id: a1-u07-speak-questions
  type: speak
  skill: speaking
  variety: de
  grammar: [modal-koennen-wollen]
  prompt: "Intonation: yes/no questions go up at the end. Read aloud."
  target: Kannst du schwimmen? Willst du mitkommen? Spielst du gern Gitarre?
  explanation: >-
    Questions that start with the verb rise at the end (schwim-MEN ↗). W-questions (Was machst du?) usually
    fall.

- id: a1-u07-speak-pron-ue-ch
  type: speak
  skill: speaking
  variety: de
  prompt: "Pronunciation: ü and the two ch sounds. Read aloud slowly, then faster."
  target: Im Frühling mache ich am liebsten Musik. Am Wochenende koche ich auch.
  explanation: >-
    ü in Frühling: say ee with rounded lips. ch after i and e is soft (ich – the ich-Laut); after a, o, u it
    is the back rasp (mache, Wochenende, koche, auch – the ach-Laut). See the pronunciation drills ü vs u and
    i, ich-Laut and ach-Laut.

- id: a1-u07-roleplay-lena
  type: roleplay
  skill: speaking
  variety: de
  grammar: [gern-lieber, modal-koennen-wollen, weather-es]
  tutor: lena
  prompt: "Roleplay with Lena: plan your weekend."
  scenario: >-
    Lena, your classmate, wants to do something with you at the weekend. Talk about what you like doing,
    what you can and can't do, and agree on a plan. Use du.
  goals:
    - Say two things you like doing (gern) and one you don't like doing (nicht gern).
    - Say one thing you can and one thing you can't do (können).
    - Say what you want to do on Saturday or Sunday (wollen).
    - Agree on a plan B if it rains (lieber).
  model: |
    Lena: Hallo! Was machst du gern am Wochenende?
    Du: Ich wandere gern und ich gehe gern ins Kino. Ich tanze nicht gern.
    Lena: Kannst du Ski fahren?
    Du: Nein, ich kann nicht Ski fahren, aber ich kann gut schwimmen.
    Lena: Was willst du am Samstag machen?
    Du: Ich will wandern. Kommst du mit?
    Lena: Gern! Aber vielleicht regnet es.
    Du: Dann gehen wir lieber ins Kino.
  explanation: >-
    Useful frames: Ich ... gern / nicht gern. Ich kann (nicht) ... + infinitive. Ich will ... + infinitive.
    Dann ... lieber ... for plan B.

# ---------- writing ----------
- id: a1-u07-translate-piano
  type: translate
  skill: writing
  variety: de
  grammar: [modal-koennen-wollen]
  prompt: Translate into German (informal).
  source: Can you play the piano?
  answers: ["Kannst du Klavier spielen?", "Spielst du Klavier?"]
  explanation: >-
    Kannst du ... spielen? – the modal first, the infinitive last. No article before instruments: Klavier
    spielen.

- id: a1-u07-write-profile
  type: write
  skill: writing
  variety: de
  grammar: [gern-lieber, modal-koennen-wollen, weather-es]
  prompt: Write a post for a language-exchange app.
  task: >-
    Write 6–8 sentences about your free time: what you like and don't like doing, what you like doing best,
    one thing you can do well, one thing you want to learn, and what you do in summer and in winter.
  minWords: 45
  model: >-
    Hallo! Ich heiße Kate und ich wohne in Basel. In meiner Freizeit lese ich gern und ich höre gern Musik.
    Sport mache ich nicht so gern, aber ich wandere gern. Am liebsten koche ich mit Freunden. Ich kann gut
    Gitarre spielen. Ich will Ski fahren lernen! Im Sommer schwimme ich im Rhein, und im Winter gehe ich oft
    ins Kino. Und du?
  checklist:
    - I use gern / nicht gern after the verb, and am liebsten at least once.
    - With können and wollen, the infinitive is at the end.
    - I use im Sommer / im Winter, with the verb in position 2 after it.
    - Every statement has the verb in position 2.
  explanation: >-
    A good profile mixes the three patterns of this unit: gern / lieber / am liebsten, the modal bracket
    (Ich kann ... spielen), and season + verb + subject (Im Winter gehe ich ...).

# ---------- Swiss Standard German ----------
- id: a1-u07-chstd-match
  type: match
  skill: vocabulary
  variety: ch-std
  prompt: Match the Swiss Standard German words with the German-German words.
  pairs:
    - ["Velo fahren", "Rad fahren"]
    - ["die Badi", "das Freibad"]
    - ["grillieren", "grillen"]
    - ["der Match", "das Spiel"]
  explanation: >-
    All four are normal in Switzerland, also in writing. die Badi (short for Badeanstalt) is the public
    open-air pool or lake bath. Swiss Standard says der Match (masculine); in Germany it's das Match or das
    Spiel.

# ---------- Swiss lane (gsw-zh) ----------
- id: a1-u07-ch-match-modals
  type: match
  skill: vocabulary
  variety: gsw-zh
  grammar: [modal-koennen-wollen]
  prompt: Match the Zurich German modal verbs with Standard German.
  pairs:
    - ["ich chan", "ich kann"]
    - ["du chasch", "du kannst"]
    - ["ich wott", "ich will"]
    - ["mir wänd", "wir wollen"]
    - ["mir chönd", "wir können"]
  explanation: >-
    chöne: ich chan, du chasch, mir chönd (k → ch). wele: ich wott, du wottsch, mir wänd – a completely
    different stem from will. mir = wir.

- id: a1-u07-ch-mcq-regen
  type: mcq
  skill: listening
  variety: gsw-zh
  prompt: "Listen to the Swiss lane dialogue. Sandra asks: \"Und wänn s rägnet?\" What does Reto suggest?"
  options: ["Going to the cinema", "Playing Jass", "Hiking anyway", "Going swimming"]
  answer: 0
  explanation: >-
    "Dänn gömmer is Kino." dänn = dann, gömmer = gehen wir, is Kino = ins Kino. wänn s rägnet = wenn es
    regnet.

- id: a1-u07-ch-mcq-jass
  type: mcq
  skill: listening
  variety: gsw-zh
  prompt: "Reto: \"Am Friitig jassed mir im Kafi. Wottsch au cho?\" What is he doing?"
  options: ["Asking Sandra to cook on Friday", "Telling Sandra the café is closed", "Inviting Sandra to play cards on Friday", "Asking Sandra for a coffee"]
  answer: 2
  explanation: >-
    jasse = to play Jass, the Swiss card game. im Kafi = in the café (es Kafi, neuter); Wottsch au cho? =
    Willst du auch kommen?

- id: a1-u07-ch-transform-chasch
  type: transform
  skill: reading
  variety: gsw-zh
  grammar: [modal-koennen-wollen]
  prompt: What does this mean in Standard German?
  from: gsw-zh
  to: de
  source: Chasch du jasse?
  answers: ["Kannst du jassen?", "Kannst du Jass spielen?"]
  explanation: >-
    chasch = kannst (k → ch), jasse = jassen. Swiss German drops the final -n of infinitives: schwümme,
    wandere, jasse.

- id: a1-u07-ch-transform-gaern
  type: transform
  skill: reading
  variety: gsw-zh
  grammar: [gern-lieber]
  prompt: What does Sandra say in Standard German?
  from: gsw-zh
  to: de
  source: Ich gang gärn is Kino.
  answers: ["Ich gehe gern ins Kino.", "Ich gehe gerne ins Kino."]
  explanation: >-
    ich gang = ich gehe, gärn = gern, is Kino = ins Kino. gärn has the same position as gern: right after the
    verb.

- id: a1-u07-ch-mcq-mega
  type: mcq
  skill: vocabulary
  variety: gsw-zh
  prompt: "Sandra answers Reto's plan with \"Mega!\". What does she mean?"
  options: ["She's annoyed.", "She doesn't understand.", "She wants something bigger.", "She thinks it's great."]
  answer: 3
  explanation: >-
    mega = super, great; as an adverb it means "very": mega guet, mega schön. It's informal and everywhere in
    Swiss German, especially among younger people.

- id: a1-u07-ch-transform-de-gsw
  type: transform
  skill: vocabulary
  variety: gsw-zh
  grammar: [modal-koennen-wollen]
  prompt: "Recognition: how would Reto say this in Zurich German? (Common spellings are accepted.)"
  from: de
  to: gsw-zh
  source: Ich kann nicht schwimmen.
  answers: ["Ich chan nöd schwümme.", "Ich cha nöd schwümme.", "Ich chan nid schwümme.", "Ich chan nöd schwimme."]
  explanation: >-
    kann → chan (k → ch), nicht → nöd, schwimmen → schwümme (Swiss ü, no final -n). The word order is the
    same as in Standard German.

- id: a1-u07-roleplay-reto
  type: roleplay
  skill: listening
  variety: gsw-zh
  grammar: [modal-koennen-wollen, gern-lieber]
  tutor: reto
  prompt: "Listening roleplay with Reto: weekend plans."
  scenario: >-
    Reto invites you to do something at the weekend. He speaks Zurich German; you answer in Standard
    German. Find out what he suggests, when, and say what you can and want to do.
  goals:
    - Understand what Reto likes doing (gärn) and what he suggests.
    - Understand chasch / wottsch questions and answer them.
    - Say what you can't do and suggest something else (lieber).
  model: |
    Reto: Hoi! Was machsch du gärn am Wuchenänd?
    Du: Ich wandere gern und ich lese gern.
    Reto: Mega! Am Sunntig gang ich uf de Üetliberg. Wottsch au cho?
    Du: Ja, gern! Um wie viel Uhr?
    Reto: Am nüüni. Und am Abig jassed mir. Chasch du jasse?
    Du: Nein, ich kann nicht jassen. Ich gehe lieber ins Kino.
    Reto: Kei Problem, dänn gömmer zäme is Kino!
  explanation: >-
    Decoding: machsch = machst, Wuchenänd = Wochenende, gang = gehe, wottsch = willst, am nüüni = um neun, am
    Abig = am Abend, kei Problem = kein Problem, zäme = zusammen.

# ---------- Bernese (gsw-be, recognition) ----------
- id: a1-u07-ch-be-mcq-aare
  type: mcq
  skill: listening
  variety: gsw-be
  prompt: "Sandra's mother: \"Am Sunntig wei mir i dr Aare schwümme.\" What's the plan?"
  options: ["To go swimming in the river on Sunday", "To go hiking on Sunday", "To have breakfast on Saturday", "To go skiing in the mountains"]
  answer: 0
  explanation: >-
    mir wei = wir wollen (Zurich: mir wänd), i dr Aare = in der Aare, Bern's river. Swimming down the Aare in
    summer is a Bernese tradition (der Aareschwumm).

- id: a1-u07-ch-be-transform-cha
  type: transform
  skill: reading
  variety: gsw-be
  grammar: [modal-koennen-wollen]
  prompt: What does Sandra tell her mother? Write it in Standard German.
  from: gsw-be
  to: de
  source: Am Sunntig cha i nid.
  answers: ["Am Sonntag kann ich nicht.", "Ich kann am Sonntag nicht."]
  explanation: >-
    cha = kann (Bernese i cha, Zurich ich chan), i = ich, nid = nicht (Zurich nöd). Sunntig = Sonntag in both
    dialects.

- id: a1-u07-ch-be-match-modals
  type: match
  skill: vocabulary
  variety: gsw-be
  grammar: [modal-koennen-wollen]
  prompt: Match the Bernese forms with Standard German.
  pairs:
    - ["i cha", "ich kann"]
    - ["mir chöi", "wir können"]
    - ["i wott", "ich will"]
    - ["mir wei", "wir wollen"]
  explanation: >-
    Bernese plural forms are short: mir chöi, mir wei (Zurich mir chönd, mir wänd). i wott is the same as
    Zurich ich wott.
