# A1 unit 11 – Gesundheit

# ---------- vocabulary ----------
- id: a1-u11-match-body
  type: match
  skill: vocabulary
  variety: de
  prompt: Match the parts of the body with English.
  pairs:
    - ["der Kopf", "head"]
    - ["der Bauch", "belly"]
    - ["der Rücken", "back"]
    - ["das Bein", "leg"]
    - ["der Fuß", "foot"]
    - ["der Hals", "throat, neck"]
  explanation: >-
    Learn the plurals too: die Köpfe, die Bäuche, die Beine, die Füße. der Hals is both the throat (Halsschmerzen)
    and the neck.

- id: a1-u11-mcq-plural-fuesse
  type: mcq
  skill: vocabulary
  variety: de
  grammar: [plural-nouns]
  prompt: What is the plural of der Fuß?
  options: ["die Fuße", "die Füßen", "die Fußer", "die Füße"]
  answer: 3
  explanation: >-
    der Fuß → die Füße, like der Zahn → die Zähne and die Hand → die Hände: umlaut + -e. Swiss spelling: Füsse.

- id: a1-u11-match-illness
  type: match
  skill: vocabulary
  variety: de
  grammar: [wehtun-schmerzen]
  prompt: Match the German with English.
  pairs:
    - ["Ich habe Fieber.", "I've got a temperature."]
    - ["Ich habe Husten.", "I've got a cough."]
    - ["Ich bin erkältet.", "I've got a cold."]
    - ["Mir ist schlecht.", "I feel sick."]
    - ["Ich bin müde.", "I'm tired."]
  explanation: >-
    Fieber, Husten and Schnupfen take no article after haben. Mir ist schlecht is a chunk – don't say Ich bin
    schlecht (that means I'm bad at something or a bad person).

- id: a1-u11-mcq-gesundheit
  type: mcq
  skill: vocabulary
  variety: de
  grammar: [wehtun-schmerzen]
  prompt: "Your colleague sneezes: \"Hatschi!\" What do you say?"
  options: ["Gute Besserung!", "Gesundheit!", "Guten Appetit!", "Herzlichen Glückwunsch!"]
  answer: 1
  explanation: >-
    Gesundheit! (literally: health!) after a sneeze; the answer is Danke! Gute Besserung! (Get well soon!) is for
    someone who is ill.

- id: a1-u11-gap-pharmacy-words
  type: gap
  skill: vocabulary
  variety: de
  prompt: "Fill in: prescription – pharmacy."
  text: Der Arzt schreibt ein ___. Dann gehe ich in die ___ und hole das Medikament.
  answers: [["Rezept"], ["Apotheke"]]
  explanation: >-
    das Rezept = prescription (also a cooking recipe). die Apotheke = pharmacy: in die Apotheke gehen (chunk).

# ---------- grammar: wehtun and Schmerzen ----------
- id: a1-u11-gap-tut-tun
  type: gap
  skill: grammar
  variety: de
  grammar: [wehtun-schmerzen]
  prompt: "Fill in tut or tun."
  text: Mein Kopf ___ weh, und meine Füße ___ auch weh.
  answers: [["tut"], ["tun"]]
  explanation: >-
    The body part is the subject: mein Kopf (one) → tut weh; meine Füße (plural) → tun weh.

- id: a1-u11-mcq-kopfschmerzen
  type: mcq
  skill: grammar
  variety: de
  grammar: [wehtun-schmerzen]
  prompt: Which sentence is correct?
  options: ["Ich habe Kopfschmerzen.", "Ich habe einen Kopfschmerz.", "Ich bin Kopfschmerzen.", "Mein Kopf hat Schmerzen weh."]
  answer: 0
  rationales:
    - "Correct. ...schmerzen is plural and takes no article."
    - "The singular with an article sounds wrong in everyday German."
    - "Pains are something you have, not something you are."
    - "Use either tut weh or ...schmerzen, not both."
  explanation: >-
    Ich habe Kopfschmerzen / Halsschmerzen / Bauchschmerzen – always plural, no article. Or: Mein Kopf tut weh.

- id: a1-u11-mcq-mir-ist-kalt
  type: mcq
  skill: grammar
  variety: de
  grammar: [wehtun-schmerzen]
  prompt: "You have a cold. What do you say?"
  options: ["Ich bin kalt.", "Ich habe kalt.", "Ich bin erkältet.", "Ich habe erkältet."]
  answer: 2
  rationales:
    - "Ich bin kalt describes your personality: I'm a cold person."
    - "Not German (French j'ai froid). For feeling cold, say Mir ist kalt."
    - "Correct. Ich bin erkältet = Ich habe eine Erkältung."
    - "erkältet goes with sein."
  explanation: >-
    Ich bin erkältet (I've got a cold). If you feel cold, it's Mir ist kalt. English speakers often say Ich bin
    kalt – that sounds unfriendly!

- id: a1-u11-translate-throat
  type: translate
  skill: writing
  variety: de
  grammar: [wehtun-schmerzen]
  prompt: Translate into German.
  source: I've got a sore throat and a cough.
  answers: ["Ich habe Halsschmerzen und Husten.", "Mein Hals tut weh und ich habe Husten.", "Mein Hals tut weh, und ich habe Husten.", "Ich habe Halsweh und Husten."]
  explanation: >-
    sore throat = Halsschmerzen (plural) or Mein Hals tut weh. Husten takes no article. Halsweh is common in
    Switzerland and southern Germany.

- id: a1-u11-order-tut-weh
  type: order
  skill: grammar
  variety: de
  grammar: [wehtun-schmerzen, w-questions]
  prompt: Make the doctor's question.
  tokens: ["Was", "tut", "Ihnen", "weh"]
  answers: ["Was tut Ihnen weh?"]
  explanation: >-
    W-word first, verb tut second, Ihnen (to you, a dative chunk) in the middle, weh at the end – like a
    separable prefix.

# ---------- grammar: modal verbs review ----------
- id: a1-u11-gap-modals
  type: gap
  skill: grammar
  variety: de
  grammar: [modal-review, modal-muessen-duerfen]
  prompt: "Fill in: muss – darf – soll."
  text: "Ich ___ drei Tage nicht arbeiten (forbidden). Ich ___ viel schlafen (necessary). Der Arzt sagt, ich ___ viel Tee trinken (his instruction)."
  answers: [["darf"], ["muss"], ["soll"]]
  explanation: >-
    nicht dürfen = mustn't, müssen = have to, sollen = an instruction from someone else. ich has no ending: ich
    darf, ich muss, ich soll.

- id: a1-u11-mcq-nicht-muessen
  type: mcq
  skill: grammar
  variety: de
  grammar: [modal-review, modal-muessen-duerfen]
  prompt: "Dr Huber: \"Sie müssen nicht ins Spital.\" What does she mean?"
  options: ["You mustn't go to hospital.", "You must go to hospital.", "You don't have to go to hospital.", "You should go to hospital."]
  answer: 2
  explanation: >-
    nicht müssen = don't have to (no need). Forbidden is nicht dürfen: Sie dürfen nicht rauchen. This is the
    classic trap for English speakers, because must not means forbidden.

- id: a1-u11-mcq-darf-ich
  type: mcq
  skill: grammar
  variety: de
  grammar: [modal-review, modal-muessen-duerfen]
  prompt: "You want to know if you are allowed to do sport. Ask the doctor."
  options: ["Muss ich Sport machen?", "Darf ich Sport machen?", "Soll ich Sport machen?", "Will ich Sport machen?"]
  answer: 1
  rationales:
    - "This asks whether you have to."
    - "Correct. dürfen = to be allowed to."
    - "This asks for advice or an instruction (Shall I ...?)."
    - "You can't ask someone else what you want."
  explanation: >-
    Darf ich ...? asks for permission. The doctor may answer: Ja, aber nicht zu viel. / Nein, Sie dürfen eine
    Woche keinen Sport machen.

- id: a1-u11-transform-soll
  type: transform
  skill: grammar
  variety: de
  grammar: [modal-review, sollen]
  prompt: "The doctor says: \"Bleiben Sie zwei Tage im Bett!\" Tell your friend. Start with \"Ich soll ...\"."
  from: de
  to: de
  source: Bleiben Sie zwei Tage im Bett!
  answers: ["Ich soll zwei Tage im Bett bleiben.", "Ich soll zwei Tage im Bett bleiben!"]
  explanation: >-
    An instruction from someone else becomes sollen: soll in position 2, the infinitive bleiben at the end.

- id: a1-u11-order-modal
  type: order
  skill: grammar
  variety: de
  grammar: [modal-review, nicht-kein]
  prompt: Put the words in order.
  tokens: ["Sie", "dürfen", "morgen", "nicht", "arbeiten"]
  answers: ["Sie dürfen morgen nicht arbeiten.", "Morgen dürfen Sie nicht arbeiten."]
  explanation: >-
    Modal verb in position 2, infinitive at the very end. nicht comes just before the infinitive; morgen can
    also start the sentence (then the subject follows the verb).

- id: a1-u11-translate-mustnt
  type: translate
  skill: writing
  variety: de
  grammar: [modal-review, modal-muessen-duerfen]
  prompt: Translate into German (Sie).
  source: You mustn't drink alcohol.
  answers: ["Sie dürfen keinen Alkohol trinken.", "Sie dürfen nicht Alkohol trinken."]
  explanation: >-
    mustn't = nicht dürfen. With a noun without an article, use kein: keinen Alkohol (der Alkohol → keinen).

# ---------- grammar: imperative in instructions ----------
- id: a1-u11-gap-imperative-sie
  type: gap
  skill: grammar
  variety: de
  grammar: [imperative-instructions, imperative]
  prompt: "Fill in the Sie-imperative: nehmen – trinken."
  text: ___ Sie dreimal täglich eine Tablette. ___ Sie viel Wasser!
  answers: [["Nehmen"], ["Trinken"]]
  explanation: >-
    Sie-imperative: infinitive first, then Sie. It is polite and used by doctors and pharmacists.

- id: a1-u11-transform-imperative-du
  type: transform
  skill: grammar
  variety: de
  grammar: [imperative-instructions, imperative]
  prompt: "Say it to a friend (du-imperative)."
  from: de
  to: de
  source: Bleiben Sie im Bett!
  answers: ["Bleib im Bett!", "Bleibe im Bett!", "Bleib im Bett."]
  explanation: >-
    du bleibst → Bleib! Drop -st and du. Bleibe is also correct but sounds formal.

- id: a1-u11-mcq-nimm
  type: mcq
  skill: grammar
  variety: de
  grammar: [imperative-instructions, stem-changing-verbs]
  prompt: Choose the du-imperative of nehmen.
  question: "___ die Tabletten nach dem Essen!"
  options: ["Nehm", "Nimmst", "Nehme", "Nimm"]
  answer: 3
  rationales:
    - "The e → i change of du nimmst stays in the imperative."
    - "No -st in the imperative."
    - "There's no -e and the vowel must change."
    - "Correct. du nimmst → Nimm!"
  explanation: >-
    Verbs with e → i / ie keep the change: nehmen → Nimm!, lesen → Lies!, essen → Iss! Verbs with a → ä drop it:
    schlafen → Schlaf!

- id: a1-u11-mcq-schlaf
  type: mcq
  skill: grammar
  variety: de
  grammar: [imperative-instructions, stem-changing-verbs]
  prompt: Choose the du-imperative of schlafen.
  question: "Du bist müde. ___ viel!"
  options: ["Schläfst", "Schlaf", "Schläf", "Schlafen"]
  answer: 1
  explanation: >-
    du schläfst, but Schlaf! The a → ä change is dropped in the imperative (fahren → Fahr!). Schlafen Sie! is
    the Sie-form.

# ---------- reading ----------
- id: a1-u11-mcq-reading-sunday
  type: mcq
  skill: reading
  variety: ch-std
  prompt: Read the pharmacy information. It's Sunday and you need medicine. What do you do?
  options: ["Go to the pharmacy at 8 a.m.", "Go to the pharmacy at 7.30 a.m.", "Call the emergency pharmacy", "Wait until Saturday"]
  answer: 2
  explanation: >-
    "Am Sonntag ist die Apotheke geschlossen. Im Notfall rufen Sie bitte die Notfall-Apotheke an." geschlossen =
    closed; anrufen is separable: rufen ... an.

- id: a1-u11-mcq-reading-dose
  type: mcq
  skill: reading
  variety: ch-std
  grammar: [imperative-instructions]
  prompt: How do you take the cough syrup?
  options: ["One spoonful three times a day, after meals", "Three spoonfuls once a day, before meals", "One spoonful a day with alcohol", "Three tablets a day"]
  answer: 0
  explanation: >-
    "Dreimal täglich einen Löffel, nach dem Essen." dreimal = three times, täglich = a day, der Löffel = spoon.

- id: a1-u11-mcq-reading-children
  type: mcq
  skill: reading
  variety: ch-std
  grammar: [modal-review]
  prompt: "\"Kinder unter 12 Jahren dürfen den Sirup nicht nehmen.\" What does it mean?"
  options: ["Children under 12 don't have to take the syrup.", "Children under 12 must take the syrup.", "Children under 12 mustn't take the syrup.", "Children under 12 can take half."]
  answer: 2
  explanation: >-
    nicht dürfen = mustn't, it's forbidden. Not having to would be nicht müssen.

