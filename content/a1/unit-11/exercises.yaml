  grammar: [imperative-instructions]
  prompt: Listen and write what you hear.
  transcript: Nehmen Sie zweimal täglich eine Tablette.
  explanation: >-
    zweimal täglich = twice a day. Nehmen Sie ... – the Sie-imperative with the verb first.

# ---------- speaking ----------
- id: a1-u11-speak-appointment
  type: speak
  skill: speaking
  variety: de
  grammar: [moechte, wehtun-schmerzen]
  prompt: "On the phone to the practice: read aloud, then say it with your own symptoms."
  target: Guten Tag, hier ist Tom Baker. Ich bin krank und möchte heute einen Termin, bitte.
  explanation: >-
    Hier ist ... on the phone (unit 9). möchte + einen Termin (accusative). Add your symptoms: Ich habe Fieber
    und Husten.

- id: a1-u11-speak-shadow-tom
  type: speak
  skill: speaking
  variety: de
  grammar: [wehtun-schmerzen]
  prompt: "Shadowing: speak along with Tom's line from the intro dialogue, then say it alone."
  target: Ich habe Halsschmerzen und Husten. Und mein Kopf tut weh.
  explanation: >-
    Stress the first part of the compound: HALS-schmerzen. In Kopf, say p and f together – one quick sound pf.
    See the drill z [ts] and pf.

- id: a1-u11-speak-shadow-huber
  type: speak
  skill: speaking
  variety: ch-std
  grammar: [modal-review]
  prompt: "Shadowing: speak along with Dr Huber, then say it alone."
  target: Nein, Sie dürfen drei Tage nicht arbeiten. Sie müssen viel schlafen und viel Tee trinken.
  explanation: >-
    Swiss Standard German keeps the -en endings clear (dürfen, müssen, schlafen, trinken) and uses a short, tapped
    r. Stress NICHT to make the rule clear. See the drill The Swiss Standard German accent.

- id: a1-u11-speak-intonation-besserung
  type: speak
  skill: speaking
  variety: de
  grammar: [wehtun-schmerzen]
  prompt: "Intonation: friendly wishes. Read aloud with a warm, falling melody."
  target: Oh, du bist krank? Gute Besserung!
  explanation: >-
    The question rises at the end (du bist krank?); the wish starts high on GU-te and falls on BES-serung. A
    flat melody sounds cold.

- id: a1-u11-speak-pron-ach
  type: speak
  skill: speaking
  variety: de
  grammar: [wehtun-schmerzen]
  prompt: "Pronunciation: ach-Laut after a, o, u, au; ich-Laut after e, i, ü. Read aloud."
  target: Bauch, Buch, auch, Woche – ich, nicht, Milch, täglich
  explanation: >-
    After a, o, u and au, ch is made at the back of the mouth (Bauch, Buch, auch, Woche). After e, i, ä, ö, ü and
    consonants it's the soft ich-Laut (ich, nicht, Milch). täglich: -ig is [ɪç] in Germany, [ɪk] in the south and
    in Switzerland. See the drills The ach-Laut (back ch) and The ich-Laut (soft ch).

- id: a1-u11-roleplay-lena
  type: roleplay
  skill: speaking
  variety: de
  grammar: [wehtun-schmerzen, modal-review, imperative-instructions]
  tutor: lena
  prompt: "Roleplay with Lena: you're ill."
  scenario: >-
    You wanted to meet Lena this evening, but you're ill. Phone her, cancel, explain what's wrong and tell
    her what the doctor said. Use du.
  goals:
    - Cancel the meeting (Ich kann heute leider nicht.).
    - Say what's wrong (Ich bin erkältet. Mein Kopf tut weh.).
    - Report the doctor's instructions with sollen and dürfen.
    - React to Lena's good wishes and say goodbye.
  model: |
    Lena: Hallo! Wir sehen uns heute um sieben, oder?
    Du: Hallo Lena. Ich kann heute leider nicht. Ich bin krank.
    Lena: Oh nein! Was hast du?
    Du: Ich bin erkältet. Ich habe Halsschmerzen und mein Kopf tut weh.
    Lena: Warst du beim Arzt?
    Du: Ja. Ich soll viel schlafen, und ich darf zwei Tage nicht arbeiten.
    Lena: Dann bleib im Bett und trink viel Tee! Gute Besserung!
    Du: Danke! Tschüss, bis bald!
  explanation: >-
    Lena uses one past form (Warst du beim Arzt? = Have you been to the doctor?) – just understand it. Your
    frames: Ich kann leider nicht. Ich habe ... Ich soll ... Ich darf nicht ...

# ---------- writing ----------
- id: a1-u11-write-sick-note
  type: write
  skill: writing
  variety: de
  grammar: [wehtun-schmerzen, modal-review]
  prompt: Write an email to your German teacher.
  task: >-
    You're ill and can't come to the German course tomorrow. Write to your teacher, Frau Keller (5–6
    sentences): say that you can't come and why, say what the doctor said, and ask what the homework is.
  minWords: 35
  model: >-
    Liebe Frau Keller, ich kann morgen leider nicht in den Deutschkurs kommen. Ich bin krank: Ich habe Fieber
    und Husten, und mein Hals tut weh. Der Arzt sagt, ich soll zwei Tage im Bett bleiben. Ich darf auch nicht
    arbeiten. Was sind die Hausaufgaben? Viele Grüße, Tom Baker
  checklist:
    - I start and end the email politely (Liebe Frau ..., Viele Grüße).
    - I say what is wrong with tut weh or ...schmerzen and haben + illness without an article.
    - I report the doctor with sollen (Ich soll ...) and use dürfen / müssen correctly.
    - The modal verb is in position 2 and the infinitive at the end.
  explanation: >-
    A short formal email uses Sie-forms for the teacher and the unit's patterns: Ich bin krank. Mein ... tut weh.
    Der Arzt sagt, ich soll ... Ich darf nicht ...

# ---------- Swiss Standard German ----------
- id: a1-u11-chstd-match
  type: match
  skill: vocabulary
  variety: ch-std
  prompt: Match the Swiss Standard German words with the German-German words.
  pairs:
    - ["das Spital", "das Krankenhaus"]
    - ["das Arztzeugnis", "die Krankschreibung"]
    - ["das Kopfweh", "die Kopfschmerzen"]
    - ["der Fuss", "der Fuß"]
  explanation: >-
    das Spital is the normal Swiss word for hospital (Duden: Swiss, also der Spital). Your employer asks for an
    Arztzeugnis when you're ill for a few days. Kopfweh is also heard in southern Germany.

- id: a1-u11-chstd-mcq-drogerie
  type: mcq
  skill: reading
  variety: ch-std
  prompt: "You need a prescription medicine (Sie haben ein Rezept). Where do you go in Switzerland?"
  options: ["In die Drogerie", "In die Migros", "In die Apotheke", "Zur Krankenkasse"]
  answer: 2
  explanation: >-
    Prescription medicine comes from the Apotheke. The Swiss Drogerie sells non-prescription remedies, cosmetics
    and household products. The Krankenkasse is your health insurance, not a shop.

# ---------- Swiss lane (gsw-zh) ----------
- id: a1-u11-ch-match-words
  type: match
  skill: vocabulary
  variety: gsw-zh
  grammar: [wehtun-schmerzen]
  prompt: Match the Zurich German words with Standard German.
  pairs:
    - ["Chopfweh", "Kopfschmerzen"]
    - ["Buuch", "Bauch"]
    - ["chrank", "krank"]
    - ["müed", "müde"]
    - ["Gsundheit!", "Gesundheit!"]
  explanation: >-
    k at the start → ch (Chopf, chrank); au → uu (Buuch); the unstressed e in ge- disappears (Gsundheit, like
    gmacht).

- id: a1-u11-ch-mcq-symptoms
  type: mcq
  skill: listening
  variety: gsw-zh
  grammar: [wehtun-schmerzen]
  prompt: Listen to the Swiss lane dialogue. What's wrong with Reto?
  options: ["He has stomach ache and is hungry.", "He has a headache and a sore throat and is very tired.", "He has a bad back.", "He has hurt his foot."]
  answer: 1
  explanation: >-
    "Ich ha Chopfweh und Halsweh, und ich bi mega müed." Chopfweh = Kopfschmerzen, mega müed = sehr müde. He also
    has a temperature: achtedriissg (38).

- id: a1-u11-ch-transform-chrank
  type: transform
  skill: reading
  variety: gsw-zh
  grammar: [sein-present]
  prompt: What does Reto say? Write it in Standard German.
  from: gsw-zh
  to: de
  source: Nöd guet. Ich bi chrank.
  answers: ["Nicht gut. Ich bin krank.", "Nicht gut, ich bin krank.", "Nicht gut. Ich bin krank!"]
  explanation: >-
    nöd = nicht, guet = gut, ich bi = ich bin, chrank = krank.

- id: a1-u11-ch-transform-gang
  type: transform
  skill: reading
  variety: gsw-zh
  grammar: [imperative-instructions, imperative]
  prompt: What does Sandra tell Reto? Write it in Standard German (du).
  from: gsw-zh
  to: de
  source: Gang zum Dokter! Und trink vill Tee.
  answers: ["Geh zum Arzt! Und trink viel Tee.", "Geh zum Arzt! Und trink viel Tee!", "Geh zum Doktor! Und trink viel Tee.", "Geh zum Arzt und trink viel Tee!", "Geh zum Arzt und trink viel Tee."]
  explanation: >-
    gang = geh (du-imperative of gaa), Dokter = Arzt (Doktor), vill = viel. The imperative works exactly as in
    Standard German.

- id: a1-u11-ch-mcq-besserig
  type: mcq
  skill: listening
  variety: gsw-zh
  prompt: "At the end Sandra says: \"Gsundheit! Gueti Besserig, Reto!\" Why does she say Gsundheit?"
  options: ["Reto has sneezed.", "Reto is healthy again.", "Reto is going to the doctor.", "It means goodbye."]
  answer: 0
  explanation: >-
    Reto sneezes (Hatschi!), so Sandra says Gsundheit! (Bless you!). Gueti Besserig! = Gute Besserung! (Get well
    soon!).

- id: a1-u11-ch-transform-de-gsw
  type: transform
  skill: vocabulary
  variety: gsw-zh
  grammar: [wehtun-schmerzen, haben-present]
  prompt: "Recognition: how do you say this in Zurich German? (Common spellings are accepted.)"
  from: de
  to: gsw-zh
  source: Ich habe Kopfschmerzen.
  answers: ["Ich ha Chopfweh.", "Ich han Chopfweh.", "Ich ha Chopfwee.", "I ha Chopfweh."]
  explanation: >-
    ich habe → ich ha, Kopfschmerzen → Chopfweh (Kopf → Chopf, -schmerzen → -weh). Bernese: I ha Gringweh /
    Chopfweh.

- id: a1-u11-roleplay-reto
  type: roleplay
  skill: listening
  variety: gsw-zh
  grammar: [wehtun-schmerzen, modal-review, imperative-instructions]
  tutor: reto
  prompt: "Listening roleplay with Reto: at the Drogerie."
  scenario: >-
    You have a cold and go to a Drogerie in Zurich. Reto works there today. He asks what's wrong in Zurich
    German and gives you advice. You answer in Standard German.
  goals:
    - Understand Was fählt Ine? / Was händ Sie? and say what's wrong.
    - Understand Reto's advice (Trinked Sie vill Tee! Bliibed Sie dihei!).
    - Understand how often to take the medicine and when to see a doctor.
  model: |
    Reto: Grüezi! Was fählt Ine?
    Du: Guten Tag. Ich bin erkältet. Ich habe Schnupfen und Halsschmerzen.
    Reto: Händ Sie au Fieber?
    Du: Nein, kein Fieber.
    Reto: Guet. Dänn nämed Sie die Tablette drüümal am Tag. Und trinked Sie vill Tee!
    Du: Dreimal am Tag, gut. Muss ich zum Arzt gehen?
    Reto: Nei, nöd grad. Händ Sie nach föif Täg no Hueschte, dänn gönd Sie zum Dokter.
    Du: Vielen Dank! Auf Wiedersehen.
    Reto: Uf Widerluege und gueti Besserig!
  explanation: >-
    Decoding: Was fählt Ine? = Was fehlt Ihnen?, händ Sie = haben Sie, nämed Sie = nehmen Sie, drüümal am Tag =
    dreimal täglich, nöd grad = not straight away, Händ Sie ... no Hueschte, dänn ... = if you still have a cough, then ..., gönd Sie = gehen Sie. Polite Sie-imperatives end in -ed in
    Zurich German.

