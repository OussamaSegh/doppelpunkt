- id: a1-u11-ch-be-transform
  type: transform
  skill: reading
  variety: gsw-be
  grammar: [wehtun-schmerzen, haben-present]
  prompt: What does Sandra tell her mother? Write it in Standard German.
  from: gsw-be
  to: de
  source: Dr Reto isch chrank. Är het Gringweh.
  answers: ["Reto ist krank. Er hat Kopfschmerzen.", "Der Reto ist krank. Er hat Kopfschmerzen.", "Reto ist krank. Er hat Kopfweh.", "Der Reto ist krank. Er hat Kopfweh.", "Reto ist krank, er hat Kopfschmerzen."]
  explanation: >-
    dr = der (Swiss German puts an article before names), är het = er hat (Zurich er hät), Gringweh = Kopfweh:
    dr Gring is the Bernese word for head (berndeutsch.ch: coarse but affectionate).

- id: a1-u11-ch-be-match
