# A1 unit 10 – Kleidung und Wetter

# ---------- vocabulary ----------
- id: a1-u10-match-clothes
  type: match
  skill: vocabulary
  variety: de
  prompt: Match the clothes with English.
  pairs:
    - ["die Hose", "trousers"]
    - ["das Hemd", "shirt"]
    - ["der Rock", "skirt"]
    - ["der Mantel", "coat"]
    - ["die Mütze", "woolly hat"]
    - ["der Hausschuh", "slipper"]
  explanation: >-
    Learn clothes with their article: der Mantel, der Rock, der Pullover, die Hose, die Jacke, das Hemd,
    das Kleid. die Hose is singular in German, but trousers is plural in English: Die Hose ist zu lang.

- id: a1-u10-match-colours
  type: match
  skill: vocabulary
  variety: de
  grammar: [colours-zu-adjective]
  prompt: Match the colours.
  pairs:
    - ["gelb", "yellow"]
    - ["grau", "grey"]
    - ["braun", "brown"]
    - ["blau", "blue"]
    - ["grün", "green"]
  explanation: >-
    braun / brown, grün / green and blau / blue are close to English. gelb (yellow) is not – and grau is
    grey, not brown. Colours after sein have no ending: Der Mantel ist grau.

- id: a1-u10-match-weather
  type: match
  skill: vocabulary
  variety: de
  grammar: [weather-forecast]
  prompt: Match the weather words with English.
  pairs:
    - ["sonnig", "sunny"]
    - ["windig", "windy"]
    - ["bewölkt", "cloudy"]
    - ["das Gewitter", "thunderstorm"]
    - ["minus fünf Grad", "−5 °C"]
  explanation: >-
    -ig turns a noun into an adjective: die Sonne → sonnig, der Wind → windig. bewölkt comes from die Wolke.
    Grad has no plural ending: fünf Grad.

- id: a1-u10-gap-weather
  type: gap
  skill: vocabulary
  variety: de
  grammar: [weather-forecast]
  prompt: "Fill in: sunny – hot."
  text: "Heute scheint die Sonne, es ist ___. Es sind 32 Grad – es ist sehr ___!"
  answers: [["sonnig"], ["heiß", "heiss", "warm"]]
  explanation: >-
    sonnig = sunny (from die Sonne). heiß = hot, Swiss spelling heiss. warm is milder (20 Grad); at 32 Grad
    Germans say heiß.

# ---------- grammar: accusative pronouns ----------
- id: a1-u10-gap-pronouns-things
  type: gap
  skill: grammar
  variety: de
  grammar: [accusative-pronouns]
  prompt: "Replace the noun: ihn, sie or es?"
  text: "Der Pullover ist schön. Ich nehme ___. Die Jacke? Ich probiere ___ an. Das Hemd ist zu teuer. Ich kaufe ___ nicht."
  answers: [["ihn"], ["sie"], ["es"]]
  explanation: >-
    The pronoun follows the gender of the noun: der Pullover → ihn, die Jacke → sie, das Hemd → es. Only the
    masculine changes in the accusative (er → ihn, like der → den).

- id: a1-u10-mcq-mich
  type: mcq
  skill: grammar
  variety: de
  grammar: [accusative-pronouns]
  prompt: Choose the pronoun.
  question: "Lena, siehst du ___? Ich bin hier, bei der Kasse!"
  options: ["ich", "mir", "mich", "mein"]
  answer: 2
  rationales:
    - "ich is the subject form."
    - "mir is dative (Das steht mir) – sehen needs the accusative."
    - "Correct. sehen + accusative: mich."
    - "mein is a possessive (my)."
  explanation: >-
    ich → mich, du → dich in the accusative. Siehst du mich? Ich rufe dich an.

- id: a1-u10-mcq-ihn
  type: mcq
  skill: grammar
  variety: de
  grammar: [accusative-pronouns]
  prompt: Choose the pronoun.
  question: "Wo ist mein Schal? – Ich sehe ___ nicht."
  options: ["ihn", "er", "es", "sie"]
  answer: 0
  rationales:
    - "Correct. der Schal → ihn (accusative)."
    - "er is the nominative (Er ist hier.)."
    - "es is for das-words."
    - "sie is for die-words and plurals."
  explanation: >-
    der Schal is masculine and the object of sehen: ihn. English says it for everything; German follows the
    gender.

- id: a1-u10-gap-uns-euch
  type: gap
  skill: grammar
  variety: de
  grammar: [accusative-pronouns]
  prompt: "Fill in uns or euch."
  text: "Hallo Lena, hallo Tom! Ich besuche ___ am Samstag. Und am Sonntag besucht ihr ___, okay?"
  answers: [["euch"], ["uns"]]
  explanation: >-
    ihr → euch, wir → uns. The speaker visits you two (euch); then you two visit us (uns). Both are the
    same in the accusative and the dative.

- id: a1-u10-transform-pronoun
  type: transform
  skill: grammar
  variety: de
  grammar: [accusative-pronouns, accusative-definite]
  prompt: "Replace den Mantel with a pronoun."
  from: de
  to: de
  source: Ich kaufe den Mantel.
  answers: ["Ich kaufe ihn."]
  explanation: >-
    den Mantel (masculine, accusative) → ihn. The pronoun takes the place of article + noun.

- id: a1-u10-order-anprobieren
  type: order
  skill: grammar
  variety: de
  grammar: [accusative-pronouns, separable-verbs-modal]
  prompt: Make a question.
  tokens: ["Kann", "ich", "sie", "anprobieren"]
  answers: ["Kann ich sie anprobieren?"]
  explanation: >-
    Modal verb first in a yes/no question, then the subject, the pronoun early, and the separable
    infinitive at the end in one word: anprobieren.

- id: a1-u10-translate-take-it
  type: translate
  skill: writing
  variety: de
  grammar: [accusative-pronouns]
  prompt: "Translate into German. (it = die Jacke)"
  source: I'll take it.
  answers: ["Ich nehme sie.", "Ich nehme sie!", "Die nehme ich.", "Ich nehme die Jacke."]
  explanation: >-
    die Jacke → sie. German uses the present tense here: Ich nehme sie. In speech you also hear Die nehme
    ich! with the article as a pointing word.

# ---------- grammar: welcher / dieser ----------
- id: a1-u10-gap-welche-diese
  type: gap
  skill: grammar
  variety: de
  grammar: [welcher-dieser]
  prompt: "Fill in welch- and dies- (die Jacke)."
  text: "___ Jacke möchten Sie? – ___ hier, bitte."
  answers: [["Welche"], ["Diese"]]
  explanation: >-
    die Jacke → welche / diese, the same ending as die. diese can stand alone when the noun is clear.

- id: a1-u10-mcq-diesen
  type: mcq
  skill: grammar
  variety: de
  grammar: [welcher-dieser, accusative-definite]
  prompt: Choose the correct form.
  question: Ich nehme ___ Pullover.
  options: ["dieser", "diesen", "dieses", "diese"]
  answer: 1
  rationales:
    - "dieser is the nominative (Dieser Pullover ist warm.)."
    - "Correct. der Pullover, object of nehmen: diesen (like den)."
    - "dieses is for das-words."
    - "diese is for die-words and plurals."
  explanation: >-
    dies- takes the endings of the article: der → dieser, den → diesen. Only the masculine changes in the
    accusative.

- id: a1-u10-transform-diesen
  type: transform
  skill: grammar
  variety: de
  grammar: [welcher-dieser, accusative-definite]
  prompt: "Replace den with the right form of dies-."
  from: de
  to: de
  source: Ich kaufe den Rock.
  answers: ["Ich kaufe diesen Rock."]
  explanation: >-
    der Rock is the object of kaufen: den → diesen. The ending -en is the same as in den.

- id: a1-u10-order-welche-groesse
  type: order
  skill: grammar
  variety: de
  grammar: [welcher-dieser, w-questions]
  prompt: Make a question.
  tokens: ["Größe", "haben", "Welche", "Sie"]
  answers: ["Welche Größe haben Sie?"]
  explanation: >-
    welche + noun counts as one question word and takes position 1; the verb follows in position 2. die
    Größe → welche.

# ---------- grammar: colours, zu + adjective ----------
- id: a1-u10-mcq-zu-lang
  type: mcq
  skill: grammar
  variety: de
  grammar: [colours-zu-adjective]
  prompt: "\"Die Hose ist zu lang.\" What's the problem?"
  options: ["The trousers are long enough.", "The trousers are too long.", "The trousers are also long.", "The trousers are very long and nice."]
  answer: 1
  explanation: >-
    zu + adjective = too: zu lang, zu klein, zu teuer. Don't mix it up with auch (also) or sehr (very).

- id: a1-u10-mcq-predicative
  type: mcq
  skill: grammar
  variety: de
  grammar: [colours-zu-adjective, predicative-adjectives]
  prompt: Which sentence is correct?
  options: ["Die Jacke ist rote.", "Die Jacke rot ist.", "Die Jacke ist rot.", "Die Jacke ist ein rot."]
  answer: 2
  rationales:
    - "No ending after sein."
    - "The verb is in position 2."
    - "Correct. Colour after sein, no ending."
    - "No article before an adjective."
  explanation: >-
    After sein, adjectives and colours never take an ending (unit 6): Die Jacke ist rot. Die Schuhe sind
    rot.

- id: a1-u10-mcq-steht-dir
  type: mcq
  skill: vocabulary
  variety: de
  grammar: [colours-zu-adjective]
  prompt: "Your friend says: \"Das steht dir gut!\" What does she mean?"
  options: ["That suits you!", "That stands over there.", "That fits in your bag.", "You're standing well."]
  answer: 0
  explanation: >-
    stehen + dir / Ihnen = to suit someone (colour, style). passen = to fit (size): Die Jacke passt. Learn
    both as chunks: Das steht dir gut. Die Hose passt mir nicht.

- id: a1-u10-translate-too-expensive
  type: translate
  skill: writing
  variety: de
  grammar: [colours-zu-adjective]
  prompt: Translate into German.
  source: The coat is too expensive.
  answers: ["Der Mantel ist zu teuer.", "Der Mantel ist mir zu teuer."]
  explanation: >-
    der Mantel; zu + adjective, no ending after sein. In Switzerland the dialect word is tüür.

# ---------- grammar: weather ----------
- id: a1-u10-gap-weather-es
  type: gap
  skill: grammar
  variety: de
  grammar: [weather-forecast, weather-es, time-inversion]
  prompt: "Fill in: it rains – it is windy."
  text: Am Sonntag ___ es, und am Abend ist es ___.
  answers: [["regnet"], ["windig"]]
  explanation: >-
    Weather verbs need es: es regnet, es schneit. After Am Sonntag the verb comes second and es third. der
    Wind → windig.

- id: a1-u10-mcq-grad
  type: mcq
  skill: grammar
  variety: de
  grammar: [weather-forecast]
  prompt: How do you say "It's 25 degrees"?
  options: ["Es sind 25 Grad.", "Es hat 25 Grade.", "Es macht 25 Graden.", "Es gibt 25 Grade."]
  answer: 0
  explanation: >-
    Es sind 25 Grad. Grad has no plural ending. You also hear Es ist 25 Grad and, in Switzerland and southern
    Germany, Es hat 25 Grad – but never Grade.

# ---------- reading ----------
- id: a1-u10-mcq-reading-warm
  type: mcq
  skill: reading
  variety: ch-std
  grammar: [weather-forecast]
  prompt: Read the weather forecast. Where is it warmest on Saturday?
  options: ["In Zurich", "In Bern", "In the mountains", "In Ticino"]
  answer: 3
  explanation: >-
    "Im Tessin sogar 19 Grad" – Ticino (das Tessin), south of the Alps, is warmer. sogar = even. Zurich and Bern
    have 14 Grad, the mountains only zwei Grad.

- id: a1-u10-mcq-reading-sunday
  type: mcq
  skill: reading
  variety: ch-std
  grammar: [weather-forecast]
  prompt: What do you need on Sunday, according to the forecast?
  options: ["Sunglasses", "An umbrella", "Only a T-shirt", "Skis"]
  answer: 1
  explanation: >-
    "Am Sonntag brauchen Sie einen Regenschirm." der Regen (rain) + der Schirm (shade) = umbrella. On Sunday it
    rains in Basel and Zurich.

- id: a1-u10-translate-reading
  type: translate
  skill: reading
  variety: ch-std
  grammar: [imperative, separable-verbs]
  prompt: Translate into English.
  source: Nehmen Sie eine Jacke und eine Mütze mit!
  answers: ["Take a jacket and a hat with you!", "Take a jacket and a hat!", "Bring a jacket and a hat!", "Take a jacket and a cap with you!"]
  explanation: >-
    mitnehmen = to take along, a separable verb: in the Sie-imperative the verb goes first and mit goes to the
    end (unit 8).

