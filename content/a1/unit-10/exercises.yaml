  prompt: Listen and write what you hear.
  transcript: Haben Sie die Jacke auch in Größe L?
  explanation: >-
    Größe (Swiss spelling Grösse) with ö and ß. die Jacke → you could also say Haben Sie sie auch in L?

- id: a1-u10-dictation-weather
  type: dictation
  skill: listening
  variety: de
  grammar: [weather-forecast]
  prompt: Listen and write what you hear.
  transcript: Morgen ist es bewölkt und windig, nur zwölf Grad.
  explanation: >-
    bewölkt (cloudy), windig (windy), zwölf Grad – no plural ending on Grad. Morgen in position 1, then the verb
    ist.

# ---------- speaking ----------
- id: a1-u10-speak-shop
  type: speak
  skill: speaking
  variety: de
  grammar: [colours-zu-adjective, accusative-pronouns]
  prompt: "In the shop: read aloud, then say it with your own size and colour."
  target: Ich suche eine Jacke in Größe M. Haben Sie sie auch in Blau?
  explanation: >-
    in Größe M, in Blau – colours are capitalised after in because they are used as nouns. die Jacke → sie.

- id: a1-u10-speak-shadow-tom
  type: speak
  skill: speaking
  variety: de
  grammar: [accusative-pronouns, welcher-dieser]
  prompt: "Shadowing: speak along with Tom's line from the intro dialogue, then say it alone."
  target: Schön! Kann ich sie anprobieren? Welche Größe ist das?
  explanation: >-
    Two questions with different melodies: Kann ich sie anprobieren? rises at the end (yes/no question);
    Welche Größe ist das? falls (W-question). Stress AN-probieren.

- id: a1-u10-speak-shadow-verkaeuferin
  type: speak
  skill: speaking
  variety: ch-std
  grammar: [colours-zu-adjective]
  prompt: "Shadowing: speak along with the Swiss shop assistant, then say it alone."
  target: Ja, hier ist sie in L. Oh, die steht Ihnen gut!
  explanation: >-
    Listen to the Swiss Standard melody: a clear, rolled or tapped r in hier, a fully pronounced -en in
    Ihnen, no glottal stop in Oh, die. See the drill The Swiss Standard German accent.

- id: a1-u10-speak-intonation-aber
  type: speak
  skill: speaking
  variety: de
  grammar: [colours-zu-adjective]
  prompt: "Intonation: stress the contrast. Say the first part rising, then fall on the second."
  target: Die Jacke ist schön, aber zu teuer.
  explanation: >-
    The voice goes up on SCHÖN, pauses briefly at the comma, then stresses TEU-er and falls at the end. This
    "yes, but" melody makes a polite complaint.

- id: a1-u10-speak-pron-oe
  type: speak
  skill: speaking
  variety: de
  grammar: [colours-zu-adjective]
  prompt: "Pronunciation: ö vs o. Read aloud and round your lips for ö."
  target: Größe, schön, Röcke – groß, rot, Rock
  explanation: >-
    For ö say e (as in bed) with rounded lips: Größe, schön, Röcke. For o just round the lips without moving
    the tongue forward: groß, rot, Rock. Röcke is the plural of Rock. See the drill ö vs o and e.

- id: a1-u10-roleplay-lena
  type: roleplay
  skill: speaking
  variety: de
  grammar: [accusative-pronouns, welcher-dieser, colours-zu-adjective]
  tutor: lena
  prompt: "Roleplay with Lena: shopping for clothes."
  scenario: >-
    You're shopping with Lena. You need shoes or a jumper for the winter. Lena asks what you're looking
    for, suggests things and asks your opinion. Use du.
  goals:
    - Say what you're looking for (Ich suche ...).
    - Say the size and colour you want.
    - Give your opinion with zu or sehr (zu teuer, sehr schön).
    - Refer to things with ihn / sie / es (Ich nehme ihn.).
  model: |
    Lena: Was suchst du?
    Du: Ich suche einen Pullover. Es ist so kalt!
    Lena: Welche Farbe möchtest du?
    Du: Grau oder blau. Größe L.
    Lena: Wie findest du diesen Pullover hier?
    Du: Der ist schön, aber zu teuer. Und dieser?
    Lena: Der kostet nur 39 Franken.
    Du: Super, ich nehme ihn!
  explanation: >-
    Useful frames: Ich suche ... Wie findest du diesen / diese / dieses ...? Der ist zu ... Ich nehme ihn /
    sie / es.

# ---------- writing ----------
- id: a1-u10-write-message
  type: write
  skill: writing
  variety: de
  grammar: [weather-forecast, imperative, accusative-pronouns]
  prompt: Write a short message to a friend.
  task: >-
    Your friend Lena is coming to visit you in Zurich next weekend. Write her a message (4–6 sentences):
    say what the weather will be like on Saturday and Sunday, tell her which clothes to bring, and ask
    whether she has a rain jacket or an umbrella.
  minWords: 30
  model: >-
    Hallo Lena, am Wochenende ist es in Zürich kalt. Am Samstag ist es sonnig, aber es sind nur fünf Grad.
    Am Sonntag regnet es. Nimm bitte einen Mantel, eine Mütze und einen Schal mit! Wir wandern am Samstag,
    also bring auch Schuhe für die Berge mit. Hast du eine Regenjacke oder einen Regenschirm? Bis Freitag!
    Liebe Grüße, Sarah
  checklist:
    - I use es with the weather (es regnet, es ist kalt) and Grad without an ending.
    - After a time word (Am Samstag) the verb is in position 2.
    - My du-imperatives have no -st and the prefix at the end (Nimm ... mit!).
    - Accusative articles are right (einen Mantel, eine Mütze, einen Schal).
  explanation: >-
    A message to a friend uses du, Hallo / Liebe Grüße, and the unit's patterns: weather with es, Grad,
    imperatives with mitnehmen and mitbringen, and accusative objects.

# ---------- Swiss Standard German ----------
- id: a1-u10-chstd-match
  type: match
  skill: vocabulary
  variety: ch-std
  prompt: Match the Swiss Standard German words with the German-German words.
  pairs:
    - ["der Pulli", "der Pullover"]
    - ["der Jupe", "der Rock"]
    - ["die Finken", "die Hausschuhe"]
    - ["die Grösse", "die Größe"]
  explanation: >-
    der Jupe comes from French (la jupe); Duden marks it as Swiss. die Finken are warm slippers (Duden:
    schweizerisch mundartlich) – Swiss homes are shoe-free. Swiss spelling never uses ß: Grösse, weiss.

- id: a1-u10-chstd-mcq-bise
  type: mcq
  skill: reading
  variety: ch-std
  grammar: [weather-forecast]
  prompt: "The Swiss weather forecast says: \"Morgen weht eine kalte Bise.\" (wehen = to blow) What's coming?"
  options: ["A warm wind from the south", "A thunderstorm", "A cold wind from the north-east", "Heavy snow"]
  answer: 2
  explanation: >-
    die Bise is the cold, dry north-east wind of the Swiss plateau. Its opposite is der Föhn, the warm, dry
    wind from the south – and also the word for a hairdryer.

# ---------- Swiss lane (gsw-zh) ----------
- id: a1-u10-ch-match-words
  type: match
  skill: vocabulary
  variety: gsw-zh
  prompt: Match the Zurich German words with Standard German.
  pairs:
    - ["chalt", "kalt"]
    - ["tüür", "teuer"]
    - ["wiiss", "weiß"]
    - ["gäl", "gelb"]
    - ["Chleid", "Kleid"]
  explanation: >-
    k at the start becomes ch (chalt, Chleid), Standard ei often becomes ii (weiß → wiiss), and eu becomes üü
    (teuer → tüür).

- id: a1-u10-ch-mcq-schiffet
  type: mcq
  skill: listening
  variety: gsw-zh
  grammar: [weather-es]
  prompt: "Listen to the Swiss lane dialogue. Reto says: \"Lueg emal use, es schiffet!\" What's the weather like?"
  options: ["It's sunny and hot.", "It's snowing.", "It's very windy.", "It's pouring with rain."]
  answer: 3
  explanation: >-
    es schiffet = it's pouring (colloquial; the neutral word is es rägnet). Lueg emal use! = Look outside!
    Later Reto says nur drü Grad – only three degrees.

- id: a1-u10-ch-transform-staht
  type: transform
  skill: reading
  variety: gsw-zh
  grammar: [colours-zu-adjective]
  prompt: What does Reto say? Write it in Standard German.
  from: gsw-zh
  to: de
  source: Das staht dir guet!
  answers: ["Das steht dir gut!", "Das steht dir gut.", "Es steht dir gut!"]
  explanation: >-
    stah = stehen, guet = gut (ue for Standard u). The chunk is the same as in Standard German: Das steht dir
    gut!

- id: a1-u10-ch-transform-z-gross
  type: transform
  skill: reading
  variety: gsw-zh
  grammar: [colours-zu-adjective]
  prompt: What does Sandra say about Reto's jacket? Write it in Standard German.
  from: gsw-zh
  to: de
  source: Die isch mer aber z gross.
  answers: ["Die ist mir aber zu groß.", "Die ist mir aber zu gross.", "Sie ist mir aber zu groß.", "Die ist mir zu groß.", "Sie ist mir zu groß.", "Die ist aber zu groß."]
  explanation: >-
    z = zu (too), mer = mir (for me), isch = ist. Die (that one) points to the jacket, die Jacke.

- id: a1-u10-ch-mcq-finke
  type: mcq
  skill: listening
  variety: gsw-zh
  prompt: "Sandra asks: \"Und wo sind mini Finke?\" What is she looking for?"
  options: ["Her slippers", "Her keys", "Her gloves", "Her phone"]
  answer: 0
  explanation: >-
    d Finke = Hausschuhe (slippers). Reto: Under em Sofa = Unter dem Sofa. Many Swiss give guests Finke at the
    door.

- id: a1-u10-ch-transform-de-gsw
  type: transform
  skill: vocabulary
  variety: gsw-zh
  grammar: [weather-es]
  prompt: "Recognition: how do you say this in Zurich German? (Common spellings are accepted.)"
  from: de
  to: gsw-zh
  source: Es ist kalt.
  answers: ["Es isch chalt.", "Es isch chalt!", "S isch chalt.", "Es isch kalt."]
  explanation: >-
    ist → isch, kalt → chalt. Add mega for really: Es isch mega chalt! Bernese says chaut.

- id: a1-u10-roleplay-reto
  type: roleplay
  skill: listening
  variety: gsw-zh
  grammar: [weather-forecast, accusative-pronouns, colours-zu-adjective]
  tutor: reto
  prompt: "Listening roleplay with Reto: what to wear."
  scenario: >-
    You and Reto want to go hiking on the Üetliberg. Reto looks at the weather on his phone and tells you
    in Zurich German what to wear. You answer in Standard German.
  goals:
