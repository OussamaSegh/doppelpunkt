# ---------- verbs and little words ----------
- id: anprobieren
  de: anprobieren
  en: to try on
  pos: verb
  example: { de: "Kann ich die Jacke anprobieren?", en: "Can I try the jacket on?" }
  gswZh: aaprobiere
  tags: [shopping, separable]

- id: tragen
  de: tragen
  en: to wear; to carry
  pos: verb
  example: { de: "Er trägt heute einen Mantel.", en: "He's wearing a coat today." }
  gswZh: träge
  tags: [clothes, stem-change]

- id: stehen-kleidung
  de: stehen (Das steht dir.)
  en: to suit (someone)
  pos: verb
  example: { de: "Die Farbe steht dir gut!", en: "That colour suits you!" }
  gswZh: "stah (Das staht dir guet!)"
  tags: [clothes, phrases]

- id: welcher
  de: welcher / welche / welches
  en: which
  pos: pron
  example: { de: "Welcher Pullover ist warm?", en: "Which jumper is warm?" }
