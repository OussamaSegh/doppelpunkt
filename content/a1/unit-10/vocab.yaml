- id: dieser
  de: dieser / diese / dieses
  en: this (one), these
  pos: pron
  example: { de: "Diese Jacke ist schön.", en: "This jacket is nice." }
  tags: [pronouns]

- id: zu-adj
  de: zu (+ adjective)
