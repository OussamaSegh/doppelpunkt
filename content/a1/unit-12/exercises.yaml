- id: a1-u12-roleplay-reto
  type: roleplay
  skill: listening
  variety: gsw-zh
  grammar: [congratulating-inviting, dates-ordinals, review-word-order]
  tutor: reto
  prompt: "Listening roleplay with Reto: 1 August plans."
  scenario: >-
    Reto invites you to celebrate the Swiss national day with his friends. He speaks Zurich German; you
    answer in Standard German. Find out what the plan is, accept and offer to bring something.
  goals:
    - Understand the invitation and the date (am erschte Auguscht).
    - Understand the plan (Buurezmorge, Fürwerk am See) and ask a question.
    - Accept and offer to bring something.
  model: |
    Reto: Du, am erschte Auguscht mached mir es Fäscht. Chunnsch au?
    Du: Am ersten August? Ja, gern! Was macht ihr?
    Reto: Am Morge gönd mir as Buurezmorge, und am Abig luege mir s Fürwerk am See.
    Du: Super! Soll ich etwas mitbringen?
    Reto: Ja, gärn. Bring en Salat mit!
    Du: Gut, mache ich. Ich freue mich!
    Reto: Ich mich au. Bis dänn!
  explanation: >-
    Decoding: mached mir = machen wir, chunnsch au? = kommst du auch?, gönd mir = gehen wir, as Buurezmorge = zum
    Bauernfrühstück (brunch on a farm), luege = schauen, s Fürwerk = das Feuerwerk.

