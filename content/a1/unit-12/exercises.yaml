# A1 unit 12 – Feste und Feiern (A1 review)

# ---------- vocabulary ----------
- id: a1-u12-match-wishes
  type: match
  skill: vocabulary
  variety: de
  grammar: [congratulating-inviting]
  prompt: Match the occasion with the right wish.
  pairs:
    - ["Geburtstag", "Herzlichen Glückwunsch!"]
    - ["Weihnachten", "Frohe Weihnachten!"]
    - ["Silvester, um Mitternacht", "Ein gutes neues Jahr!"]
    - ["Vor dem Essen", "Guten Appetit!"]
    - ["Mit einem Glas Wein", "Prost!"]
    - ["Vor der Party", "Viel Spaß!"]
  explanation: >-
    Each occasion has its fixed wish. Herzlichen Glückwunsch also works for a wedding or an exam (zur Hochzeit,
    zur Prüfung). In Switzerland: Vill Glück zum Geburtstag!, En Guete!, Proscht!

- id: a1-u12-match-party
  type: match
  skill: vocabulary
  variety: de
  prompt: Match the party words with English.
  pairs:
    - ["das Geschenk", "present"]
    - ["die Kerze", "candle"]
    - ["der Gast", "guest"]
    - ["die Überraschung", "surprise"]
    - ["das Feuerwerk", "fireworks"]
  explanation: >-
    Plurals: die Geschenke, die Kerzen, die Gäste (umlaut!), die Überraschungen. das Feuerwerk is singular in
    German but fireworks is plural in English.

# ---------- grammar: inviting, accepting, declining, congratulating ----------
- id: a1-u12-mcq-decline
  type: mcq
  skill: grammar
  variety: de
  grammar: [congratulating-inviting, modal-koennen-wollen]
  prompt: Lena invites you to her party, but you have to work. What's the most polite answer?
  options: ["Ich komme nicht.", "Nein.", "Leider kann ich nicht. Ich muss arbeiten.", "Ich will nicht kommen."]
  answer: 2
  rationales:
    - "Correct grammar, but it sounds rude without leider and a reason."
    - "Much too short."
    - "Correct. leider + a short reason is the polite way."
    - "This says you don't want to – unfriendly."
  explanation: >-
    Decline with leider (unfortunately) and a short reason: Leider kann ich nicht. Ich muss arbeiten. Then add
    Schade! or Viel Spaß!

- id: a1-u12-gap-zum-zur
  type: gap
  skill: grammar
  variety: de
  grammar: [congratulating-inviting]
  prompt: "Fill in zum or zur."
  text: Herzlichen Glückwunsch ___ Geburtstag! Herzlichen Glückwunsch ___ Hochzeit!
  answers: [["zum"], ["zur"]]
  explanation: >-
    zum = zu dem (der Geburtstag), zur = zu der (die Hochzeit). The same chunk as zum Bahnhof / zur Post (unit 8).

- id: a1-u12-mcq-freue-mich
  type: mcq
  skill: grammar
  variety: de
  grammar: [congratulating-inviting]
  prompt: "You accept an invitation happily. Complete: \"Super, ich ___!\""
  options: ["freue", "freue mich", "freue dich", "bin freue"]
  answer: 1
  explanation: >-
    sich freuen is reflexive: ich freue mich, du freust dich. Learn Ich freue mich! as a chunk for I'm looking
    forward to it / I'm happy.

- id: a1-u12-translate-happy-birthday
  type: translate
  skill: writing
  variety: de
  grammar: [congratulating-inviting]
  prompt: Translate into German.
  source: Happy birthday!
  answers: ["Herzlichen Glückwunsch zum Geburtstag!", "Alles Gute zum Geburtstag!", "Herzlichen Glückwunsch!", "Alles Gute!"]
  explanation: >-
    Not Glücklichen Geburtstag – that's a word-for-word translation. Say Herzlichen Glückwunsch zum Geburtstag!
    or Alles Gute zum Geburtstag!

# ---------- review: word order ----------
- id: a1-u12-order-time-first
  type: order
  skill: grammar
  variety: de
  grammar: [review-word-order, time-inversion]
  prompt: Start with "Am Samstag".
  tokens: ["Am", "Samstag", "feiere", "ich", "meinen", "Geburtstag"]
  answers: ["Am Samstag feiere ich meinen Geburtstag."]
  explanation: >-
    Only one element before the verb: Am Samstag (position 1), feiere (position 2), then the subject ich.

- id: a1-u12-order-separable
  type: order
  skill: grammar
  variety: de
  grammar: [review-word-order, separable-verbs-modal]
  prompt: Put the words in order.
  tokens: ["Ich", "lade", "dich", "zur", "Party", "ein"]
  answers: ["Ich lade dich zur Party ein."]
  explanation: >-
    einladen is separable: lade in position 2, ein at the end. The pronoun dich comes early, right after the
    verb.

- id: a1-u12-order-modal-question
  type: order
  skill: grammar
  variety: de
  grammar: [review-word-order, separable-verbs-modal, sollen]
  prompt: Make a yes/no question.
  tokens: ["Soll", "ich", "einen", "Kuchen", "mitbringen"]
  answers: ["Soll ich einen Kuchen mitbringen?"]
  explanation: >-
    Yes/no question: the modal verb first, the separable infinitive at the end in one word.

- id: a1-u12-mcq-word-order
  type: mcq
  skill: grammar
  variety: de
  grammar: [review-word-order, modal-koennen-wollen]
  prompt: Which sentence is correct?
  options: ["Ich kann nicht kommen am Samstag.", "Am Samstag ich kann nicht kommen.", "Ich kann am Samstag nicht kommen.", "Ich nicht kann am Samstag kommen."]
  answer: 2
  rationales:
    - "The infinitive must be at the very end."
    - "Only one element before the verb."
    - "Correct. Modal second, time and nicht in the middle, infinitive at the end."
    - "The modal verb must be in position 2."
  explanation: >-
    The sentence bracket: kann ... kommen. Everything else (am Samstag, nicht) goes inside.

- id: a1-u12-transform-modal
  type: transform
  skill: grammar
  variety: de
  grammar: [review-word-order, modal-muessen-duerfen, separable-verbs-modal]
  prompt: "Add the modal verb: müssen."
  from: de
  to: de
  source: Ich kaufe heute ein Geschenk ein.
  answers: ["Ich muss heute ein Geschenk einkaufen.", "Heute muss ich ein Geschenk einkaufen."]
  explanation: >-
    muss takes position 2; kaufe ... ein becomes one infinitive at the end: einkaufen. (Ich muss heute ein
    Geschenk kaufen is also good German.)

- id: a1-u12-transform-imperative
  type: transform
  skill: grammar
  variety: de
  grammar: [review-word-order, imperative]
  prompt: "Make a du-imperative."
  from: de
  to: de
  source: Du bringst Blumen mit.
  answers: ["Bring Blumen mit!", "Bring bitte Blumen mit!", "Bring Blumen mit.", "Bringe Blumen mit!"]
  explanation: >-
    du bringst → Bring! (drop -st and du). The prefix mit stays at the end.

# ---------- review: nicht / kein and accusative ----------
- id: a1-u12-gap-nicht-kein
  type: gap
  skill: grammar
  variety: de
  grammar: [review-negation-accusative, nicht-kein]
  prompt: "Fill in nicht, kein or keine."
  text: Ich habe ___ Zeit, und ich habe ___ Geschenk. Ich komme leider ___.
  answers: [["keine"], ["kein"], ["nicht"]]
  explanation: >-
    kein negates nouns: die Zeit → keine Zeit, das Geschenk → kein Geschenk. nicht negates verbs: Ich komme nicht.

- id: a1-u12-gap-accusative
  type: gap
  skill: grammar
  variety: de
  grammar: [review-negation-accusative, accusative-indefinite, possessives]
  prompt: "Fill in: einen – eine – meinen."
  text: Ich kaufe ___ Kuchen und ___ Kerze. Am Samstag feiere ich ___ Geburtstag.
  answers: [["einen"], ["eine"], ["meinen"]]
  explanation: >-
    der Kuchen and der Geburtstag are masculine objects: einen, meinen. die Kerze doesn't change: eine.

- id: a1-u12-mcq-keinen
  type: mcq
  skill: grammar
  variety: de
  grammar: [review-negation-accusative, nicht-kein]
  prompt: Choose the correct form.
  question: Wir brauchen ___ Wein, wir haben genug.
  options: ["kein", "keine", "nicht", "keinen"]
  answer: 3
  explanation: >-
    der Wein, object of brauchen → keinen (like einen). genug = enough.

- id: a1-u12-mcq-doch
  type: mcq
  skill: grammar
  variety: de
  grammar: [ja-nein-doch]
  prompt: "\"Kommst du nicht zur Party?\" – You are coming. What do you answer?"
  options: ["Ja!", "Doch, ich komme!", "Nein, ich komme!", "Nicht, ich komme!"]
  answer: 1
  explanation: >-
    After a negative question, doch says yes, I am (unit 5). Ja would be confusing; Nein means you're not coming.

- id: a1-u12-transform-pronoun
  type: transform
  skill: grammar
  variety: de
  grammar: [review-negation-accusative, accusative-pronouns]
  prompt: "Replace the noun with a pronoun."
  from: de
  to: de
  source: Ich lade Reto ein.
  answers: ["Ich lade ihn ein."]
  explanation: >-
    Reto is male and the object of einladen → ihn (unit 10). The pronoun stays before the prefix ein.

# ---------- review: questions, present tense, sein / haben ----------
- id: a1-u12-gap-sein-haben
  type: gap
  skill: grammar
  variety: de
  grammar: [sein-present, haben-present, stem-changing-verbs]
  prompt: "Fill in the verbs: sein – haben – fahren."
  text: Nadine ___ dreißig Jahre alt. Sie ___ am Samstag Geburtstag. Wir ___ mit dem Tram zur Party.
  answers: [["ist"], ["hat"], ["fahren"]]
  explanation: >-
    sie ist, sie hat (irregular); wir fahren (the a → ä change is only for du and er/sie/es: du fährst, sie
    fährt).

- id: a1-u12-mcq-du-sie
  type: mcq
  skill: grammar
  variety: de
  grammar: [du-sie]
  prompt: You invite your boss, Frau Weber. Which question is right?
  options: ["Kommst du auch, Frau Weber?", "Kommen Sie auch, Frau Weber?", "Kommt ihr auch, Frau Weber?", "Kommen sie auch, Frau Weber?"]
  answer: 1
  explanation: >-
    Use Sie (capital S, verb ending -en) with your boss and with Herr / Frau + surname. du is for friends and
    family; lower-case sie means they.

# ---------- forms, spelling, asking for help ----------
