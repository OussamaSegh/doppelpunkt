- id: a1-u12-ch-be-match
  type: match
  skill: vocabulary
  variety: gsw-be
  prompt: Match the Bernese words with Standard German.
  pairs:
    - ["ds Fescht", "das Fest"]
    - ["Samichlous", "Nikolaus"]
    - ["Silveschter", "Silvester"]
    - ["zäme", "zusammen"]
  explanation: >-
    All from berndeutsch.ch. Bernese ds is the neuter article (Zurich s), and ou often stands where Zurich has
    au (Samichlous – Zurich Samichlaus).
