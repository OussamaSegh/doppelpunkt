# ---------- speaking ----------
- id: a1-u12-speak-invite
  type: speak
  skill: speaking
  variety: de
  grammar: [congratulating-inviting, review-word-order]
  prompt: "Read aloud, then invite a friend to your own party (day, time, place)."
  target: Ich feiere am Samstag meinen Geburtstag. Kommst du auch? Die Party beginnt um acht.
  explanation: >-
    Three A1 patterns in a row: verb second (Ich feiere ...), verb first in a yes/no question (Kommst du ...?),
    and the time with um.

- id: a1-u12-speak-shadow-tom
  type: speak
  skill: speaking
  variety: de
  grammar: [congratulating-inviting, sollen]
  prompt: "Shadowing: speak along with Tom's line from the intro dialogue, then say it alone."
  target: Ja, ich komme gern! Soll ich etwas mitbringen?
  explanation: >-
    Enthusiastic: a high start on JA, stress on GERN. The question Soll ich etwas MIT-bringen? rises at the end.

- id: a1-u12-speak-shadow-nadine
  type: speak
  skill: speaking
  variety: ch-std
  grammar: [review-negation-accusative, modal-muessen-duerfen]
  prompt: "Shadowing: speak along with Nadine, then say it alone."
  target: Nein, du musst nichts mitbringen. Es gibt genug Essen und Getränke.
  explanation: >-
    Swiss Standard German: the ch in nichts is often the back ach-sound, the r is tapped, and -en is fully
    pronounced (Getränke, mitbringen). See the drill The Swiss Standard German accent.

- id: a1-u12-speak-intonation-wishes
  type: speak
  skill: speaking
  variety: de
  grammar: [congratulating-inviting]
  prompt: "Intonation: wishes sound warm. Stress the key word and let the voice fall."
  target: Herzlichen Glückwunsch zum Geburtstag! Alles Gute!
  explanation: >-
    Stress HERZ-lichen and GLÜCK-wunsch, then ge-BURTS-tag; the voice falls at the end. Alles GU-te with a warm,
    falling tone.

- id: a1-u12-speak-pron-review
  type: speak
  skill: speaking
  variety: de
  grammar: [spelling-repair]
  prompt: "Pronunciation review of A1: ü, ö, ch, z and the vocalised -er. Read aloud slowly."
  target: Fünf Gäste feiern zwölf Stunden – Frohe Weihnachten und schöne Grüße aus Zürich!
  explanation: >-
    ü in fünf, Grüße, Zürich (say ee with round lips); ö in zwölf, schöne; ach-Laut in Weihnachten; z = ts in
    zwölf, Zürich; -er in feiern sounds like a short a. See the drills ü vs u and i, ö vs o and e, The ach-Laut
    (back ch), z [ts] and pf, and German r and the vocalised -er.

- id: a1-u12-roleplay-lena
  type: roleplay
  skill: speaking
  variety: de
  grammar: [congratulating-inviting, review-word-order, review-negation-accusative, spelling-repair]
  tutor: lena
  prompt: "Roleplay with Lena: planning a party (A1 review)."
  scenario: >-
    It's Lena's birthday next week. Congratulate her early, ask about her party, accept the invitation, offer
    to bring something and ask her to repeat one thing she says too fast. Use du.
  goals:
    - Congratulate Lena (Herzlichen Glückwunsch! / Alles Gute!).
    - Ask when and where the party is (Wann? Wo?).
    - Accept the invitation (Ich komme gern!) and offer something (Soll ich ... mitbringen?).
    - Ask Lena to repeat or speak more slowly (Wie bitte? Kannst du das wiederholen?).
  model: |
    Lena: Nächste Woche habe ich Geburtstag!
    Du: Oh, alles Gute! Feierst du?
    Lena: Ja, am Freitag. Ich lade dich ein!
    Du: Danke! Wann und wo ist die Party?
    Lena: Umachtbeimirundwirgrillenimgarten!
    Du: Wie bitte? Kannst du das bitte langsam wiederholen?
    Lena: Um acht, bei mir. Wir grillen im Garten.
    Du: Super, ich komme gern! Soll ich einen Salat mitbringen?
    Lena: Ja, gern! Danke!
  explanation: >-
    A review of A1 in one conversation: W-questions, separable einladen and mitbringen, Soll ich ...?, and the
    rescue phrases Wie bitte? / Kannst du das bitte wiederholen?

# ---------- writing ----------
- id: a1-u12-write-invitation
  type: write
  skill: writing
  variety: de
  grammar: [congratulating-inviting, review-word-order, dates-ordinals, separable-verbs-modal]
  prompt: Write an invitation.
  task: >-
    Write an invitation to your birthday party for your German course (5–7 sentences). Say what you are
    celebrating, give the day, date, time and place, say what there is to eat and drink, ask people to bring
    something, and ask them to reply (zusagen) by a date.
  minWords: 35
  model: >-
    Liebe Kursteilnehmerinnen und Kursteilnehmer, am Samstag, 14. Juni, feiere ich meinen Geburtstag. Ich lade
    euch ein! Die Party beginnt um 19 Uhr bei mir zu Hause, an der Seestraße 12. Es gibt Pizza, Salat und
    Getränke. Bringt bitte gute Laune und Musik mit! Bitte sagt bis zum 10. Juni zu. Ich freue mich! Viele
    Grüße, Tom
  checklist:
    - I start with a greeting (Liebe ..., Hallo ...) and end with Viele Grüße and my name.
    - I give the day, date (am 14. Juni), time (um 19 Uhr) and place.
    - The verb is in position 2 in every statement, also after a time word.
    - Separable verbs (einladen, mitbringen, zusagen) have the prefix at the end.
    - I use ihr / euch for the group (Ich lade euch ein. Bringt ... mit!).
  explanation: >-
    An invitation to a group uses ihr: Ich lade euch ein. Bringt ... mit! Bitte sagt ... zu. gute Laune = a good
    mood (a fixed chunk).

# ---------- Swiss Standard German ----------
- id: a1-u12-chstd-match
  type: match
  skill: vocabulary
  variety: ch-std
  prompt: Match the Swiss Standard German words with the German-German words.
  pairs:
    - ["der Samichlaus", "der Nikolaus"]
    - ["die Fasnacht", "der Karneval"]
    - ["die Schoggi", "die Schokolade"]
    - ["dreissig", "dreißig"]
  explanation: >-
    Samichlaus (Duden: schweizerisch) comes on 6 December. Fasnacht is the Swiss carnival (Basel, Lucerne).
    Schoggi is colloquial – you see it on Swiss packaging and menus. Swiss spelling has no ß.

# ---------- Swiss lane (gsw-zh) ----------
- id: a1-u12-ch-match-words
  type: match
  skill: vocabulary
  variety: gsw-zh
  prompt: Match the Zurich German words with Standard German.
  pairs:
    - ["s Gschänk", "das Geschenk"]
    - ["s Fäscht", "das Fest"]
    - ["de Geburi", "der Geburtstag"]
    - ["Proscht!", "Prost!"]
    - ["En Guete!", "Guten Appetit!"]
  explanation: >-
    Gschänk and Fäscht follow regular patterns: ge- → g, e → ä, st → scht. Geburi is the colloquial short form.
    En Guete! is said before every meal.

- id: a1-u12-ch-mcq-present
  type: mcq
  skill: listening
  variety: gsw-zh
  prompt: Listen to the Swiss lane dialogue. What is Sandra's present for Reto?
  options: ["A bottle of wine", "Flowers", "Chocolate", "A cake"]
  answer: 2
  explanation: >-
    "Mach s uf!" – "Schoggi! Mega, merci!" Schoggi = Schokolade, Mach s uf! = Mach es auf! (Open it!)

- id: a1-u12-ch-transform-glueck
  type: transform
  skill: reading
  variety: gsw-zh
  grammar: [congratulating-inviting]
  prompt: What does Sandra say to Reto? Write it in Standard German.
  from: gsw-zh
  to: de
  source: Vill Glück zum Geburtstag!
  answers: ["Viel Glück zum Geburtstag!", "Herzlichen Glückwunsch zum Geburtstag!", "Alles Gute zum Geburtstag!"]
  explanation: >-
    vill = viel. Word for word it's Viel Glück zum Geburtstag; in Germany you'd say Herzlichen Glückwunsch or
    Alles Gute zum Geburtstag.

- id: a1-u12-ch-transform-trinke
  type: transform
  skill: reading
  variety: gsw-zh
  grammar: [modal-koennen-wollen]
  prompt: What does Reto ask? Write it in Standard German.
  from: gsw-zh
  to: de
  source: Wottsch öppis trinke?
  answers: ["Willst du etwas trinken?", "Möchtest du etwas trinken?", "Willst du was trinken?"]
  explanation: >-
    wottsch = willst du (wele, unit 7), öppis = etwas, trinke = trinken (no final -n in Zurich German).

- id: a1-u12-ch-mcq-en-guete
  type: mcq
  skill: listening
  variety: gsw-zh
  grammar: [congratulating-inviting]
  prompt: "Reto says: \"Und jetzt gits Fondue. En Guete mitenand!\" When do Swiss people say En Guete?"
  options: ["When they clink glasses", "When someone sneezes", "When they say goodbye", "Before they start eating"]
  answer: 3
  explanation: >-
    En Guete! = Guten Appetit! Swiss people say it before every meal, also to colleagues. gits = es gibt,
    mitenand = everyone. For clinking glasses: Proscht!

