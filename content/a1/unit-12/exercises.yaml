- id: a1-u12-match-letters
  type: match
  skill: listening
  variety: de
  grammar: [spelling-repair]
  prompt: "Spelling: match the German letter names with the letters."
  pairs:
    - ["ay", "E"]
    - ["ee", "I"]
    - ["yot", "J"]
    - ["fow", "V"]
    - ["vay", "W"]
    - ["tset", "Z"]
  explanation: >-
    The classic trap: German E sounds like English A in day, German I like English E in see. V is fau, W is we,
    Z is tset.

- id: a1-u12-dictation-spelling
  type: dictation
  skill: listening
  variety: de
  grammar: [spelling-repair]
