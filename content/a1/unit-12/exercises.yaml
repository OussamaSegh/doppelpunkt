- id: a1-u12-mcq-wiederholen
  type: mcq
  skill: speaking
  variety: de
  grammar: [spelling-repair]
  prompt: The receptionist speaks very fast and you don't understand. What do you say?
  options: ["Ich spreche nicht.", "Können Sie das bitte wiederholen?", "Das ist falsch.", "Sprechen Sie bitte schnell!"]
  answer: 1
  explanation: >-
    Können Sie das bitte wiederholen? (Could you repeat that, please?) Also: Wie bitte? Bitte langsam! Asking for
