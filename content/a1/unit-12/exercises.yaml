  transcript: Mein Name ist Baker. Ich buchstabiere B-A-K-E-R.
  explanation: >-
    buchstabieren = to spell. Listen carefully for E (ay) and A (ah).

# ---------- reading ----------
- id: a1-u12-mcq-reading-sechselaeuten
  type: mcq
  skill: reading
  variety: ch-std
  prompt: Read "Feste in der Schweiz". What happens at the Sechseläuten in Zurich?
  options: ["Children get nuts and mandarins.", "There are fireworks on the mountains.", "People wear masks all night.", "The Böögg burns at six o'clock."]
  answer: 3
  explanation: >-
    "Im April feiert Zürich das Sechseläuten ... um sechs Uhr brennt der Böögg." The quicker its head explodes, the
    better the summer (zuerich.com). Masks are the Fasnacht, nuts and mandarins the Samichlaus.

- id: a1-u12-mcq-reading-august
  type: mcq
  skill: reading
  variety: ch-std
  grammar: [dates-ordinals]
  prompt: What do many people do on the morning of the Swiss national day?
  options: ["They have a brunch on a farm.", "They go to the Fasnacht.", "They visit Saint Nicholas.", "They burn the Böögg."]
  answer: 0
  explanation: >-
    "Am 1. August ... am Morgen oft einen Brunch auf dem Bauernhof." der Bauernhof = farm. The Swiss call it
    Buurezmorge (farmers' breakfast).

- id: a1-u12-translate-reading
  type: translate
  skill: reading
  variety: ch-std
  grammar: [review-word-order]
  prompt: Translate into English.
  source: Am 6. Dezember kommt der Samichlaus zu den Kindern.
  answers: ["On 6 December Saint Nicholas comes to the children.", "On the 6th of December Saint Nicholas visits the children.", "On 6 December Santa Claus comes to the children.", "On 6 December St Nicholas visits the children."]
  explanation: >-
    Time first, then the verb kommt, then the subject der Samichlaus – verb second. Samichlaus is the Swiss name
    for Saint Nicholas (Duden: schweizerisch).

