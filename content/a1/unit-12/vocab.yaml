# A1 unit 12 – Feste und Feiern (A1 review)

# ---------- parties and presents ----------
- id: party
  de: Party
  en: party
  pos: noun
  gender: f
  plural: Partys
  example: { de: "Die Party beginnt um acht.", en: "The party starts at eight." }
  gswZh: Party / Fäscht
  tags: [celebrations]

- id: feier
  de: Feier
  en: celebration
  pos: noun
  gender: f
  plural: Feiern
  example: { de: "Die Feier ist im Garten.", en: "The celebration is in the garden." }
  gswZh: Fiir
  gswBe: Fyr (d Geburtstagsfyr)
