- id: feiern
  de: feiern
  en: to celebrate
  pos: verb
  example: { de: "Am Samstag feiere ich meinen Geburtstag.", en: "On Saturday I'm celebrating my birthday." }
  gswZh: fiire
  tags: [celebrations]

- id: geschenk
  de: Geschenk
  en: present, gift
  pos: noun
  gender: n
  plural: Geschenke
  example: { de: "Das Geschenk ist für dich.", en: "The present is for you." }
