- id: schenken
  de: schenken
  en: to give (as a present)
  pos: verb
  example: { de: "Ich schenke Reto Blumen.", en: "I'm giving Reto flowers." }
  gswZh: schänke
  tags: [celebrations]

- id: glueckwunsch
  de: Glückwunsch
