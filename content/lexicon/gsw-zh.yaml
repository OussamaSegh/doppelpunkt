# Doppelpunkt – Standard German → Zurich German lexicon (high-frequency core)
#
# One entry per Standard German headword. Fields:
#   de     Standard German (Germany spelling; Swiss Standard German writes ss for ß)
#   gswZh  Zurich German in Dieth-style spelling; common alternative spellings separated by " / "
#   gswBe  Bernese, only where it is notably different from Zurich
#   chStd  Swiss Standard German (Helvetism), only where it differs from Germany
#   en     English gloss
#   pos    noun | verb | adj | adv | prep | conj | pron | num | phrase | other
#   notes  optional usage note in English
#   tags   free tags (grammar, food, transport, ...)
#
# Swiss German has no official spelling. Graders accept every listed alternative, and should be
# lenient with vowel length (doubled vowels) and with ä/e. Status: draft, awaiting native review.

entries:
  # ----- pronouns -----
  - { de: ich, gswZh: ich, gswBe: i, en: I, pos: pron, tags: [pronouns] }
  - { de: du, gswZh: du, en: you (informal), pos: pron, notes: "Often dropped after the verb: Chunnsch au? (Kommst du auch?)", tags: [pronouns] }
  - { de: er, gswZh: er, gswBe: är, en: he, pos: pron, tags: [pronouns] }
  - { de: sie (she / they), gswZh: si, en: she; they, pos: pron, tags: [pronouns] }
  - { de: wir, gswZh: mir, en: we, pos: pron, notes: "mir = wir in all Swiss dialects; it is not 'me'.", tags: [pronouns] }
  - { de: ihr, gswZh: ihr, gswBe: dir, en: you (plural informal), pos: pron, notes: "Bernese dir = Standard ihr – a classic trap.", tags: [pronouns] }
  - { de: Sie (polite), gswZh: Sie, gswBe: Dir (dative / accusative Ech), en: you (polite), pos: pron, notes: "Bernese traditionally uses Ihrzen instead of Siezen: Dir (= Ihr) as subject, Ech (= Euch) as object: Wie geits Ech? Chöit Dir mer hälfe?", tags: [pronouns] }
  - { de: mein / meine, gswZh: "min (m) / mini (f, pl) / mis (n)", en: my, pos: pron, tags: [possessives] }
  - { de: dein / deine, gswZh: "din (m) / dini (f, pl) / dis (n)", en: your (informal), pos: pron, tags: [possessives] }
  - { de: unser / unsere, gswZh: öise / öisi / öises, gswBe: üse / üsi / üses, en: our, pos: pron, tags: [possessives] }
  - { de: etwas, gswZh: öppis, en: something, pos: pron, tags: [pronouns] }
  - { de: jemand, gswZh: öpper, en: somebody, pos: pron, tags: [pronouns] }
  - { de: nichts, gswZh: nüt, en: nothing, pos: pron, tags: [pronouns] }
  - { de: niemand, gswZh: niemert / niemer, en: nobody, pos: pron, tags: [pronouns] }

  # ----- core verbs -----
  - { de: sein, gswZh: "sii (ich bi, du bisch, er isch, mir/ihr/si sind)", gswBe: "sy (i bi, du bisch, är isch, mir sy, dir syt, si sy)", en: to be, pos: verb, notes: "Past: ich bi gsii (= ich war / bin gewesen). Swiss German has no Präteritum.", tags: [verbs, irregular] }
  - { de: haben, gswZh: "ha (ich ha, du häsch, er hät, mir/ihr/si händ)", gswBe: "ha (i ha, du hesch, är het, mir hei, dir heit, si hei)", en: to have, pos: verb, notes: "Participle gha: ich ha gha.", tags: [verbs, irregular] }
  - { de: gehen, gswZh: "gaa / gah (ich gang, du gaasch, er gaat, mir gönd)", gswBe: "ga (i gange, du geisch, är geit, mir göh)", en: to go, pos: verb, notes: "Participle: gange. 'go + infinitive' pattern: Ich gang go poschte (I'm going shopping).", tags: [verbs, irregular] }
  - { de: kommen, gswZh: "cho (ich chume, du chunnsch, er chunnt, mir chömed)", gswBe: "cho (i chume, du chunsch, är chunnt, mir chöme)", en: to come, pos: verb, notes: "Participle: cho. Chunsch au? = Kommst du auch?", tags: [verbs, irregular] }
  - { de: aufstehen, gswZh: "ufstah (ich stah uf / ich stand uf, du staasch uf, er staat uf, mir stönd uf)", gswBe: ufstah / ufsta, en: to get up, pos: verb, notes: "Participle: ufgstande (Bernese ufgstange).", tags: [verbs, separable] }
  - { de: anfangen, gswZh: "aafange (es fangt aa)", en: to start, pos: verb, notes: "No umlaut: de Kurs fangt am nüüni aa.", tags: [verbs, separable] }
  - { de: lesen, gswZh: "läse (ich lise, du lisisch, er list, mir läsed)", en: to read, pos: verb, tags: [verbs, irregular] }
  - { de: kaufen, gswZh: chaufe, gswBe: "choufe (participle gchouft)", en: to buy, pos: verb, tags: [verbs, shopping] }
  - { de: machen, gswZh: mache, en: to make; to do, pos: verb, notes: "Participle: gmacht.", tags: [verbs] }
  - { de: sagen, gswZh: "säge (ich säg, du seisch, er seit, mir säged)", en: to say, pos: verb, tags: [verbs] }
  - { de: geben, gswZh: "gää (ich gib, du gisch, er git, mir gänd)", gswBe: gä, en: to give, pos: verb, notes: "es gibt = es git; Participle: ggää (ich ha der s ggää). Learners may write gää.", tags: [verbs, irregular] }
  - { de: nehmen, gswZh: "näh (ich nimm, du nimmsch, er nimmt, mir nämed)", gswBe: "näh (i nime)", en: to take, pos: verb, notes: "Participle: gnaa.", tags: [verbs, irregular] }
  - { de: können, gswZh: "chöne (ich chan, du chasch, er chan, mir chönd)", gswBe: "chönne (i cha, du chasch, mir chöi)", en: "can, to be able to", pos: verb, tags: [verbs, modal] }
  - { de: müssen, gswZh: "müese (ich mues, du muesch, mir müend)", gswBe: "müesse (i mues, mir müesse)", en: "must, to have to", pos: verb, tags: [verbs, modal] }
  - { de: wollen, gswZh: "wele / welle (ich wott, du wottsch, er wott, mir wänd)", gswBe: "wöue (i wott, mir wei)", en: to want, pos: verb, notes: "Wämmer ...? = Wollen wir ...? (Shall we ...?)", tags: [verbs, modal] }
  - { de: dürfen, gswZh: "dörfe (ich dörf, du dörfsch, er dörf, mir dörfed; darf is also heard)", en: "may, to be allowed to", pos: verb, notes: "Was dörfs sii? = Was darf es sein?", tags: [verbs, modal] }
  - { de: sollen, gswZh: "sölle / söle (ich söll, du söllsch, er söll, mir sölled)", en: "should, to be supposed to", pos: verb, tags: [verbs, modal] }
  - { de: möchten, gswZh: "möchte (ich möcht, du möchtsch / möchtisch, er möcht, mir möchted)", en: would like, pos: verb, notes: "Ordering usually uses Ich hett gärn ... or Ich nimm ... Zurich also says ich wett (= ich möchte / wollte).", tags: [verbs, modal] }
  - { de: wissen, gswZh: "wüsse (ich weiss, du weisch, er weiss, mir wüssed)", en: to know (a fact), pos: verb, tags: [verbs, irregular] }
  - { de: sehen, gswZh: "gseh (ich gseh / gsee, du gsehsch, er gseht, mir gsehnd / gseend)", notes: "Spelled gseh / gsee; graders accept both. Some speakers say ich gsehne.", en: to see, pos: verb, tags: [verbs, irregular] }
  - { de: schauen, gswZh: luege, en: "to look, to watch", pos: verb, notes: "Lueg emal! = Schau mal! TV luege = fernsehen.", tags: [verbs] }
  - { de: hören, gswZh: ghöre, en: to hear, pos: verb, tags: [verbs] }
  - { de: zuhören, gswZh: lose, en: to listen, pos: verb, notes: "Los emal! = Hör mal! Not related to Standard los.", tags: [verbs, false-friend] }
  - { de: essen, gswZh: ässe, en: to eat, pos: verb, notes: "Participle: ggässe.", tags: [verbs, food] }
  - { de: trinken, gswZh: trinke, en: to drink, pos: verb, notes: "Participle: trunke.", tags: [verbs, food] }
  - { de: arbeiten, gswZh: schaffe / schaffe gaa, en: to work, pos: verb, notes: "Arbeite is understood but schaffe is the everyday word. Colloquial: büeze.", tags: [verbs, work] }
  - { de: wohnen, gswZh: wohne, en: to live (reside), pos: verb, tags: [verbs] }
  - { de: reden / sprechen, gswZh: rede, en: "to speak, to talk", pos: verb, notes: "Spräche is rare in Zurich. Basel and eastern Switzerland also say schwätze.", tags: [verbs] }
  - { de: einkaufen, gswZh: poschte / iichaufe, gswBe: ychoufe / poschte, en: to go (grocery) shopping, pos: verb, notes: "Ich gang go poschte. berndeutsch.ch notes that poschte came to Bern from eastern Switzerland; Bernese also says ychoufe or kömerle.", tags: [verbs, shopping] }
  - { de: fahren, gswZh: fahre, en: to drive; to ride, pos: verb, tags: [verbs, transport] }
  - { de: zu Fuß gehen, gswZh: laufe, en: to walk, pos: verb, notes: "Swiss laufe = walk (Standard: laufen = run in Germany). To run = springe / renne / seckle.", tags: [verbs, false-friend] }
  - { de: rennen, gswZh: springe / renne / seckle, en: to run, pos: verb, notes: "Swiss springe = run, not jump. To jump = gumpe.", tags: [verbs, false-friend] }
  - { de: springen, gswZh: gumpe, en: to jump, pos: verb, tags: [verbs, false-friend] }
  - { de: warten, gswZh: warte, en: to wait, pos: verb, tags: [verbs] }
  - { de: schlafen, gswZh: schlafe, en: to sleep, pos: verb, tags: [verbs] }
  - { de: kochen, gswZh: choche, en: to cook, pos: verb, tags: [verbs, food] }
  - { de: brauchen, gswZh: bruuche, en: to need, pos: verb, tags: [verbs] }
  - { de: schreiben, gswZh: schriibe, en: to write, pos: verb, notes: "Long ii where Standard has ei (schreiben, Zeit, Wein → schriibe, Ziit, Wii).", tags: [verbs] }
  - { de: anrufen, gswZh: aalüüte / aalüte, en: to phone, pos: verb, notes: "Ich lüüt dir aa = Ich rufe dich an.", tags: [verbs, phone] }
  - { de: sich setzen, gswZh: absitze / abhocke, en: to sit down, pos: verb, notes: "Hock ab! (informal) = Setz dich!", tags: [verbs] }
  - { de: nach Hause gehen, gswZh: hei gaa, gswBe: hei ga, en: to go home, pos: phrase, tags: [verbs] }
  - { de: gefallen, gswZh: gfalle, en: to please (be liked), pos: verb, notes: "Das gfallt mer = Das gefällt mir.", tags: [verbs] }
  - { de: parken, gswZh: parkiere, chStd: parkieren, en: to park, pos: verb, tags: [verbs, transport, helvetism] }
  - { de: grillen, gswZh: grilliere / brätle, chStd: grillieren, en: to barbecue, pos: verb, notes: "brätle = grilling outdoors over a fire, a Swiss summer ritual.", tags: [verbs, food, helvetism] }

  # ----- question words, adverbs, particles -----
  - { de: kein / keine, gswZh: kei (neuter also keis), gswBe: ke / kei (neuter kes), en: "no, not any", pos: pron, notes: "Usually one form for all genders: kei Rahm, kei Milch, kei Eier. kei ... meh = kein ... mehr.", tags: [basics, negation] }
  - { de: es gibt, gswZh: es git / es hät, gswBe: es git / es het, en: "there is, there are", pos: phrase, notes: "es hät is typical for 'there is/are (here)': Es hät no Platz.", tags: [basics, grammar] }
  - { de: nicht, gswZh: nöd / nid, gswBe: nid, en: not, pos: adv, notes: "nöd is typical Zurich; nid is Bernese and also heard in Zurich.", tags: [basics] }
  - { de: ja, gswZh: ja / jo, en: "yes", pos: other, tags: [basics] }
  - { de: nein, gswZh: nei, en: "no", pos: other, tags: [basics] }
  - { de: doch, gswZh: moll / momoll, en: yes (contradicting a negative), pos: other, notes: "Du chunnsch nöd? – Moll! (Doch!)", tags: [basics] }
  - { de: auch, gswZh: au, en: "also, too", pos: adv, tags: [basics] }
  - { de: noch, gswZh: no, en: still; yet; else, pos: adv, notes: "Suscht no öppis? = Sonst noch etwas?", tags: [basics] }
  - { de: schon, gswZh: scho, en: already, pos: adv, tags: [basics] }
  - { de: jetzt, gswZh: jetzt / jetz / etz, en: now, pos: adv, tags: [time] }
  - { de: gleich / sofort, gswZh: grad, en: right away; just, pos: adv, notes: "Ich chume grad = Ich komme gleich.", tags: [time] }
  - { de: heute, gswZh: hüt, en: today, pos: adv, tags: [time] }
  - { de: morgen, gswZh: morn, en: tomorrow, pos: adv, notes: "Bis morn! But am Morge = in the morning.", tags: [time] }
  - { de: übermorgen, gswZh: übermorn, en: the day after tomorrow, pos: adv, tags: [time] }
  - { de: gestern, gswZh: geschter, en: yesterday, pos: adv, tags: [time] }
  - { de: später, gswZh: spöter, en: later, pos: adv, tags: [time] }
  - { de: immer, gswZh: immer, en: always, pos: adv, tags: [time] }
  - { de: hier, gswZh: da, gswBe: hie / da, en: here, pos: adv, tags: [place] }
  - { de: dort, gswZh: det, en: there, pos: adv, tags: [place] }
  - { de: oben, gswZh: obe, en: "up, upstairs", pos: adv, tags: [place] }
  - { de: unten, gswZh: une, en: "down, downstairs", pos: adv, tags: [place] }
  - { de: drinnen, gswZh: dinne, en: inside, pos: adv, tags: [place] }
  - { de: draußen, gswZh: dusse, en: outside, pos: adv, tags: [place] }
  - { de: hinauf / herauf, gswZh: ufe / uufe, en: up (direction), pos: adv, tags: [place] }
  - { de: hinunter / herunter, gswZh: abe, en: down (direction), pos: adv, tags: [place] }
  - { de: nach Hause, gswZh: hei, en: home (direction), pos: adv, tags: [place] }
  - { de: wo, gswZh: wo, en: where, pos: adv, tags: [questions] }
  - { de: woher, gswZh: vo wo, en: where from, pos: adv, tags: [questions] }
  - { de: wohin, gswZh: wo ane / wohäre, en: where to, pos: adv, tags: [questions] }
  - { de: warum, gswZh: wieso / werum, en: why, pos: adv, tags: [questions] }
  - { de: wann, gswZh: wänn, en: when, pos: adv, tags: [questions] }
  - { de: wie viel, gswZh: wie vill, gswBe: wie viu, en: how much, pos: adv, tags: [questions] }
  - { de: viel, gswZh: vill, gswBe: viu, en: "much, a lot", pos: adv, notes: "Bernese turns l before a consonant or at the end of a word into u: viu, aut, chaut, Miuch.", tags: [quantity] }
  - { de: sehr, gswZh: sehr / mega / huere, en: very, pos: adv, notes: "mega is very common in informal speech (mega guet). huere is vulgar – recognise it, don't use it.", tags: [quantity, register] }
  - { de: ein bisschen, gswZh: es bitzeli / echli / chli, en: a little, pos: adv, tags: [quantity] }
  - { de: ungefähr, gswZh: öppe, en: "about, approximately", pos: adv, notes: "öppe zäh Minute = ungefähr zehn Minuten.", tags: [quantity] }
  - { de: gern, gswZh: gärn, en: gladly, pos: adv, notes: "Gärn gscheh = You're welcome.", tags: [basics] }
  - { de: vielleicht, gswZh: villicht, gswBe: villech / vilech, en: maybe, pos: adv, tags: [basics] }
  - { de: zusammen, gswZh: zäme, en: together, pos: adv, tags: [basics] }
  - { de: so, gswZh: eso / so, en: "so, like this", pos: adv, tags: [basics] }
  - { de: "nicht wahr? / oder?", gswZh: "oder? / gäll? / gell?", en: "isn't it?, right?", pos: other, notes: "The Swiss tag question 'oder?' is everywhere: Schön, oder?", tags: [basics] }
  - { de: in (Ortsname), gswZh: z, en: in / to (a town), pos: prep, notes: "z Züri, z Bärn = in/nach Zürich, Bern.", tags: [place, grammar] }
  - { de: aus, gswZh: us, en: "from, out of", pos: prep, tags: [place] }

  # ----- people and family -----
  - { de: Mann, gswZh: Maa, gswBe: Ma, en: man; husband, pos: noun, tags: [people] }
  - { de: Kind, gswZh: Chind, gswBe: Chind / Ching, en: child, pos: noun, notes: "Plural: Chind (unchanged), d Chind. Chinde is heard in some other dialects.", tags: [people, family] }
  - { de: Junge, gswZh: Bueb, gswBe: Bueb / Giel, chStd: Knabe (official) / Bub, en: boy, pos: noun, tags: [people, family] }
  - { de: Mädchen, gswZh: Meitli, gswBe: Meitschi, en: girl, pos: noun, tags: [people, family] }
  - { de: Mutter / Mama, gswZh: Muetter / Mami, en: mother / mum, pos: noun, notes: "s Mami is neuter.", tags: [family] }
  - { de: Vater / Papa, gswZh: Vater / Vatter / Papi, gswBe: Vatter / Ätti / Papi, en: father / dad, pos: noun, tags: [family] }
  - { de: Bruder, gswZh: Brueder, en: brother, pos: noun, notes: "Plural: Brüeder (the umlaut stays, as in Standard Brüder).", tags: [family] }
  - { de: Schwester, gswZh: Schwöschter / Schwester, en: sister, pos: noun, tags: [family] }
  - { de: Geschwister, gswZh: Gschwüschterti / Gschwüschter, en: siblings, pos: noun, tags: [family] }
  - { de: Großmutter / Oma, gswZh: Grossmuetter / Grosi / Grossmami, chStd: Grossmutter, en: grandmother, pos: noun, tags: [family] }
  - { de: Pate / Patin, gswZh: Götti / Gotte, chStd: Götti / Gotte, en: godfather / godmother, pos: noun, tags: [family, helvetism] }
  - { de: Freund (Kumpel), gswZh: Kolleg / Kollegin / Fründ, en: "friend, mate", pos: noun, notes: "Kolleg in Swiss German means friend, not only colleague.", tags: [people, false-friend] }
  - { de: Leute, gswZh: Lüüt, en: people, pos: noun, tags: [people] }

  # ----- home -----
  - { de: Haus, gswZh: Huus, en: house, pos: noun, notes: "Long uu where Standard has au: Haus, Maus, Bauch → Huus, Muus, Buuch.", tags: [home] }
  - { de: Wohnung, gswZh: Wohnig, en: "flat, apartment", pos: noun, notes: "-ung → -ig: Wohnig, Rächnig, Zitig (Zeitung).", tags: [home] }
  - { de: Küche, gswZh: Chuchi, en: kitchen, pos: noun, tags: [home] }
  - { de: Wohnzimmer, gswZh: Stube, en: living room, pos: noun, tags: [home] }
  - { de: Kühlschrank, gswZh: Chüelschrank, en: fridge, pos: noun, tags: [home] }
  - { de: Schrank, gswZh: Chaschte, en: "cupboard, wardrobe", pos: noun, tags: [home] }
  - { de: Treppe, gswZh: Stäge, en: stairs, pos: noun, tags: [home] }
  - { de: Müll, gswZh: Güsel, gswBe: Ghüder, en: "rubbish, trash", pos: noun, notes: "Güselsack = bin bag (official 'Züri-Sack' in Zurich).", tags: [home] }
  - { de: Waschküche, gswZh: Waschchuchi, gswBe: Wöschchuchi, en: "(shared) laundry room", pos: noun, notes: "Shared laundry room in the basement, used by turns (Wäschplan).", tags: [home, swiss-life] }
  - { de: Keller, gswZh: Chäller, en: "basement, cellar", pos: noun, tags: [home] }
  - { de: Dachboden, gswZh: Estrich, chStd: Estrich, en: attic, pos: noun, notes: "In Germany Estrich means floor screed.", tags: [home, helvetism] }
  - { de: Aufzug, gswZh: Lift, chStd: Lift, en: "lift, elevator", pos: noun, tags: [home, helvetism] }
  - { de: Fenster, gswZh: Feischter, en: window, pos: noun, tags: [home] }
  - { de: Miete, gswZh: Miete / Ziis, chStd: Mietzins, en: rent, pos: noun, tags: [home, renting, helvetism] }
  - { de: Mülleimer, gswZh: Güselchübel, gswBe: Ghüderchübu, en: bin, pos: noun, tags: [home] }
  - { de: Tüte, gswZh: Sack / Säckli, en: (plastic/paper) bag, pos: noun, tags: [home, shopping] }

  # ----- food and drink -----
  - { de: Frühstück, gswZh: Zmorge, chStd: Morgenessen, en: breakfast, pos: noun, gswBe: Zmorge (ds Zmorge), notes: "Zurich mostly de Zmorge, like de Zmittag (Duden: masculine or neuter); Bernese ds Zmorge (berndeutsch.ch: n.). s Znacht is neuter.", tags: [food, meals] }
  - { de: Mittagessen, gswZh: Zmittag, chStd: Mittagessen, en: lunch, pos: noun, tags: [food, meals] }
  - { de: Abendessen, gswZh: Znacht, gswBe: Znacht / Zaabe, chStd: Nachtessen, en: "dinner, supper", pos: noun, notes: "s Znacht (neuter).", tags: [food, meals] }
  - { de: Pausensnack (vormittags), gswZh: Znüni, chStd: Znüni, en: mid-morning snack, pos: noun, notes: "Literally 'at nine'. Its afternoon partner is the Zvieri ('at four'). Both are heard as de and s (de Znüni / s Znüni).", tags: [food, meals, helvetism] }
  - { de: Nachmittagssnack, gswZh: Zvieri, chStd: Zvieri, en: afternoon snack, pos: noun, tags: [food, meals, helvetism] }
  - { de: Kaffee, gswZh: Kafi, en: coffee, pos: noun, notes: "de Kafi / en Kafi (the drink, masculine); s Kafi / es Kafi (neuter) is a café.", tags: [food, drinks] }
  - { de: Milchkaffee, gswZh: Schale, chStd: Schale, en: milky coffee, pos: noun, tags: [food, drinks, helvetism] }
  - { de: Croissant, gswZh: Gipfeli, chStd: Gipfeli, en: croissant, pos: noun, tags: [food, helvetism] }
  - { de: Brötchen, gswZh: Brötli / Weggli / Bürli, chStd: Brötchen / Weggli / Bürli, en: bread roll, pos: noun, notes: "Weggli = soft white roll; Bürli = crusty roll.", tags: [food, helvetism] }
  - { de: Kuchen, gswZh: Chueche, en: cake; tart, pos: noun, tags: [food] }
  - { de: Butter, gswZh: Anke / Butter, gswBe: Anke, en: butter, pos: noun, tags: [food] }
  - { de: Käse, gswZh: Chäs, en: cheese, pos: noun, notes: "räss = sharp, strong (of cheese).", tags: [food] }
  - { de: Zwiebel, gswZh: Zwieble / Bölle, gswBe: Zibele, en: onion, pos: noun, tags: [food] }
