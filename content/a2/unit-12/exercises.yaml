  explanation: >-
    det = dort, vill Lüüt = viele Leute, säged = sagen, nöd = nicht. Basel German keeps the k at the start of Kind,
    where Zurich has ch (Chind).

- id: a2-u12-ch-transform-erscht-mal
  type: transform
  skill: reading
  variety: gsw-zh
  grammar: [wenn-als, review-a2-perfekt]
  prompt: What does Reto say? Write it in Standard German.
  from: gsw-zh
  to: de
  source: Wo n ich s erscht Mal z Bärn gsii bin, han ich fascht nüt verstande.
  answers:
    - "Als ich das erste Mal in Bern war, habe ich fast nichts verstanden."
    - "Als ich zum ersten Mal in Bern war, habe ich fast nichts verstanden."
    - "Als ich das erste Mal in Bern gewesen bin, habe ich fast nichts verstanden."
  explanation: >-
    wo n ich = als ich (one time in the past; unit 9: wo or wänn), s erscht Mal = das erste Mal, z Bärn = in Bern,
    gsii bin = war, fascht nüt = fast nichts, verstande = verstanden.

- id: a2-u12-ch-mcq-zurich-word
  type: mcq
  skill: vocabulary
  variety: gsw-zh
  prompt: Which of these is the Zurich German way of saying "Kind" (child)?
  options: ["Chind", "Kind", "Ching", "Kint"]
  answer: 0
  rationales:
    - "Correct. Zurich turns k at the start of a word into ch: Chind, Chuchi, Chäs."
    - "That's Standard German – and Basel German."
    - "Ching is heard in Bern (lexicon: Chind / Ching)."
    - "Not a Swiss form."
  explanation: >-
    Most Swiss dialects say Chind (also Chuchi = Küche, Chäs = Käse); Basel keeps Kind; Bernese also has Ching (nd →
    ng).

- id: a2-u12-ch-gap-gsii
  type: gap
  skill: grammar
  variety: gsw-zh
  grammar: [review-a2-perfekt, praeteritum-sein-haben]
  prompt: "Guided production: write the Zurich participles of sein (gewesen) and fahren (gefahren)."
  text: Mir sind geschter z Bärn ___. Mir sind mit em Zug ___.
  answers:
    - ["gsii", "gsi", "gsy"]
    - ["gfahre", "gfaare"]
  explanation: >-
    gewesen → gsii (A2.1), gefahren → gfahre (A2.2). Both take sind: movement and sein. Swiss German has no war, so
    gsii is the only way to say "was".

- id: a2-u12-ch-transform-de-gsw
  type: transform
  skill: vocabulary
  variety: gsw-zh
  grammar: [travel-prepositions]
  prompt: "Recognition: how do you say this in Zurich German? (Common spellings are accepted.)"
  from: de
  to: gsw-zh
  source: Wir fahren nach Bern.
  answers:
    - "Mir fahred uf Bärn."
    - "Mir fahred nach Bärn."
    - "Mir fahred uf Bern."
    - "Mir fahred nach Bern."
  explanation: >-
    wir → mir, fahren → fahred (plural -ed), Bern → Bärn. For a town Zurich German often uses uf (uf Bärn, uf
    Luzern); nach is heard too.

- id: a2-u12-roleplay-reto
  type: roleplay
  skill: listening
  variety: gsw-zh
  grammar: [planning-together, review-a2-perfekt]
  tutor: reto
  prompt: "Listening roleplay with Reto: planning a trip to Bern."
  scenario: >-
    Reto suggests a day trip to Bern in Zurich German. He tells you when the train leaves, who you will meet and how
    people greet in Bern. You answer in Standard German, agree, and ask about the details.
  goals:
    - Understand the time and the platform (am nüüni, Gleis sächzäh).
    - Understand Reto's tips about Bern (Grüessech, Tschou, d Aare).
    - Agree, and ask one question about the plan (Wann …? Wo treffen wir uns?).
  model: |
    Reto: Hoi! Wämmer am Samschtig uf Bärn fahre? Zu de Mueter vo de Sandra.
    Du: Gern! Wann fährt der Zug?
    Reto: Am nüüni ab Gleis sächzäh. Mir träffed eus am Viertel vor nüüni bim Gleis.
    Du: Gut. Was muss ich in Bern sagen?
    Reto: Säg eifach Grüessech – und am Schluss Tschou.
    Du: Grüessech! Und was machen wir dort?
    Reto: Mir gönd i d Altstadt und dänn a d Aare.
  explanation: >-
    Decoding: Wämmer … fahre? = Wollen wir … fahren?, mir träffed eus = wir treffen uns, am Viertel vor nüüni = um
    Viertel vor neun, säg eifach = sag einfach, am Schluss = am Ende.

# ---------- Bernese (gsw-be, recognition) ----------
- id: a2-u12-ch-be-mcq-aacho
  type: mcq
  skill: listening
  variety: gsw-be
  prompt: Listen to Sandra's mother. What does she ask her guests?
  transcript: |-
    Mami: Grüessech mitenand! Syt dir guet aacho?
  options: ["Whether they would like coffee", "Whether they arrived safely", "Where they come from", "Whether they took the train"]
  answer: 1
  explanation: >-
    Grüessech mitenand = Guten Tag zusammen, Syt dir … aacho? = Seid ihr … angekommen? (berndeutsch.ch: dir syt;
    aacho = ankommen).

- id: a2-u12-ch-be-transform
  type: transform
  skill: reading
  variety: gsw-be
  grammar: [travel-prepositions]
  prompt: What does Sandra's mother say? Write it in Standard German.
  from: gsw-be
  to: de
  source: Nachär göh mir zäme a d Aare.
  answers: ["Nachher gehen wir zusammen an die Aare.", "Danach gehen wir zusammen an die Aare.", "Später gehen wir zusammen an die Aare."]
  explanation: >-
    nachär = nachher, göh mir = gehen wir (Zurich gömmer), zäme = zusammen, a d Aare = an die Aare (river → an +
    accusative for where to).

- id: a2-u12-ch-be-match
  type: match
  skill: vocabulary
  variety: gsw-be
  prompt: Match the Bernese words with Standard German.
  pairs:
    - ["Grüessech", "Guten Tag (polite)"]
