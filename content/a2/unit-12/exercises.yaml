# A2 unit 12 – Unterwegs in der Schweiz (A2 review)

# ---------- vocabulary ----------
- id: a2-u12-match-country
  type: match
  skill: vocabulary
  variety: ch-std
  prompt: Match the words with English.
  pairs:
    - ["der Kanton", "canton"]
    - ["die Grenze", "border"]
    - ["die Altstadt", "old town"]
    - ["der Brunnen", "fountain"]
    - ["der Gletscher", "glacier"]
    - ["zweisprachig", "bilingual"]
  explanation: >-
    Switzerland has 26 Kantone. die Altstadt = alt + Stadt (feminine like Stadt). zweisprachig = zwei + Sprache +
    -ig: Biel / Bienne and Fribourg / Freiburg are bilingual towns.

- id: a2-u12-match-train
  type: match
  skill: vocabulary
  variety: ch-std
  prompt: Match the travel words with English.
  pairs:
    - ["die Tageskarte", "day pass"]
    - ["der Anschluss", "connection"]
    - ["die Abfahrt", "departure"]
    - ["pünktlich", "on time"]
    - ["die Schifffahrt", "boat trip"]
    - ["das Ausflugsziel", "day-trip destination"]
  explanation: >-
    die Schifffahrt has three f: Schiff + Fahrt. der Anschluss is the connecting train: Wir haben den Anschluss
    verpasst = we missed the connection.

# ---------- grammar: where to? ----------
- id: a2-u12-gap-travel-prepositions
  type: gap
  skill: grammar
  variety: ch-std
  grammar: [travel-prepositions, two-way-prepositions]
  prompt: "Fill in nach, in die, an den or auf den."
  text: Am Montag fahren wir ___ Bern. Am Dienstag gehen wir ___ Altstadt. Am Mittwoch fahren wir ___ Genfersee und am Donnerstag ___ Pilatus.
  answers: [["nach"], ["in die"], ["an den"], ["auf den"]]
  explanation: >-
    Towns without an article → nach. Into a part of town → in + accusative (die Altstadt). Water → an + accusative
    (der See → an den See). Mountains → auf + accusative (der Pilatus → auf den Pilatus).

- id: a2-u12-mcq-in-die-schweiz
  type: mcq
  skill: grammar
  variety: de
  grammar: [travel-prepositions]
  prompt: Choose the right preposition.
  question: Toms Eltern fliegen im Mai ___ Schweiz.
  options: ["nach der", "zu der", "in die", "in der"]
  answer: 2
  rationales:
    - "nach is for countries without an article (nach Italien). die Schweiz has an article."
    - "zu is for people and specific places."
    - "Correct. Countries with an article: in + accusative (Wohin?)."
    - "in der Schweiz = in Switzerland (Wo? – dative), not where to."
  explanation: >-
    die Schweiz, die Türkei, die USA always have an article: Wohin? → in die Schweiz, Wo? → in der Schweiz. Countries
    without an article take nach: nach Deutschland, nach England.

- id: a2-u12-mcq-wo-in-bern
  type: mcq
  skill: grammar
  variety: de
  grammar: [travel-prepositions]
  prompt: Choose the right preposition.
  question: Wo seid ihr am Samstag? – Wir sind ___ Bern, ___ Sandras Mutter.
  options: ["in … bei", "nach … zu", "in … zu", "nach … bei"]
  answer: 0
  rationales:
    - "Correct. Location: in Bern; at someone's place: bei."
    - "nach and zu are for where to, not where."
    - "zu is for where to: zu Sandras Mutter fahren."
    - "nach is for where to."
  explanation: >-
    Wo? → in Bern, bei Sandras Mutter. Wohin? → nach Bern, zu Sandras Mutter. Learn the pairs: nach / in, zu / bei,
    nach Hause / zu Hause.

- id: a2-u12-match-wo-wohin
  type: match
  skill: grammar
  variety: de
  grammar: [travel-prepositions, two-way-prepositions]
  prompt: Match "where to?" with "where?".
  pairs:
    - ["an den See", "am See"]
    - ["auf den Berg", "auf dem Berg"]
    - ["in die Altstadt", "in der Altstadt"]
    - ["nach Luzern", "in Luzern"]
    - ["nach Hause", "zu Hause"]
  explanation: >-
    Two-way prepositions: Wohin? = accusative (den, die), Wo? = dative (dem, der; an dem → am). Towns and home have
    their own pairs: nach Luzern / in Luzern, nach Hause / zu Hause.

- id: a2-u12-transform-wohin
  type: transform
  skill: grammar
  variety: ch-std
  grammar: [travel-prepositions, two-way-prepositions]
  prompt: "Answer the question Wohin? Change the location into a direction."
  from: ch-std
  to: ch-std
  source: Wir sind am Genfersee.
  answers: ["Wir fahren an den Genfersee.", "Wir gehen an den Genfersee."]
  explanation: >-
    am (an dem) Genfersee = Wo? (dative). Wohin? → an den Genfersee (accusative). Water always takes an.

# ---------- grammar: Perfekt review ----------
- id: a2-u12-gap-perfekt-trip
  type: gap
  skill: grammar
  variety: ch-std
  grammar: [review-a2-perfekt, perfekt-sein, perfekt-haben]
  prompt: "Fill in haben or sein in the right form (habe, haben, bin, sind, ist)."
  text: Wir ___ früh aufgestanden. Dann ___ wir mit dem Schiff nach Flüelen gefahren. Dort ___ wir ein Picknick gemacht. Mein Vater ___ sogar in der Aare geschwommen.
  answers: [["sind"], ["sind"], ["haben"], ["ist"]]
  explanation: >-
    aufstehen, fahren, schwimmen (movement or change) take sein; ein Picknick machen takes haben. sogar = even.

- id: a2-u12-mcq-participle
  type: mcq
  skill: grammar
  variety: de
  grammar: [review-a2-perfekt, participles-regular, participles-separable]
  prompt: Choose the right participle.
  question: Wir haben die Kapellbrücke ___.
  options: ["gebesichtigt", "besichtigen", "besichtigt", "besichtiget"]
  answer: 2
  rationales:
    - "be- verbs take no ge-."
    - "That's the infinitive; the Perfekt needs the participle."
    - "Correct. Inseparable be-: no ge-, ending -t."
    - "The -et ending is only after t or d (gearbeitet)."
  explanation: >-
    Verbs with be-, ver-, er- and -ieren take no ge-: besichtigt, besucht, verpasst, fotografiert. Regular ending -t.

- id: a2-u12-transform-perfekt
  type: transform
  skill: grammar
  variety: de
  grammar: [review-a2-perfekt, perfekt-sein, participles-separable]
  prompt: "Tell it in the past (Perfekt)."
  from: de
  to: de
  source: Der Zug kommt pünktlich in Bern an.
  answers: ["Der Zug ist pünktlich in Bern angekommen."]
  explanation: >-
    ankommen = movement → sein; separable → an-ge-kommen. ist in position 2, angekommen at the end.

- id: a2-u12-translate-trip
  type: translate
  skill: writing
  variety: de
  grammar: [review-a2-perfekt, praeteritum-sein-haben, travel-prepositions]
  prompt: Translate into German.
  source: Last summer we went to Lucerne. The weather was great.
  answers:
    - "Letzten Sommer sind wir nach Luzern gefahren. Das Wetter war super."
    - "Letzten Sommer sind wir nach Luzern gefahren. Das Wetter war toll."
    - "Letzten Sommer sind wir nach Luzern gefahren. Das Wetter war sehr schön."
    - "Wir sind letzten Sommer nach Luzern gefahren. Das Wetter war super."
    - "Letzten Sommer sind wir nach Luzern gereist. Das Wetter war super."
  explanation: >-
    went (by train / car) = sind … gefahren (sein: movement); town → nach Luzern. For sein, use war. letzten Sommer
    is accusative of time, no preposition.

# ---------- grammar: subordinate clauses review ----------
- id: a2-u12-gap-conjunctions
  type: gap
  skill: grammar
  variety: ch-std
  grammar: [review-a2-subordinate, wenn-als, indirect-questions]
  prompt: "Fill in weil, dass, wenn, als or ob."
  text: Wir fahren nach Bern, ___ die Altstadt so schön ist. ___ es warm ist, schwimmen wir in der Aare. Ich glaube nicht, ___ mein Vater mitkommt. ___ wir in Luzern waren, hat es geregnet. Weisst du, ___ das Schiff heute fährt?
  answers: [["weil"], ["Wenn", "wenn"], ["dass"], ["Als", "als"], ["ob"]]
  explanation: >-
    weil = reason, wenn = condition, dass = what I think, als = one time in the past, ob = yes/no indirect question.
    In every clause the verb is last.

- id: a2-u12-mcq-weil-order
  type: mcq
  skill: grammar
  variety: de
  grammar: [review-a2-subordinate, review-a2-perfekt]
  prompt: Which sentence is correct?
  options:
    - "Wir kommen später, weil wir haben den Zug verpasst."
    - "Wir kommen später, weil wir den Zug haben verpasst."
    - "Wir kommen später, weil haben wir den Zug verpasst."
    - "Wir kommen später, weil wir den Zug verpasst haben."
  answer: 3
  rationales:
    - "After weil the conjugated verb goes to the end."
    - "haben must come after the participle, at the very end."
    - "weil doesn't take verb-second order."
    - "Correct. Perfekt in a weil-clause: participle, then haben at the end."
  explanation: >-
    In a subordinate clause the auxiliary is the very last word: …, weil wir den Zug verpasst haben. verpassen = to
    miss (be-, ver- verbs: no ge-).

- id: a2-u12-order-dass
  type: order
  skill: grammar
  variety: ch-std
  grammar: [review-a2-subordinate]
  prompt: Put the words in order.
  tokens: ["Ich", "finde", "dass", "man", "Bern", "unbedingt", "besuchen", "muss"]
  answers: ["Ich finde, dass man Bern unbedingt besuchen muss."]
  explanation: >-
    In the dass-clause the modal verb muss goes to the very end, after the infinitive besuchen. unbedingt =
    absolutely.

- id: a2-u12-transform-weil
  type: transform
  skill: grammar
  variety: ch-std
  grammar: [review-a2-subordinate, connectors-deshalb-trotzdem]
  prompt: "Join the sentences with weil."
  from: ch-std
  to: ch-std
  source: Wir kaufen eine Tageskarte. Wir haben kein Halbtax.
  answers: ["Wir kaufen eine Tageskarte, weil wir kein Halbtax haben.", "Weil wir kein Halbtax haben, kaufen wir eine Tageskarte."]
  explanation: >-
    weil + reason, verb at the end: weil wir kein Halbtax haben. With deshalb it would be: Wir haben kein Halbtax,
    deshalb kaufen wir eine Tageskarte.

- id: a2-u12-gap-wo-dative
  type: gap
  skill: grammar
  variety: ch-std
  grammar: [travel-prepositions, two-way-prepositions, dative-review]
  prompt: "Where are they? Fill in am, an der, auf dem or in der."
  text: Toms Eltern sitzen ___ Pilatus im Restaurant. Am Nachmittag spazieren sie ___ Aare. Das Hotel ist ___ Genfersee. Am Abend essen sie ___ Altstadt.
  answers: [["auf dem"], ["an der"], ["am"], ["in der"]]
  explanation: >-
    Wo? → dative: auf dem Pilatus (m), an der Aare (f), am See (an dem, m), in der Altstadt (f). Compare Wohin?: auf
    den Pilatus, an die Aare, an den See, in die Altstadt.

- id: a2-u12-mcq-als-wenn-review
  type: mcq
  skill: grammar
  variety: de
  grammar: [review-a2-subordinate, wenn-als]
  prompt: Choose the right word.
  question: ___ ich letztes Jahr in Lausanne war, habe ich nur Französisch gehört.
  options: ["Wenn", "Wann", "Ob", "Als"]
  answer: 3
  rationales:
    - "wenn is for repeated events or the present; this was one trip."
    - "wann asks a question."
    - "ob means whether."
    - "Correct. One time in the past (letztes Jahr): als."
  explanation: >-
    als for one event in the past, with the verb (war) at the end of the clause; then the main clause starts with
    habe. Review of unit 9.

# ---------- grammar: planning together ----------
- id: a2-u12-mcq-wie-waere
  type: mcq
  skill: grammar
  variety: de
  grammar: [planning-together, dative-articles]
  prompt: Choose the right form.
  question: Wie wäre es mit ___ Schifffahrt auf dem Vierwaldstättersee?
  options: ["eine", "einer", "einen", "ein"]
  answer: 1
  rationales:
    - "eine is nominative or accusative; mit needs the dative."
    - "Correct. mit + dative, feminine: einer Schifffahrt."
    - "einen is masculine accusative."
    - "ein is nominative masculine or neuter."
  explanation: >-
    Wie wäre es mit …? = How about …? mit always takes the dative: mit einer Schifffahrt (f), mit einem Ausflug (m),
    mit einem Picknick (n).

- id: a2-u12-match-planning
  type: match
  skill: speaking
  variety: de
  grammar: [planning-together]
  prompt: Match the planning phrases with their function.
  pairs:
    - ["Wollen wir nach Luzern fahren?", "make a suggestion"]
    - ["Einverstanden!", "agree"]
    - ["Da kann ich leider nicht.", "say no politely"]
    - ["Wann passt es dir?", "ask about the time"]
    - ["Treffen wir uns um neun am Bahnhof.", "fix the details"]
  explanation: >-
    These four moves – suggest, agree or say no, ask about time, fix the details – are exactly what part 3 of the
    A2 speaking exam asks for.

- id: a2-u12-order-planning
  type: order
  skill: grammar
  variety: de
  grammar: [planning-together]
  prompt: Put the words in order to make a suggestion.
  tokens: ["Wollen", "wir", "am", "Samstag", "nach", "Bern", "fahren"]
  answers: ["Wollen wir am Samstag nach Bern fahren?"]
  explanation: >-
    Wollen wir …? = Shall we …? Verb first (a yes/no question), time before place, infinitive at the end.

- id: a2-u12-translate-meet
  type: translate
  skill: writing
  variety: de
  grammar: [planning-together]
  prompt: Translate into German.
  source: Shall we meet at nine at the station?
  answers:
    - "Treffen wir uns um neun am Bahnhof?"
    - "Treffen wir uns um neun Uhr am Bahnhof?"
    - "Wollen wir uns um neun am Bahnhof treffen?"
    - "Wollen wir uns um neun Uhr am Bahnhof treffen?"
    - "Sollen wir uns um neun am Bahnhof treffen?"
  explanation: >-
    sich treffen is reflexive (unit 7): Treffen wir uns …? or Wollen wir uns … treffen? Time (um neun) before place
    (am Bahnhof).

