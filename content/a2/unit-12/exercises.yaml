# ---------- speaking ----------
- id: a2-u12-speak-frame
  type: speak
  skill: speaking
  variety: ch-std
  grammar: [planning-together, travel-prepositions]
  prompt: "Read aloud, then plan your own day trip."
  target: Wollen wir am Samstag nach Luzern fahren? Wir können eine Schifffahrt machen und am Abend in der Altstadt essen.
  explanation: >-
    Frame: Wollen wir am … nach … fahren? Wir können … und … Change the day, the place and the activities.

- id: a2-u12-speak-shadow-tom
  type: speak
  skill: speaking
  variety: de
  grammar: [planning-together]
  prompt: "Shadowing: speak along with Tom's line from the intro dialogue, then say it alone."
  target: Super, danke! Wollen wir nächste Woche zusammen den Fahrplan anschauen?
  explanation: >-
    A friendly suggestion: the voice rises at the end (… ANschauen? ↗). anschauen is stressed on AN-, the separable
    prefix (see the drill Word stress in compounds and verbs).

- id: a2-u12-speak-shadow-nadine
  type: speak
  skill: speaking
  variety: ch-std
  grammar: [review-a2-perfekt, travel-prepositions]
  prompt: "Shadowing: speak along with Nadine, then say it alone."
  target: Wie wäre es mit Luzern? Ich bin letztes Jahr mit dem Schiff von Luzern nach Flüelen gefahren.
  explanation: >-
    Swiss Standard German: the stress in Luzern is on the second syllable (LuZERN), the r is tapped, and the ch in
    nach is the back ach-sound. See the drill The Swiss Standard German accent.

- id: a2-u12-speak-intonation
  type: speak
  skill: speaking
  variety: de
  grammar: [planning-together]
  prompt: "Intonation: agreeing warmly, then fixing a time. Stress the key words."
  target: Gute Idee! Treffen wir uns um neun am Bahnhof.
  explanation: >-
    GUte iDEE! (enthusiastic, falling) – then a calm statement with stress on the facts: um NEUN am BAHNhof ↘. As a
    statement it falls; as a question (Treffen wir uns um neun?) it would rise.

- id: a2-u12-speak-pron-stress
  type: speak
  skill: speaking
  variety: ch-std
  prompt: "Pronunciation: word stress in compounds. Read aloud slowly."
  target: Vierwaldstättersee, Tageskarte, Altstadt, Generalabonnement, Ausflugsziel.
  explanation: >-
    Compounds are stressed on the first part: VIERwaldstättersee, TAgeskarte, ALTstadt, AUSflugsziel. Loanwords keep
    their own stress: GeneralabonneMENT. See the drill Word stress in compounds and verbs.

# ---------- roleplay and writing ----------
- id: a2-u12-roleplay-lena
  type: roleplay
  skill: speaking
  variety: de
  grammar: [planning-together, travel-prepositions, review-a2-subordinate]
  tutor: lena
  prompt: "Roleplay with Lena: plan a day trip together."
  scenario: >-
    Lena is visiting you in Zurich for a weekend. Plan a day trip together: suggest a destination, react to her
    ideas (agree or say no politely with a reason), and fix the time, the meeting point and who buys the tickets.
  goals:
    - Make at least two suggestions (Wollen wir …? Wie wäre es mit …?).
    - Agree and disagree politely, once with weil.
    - Fix the time and the meeting point (Treffen wir uns um … am …).
    - Say who does what (Ich kaufe die Billette, du bringst …).
  model: |
    Lena: Was machen wir am Samstag?
    Du: Wollen wir nach Luzern fahren? Wir können eine Schifffahrt machen.
    Lena: Hm, ich bin nicht so gern auf dem Schiff. Wie wäre es mit Bern?
    Du: Gute Idee! Ich war noch nie in der Berner Altstadt. Wenn es warm ist, können wir an die Aare gehen.
    Lena: Super. Wann fahren wir?
    Du: Am Samstag kann ich nicht früh, weil ich am Freitag lange arbeite. Treffen wir uns um zehn am Hauptbahnhof?
    Lena: Einverstanden! Und die Billette?
    Du: Ich kaufe zwei Tageskarten online. Bringst du das Picknick mit?
    Lena: Klar!
  explanation: >-
    The four planning moves: suggest (Wollen wir …?), react (Gute Idee! / … kann ich nicht, weil …), fix the time and
    place (Treffen wir uns um … am …?), share the jobs (Ich kaufe …, Bringst du …?).

- id: a2-u12-write-trip
  type: write
  skill: writing
  variety: ch-std
  grammar: [review-a2-perfekt, travel-prepositions, review-a2-subordinate]
  prompt: Write about a trip in Switzerland.
  task: >-
    Write an email (8–10 sentences) to a friend about a trip you made in Switzerland. Where did you go and how? What
    did you see, eat and do? What did you like, and why (weil)? Suggest a trip you could make together (Wollen wir
    …?).
  minWords: 70
  model: >-
    Liebe Mia,


    letztes Wochenende bin ich mit Tom und Anna nach Bern gefahren. Wir haben Sandras Mutter besucht. Sie hat uns
    Kaffee und Zopf gemacht. Am Nachmittag sind wir durch die Altstadt gelaufen und haben die vielen Brunnen gesehen.
    Danach sind wir an die Aare gegangen, aber das Wasser war zu kalt zum Schwimmen. Am Abend haben wir Rösti
    gegessen. Bern hat mir sehr gut gefallen, weil die Stadt klein und gemütlich ist. Wenn du im Sommer kommst, wollen
    wir zusammen nach Luzern fahren? Ich bin sicher, dass dir die Schifffahrt gefällt.


    Liebe Grüsse

    Priya
  checklist:
    - I use the Perfekt with sein for movement (bin gefahren, sind gelaufen) and with haben for the rest.
    - I use war / hatte for sein and haben.
    - I use the right preposition for where to (nach Bern, in die Altstadt, an die Aare).
    - I give a reason with weil and put the verb at the end.
    - I make a suggestion (Wollen wir …?) and open and close the email.
  explanation: >-
    A trip story combines the A2 tools: Perfekt (haben / sein), war / hatte, nach / in / an + place, the dative after
    mit and an (Wo?), weil / wenn / dass with the verb last, and a planning question to finish.

# ---------- Swiss Standard German ----------
- id: a2-u12-chstd-match
  type: match
  skill: vocabulary
  variety: ch-std
  prompt: Match the Swiss travel words with their meaning.
  pairs:
    - ["das Halbtax", "half-price travel card"]
    - ["das GA", "travel pass for the whole network"]
    - ["das Billett", "ticket"]
    - ["der Röstigraben", "language border between German and French Switzerland"]
  explanation: >-
    das Halbtax (half fare for a year), das GA (Generalabonnement – unlimited travel), das Billett (Duden:
    schweizerisch for Fahrkarte), der Röstigraben (Duden: schweizerisch, scherzhaft).

# ---------- Swiss lane (gsw-zh) ----------
- id: a2-u12-ch-mcq-gleis
  type: mcq
  skill: listening
  variety: gsw-zh
  prompt: Listen to Reto. When and from where does the train leave?
  transcript: |-
    Reto: Hoi zäme! Händ ihr s Billett? Mir fahred am nüüni ab Gleis sächzäh.
  options: ["At nine from platform six", "At nine from platform sixteen", "At ten from platform sixteen", "At nineteen hundred from platform six"]
  answer: 1
  rationales:
    - "sächs would be six; sächzäh is sixteen."
    - "Correct. am nüüni = um neun, sächzäh = sechzehn."
    - "zäni would be ten."
    - "nüüni is nine o'clock, not 19.00."
  explanation: >-
    am nüüni = um neun (Zurich: am + hour with -i), Gleis sächzäh = Gleis sechzehn, Mir fahred = Wir fahren.

- id: a2-u12-ch-match-greetings
  type: match
  skill: vocabulary
  variety: gsw-zh
  prompt: Match the greetings with where and how they are used.
  pairs:
    - ["Grüezi", "polite hello in Zurich"]
    - ["Grüessech", "polite hello in Bern"]
    - ["Griezi", "hello as many people say it in Basel"]
    - ["Tschou", "bye in Bern (to people you know)"]
    - ["Hoi", "hi to friends, almost everywhere"]
  explanation: >-
    Grüezi and Grüessech both come from (Gott) grüsse … (berndeutsch.ch: grüessech = Grüss Euch). Basel German
    unrounds ü to i: Griezi, grien (Wikipedia, Baseldeutsch).

- id: a2-u12-ch-mcq-basel
  type: mcq
  skill: listening
  variety: gsw-zh
  prompt: Listen to Sandra. What does she say about Basel?
  transcript: |-
    Sandra: Det säged vill Lüüt Griezi – mit i. Und d Basler säged Kind, nöd Chind.
  options: ["People in Basel say Grüessech.", "People in Basel don't greet strangers.", "In Basel, people say Chind like in Zurich.", "Many say Griezi, and Basel people say Kind instead of Chind."]
  answer: 3
  rationales:
    - "Grüessech is Bernese."
    - "Nothing like that is said."
    - "The other way round: Kind, nöd Chind."
