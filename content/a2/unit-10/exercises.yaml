- id: a2-u10-ch-mcq-hdl
  type: mcq
  skill: vocabulary
  variety: gsw-zh
  prompt: "Sandra ends a message to her mother with \"hdl\". What does it mean?"
  options: ["Love you (ha di gärn / hab dich lieb)", "Until later", "Have a nice day", "Call me back"]
  answer: 0
  rationales:
    - "Correct. hdl = ha di gärn (Swiss) / hab dich lieb (German): to family and close friends."
    - "Until later = bis spöter."
    - "Have a nice day = en schöne Tag."
    - "Call me back = lüüt mer zrugg."
  explanation: >-
    hdl is used in Switzerland and Germany. In Swiss German it is read as ha di gärn (= ich habe dich gern). Use
    it only with people who are close to you.

- id: a2-u10-ch-gap-oeb
  type: gap
  skill: grammar
  variety: gsw-zh
  grammar: [indirect-questions]
  prompt: "Guided production: write the Zurich word for ob (whether)."
  text: Weisch du, ___ de Reto am Samschtig Ziit hät?
  answers: [["öb", "ob"]]
  explanation: >-
    ob → öb in Zurich German (ob is also heard). As in Standard German, the verb hät (hat) goes to the end of the
    öb-clause.

- id: a2-u10-ch-transform-de-gsw
  type: transform
  skill: vocabulary
  variety: gsw-zh
  prompt: "Recognition: how do you say this in Zurich German? (Common spellings are accepted.)"
  from: de
  to: gsw-zh
  source: Keine Ahnung. Bis morgen!
  answers:
    - "Kei Ahnig. Bis morn!"
    - "Kei Ahnig. Bis morge!"
    - "Kä Ahnig. Bis morn!"
    - "Kei Ahnig, bis morn!"
  explanation: >-
    keine → kei, Ahnung → Ahnig, morgen (tomorrow) → morn. Careful: am Morge = in the morning.

- id: a2-u10-roleplay-reto
  type: roleplay
  skill: listening
  variety: gsw-zh
  grammar: [indirect-questions, connectors-deshalb-trotzdem]
  tutor: reto
  prompt: "Listening roleplay with Reto: planning dinner by message."
  scenario: >-
    Reto writes to you in Zurich German about his dinner on Saturday. Read his messages, then answer in Standard
    German: say if you can come, ask what you should bring and whether others are coming.
  goals:
    - Understand Reto's dialect messages (Händ ihr Ziit? Weisch, öb …? drum …).
    - Answer whether you can come and ask a question with ob.
    - Close the chat politely (Bis Samstag! Schönen Abend!).
  model: |
    Reto: Hoi! Am Samschtig mach ich Znacht. Häsch Ziit?
    Du: Hallo Reto! Ja, gern. Um wie viel Uhr?
    Reto: Am sibni. D Nadine chunnt au, drum mach ich es Fondue.
    Du: Super! Weißt du, ob Sandra auch kommt?
    Reto: Ja, aber erscht am achti. Si hät Frühdienscht.
    Du: Soll ich etwas mitbringen?
    Reto: Es Dessert wär mega lieb. Bis Samschtig!
    Du: Bis Samstag! Schönen Abend!
  explanation: >-
    Decoding: Häsch Ziit? = Hast du Zeit?, am sibni = um sieben, drum = deshalb, erscht am achti = erst um acht,
    wär mega lieb = wäre sehr nett.

# ---------- Bernese (gsw-be, recognition) ----------
- id: a2-u10-ch-be-mcq-aalute
  type: mcq
  skill: listening
  variety: gsw-be
  prompt: Listen to the voice message from Sandra's mother. What happened today?
  transcript: |-
    Mami: Hoi Sandra, i ha der hüt zwöimau aaglütet. Hesch mi Nachricht übercho?
  options: ["She sent Sandra two letters.", "She visited Sandra twice.", "She is going to call Sandra this evening.", "She phoned Sandra twice."]
  answer: 3
  explanation: >-
    aaglütet = angerufen (berndeutsch.ch: aalüte, PP aaglütet), zwöimau = zweimal (l → u). Hesch … übercho? =
    Hast du … bekommen? (berndeutsch.ch: übercho).

- id: a2-u10-ch-be-transform
  type: transform
  skill: reading
  variety: gsw-be
  grammar: [separable-verbs]
  prompt: What does Sandra answer? Write it in Standard German.
  from: gsw-be
  to: de
  source: Mi Akku isch läär gsy. I lüte der hüt am Abe a.
  answers:
    - "Mein Akku war leer. Ich rufe dich heute Abend an."
    - "Mein Akku ist leer gewesen. Ich rufe dich heute Abend an."
    - "Mein Akku war leer. Ich rufe dich heute am Abend an."
  explanation: >-
    gsy = gewesen (no war in dialect), läär = leer, i lüte der … a = ich rufe dich … an (aalüte is separable, and
    it takes the dative der = dir), am Abe = am Abend.

- id: a2-u10-ch-be-match
  type: match
  skill: vocabulary
  variety: gsw-be
  prompt: Match the Bernese words with Standard German.
  pairs:
    - ["aalüte", "anrufen"]
    - ["übercho", "bekommen"]
    - ["zwöimau", "zweimal"]
    - ["tschou", "tschüss"]
  explanation: >-
    From berndeutsch.ch: aalüte (PP aaglütet), übercho (i ha übercho), tschou (informal goodbye). zwöimau shows
    the Bernese l → u (mal → mau).
