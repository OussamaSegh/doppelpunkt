- id: a2-u01-roleplay-reto
  type: roleplay
  skill: listening
  variety: gsw-zh
  grammar: [perfekt-haben, participles-regular, past-time-markers]
  tutor: reto
  prompt: "Listening roleplay with Reto: Monday at the letterboxes."
  scenario: >-
    Reto asks about your weekend in Zurich German and tells you about his. You answer in Standard German.
    Understand his questions and what he did, and tell him two things you did.
  goals:
    - Understand Wie isch s Wuchenänd gsii? and Was häsch gmacht?
    - Understand what Reto did (gschaffet, putzt, go schwümme).
    - Tell Reto two things you did, in the Perfekt.
  model: |
    Reto: Hoi! Wie isch s Wuchenänd gsii?
    Du: Hallo Reto! Gut, danke. Ich habe einen Ausflug auf den Uetliberg gemacht.
    Reto: Lässig! Und am Sunntig, was häsch dänn gmacht?
    Du: Am Sonntag habe ich die Wohnung geputzt und gekocht. Und du?
    Reto: Ich ha de ganz Samschtig gschaffet, und am Sunntig bin ich go schwümme.
    Du: Oh, du hast am Samstag gearbeitet? Schade!
    Reto: Ja, aber s Hallebad isch super gsii.
  explanation: >-
    Decoding: Wie isch … gsii? = Wie war …?, Was häsch gmacht? = Was hast du gemacht?, gschaffet = gearbeitet,
    bin go schwümme = bin schwimmen gegangen. Answering in Standard German is normal in Zurich.

# ---------- Bernese (gsw-be, recognition) ----------
- id: a2-u01-ch-be-mcq-gsy
  type: mcq
  skill: listening
  variety: gsw-be
  prompt: Listen to Sandra on the phone to her mother. What does she say about the weekend?
  transcript: |-
    Sandra: Ja, merci! Ds Wuchenänd isch mega schön gsy.
  options: ["It is going to be really nice.", "It was really nice.", "It was too short.", "She hasn't had a weekend."]
  answer: 1
  explanation: >-
    isch … gsy = ist gewesen / war: Bernese gsy is Zurich gsii (berndeutsch.ch: gsy, Partizip von sy). ds
    Wuchenänd = das Wochenende. Bernese, too, has no Präteritum.

- id: a2-u01-ch-be-transform
  type: transform
  skill: reading
  variety: gsw-be
  grammar: [perfekt-haben]
  prompt: What does Sandra's mother ask? Write it in Standard German.
  from: gsw-be
  to: de
  source: Bisch guet hei cho?
  answers: ["Bist du gut nach Hause gekommen?", "Bist du gut heimgekommen?", "Bist du gut zu Hause angekommen?"]
  explanation: >-
    bisch = bist du, hei = heim / nach Hause, cho = gekommen (the same participle as in Zurich). Movement
    verbs take sein – in dialect too (unit 2).

- id: a2-u01-ch-be-match
  type: match
  skill: vocabulary
  variety: gsw-be
  prompt: Match the Bernese words with Standard German.
  pairs:
    - ["gsy", "gewesen"]
    - ["ds Wuchenänd", "das Wochenende"]
    - ["Das fröit mi.", "Das freut mich."]
    - ["mir sy", "wir sind"]
  explanation: >-
    All in berndeutsch.ch (gsy, sy, Wuchenänd, fröie). Bernese uses y where Zurich has ii (gsy – gsii, mir
    sy – mir sind) and öi for eu (fröie).
