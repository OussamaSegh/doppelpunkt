# A2 unit 2 – Reisen und Ferien

# ---------- travelling ----------
- id: reise
  de: Reise
  en: journey, trip
  pos: noun
  gender: f
  plural: Reisen
  example: { de: "Die Reise hat vier Stunden gedauert.", en: "The journey took four hours." }
  gswZh: Reis
  tags: [travel]

- id: reisen
  de: reisen
  en: to travel
  pos: verb
  example: { de: "Lena ist mit dem Zug durch die Schweiz gereist.", en: "Lena travelled through Switzerland by train." }
  gswZh: reise
  tags: [travel, sein]

- id: ferien
  de: Ferien
  en: holidays, vacation
  pos: noun
  pluralOnly: true
  example: { de: "Wo bist du in den Ferien gewesen?", en: "Where were you on holiday?" }
  gswZh: Ferie (i d Ferie gaa)
  tags: [travel, helvetism]

- id: urlaub
  de: Urlaub
  en: holiday, leave (from work)
  pos: noun
  gender: m
  plural: Urlaube
  example: { de: "Ich habe zwei Wochen Urlaub.", en: "I have two weeks off." }
  chStd: Ferien (Urlaub mostly = leave from work or the army)
  gswZh: Ferie / Urlaub
  tags: [travel]

- id: fliegen
  de: fliegen
  en: to fly
  pos: verb
  example: { de: "Wir sind nach London geflogen.", en: "We flew to London." }
  gswZh: flüüge (gflooge)
  tags: [travel, irregular, sein]

- id: flughafen
  de: Flughafen
  en: airport
  pos: noun
  gender: m
  plural: Flughäfen
  example: { de: "Der Flughafen Zürich ist in Kloten.", en: "Zurich airport is in Kloten." }
  gswZh: Flughafe
  tags: [travel]

- id: flugzeug
  de: Flugzeug
  en: plane
  pos: noun
  gender: n
  plural: Flugzeuge
  example: { de: "Das Flugzeug ist pünktlich gelandet.", en: "The plane landed on time." }
  gswZh: Flugzüg
  tags: [travel]

- id: ankommen
  de: ankommen
  en: to arrive
  pos: verb
  example: { de: "Der Zug ist um acht Uhr in Lugano angekommen.", en: "The train arrived in Lugano at eight." }
  gswZh: "aacho (ich chume aa, participle aacho)"
  tags: [travel, separable, irregular, sein]

- id: ankunft
  de: Ankunft
  en: arrival
  pos: noun
  gender: f
  plural: Ankünfte
  example: { de: "Die Ankunft in Lugano ist um 10.12 Uhr.", en: "Arrival in Lugano is at 10.12." }
  gswZh: Aakunft
  tags: [travel, station]

- id: gleis
  de: Gleis
  en: track, platform (number)
  pos: noun
  gender: n
  plural: Gleise
  example: { de: "Der Zug nach Lugano fährt auf Gleis acht.", en: "The train to Lugano leaves from platform eight." }
  gswZh: Gleis
  tags: [travel, station]

- id: verspaetung
  de: Verspätung
  en: delay
  pos: noun
  gender: f
  plural: Verspätungen
  example: { de: "Der Zug hat zehn Minuten Verspätung.", en: "The train is ten minutes late." }
  gswZh: Verspätig
  tags: [travel, station]

- id: einfach-retour
  de: einfach / hin und zurück
  en: single / return (ticket)
  pos: phrase
  example: { de: "Eine Fahrkarte nach Hamburg, hin und zurück, bitte.", en: "A return ticket to Hamburg, please." }
  chStd: einfach / retour (Ein Billett nach Lugano, retour.)
  gswZh: eifach / retour
  tags: [travel, station, helvetism]

- id: koffer
  de: Koffer
  en: suitcase
  pos: noun
  gender: m
  plural: Koffer
  example: { de: "Ich habe meinen Koffer schon gepackt.", en: "I've already packed my suitcase." }
  gswZh: Koffer
  tags: [travel]

- id: gepaeck
  de: Gepäck
  en: luggage
  pos: noun
  gender: n
  plural: "-"
  example: { de: "Wo ist dein Gepäck?", en: "Where is your luggage?" }
  gswZh: Gepäck
  tags: [travel]

- id: packen
  de: packen
  en: to pack
  pos: verb
  example: { de: "Hast du den Koffer gepackt?", en: "Have you packed the suitcase?" }
  gswZh: packe (packt)
  tags: [travel]

