- id: a2-u02-roleplay-reto
  type: roleplay
  skill: listening
  variety: gsw-zh
  grammar: [perfekt-sein, perfekt-haben, praeteritum-sein-haben]
  tutor: reto
  prompt: "Listening roleplay with Reto: holiday photos."
  scenario: >-
    Reto shows you photos of his holiday in Ticino and talks about it in Zurich German. You answer in
    Standard German. Understand where he went, how and what he did, and tell him about one trip of yours.
  goals:
    - Understand where and how Reto travelled (is Tessin gfahre, mit em Zug).
    - Understand what he did and how the weather was (gwanderet, gschwumme, grägnet, heiss gsii).
    - Tell Reto about one of your trips in the Perfekt.
  model: |
    Reto: Lueg, das isch Ascona. Mir sind mit em Zug is Tessin gfahre.
    Du: Schön! Wie lange wart ihr dort?
    Reto: Ä Wuche. Mir sind jede Tag gwanderet, und am Abig hämmer Risotto ggässe.
    Du: Lecker! War das Wetter gut?
    Reto: Am Aafang hät s grägnet, aber dänn isch es heiss gsii. Und du, wo bisch du gsii?
    Du: Ich war in Grindelwald. Ich bin mit der Seilbahn auf den Berg gefahren.
    Reto: Lässig!
  explanation: >-
    Decoding: sind … gfahre = sind … gefahren, gwanderet = gewandert, hämmer … ggässe = haben wir … gegessen,
    grägnet = geregnet, isch … gsii = war. Ä Wuche = eine Woche.

