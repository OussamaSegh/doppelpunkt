  grammar: [praeteritum-sein-haben]
  prompt: Listen and write what you hear.
  transcript: Letzten Sommer war ich zwei Wochen in Italien.
  explanation: >-
    Letzten Sommer (der Sommer → letzten) in position 1, then war, then ich. war = the past of sein.

# ---------- speaking ----------
- id: a2-u02-speak-frame
  type: speak
  skill: speaking
  variety: de
  grammar: [perfekt-sein, perfekt-haben]
  prompt: "Read aloud, then talk about your last holiday: where, how and what you did."
  target: Letzten Sommer bin ich nach Italien gefahren. Ich habe in einem Hotel am Meer gewohnt und bin jeden Tag geschwommen.
  explanation: >-
    Two auxiliaries in one story: bin gefahren, bin geschwommen (movement) but habe gewohnt (staying). Stress
