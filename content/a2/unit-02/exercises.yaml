# ---------- grammar: sein or haben ----------
- id: a2-u02-mcq-sind-gefahren
  type: mcq
  skill: grammar
  variety: de
  grammar: [perfekt-sein]
  prompt: Choose the correct auxiliary.
  question: Wir ___ mit dem Zug nach Lugano gefahren.
  options: ["haben", "hat", "sind", "seid"]
  answer: 2
  rationales:
    - "Movement to a place takes sein."
    - "Movement takes sein – and hat is not the wir form."
    - "Correct. wir sind gefahren."
    - "seid goes with ihr."
  explanation: >-
    fahren nach Lugano is movement from A to B, so the Perfekt uses sein: Wir sind … gefahren. English
    always uses have – German doesn't.

- id: a2-u02-gap-sein-haben
  type: gap
  skill: grammar
  variety: de
  grammar: [perfekt-sein, perfekt-haben]
  prompt: "Fill in a form of sein or haben."
  text: Ich ___ nach Zürich geflogen. Dort ___ ich ein Hotel gebucht. Am Abend ___ ich im Hotel geblieben.
  answers: [["bin"], ["habe"], ["bin"]]
  explanation: >-
    fliegen (movement) → bin geflogen; buchen has an object (ein Hotel) → habe gebucht; bleiben always takes
    sein → bin geblieben.

- id: a2-u02-mcq-geblieben
  type: mcq
  skill: grammar
  variety: de
  grammar: [perfekt-sein]
  prompt: Choose the correct auxiliary.
  question: Am Sonntag hat es geregnet. Wir ___ den ganzen Tag im Hotel geblieben.
  options: ["sind", "haben", "hatten", "waren"]
  answer: 0
  rationales:
    - "Correct. bleiben takes sein."
    - "bleiben is one of the verbs with sein, although nothing moves."
    - "hatten is the past of haben, not an auxiliary for the Perfekt here."
    - "waren + participle would be a different tense (pluperfect) – not A2."
  explanation: >-
    sein, bleiben and passieren take sein in the Perfekt: Wir sind geblieben. Was ist passiert?

- id: a2-u02-mcq-aufgestanden
  type: mcq
  skill: grammar
  variety: de
  grammar: [perfekt-sein, participles-irregular]
  prompt: Choose the correct sentence.
  options: ["Ich habe um sechs Uhr aufgestanden.", "Ich bin um sechs Uhr aufgestanden.", "Ich bin um sechs Uhr aufgesteht.", "Ich bin um sechs Uhr gestanden auf."]
  answer: 1
  rationales:
    - "aufstehen is a change of state: sein."
    - "Correct. bin … aufgestanden."
    - "stehen is irregular: gestanden."
    - "The separable participle is one word at the end: aufgestanden."
  explanation: >-
    aufstehen (from lying to standing) is a change of state → sein. It is irregular and separable:
    auf-ge-standen.

- id: a2-u02-mcq-auto-gefahren
  type: mcq
  skill: grammar
  variety: de
  grammar: [perfekt-sein, perfekt-haben]
  prompt: "Careful! Choose the correct auxiliary."
  question: Ich ___ das Auto meiner Schwester gefahren.
  options: ["bin", "ist", "sind", "habe"]
  answer: 3
  rationales:
    - "Here fahren has an object (das Auto): haben."
    - "ist goes with er / sie / es."
    - "sind goes with wir / sie."
    - "Correct. With an accusative object fahren takes haben."
  explanation: >-
    fahren + an accusative object (das Auto) = to drive something → haben: Ich habe das Auto gefahren. fahren
    to a place → sein: Ich bin nach Bern gefahren.

- id: a2-u02-order-tessin
  type: order
  skill: grammar
  variety: de
  grammar: [perfekt-sein]
  prompt: Put the words in order.
  tokens: ["Wir", "sind", "mit", "dem", "Zug", "ins", "Tessin", "gefahren"]
  answers: ["Wir sind mit dem Zug ins Tessin gefahren.", "Mit dem Zug sind wir ins Tessin gefahren.", "Ins Tessin sind wir mit dem Zug gefahren."]
  explanation: >-
    sind in position 2, gefahren at the end. How (mit dem Zug) usually comes before where to (ins Tessin):
    the German order is time – manner – place.

- id: a2-u02-order-angekommen
  type: order
  skill: grammar
  variety: de
  grammar: [perfekt-sein, participles-irregular]
  prompt: "Put the words in order. (pünktlich = on time)"
  tokens: ["Der", "Zug", "ist", "pünktlich", "in", "Lugano", "angekommen"]
  answers: ["Der Zug ist pünktlich in Lugano angekommen.", "In Lugano ist der Zug pünktlich angekommen.", "Pünktlich ist der Zug in Lugano angekommen."]
  explanation: >-
    ankommen is separable and irregular: an-ge-kommen, and it takes sein (arrival = movement). The
    participle closes the sentence.

- id: a2-u02-transform-fliegen
  type: transform
  skill: grammar
  variety: de
  grammar: [perfekt-sein, participles-irregular]
  prompt: "Put the sentence into the Perfekt."
  from: de
  to: de
  source: Ich fliege nach London.
  answers: ["Ich bin nach London geflogen."]
  explanation: >-
    fliegen: movement → sein; irregular participle with o: geflogen. fliege → bin … geflogen.

# ---------- grammar: irregular participles ----------
- id: a2-u02-gap-irregular
  type: gap
  skill: grammar
  variety: de
  grammar: [participles-irregular]
  prompt: "Write the participles: schlafen – lesen – essen."
  text: In den Ferien habe ich viel ___, viel ___ und gut ___.
  answers: [["geschlafen"], ["gelesen"], ["gegessen"]]
  explanation: >-
    Irregular participles end in -en. These three keep the stem vowel: geschlafen, gelesen, gegessen (with an
    extra g). All three take haben.

- id: a2-u02-gap-irregular-vowel
  type: gap
  skill: grammar
  variety: de
  grammar: [participles-irregular, perfekt-sein]
  prompt: "Write the participles: schwimmen – schreiben – trinken."
  text: Wir sind im See ___. Ich habe drei Postkarten ___. Am Abend haben wir Wein ___.
  answers: [["geschwommen"], ["geschrieben"], ["getrunken"]]
  explanation: >-
    The stem vowel changes: schwimmen → geschwommen (i → o), schreiben → geschrieben (ei → ie), trinken →
    getrunken (i → u). Learn the participle with the verb.

- id: a2-u02-match-participles
  type: match
  skill: grammar
  variety: de
  grammar: [participles-irregular]
  prompt: Match the verbs with their participles.
  pairs:
    - ["fliegen", "geflogen"]
    - ["bleiben", "geblieben"]
    - ["gehen", "gegangen"]
    - ["finden", "gefunden"]
    - ["nehmen", "genommen"]
    - ["bringen", "gebracht"]
  explanation: >-
    Vowel patterns: ie → o (geflogen), ei → ie (geblieben), i → u (gefunden), e → o (genommen). gehen →
    gegangen is unique. bringen is a mixed verb: new vowel, but -t like a regular verb.

# ---------- grammar: war and hatte ----------
- id: a2-u02-gap-war-hatte
  type: gap
  skill: grammar
  variety: de
  grammar: [praeteritum-sein-haben]
  prompt: "Fill in war, wart or hatten."
  text: Das Wetter ___ super. Wir ___ ein Zimmer mit Balkon. Und ihr? ___ ihr auch am See?
  answers: [["war"], ["hatten"], ["Wart", "wart"]]
  explanation: >-
    das Wetter → war (no ending for er/sie/es); wir → hatten; ihr → wart. With sein and haben the
    Präteritum is the normal way to talk about the past.

- id: a2-u02-mcq-warst
  type: mcq
  skill: grammar
  variety: de
  grammar: [praeteritum-sein-haben]
  prompt: Choose the correct form.
  question: Wo ___ du in den Ferien?
  options: ["warst", "war", "wart", "warte"]
  answer: 0
  rationales:
    - "Correct. du warst."
    - "war goes with ich and er / sie / es."
    - "wart goes with ihr."
    - "warte comes from warten (to wait)."
  explanation: >-
    sein in the Präteritum: ich war, du warst, er war, wir waren, ihr wart, sie waren. Wo warst du? is more
    natural than Wo bist du gewesen? in Germany; in Switzerland you hear both.

- id: a2-u02-transform-war
  type: transform
  skill: grammar
  variety: de
  grammar: [praeteritum-sein-haben]
  prompt: "Say it with war or hatte instead of the Perfekt."
  from: de
  to: de
  source: Wir sind in Bern gewesen und haben viel Spaß gehabt.
  answers: ["Wir waren in Bern und hatten viel Spaß.", "Wir waren in Bern und hatten viel Spass."]
  explanation: >-
    sind … gewesen → waren, haben … gehabt → hatten. One word instead of two – that's why speakers prefer it
    with sein and haben.

# ---------- booking ----------
- id: a2-u02-mcq-polite-room
  type: mcq
  skill: speaking
  variety: de
  grammar: [travel-booking]
  prompt: You arrive at a hotel without a booking. What's the best way to ask for a room?
  options: ["Ich will ein Zimmer.", "Gib mir ein Zimmer!", "Guten Tag! Haben Sie noch ein Doppelzimmer frei?", "Ein Zimmer ist frei?"]
  answer: 2
  rationales:
    - "Grammatically fine, but ich will sounds demanding."
    - "du and an imperative are rude to a receptionist."
    - "Correct. A polite yes/no question with Sie."
    - "A yes/no question starts with the verb: Ist ein Zimmer frei?"
  explanation: >-
    Haben Sie noch ein … frei? (Do you still have a … available?) is the standard question. Use Sie and the
    verb first.

- id: a2-u02-gap-booking
  type: gap
  skill: writing
  variety: de
  grammar: [travel-booking]
  prompt: "Complete the booking request: Nächte – bis – Nacht."
  text: Ich möchte ein Doppelzimmer für zwei ___ reservieren, vom 3. ___ 5. Mai. Was kostet die ___?
  answers: [["Nächte"], ["bis", "bis zum"], ["Nacht"]]
  explanation: >-
    die Nacht → zwei Nächte (umlaut in the plural). vom … bis (zum) … for a period of dates. Was kostet die
    Nacht? = How much is it per night?

- id: a2-u02-translate-billett
  type: translate
  skill: writing
  variety: ch-std
  grammar: [travel-booking]
  prompt: "Translate into Swiss Standard German (at a Swiss station)."
  source: A return ticket to Lugano, please.
  answers: ["Ein Billett nach Lugano, retour, bitte.", "Ein Billett nach Lugano retour, bitte.", "Einmal Lugano retour, bitte.", "Ein Retourbillett nach Lugano, bitte.", "Eine Fahrkarte nach Lugano, hin und zurück, bitte."]
  explanation: >-
    In Switzerland: das Billett and retour (return) or einfach (single). In Germany: eine Fahrkarte, hin und
    zurück. nach for towns.

- id: a2-u02-translate-zug
  type: translate
  skill: writing
  variety: de
  grammar: [perfekt-sein]
  prompt: Translate into German.
  source: We went to Italy by train.
  answers: ["Wir sind mit dem Zug nach Italien gefahren.", "Mit dem Zug sind wir nach Italien gefahren.", "Wir sind mit der Bahn nach Italien gefahren."]
  explanation: >-
    went by train = sind mit dem Zug gefahren (not gegangen: gehen means on foot). Movement → sein.

# ---------- reading ----------
- id: a2-u02-mcq-reading-zermatt
  type: mcq
  skill: reading
  variety: de
  grammar: [praeteritum-sein-haben, participles-irregular]
  prompt: Read "Mit dem Zug durch die Schweiz". Why was Lena lucky on Wednesday?
  options: ["The hostel was free.", "The train was on time.", "The weather was perfect and she saw the Matterhorn.", "She met Anna and Tom."]
  answer: 2
  explanation: >-
    "Am Mittwoch hatte ich Glück: Das Wetter war perfekt, und ich habe das Matterhorn gesehen!" Glück haben =
    to be lucky; hatte and war are the Präteritum of haben and sein.

- id: a2-u02-mcq-reading-sein-verbs
  type: mcq
  skill: reading
  variety: de
  grammar: [perfekt-sein]
  prompt: In Lena's text, which of these verbs forms the Perfekt with sein?
  options: ["fotografieren", "übernachten", "schreiben", "weiterfahren"]
  answer: 3
  rationales:
    - "Ich habe viel fotografiert – haben."
    - "Ich habe … übernachtet – haben (staying, not moving)."
    - "Ich habe Postkarten geschrieben – haben."
    - "Correct. Ich bin nach Lugano weitergefahren – movement."
  explanation: >-
    In the text, sein goes with reisen, ankommen, aufstehen, fahren, weiterfahren, schwimmen and fliegen –
    all movement or change. übernachten (to stay the night) takes haben.

- id: a2-u02-translate-reading
  type: translate
  skill: reading
  variety: de
  grammar: [perfekt-sein, praeteritum-sein-haben]
  prompt: Translate into English.
  source: Dort war es warm, und ich bin im See geschwommen.
  answers: ["It was warm there, and I swam in the lake.", "There it was warm and I swam in the lake.", "It was warm there and I went swimming in the lake."]
  explanation: >-
    war = was (Präteritum of sein), bin … geschwommen = swam (Perfekt with sein: swimming is movement).

# ---------- listening ----------
- id: a2-u02-mcq-listening-where
