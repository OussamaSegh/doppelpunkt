- id: a2-u02-ch-transform-gfahre
  type: transform
  skill: reading
  variety: gsw-zh
  grammar: [perfekt-sein]
  prompt: What does Reto say? Write it in Standard German.
  from: gsw-zh
  to: de
  source: Mir sind mit em Zug is Tessin gfahre.
  answers: ["Wir sind mit dem Zug ins Tessin gefahren.", "Mit dem Zug sind wir ins Tessin gefahren."]
  explanation: >-
    mir = wir (not me!), mit em = mit dem, is = ins, gfahre = gefahren. Same auxiliary and the same bracket
    as in Standard German.

- id: a2-u02-ch-mcq-wetter
