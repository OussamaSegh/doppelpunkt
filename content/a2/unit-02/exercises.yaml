- id: a2-u02-speak-shadow-tom
  type: speak
  skill: speaking
  variety: de
  grammar: [perfekt-sein, participles-irregular]
  prompt: "Shadowing: speak along with Tom's line from the intro dialogue, then say it alone."
  target: Doch, ein bisschen! Am Abend habe ich immer Risotto gegessen, und ich bin nie früh ins Bett gegangen.
  explanation: >-
    Doch! answers a negative question (War das Wasser nicht kalt?) – stress it. Then a calm, falling story
    rhythm: ge-GES-sen, ge-GAN-gen.

- id: a2-u02-speak-shadow-nadine
  type: speak
  skill: speaking
  variety: ch-std
  grammar: [perfekt-sein]
  prompt: "Shadowing: speak along with Nadine, then say it alone."
  target: Hallo Tom! Du bist ja ganz braun! Wo bist du in den Ferien gewesen?
  explanation: >-
    Swiss Standard German: Wo bist du … gewesen? (where Germans often say Wo warst du?), die Ferien, and
    the r in braun and Ferien tapped at the front. See the drill The Swiss Standard German accent.

- id: a2-u02-speak-intonation
  type: speak
  skill: speaking
  variety: de
  grammar: [travel-booking]
  prompt: "Intonation: polite yes/no questions rise at the end."
  target: Guten Tag! Haben Sie noch ein Doppelzimmer frei? Ist das Frühstück dabei?
  explanation: >-
    Both questions start with the verb and rise on the last stressed word: … DOP-pelzimmer FREI? … da-BEI?
    A friendly rise sounds polite; a falling tone sounds like a demand.

- id: a2-u02-speak-pron-w
  type: speak
  skill: speaking
  variety: de
  grammar: [perfekt-sein]
  prompt: "Pronunciation: w, v and f. Read aloud slowly."
  target: Wir waren vier Wochen in den Ferien und sind viel gewandert.
  explanation: >-
    German w is English v (wir, waren, Wochen, gewandert); German v is usually f (vier, viel); f is f
    (Ferien). See the drill w, v and f.

# ---------- roleplay and writing ----------
- id: a2-u02-roleplay-lena
  type: roleplay
  skill: speaking
  variety: de
  grammar: [perfekt-sein, perfekt-haben, participles-irregular, praeteritum-sein-haben]
  tutor: lena
  prompt: "Roleplay with Lena: tell her about your last trip."
  scenario: >-
    Lena has just come back from her train trip through Switzerland and wants to hear about your last
    holiday. Tell her where you went, how you travelled, where you stayed and what you did. Ask her one
    question about her trip.
  goals:
    - Say where you went and how (Ich bin mit dem Zug / mit dem Flugzeug nach … gefahren / geflogen).
    - Say where you stayed (Ich habe in einem Hotel / in einer Ferienwohnung gewohnt).
    - Say what you did, with sein and haben (Ich bin gewandert, ich habe viel gesehen).
    - Use war or hatte at least once (Das Wetter war …, Wir hatten Glück).
  model: |
    Lena: Und du? Wo warst du in den Ferien?
    Du: Ich war im August in Spanien. Ich bin nach Barcelona geflogen.
    Lena: Toll! Wo hast du gewohnt?
    Du: In einer Ferienwohnung in der Altstadt. Ich bin jeden Tag an den Strand gegangen und im Meer geschwommen.
    Lena: Und wie war das Wetter?
    Du: Sehr heiß! Wir hatten jeden Tag Sonne. Und du? Hast du das Matterhorn gesehen?
    Lena: Ja! Ich hatte Glück.
  explanation: >-
    A holiday story mixes the auxiliaries: bin geflogen / gegangen / geschwommen (movement), habe gewohnt /
    gesehen; and war / hatte for the weather and luck.

- id: a2-u02-write-postcard
  type: write
  skill: writing
  variety: de
  grammar: [perfekt-sein, perfekt-haben, participles-irregular, praeteritum-sein-haben]
  prompt: Write a holiday postcard.
  task: >-
    Write a postcard (6–8 sentences) to a friend from your holiday – or about a past holiday. Say where you
    are or were, how you travelled, where you are staying, what you have done (at least four things), and
    how the weather was. End with a greeting.
  minWords: 50
  model: >-
    Liebe Anna, viele Grüße aus Graubünden! Ich bin am Samstag mit dem Zug nach Scuol gefahren. Die Reise war
    lang, aber die Landschaft war wunderschön. Ich wohne in einem kleinen Hotel mit Aussicht auf die Berge.
    Am Sonntag bin ich mit der Seilbahn auf einen Berg gefahren und drei Stunden gewandert. Gestern habe ich
    ein Museum besichtigt und viel gelesen. Das Wetter war leider nicht so gut: Es hat zwei Tage geregnet.
    Bis bald! Dein Tom
  checklist:
    - I use sein with movement and change (bin gefahren, bin gewandert, bin aufgestanden) and haben with the rest.
    - Irregular participles end in -en (gefahren, geschwommen, gesehen, gelesen).
    - I use war / hatte for sein and haben in the past (Das Wetter war …).
    - The participle is at the end of each sentence.
    - I start with Liebe … / Lieber … and end with a greeting and my name.
  explanation: >-
    Postcards mix present (Ich wohne …) and past (Ich bin … gefahren). Check each Perfekt: does the verb
    describe movement or change? Then sein.

# ---------- Swiss Standard German ----------
- id: a2-u02-chstd-mcq-gelegen
  type: mcq
  skill: grammar
  variety: ch-std
  grammar: [perfekt-sein]
  prompt: "A Swiss colleague says: \"Ich bin den ganzen Tag am Strand gelegen.\" Is that correct Standard German?"
  options: ["No – it's a dialect form.", "No – liegen always takes haben.", "Only in writing.", "Yes – in Switzerland, Austria and southern Germany liegen, sitzen and stehen take sein."]
  answer: 3
  rationales:
    - "It is Standard German, not dialect."
    - "Only in northern and central Germany."
    - "It is used in speech and writing."
    - "Correct. Duden lists sein for these verbs in southern German, Austrian and Swiss usage."
  explanation: >-
    Duden (sitzen): "Das Hilfsverb sein wird nur im Süddeutschen, Österreichischen und Schweizerischen
    verwendet." So: Ich bin gelegen / gesessen / gestanden (CH) = Ich habe gelegen / gesessen / gestanden
    (north). Both are correct.

- id: a2-u02-chstd-match
  type: match
  skill: vocabulary
  variety: ch-std
  grammar: [travel-booking]
  prompt: Match the Swiss Standard German words with the words used in Germany.
  pairs:
    - ["die Ferien", "der Urlaub"]
    - ["das Billett", "die Fahrkarte"]
    - ["retour", "hin und zurück"]
  explanation: >-
    In Switzerland you go in die Ferien (Urlaub is mostly leave from work), buy ein Billett and choose einfach
    or retour. Germans understand all three.

# ---------- Swiss lane (gsw-zh) ----------
- id: a2-u02-ch-mcq-tessin
  type: mcq
  skill: listening
  variety: gsw-zh
  grammar: [perfekt-sein]
  prompt: Listen to the Swiss lane dialogue. Where was Reto on holiday, and how did he get there?
