- id: a2-u09-roleplay-reto
  type: roleplay
  skill: listening
  variety: gsw-zh
  grammar: [wenn-als, wenn-condition, dates-festivals]
  tutor: reto
  prompt: "Listening roleplay with Reto: Swiss customs."
  scenario: >-
    Reto tells you in Zurich German about Swiss customs – the Räbeliechtli, the Fasnacht in Lucerne and the
    Chlausjage – and asks you about a festival in your country. You answer in Standard German.
  goals:
    - Understand Reto's wänn-sentences (Wänn ich es Chind gsii bin …, Wänn d Guggemusige spiled …).
    - Understand the names and dates of the customs (im Februar, am füfte Dezämber).
    - Tell Reto about a festival from your country, with one als-sentence.
  model: |
    Reto: Kännsch du s Räbeliechtli? Wänn ich es Chind gsii bin, han ich jedes Jahr eis gschnitzt.
    Du: Nein, das kenne ich nicht. Was ist das?
    Reto: Mer schnitzt e Räbe und tuet e Cherze drii. Und im Februar gang ich a d Fasnacht uf Luzern.
    Du: Toll! In England gibt es am 5. November die Bonfire Night.
    Reto: Und was händ ihr da gmacht?
    Du: Als ich klein war, haben wir ein Feuer gemacht und Würstchen gegessen.
  explanation: >-
    Decoding: wänn = als / wenn, gsii bin = war, gschnitzt = geschnitzt, mer = man, tuet … drii = tut …
    hinein, e Cherze = eine Kerze, händ ihr gmacht = habt ihr gemacht.

