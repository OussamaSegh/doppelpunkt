  source: Wänn ich es Chind gsii bin, han ich au jedes Jahr eis gschnitzt.
  answers:
    - "Als ich ein Kind war, habe ich auch jedes Jahr eins geschnitzt."
    - "Als ich ein Kind war, habe ich auch jedes Jahr eine geschnitzt."
    - "Als ich ein Kind gewesen bin, habe ich auch jedes Jahr eins geschnitzt."
    - "Als ich Kind war, habe ich auch jedes Jahr eins geschnitzt."
  explanation: >-
    Here wänn means als: one period in the past. In Standard German use als + war (Swiss German has no war:
    gsii bin = gewesen bin). eis = eins (one – a lantern), gschnitzt = geschnitzt.

- id: a2-u09-ch-mcq-waenn-meaning
  type: mcq
  skill: grammar
  variety: gsw-zh
  grammar: [wenn-als, wenn-condition]
  prompt: "In the Zurich sentence \"Wänn s rägnet, bliib ich dihei\", what is wänn in Standard German?"
  options: ["als", "wann", "weil", "wenn"]
  answer: 3
  rationales:
    - "als would need a single event in the past; this is a condition in the present."
    - "wann would ask a question – here wänn starts a clause."
    - "weil = because; that would be wil in Zurich German."
    - "Correct. A condition in the present: Wenn es regnet, bleibe ich zu Hause."
  explanation: >-
    Zurich wänn covers three Standard words: wenn (if, whenever), als (one time in the past) and wann (the
    question word). Decide from the context: present or repeated → wenn; one past event → als; question → wann.

