# ---------- roleplay and writing ----------
- id: a2-u09-roleplay-lena
  type: roleplay
  skill: speaking
  variety: de
  grammar: [wenn-als, wenn-condition, dates-festivals, perfekt-haben]
  tutor: lena
  prompt: "Roleplay with Lena: a festival from your country."
  scenario: >-
    Lena asks you about a festival or tradition from your country. Tell her when it is, what people do and eat,
    and what you did as a child. Ask her about a festival in Germany.
  goals:
    - Say when the festival takes place (am …, im …, an …).
    - Say what people do and eat (Man …, Es gibt …).
    - Tell one childhood memory with als and one repeated event with wenn.
    - Ask Lena about a festival in her country (Was macht ihr an …? Wann ist …?).
  model: |
    Lena: Welches Fest feiert ihr in deinem Land?
    Du: In England gibt es am 5. November die Bonfire Night. Es gibt Feuer und Feuerwerk.
    Lena: Und was habt ihr da gemacht, als du klein warst?
    Du: Als ich ein Kind war, haben wir im Garten ein Feuer gemacht. Wenn es kalt war, haben wir Suppe gegessen.
    Lena: Schön! Bei uns in Hamburg gibt es im Dezember viele Weihnachtsmärkte.
    Du: Wann beginnen die Weihnachtsmärkte?
    Lena: Ende November. Wenn du im Dezember nach Hamburg kommst, gehen wir zusammen hin!
  explanation: >-
    als for the childhood memory (als ich ein Kind war), wenn for repeated or future events (wenn es kalt war,
    wenn du kommst), wann for the question. Dates with am, im and an.

- id: a2-u09-write-fest
  type: write
  skill: writing
  variety: de
  grammar: [wenn-als, wenn-condition, dates-festivals, perfekt-haben]
  prompt: Write about a festival.
  task: >-
    Write a short text (6–8 sentences) for the course blog: "Ein Fest aus meinem Land". Say what the festival
    is, when it takes place, what people do, eat and drink, and what you did as a child. Use als once and wenn
    at least once.
  minWords: 60
  model: >-
    In Mexiko feiern wir am 1. und 2. November den Día de Muertos, den Tag der Toten. Die Familien schmücken die
    Häuser mit Blumen, Kerzen und Fotos. Man isst ein süßes Brot und trinkt heiße Schokolade. Als ich ein Kind
    war, haben wir jedes Jahr meine Großeltern besucht. Wir haben zusammen gekocht und viele Lieder gesungen.
    Immer wenn ich heute das Brot rieche, denke ich an meine Großmutter. Wenn du im November in Mexiko bist,
    musst du das Fest sehen!
  checklist:
    - I say when the festival is (am …, im …, an …) with ordinal numbers for dates.
    - I use als for one event or period in the past (Als ich ein Kind war, …).
    - I use wenn for repeated events or conditions (Immer wenn …, Wenn du …).
    - After an als- or wenn-clause the main clause starts with the verb.
    - I use the Perfekt for what I did (haben wir besucht, sind wir gegangen).
  explanation: >-
    A festival text needs dates (am 1. November), the present for what people usually do (Man isst …), and als
    + Perfekt for a childhood memory. riechen = to smell.

