# ---------- grammar: als / wenn / wann ----------
- id: a2-u09-mcq-als-childhood
  type: mcq
  skill: grammar
  variety: de
  grammar: [wenn-als]
  prompt: Choose the right word.
  question: ___ ich ein Kind war, habe ich in Manchester gewohnt.
  options: ["Wenn", "Wann", "Als", "Dass"]
  answer: 2
  rationales:
    - "wenn is for repeated events or the present. Childhood is one period."
    - "wann is the question word (When?)."
    - "Correct. One period in the past: als."
    - "dass means that – it doesn't express time."
  explanation: >-
    als = when, for one event or one period in the past (Als ich ein Kind war, als ich in Bern war). The verb
    goes to the end of the als-clause, and the main clause starts with its verb: habe ich …

- id: a2-u09-mcq-immer-wenn
  type: mcq
  skill: grammar
  variety: ch-std
  grammar: [wenn-als]
  prompt: Choose the right word.
  question: Immer ___ ich in Bern bin, esse ich Zibelechueche.
  options: ["als", "wenn", "wann", "ob"]
  answer: 1
  rationales:
    - "als is only for one event in the past – here it's the present and repeated."
    - "Correct. Repeated (immer) and present: wenn."
    - "wann asks a question."
    - "ob means whether (unit 10)."
  explanation: >-
    Every time / whenever = immer wenn or jedes Mal, wenn. In the present wenn is the only choice; als never
    goes with the present tense.

- id: a2-u09-gap-als-wenn
  type: gap
  skill: grammar
  variety: ch-std
  grammar: [wenn-als]
  prompt: "Fill in als or wenn."
  text: ___ ich zehn Jahre alt war, bin ich zum ersten Mal an die Fasnacht gegangen. Jedes Mal, ___ die Guggenmusik gespielt hat, habe ich getanzt. Heute tanze ich immer noch, ___ ich Guggenmusik höre.
  answers: [["Als", "als"], ["wenn"], ["wenn"]]
  explanation: >-
    One moment in the past (zehn Jahre alt, zum ersten Mal) → als. Repeated in the past (jedes Mal) → wenn.
    Present → always wenn.

- id: a2-u09-mcq-wann
  type: mcq
  skill: grammar
  variety: de
  grammar: [wenn-als, w-questions]
  prompt: Choose the right word.
  question: ___ beginnt der Umzug? – Um sechs Uhr am Bahnhof.
  options: ["Wenn", "Wann", "Als", "Wo"]
  answer: 1
  rationales:
    - "wenn starts a clause (if / whenever), it doesn't ask a question."
    - "Correct. A question about time: wann."
    - "als starts a clause about the past."
    - "wo asks where – the answer gives a time."
  explanation: >-
    wann? = question word (verb in position 2: Wann beginnt …?). wenn and als are conjunctions: they start a
    clause with the verb at the end. Trap: English when covers all three.

- id: a2-u09-mcq-wenn-word-order
  type: mcq
  skill: grammar
  variety: de
  grammar: [wenn-condition]
  prompt: Which sentence is correct?
  options:
    - "Wenn ich Zeit habe, ich gehe zum Umzug."
    - "Wenn ich habe Zeit, gehe ich zum Umzug."
    - "Wenn habe ich Zeit, ich gehe zum Umzug."
    - "Wenn ich Zeit habe, gehe ich zum Umzug."
  answer: 3
  rationales:
    - "After the wenn-clause the main clause starts with the verb: gehe ich."
    - "In the wenn-clause the verb goes to the end: Zeit habe."
    - "Both verbs are in the wrong place."
    - "Correct. Verb last in the wenn-clause, verb first in the main clause."
  explanation: >-
    The wenn-clause counts as position 1, so the main verb comes next: Wenn ich Zeit habe, gehe ich … Inside
    the wenn-clause the verb is at the end. You get "verb, verb" in the middle of the sentence.

- id: a2-u09-gap-wenn-verb-end
  type: gap
  skill: grammar
  variety: de
  grammar: [wenn-condition, haben-present, sein-present]
  prompt: "Fill in the verb at the end of the wenn-clause: ist or hast."
  text: Wenn es kalt ___, trinken wir Glühwein. Wenn du am Montag frei ___, kannst du mitkommen. Was machst du, wenn du Geburtstag ___?
  answers: [["ist"], ["hast"], ["hast"]]
  explanation: >-
    In a wenn-clause the conjugated verb is the last word: wenn es kalt ist, wenn du frei hast, wenn du
    Geburtstag hast. Frei haben = to have the day off.

- id: a2-u09-order-als
  type: order
  skill: grammar
  variety: de
  grammar: [wenn-als, perfekt-haben]
  prompt: Put the words in order. Start with Als.
  tokens: ["Als", "ich", "klein", "war", "habe", "ich", "viel", "gesungen"]
  answers: ["Als ich klein war, habe ich viel gesungen.", "Ich habe viel gesungen, als ich klein war."]
  explanation: >-
    Als ich klein war (verb war at the end) is position 1; then the verb habe, the subject ich and the
    participle gesungen at the end. The other order is correct too: Ich habe viel gesungen, als ich klein war.

- id: a2-u09-order-wenn
  type: order
  skill: grammar
  variety: de
  grammar: [wenn-condition]
  prompt: Put the words in order.
  tokens: ["Wenn", "es", "regnet", "bleiben", "wir", "zu", "Hause"]
  answers: ["Wenn es regnet, bleiben wir zu Hause.", "Wir bleiben zu Hause, wenn es regnet."]
  explanation: >-
    Wenn es regnet (verb last), bleiben wir … (verb first). If the main clause comes first, it has normal verb
    second order: Wir bleiben zu Hause, wenn es regnet.

- id: a2-u09-transform-als
  type: transform
  skill: grammar
  variety: ch-std
  grammar: [wenn-als, praeteritum-sein-haben, perfekt-haben]
  prompt: "Join the two sentences with als. Start with Als."
  from: ch-std
  to: ch-std
  source: Ich war in Bern. Ich habe den Zibelemärit besucht.
  answers: ["Als ich in Bern war, habe ich den Zibelemärit besucht.", "Ich habe den Zibelemärit besucht, als ich in Bern war."]
  explanation: >-
    One visit in the past → als. war moves to the end of the als-clause; the main clause starts with the verb:
    habe ich … besucht.

- id: a2-u09-transform-wenn
  type: transform
  skill: grammar
  variety: de
  grammar: [wenn-condition]
  prompt: "Join the two sentences with wenn (if). Start with Wenn."
  from: de
  to: de
  source: Das Wetter ist schön. Wir grillen im Garten.
  answers: ["Wenn das Wetter schön ist, grillen wir im Garten.", "Wir grillen im Garten, wenn das Wetter schön ist."]
  explanation: >-
    A condition → wenn. ist goes to the end of the wenn-clause, then the main clause starts with grillen.

- id: a2-u09-gap-als-perfekt
  type: gap
  skill: grammar
  variety: ch-std
  grammar: [wenn-als, perfekt-haben, participles-irregular]
  prompt: "Fill in the Perfekt of sehen (two gaps)."
  text: Als ich in Basel war, ___ ich die Fasnacht ___.
  answers: [["habe"], ["gesehen"]]
  explanation: >-
    The main clause after als is an ordinary Perfekt sentence: habe in position 2 (right after the als-clause)
    and the participle gesehen at the end (sehen → gesehen, A2.1).

- id: a2-u09-translate-als
  type: translate
  skill: writing
  variety: de
  grammar: [wenn-als, praeteritum-sein-haben, perfekt-haben]
  prompt: Translate into German.
  source: When I was a child, I lived in Hamburg.
  answers:
    - "Als ich ein Kind war, habe ich in Hamburg gewohnt."
    - "Als ich klein war, habe ich in Hamburg gewohnt."
    - "Als ich ein Kind war, wohnte ich in Hamburg."
    - "Ich habe in Hamburg gewohnt, als ich ein Kind war."
    - "Als Kind habe ich in Hamburg gewohnt."
  explanation: >-
    One period in the past → als, with war at the end of the clause. Then the main clause starts with the verb:
    habe ich … gewohnt. Short alternative without a clause: Als Kind habe ich in Hamburg gewohnt.

- id: a2-u09-translate-every-time
  type: translate
  skill: writing
  variety: ch-std
  grammar: [wenn-als]
  prompt: Translate into German.
  source: Every time I'm in Bern, I visit my mother.
  answers:
    - "Jedes Mal, wenn ich in Bern bin, besuche ich meine Mutter."
    - "Immer wenn ich in Bern bin, besuche ich meine Mutter."
    - "Wenn ich in Bern bin, besuche ich meine Mutter."
    - "Ich besuche meine Mutter, wenn ich in Bern bin."
    - "Ich besuche meine Mutter jedes Mal, wenn ich in Bern bin."
  explanation: >-
    Repeated and in the present → wenn (immer wenn / jedes Mal, wenn). bin at the end of the clause, then
    besuche ich.

- id: a2-u09-gap-wann-wenn-als
  type: gap
  skill: grammar
  variety: de
  grammar: [wenn-als, wenn-condition]
  prompt: "Fill in wann, wenn or als."
  text: ___ ist das Fest? – Am Samstag. ___ du Lust hast, kommen wir dich abholen. Letztes Jahr, ___ ich in Zürich angekommen bin, habe ich das Fest noch nicht gekannt.
  answers: [["Wann"], ["Wenn"], ["als"]]
  explanation: >-
    A question → wann. A condition (if) → wenn. One event in the past (when I arrived) → als. abholen = to pick
    up; gekannt = known (kennen → gekannt).

# ---------- grammar: dates ----------
- id: a2-u09-mcq-date
  type: mcq
  skill: grammar
  variety: ch-std
  grammar: [dates-festivals, dates-ordinals]
  prompt: Wann ist der Schweizer Nationalfeiertag?
  options: ["Am erste August", "Am ersten August", "Im ersten August", "Am eins August"]
  answer: 1
  rationales:
    - "After am the ordinal ends in -en: ersten."
    - "Correct. am + ordinal with -ten: am ersten August."
    - "im is for months alone (im August), not for a date."
    - "Dates need the ordinal (erste), not the cardinal (eins)."
  explanation: >-
    Dates: am + ordinal + -en (am ersten, am sechsten, am fünfundzwanzigsten). Written: am 1. August. The
    1st of August is the Swiss national day (A1.12).

- id: a2-u09-gap-dates
  type: gap
  skill: grammar
  variety: ch-std
  grammar: [dates-festivals, dates-ordinals]
  prompt: "Write the dates in words: 6., 23. and 1."
  text: Der Samichlaus kommt am ___ Dezember. Der Zibelemärit ist dieses Jahr am ___ November. Heute ist der ___ Dezember.
  answers:
    - ["sechsten", "6."]
    - ["dreiundzwanzigsten", "23."]
    - ["erste", "1."]
  explanation: >-
    1–19: -ten (sechsten), from 20: -sten (dreiundzwanzigsten). After am (dative) the ending is -en; after
    der (nominative: Heute ist der …) it is -e: der erste Dezember.

- id: a2-u09-match-date-prepositions
  type: match
  skill: grammar
  variety: de
  grammar: [dates-festivals]
  prompt: Match the German time phrases with English.
  pairs:
    - ["am 1. August", "on 1 August"]
    - ["im Februar", "in February"]
    - ["an Ostern", "at Easter"]
    - ["vom 24. bis zum 26. Dezember", "from 24 to 26 December"]
    - ["am Nachmittag", "in the afternoon"]
  explanation: >-
    am for days, dates and parts of the day; im for months and seasons; an for festivals (southern Germany,
    Austria, Switzerland; zu Ostern in northern Germany); vom … bis zum for a period.

- id: a2-u09-mcq-an-ostern
  type: mcq
  skill: grammar
  variety: ch-std
  grammar: [dates-festivals]
  prompt: Choose the right preposition (Swiss / southern German usage).
  question: ___ Ostern färben wir Eier und suchen sie im Garten.
  options: ["Im", "Um", "Am", "An"]
  answer: 3
  rationales:
    - "im is for months and seasons (im April)."
    - "um is for clock times."
    - "am is for one day: am Ostersonntag – but not with the festival name."
    - "Correct. Festivals: an Ostern, an Weihnachten."
  explanation: >-
    an + festival: an Ostern, an Weihnachten, an Silvester. In northern Germany you also hear zu Ostern. For a
    single day use am: am Ostermontag.

