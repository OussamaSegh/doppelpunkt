  prompt: "Guided production: write the Zurich word that covers both als and wenn (Standard: Als …, Wenn …)."
  text: ___ ich chlii gsii bin, han ich vill gsunge. ___ s rägnet, bliib ich dihei.
  answers:
    - ["Wänn", "wänn", "Wän", "wän", "Wo", "wo"]
    - ["Wänn", "wänn", "Wän", "wän"]
  explanation: >-
