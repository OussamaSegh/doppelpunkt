# ---------- Swiss lane (gsw-zh) ----------
- id: a2-u09-ch-mcq-raebe
  type: mcq
  skill: listening
  variety: gsw-zh
  prompt: Listen to Sandra. What is she doing?
  transcript: |-
    Sandra: Ich schnitz es Räbeliechtli. Am Friitig isch de Räbeliechtli-Umzug im Quartier.
  options: ["She's cooking turnip soup.", "She's carving a turnip lantern for a procession on Friday.", "She's buying candles for Friday.", "She's decorating a Christmas tree."]
  answer: 1
  rationales:
    - "Räbe is a turnip, but she isn't cooking."
    - "Correct. schnitz = schnitze (carve), es Räbeliechtli = a turnip lantern, am Friitig = on Friday."
    - "Candles go inside the lantern, but she doesn't buy them."
    - "Christmas trees are not mentioned."
  explanation: >-
    Ich schnitz = ich schnitze (the first person often drops -e). s Räbeliechtli is Räbe + Liecht + -li (a
    lantern made from a turnip). Umzug and Quartier are the same in Swiss Standard German.

- id: a2-u09-ch-transform-waenn-als
  type: transform
  skill: reading
  variety: gsw-zh
  grammar: [wenn-als, praeteritum-sein-haben]
  prompt: What does Reto say? Write it in Standard German.
  from: gsw-zh
