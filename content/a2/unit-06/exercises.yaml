- id: a2-u06-roleplay-reto
  type: roleplay
  skill: listening
  variety: gsw-zh
  grammar: [comparative, superlative, shopping-chunks]
  tutor: reto
  prompt: "Listening roleplay with Reto: at the bike sale."
  scenario: >-
    You meet Reto at the second-hand bike sale. He compares two bikes in Zurich German and asks for your
    opinion. You answer in Standard German.
  goals:
    - Understand Zurich comparatives and superlatives (gröösser, tüürer, am billigschte).
