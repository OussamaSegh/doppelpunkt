  tags: [money]

- id: ausgeben
  de: ausgeben
  en: to spend (money)
  pos: verb
  example: { de: "Ich möchte nicht mehr als hundert Franken ausgeben.", en: "I don't want to spend more than a hundred francs." }
  gswZh: uusgää
