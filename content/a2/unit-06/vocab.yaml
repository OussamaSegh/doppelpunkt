# A2 unit 6 – Vergleichen und Kaufen

# ---------- price and offers ----------
- id: preis
  de: Preis
  en: price
  pos: noun
  gender: m
  plural: Preise
  example: { de: "Der Preis ist gut.", en: "The price is good." }
  gswZh: Priis
  tags: [shopping, money]

- id: angebot
  de: Angebot
  en: special offer; offer
  pos: noun
  gender: n
  plural: Angebote
  example: { de: "Die Kopfhörer sind im Angebot.", en: "The headphones are on special offer." }
