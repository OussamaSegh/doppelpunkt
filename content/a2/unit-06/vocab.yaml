# ---------- verbs ----------
- id: vergleichen
  de: vergleichen
  en: to compare
  pos: verb
  example: { de: "Ich vergleiche die Preise im Internet.", en: "I compare the prices online." }
  gswZh: vergliiche
  tags: [shopping, inseparable]

- id: aussuchen
  de: aussuchen
  en: to choose, to pick out
  pos: verb
  example: { de: "Hast du schon ein Geschenk ausgesucht?", en: "Have you picked out a present yet?" }
  gswZh: uussueche
  tags: [shopping, separable]

- id: bezahlen
  de: bezahlen
  en: to pay
  pos: verb
  example: { de: "Kann ich mit Karte bezahlen?", en: "Can I pay by card?" }
