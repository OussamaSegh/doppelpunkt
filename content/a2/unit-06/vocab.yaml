# ---------- comparison words ----------
- id: besser
  de: besser
  en: better
  pos: adj
  example: { de: "Welche Kopfhörer sind besser?", en: "Which headphones are better?" }
  gswZh: besser
  tags: [comparison, irregular]

- id: am-besten
  de: am besten
  en: (the) best
  pos: phrase
  example: { de: "Diese Kopfhörer sind am besten für den Zug.", en: "These headphones are the best for the train." }
  gswZh: am beschte
