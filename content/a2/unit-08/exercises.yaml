- id: a2-u08-roleplay-reto
  type: roleplay
  skill: listening
  variety: gsw-zh
  grammar: [weil-clause, dass-clause]
  tutor: reto
  prompt: "Listening roleplay with Reto: school days."
  scenario: >-
    Reto asks you in Zurich German about your school and why you are learning German. He tells you about his
    Lehr. You answer in Standard German.
  goals:
    - Understand wil and dass with the verb at the end.
    - Understand the school words Sek, Gymi, Lehr, Matur and Prüefig.
    - Tell Reto about your school and give a reason with weil.
  model: |
    Reto: Wieso lernsch du eigentlich Dütsch?
    Du: Weil ich hier arbeite und weil ich die Leute verstehen will.
    Reto: Super! Und bisch du is Gymi gange?
    Du: In England gibt es kein Gymi, aber ich habe das Abitur gemacht – die Matur.
    Reto: Ich ha nach de Sek e Lehr gmacht, wil ich lieber schaff als lern.
    Du: Ich finde, dass das eine gute Idee war.
    Reto: Ich au! Und ich glaub, dass du d Prüefig bestahsch!
  explanation: >-
    Decoding: wieso = warum, lernsch = lernst, wil = weil, dass … bestahsch = dass du … bestehst
    (verb at the end), lieber schaff als lern = lieber arbeite als lerne.

# ---------- Bernese (gsw-be, recognition) ----------
- id: a2-u08-ch-be-mcq-pruefig
  type: mcq
  skill: listening
  variety: gsw-be
  prompt: Listen to Sandra's mother. What is her news?
  transcript: |-
    Mami: Weisch was? Dr Jonas het d Prüefig bestande!
  options: ["Jonas has passed his exam.", "Jonas has a new job.", "Jonas is moving to Bern.", "Jonas has failed his exam."]
  answer: 0
  explanation: >-
    het … bestande = hat … bestanden (berndeutsch.ch: bestaa, PP. bestande, 'Er het d Prüefig bestande').
    Weisch was? = Weißt du was? Bernese dr = der.

- id: a2-u08-ch-be-transform
