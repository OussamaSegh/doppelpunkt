# ---------- speaking ----------
- id: a2-u08-speak-frame
  type: speak
  skill: speaking
  variety: de
  grammar: [weil-clause, dass-clause]
  prompt: "Read aloud, then give your own reasons for learning German."
  target: Ich lerne Deutsch, weil ich in Zürich arbeite. Ich finde, dass man hier ohne Deutsch nicht viel versteht.
  explanation: >-
    Two frames: …, weil ich … (verb at the end) and Ich finde, dass … (verb at the end). Replace the reasons
    with your own.

- id: a2-u08-speak-shadow-tom
  type: speak
  skill: speaking
  variety: de
  grammar: [weil-clause]
  prompt: "Shadowing: speak along with Tom's line from the intro dialogue, then say it alone."
  target: Interessant! Aber jetzt gehe ich nach Hause, weil ich noch die Verben wiederholen muss.
  explanation: >-
    Stress in-te-res-SANT and the end of the weil-clause: wie-der-HO-len muss. Make a small pause at the
    comma before weil.

- id: a2-u08-speak-shadow-martin
  type: speak
  skill: speaking
  variety: ch-std
  grammar: [weil-clause]
  prompt: "Shadowing: speak along with Martin, then say it alone."
  target: Zuerst zwei Jahre Kindergarten, dann sechs Jahre Primarschule und drei Jahre Sek.
  explanation: >-
    Swiss Standard German: the r in Primarschule and drei is tapped, and Kindergarten is stressed on KIN-.
    See the drill The Swiss Standard German accent.

- id: a2-u08-speak-intonation
  type: speak
  skill: speaking
  variety: de
  grammar: [weil-clause]
  prompt: "Intonation: the main clause rises a little before the comma; the weil-clause falls at the end."
  target: Ich bin müde, weil ich viel gelernt habe.
  explanation: >-
    Ich bin MÜ-de ↗ (the voice stays up – more is coming), weil ich VIEL gelernt habe ↘ (falls at the end).

- id: a2-u08-speak-pron-glottal
  type: speak
  skill: speaking
  variety: de
  grammar: [weil-clause]
  prompt: "Pronunciation: the glottal stop before vowels. Read aloud slowly."
  target: Ich arbeite am Abend in Uster, aber ich übe immer am Ende eines Arbeitstags.
  explanation: >-
    German starts every vowel-initial word with a small catch in the throat: ich | arbeite | am | Abend | in |
    Uster. Don't link the words as in English (no 'ich_arbeite'). See the drill The glottal stop (Knacklaut).

# ---------- roleplay and writing ----------
- id: a2-u08-roleplay-lena
  type: roleplay
  skill: speaking
  variety: de
  grammar: [weil-clause, dass-clause, denn-weil]
  tutor: lena
  prompt: "Roleplay with Lena: school and learning."
  scenario: >-
    Lena asks you about your school days and why you are learning German. Talk about your favourite subject,
    your exams and your plans, and give reasons. Ask her what she thinks about learning languages.
  goals:
    - Talk about your school or studies in the Perfekt (Ich bin … zur Schule gegangen, ich habe … studiert).
    - Give at least two reasons with weil (verb at the end).
    - Say what you think with Ich finde / glaube, dass …
    - Ask Lena for her opinion (Was meinst du?).
  model: |
    Lena: Warum lernst du eigentlich Deutsch?
    Du: Weil ich in Zürich arbeite und weil meine Freunde hier Deutsch sprechen.
    Lena: Und was war in der Schule dein Lieblingsfach?
    Du: Geschichte, weil die Lehrerin sehr gut erklärt hat. Mathe war schwierig für mich.
    Lena: Hast du studiert?
    Du: Ja, ich habe in Leeds Biologie studiert. Was meinst du, ist Deutsch schwierig?
    Lena: Ich glaube, dass Deutsch nicht so schwierig ist. Man muss nur jeden Tag üben.
    Du: Ich hoffe, dass du recht hast!
  explanation: >-
    weil + verb at the end (arbeite, sprechen, erklärt hat); dass + verb at the end (ist, hast). Was meinst du?
    asks for an opinion.

- id: a2-u08-write-learning
  type: write
  skill: writing
  variety: de
  grammar: [weil-clause, dass-clause, perfekt-haben]
  prompt: Write about your education and your German.
  task: >-
    Write a short text (6–8 sentences) for your German course's blog: where you went to school, what you
    liked or didn't like and why, what you did after school, why you are learning German, and what you think
    is the best way to learn a language.
  minWords: 60
  model: >-
    Ich bin in Manchester zur Schule gegangen. Mein Lieblingsfach war Kunst, weil ich gern male. Mathe hat mir nicht
    gefallen, denn ich habe die Lehrerin nie verstanden. Nach der Schule habe ich eine Ausbildung als Koch gemacht.
    Jetzt lerne ich Deutsch, weil ich seit einem Jahr in Winterthur wohne und hier arbeiten möchte. Ich finde,
    dass man jeden Tag ein bisschen üben muss. Am besten lernt man mit Freunden, weil man dann viel spricht. Ich
    hoffe, dass ich im Juni die A2-Prüfung bestehe!
  checklist:
    - I give at least three reasons with weil, and the verb is at the end.
    - I use dass at least twice (Ich finde / hoffe, dass …), with a comma before it.
    - I use denn once, with normal word order.
    - I use the Perfekt for my school days (bin … gegangen, habe … gemacht).
    - Modal verbs in weil- and dass-clauses go last (… arbeiten möchte, … üben muss).
  explanation: >-
    A learner biography needs reasons and opinions: weil and dass with the verb at the end, denn with normal
    word order, and the Perfekt for the past (hat mir nicht gefallen, A2.4).

# ---------- Swiss Standard German ----------
- id: a2-u08-chstd-match
  type: match
  skill: vocabulary
  variety: ch-std
  prompt: Match the Swiss school words with the words used in Germany.
  pairs:
    - ["die Matur", "das Abitur"]
    - ["die Primarschule", "die Grundschule"]
    - ["die Kantonsschule", "das Gymnasium"]
    - ["repetieren", "wiederholen"]
  explanation: >-
    Matur and Primarschule are marked schweizerisch in Duden. A Kantonsschule (Kanti) is a cantonal
    Gymnasium. repetieren is often heard in Switzerland for wiederholen (eine Klasse repetieren).

# ---------- Swiss lane (gsw-zh) ----------
- id: a2-u08-ch-mcq-gymi
  type: mcq
  skill: listening
  variety: gsw-zh
  prompt: Listen to Reto. What is his news?
  transcript: |-
    Reto: Min Neffe, de Luca, hät d Gymiprüefig bestande!
  options: ["Luca has finished his apprenticeship.", "Luca has failed an exam.", "Luca has passed the Gymnasium entrance exam.", "Luca is starting kindergarten."]
  answer: 2
  rationales:
    - "Lehr would be the apprenticeship."
    - "bestande = bestanden (passed)."
    - "Correct. d Gymiprüefig = the entrance exam for the Gymnasium."
    - "Kindergarten would be de Chindsgi."
  explanation: >-
    min Neffe = mein Neffe, hät … bestande = hat … bestanden, d Prüefig = die Prüfung (-ung → -ig), s Gymi =
    das Gymnasium.

- id: a2-u08-ch-transform-wil
  type: transform
  skill: reading
  variety: gsw-zh
  grammar: [weil-clause]
  prompt: What does Reto say? Write it in Standard German.
  from: gsw-zh
  to: de
  source: Er wott Arzt werde, wil er gärn Mänsche hilft.
  answers: ["Er will Arzt werden, weil er gern Menschen hilft.", "Er will Arzt werden, weil er gerne Menschen hilft.", "Er möchte Arzt werden, weil er gern Menschen hilft."]
  explanation: >-
    wott = will, werde = werden, wil = weil, gärn = gern, Mänsche = Menschen. The verb (hilft) goes to the end,
    as in Standard German.

- id: a2-u08-ch-match-school
  type: match
  skill: vocabulary
  variety: gsw-zh
  prompt: Match the Zurich school words with Standard German.
  pairs:
    - ["de Chindsgi", "der Kindergarten"]
    - ["d Sek", "die Sekundarschule"]
    - ["s Gymi", "das Gymnasium"]
    - ["e Lehr", "eine Lehre"]
    - ["d Prüefig", "die Prüfung"]
  explanation: >-
    Swiss pupils go Chindsgi → Primar → Sek → Lehr or Gymi (Matur). -ung becomes -ig: Prüefig, Wohnig.

- id: a2-u08-ch-mcq-dass
  type: mcq
  skill: grammar
  variety: gsw-zh
  grammar: [dass-clause]
  prompt: "What is \"Ich find, dass d Lehr e super Sach isch\" in Standard German?"
  options: ["Ich finde, die Lehre ist super, und das ist eine Sache.", "Ich finde, dass die Lehre eine super Sache ist.", "Ich finde die Lehre, das ist super.", "Ich finde, dass die Lehre ist eine super Sache."]
  answer: 1
  rationales:
    - "This adds an idea that isn't there."
    - "Correct. dass + verb at the end, in dialect and in Standard German."
    - "The dass-clause is missing."
    - "After dass the verb goes to the end."
  explanation: >-
    Zurich German uses dass with the verb at the end, just like Standard German: …, dass d Lehr e super Sach
    isch. isch = ist, e Sach = eine Sache.

- id: a2-u08-ch-mcq-lehr
  type: mcq
  skill: listening
  variety: gsw-zh
  grammar: [weil-clause]
  prompt: Listen to Reto. Why did he do an apprenticeship as a cook?
  transcript: |-
    Reto: Nei, nach de Sek han ich e Lehr als Koch gmacht, wil ich gärn choche.
  options: ["Because his father is a cook", "Because he didn't pass the Gymi exam", "Because the Lehr was short", "Because he likes cooking"]
  answer: 3
  rationales:
    - "He doesn't mention his father."
    - "He doesn't say he failed anything."
    - "He says nothing about the length."
    - "Correct. wil ich gärn choche = weil ich gern koche."
  explanation: >-
    wil = weil, verb at the end: wil ich gärn choche. nach de Sek = nach der Sekundarschule.

- id: a2-u08-ch-gap-wil
  type: gap
  skill: grammar
  variety: gsw-zh
  grammar: [weil-clause]
  prompt: "Guided production: write the Zurich word for weil."
  text: Ich lern Dütsch, ___ ich z Züri schaff.
  answers: [["wil"]]
  explanation: >-
    weil = wil in Zurich German (Bernese wüu), and the verb goes to the end: wil ich z Züri schaff (= weil ich
    in Zürich arbeite).

- id: a2-u08-ch-transform-de-gsw
  type: transform
