# ---------- grammar: weil ----------
- id: a2-u08-mcq-weil-end
  type: mcq
  skill: grammar
  variety: ch-std
  grammar: [weil-clause]
  prompt: Choose the correct sentence.
  options: ["Ich lerne jeden Abend, weil ich brauche das Zertifikat.", "Ich lerne jeden Abend, weil ich das Zertifikat brauche.", "Ich lerne jeden Abend, weil brauche ich das Zertifikat.", "Ich lerne jeden Abend weil ich das Zertifikat brauche."]
  answer: 1
  rationales:
    - "You hear this in speech, but in writing the verb goes to the end after weil."
    - "Correct. weil + subject … verb at the end."
    - "The subject comes straight after weil, and the verb at the end."
    - "The comma before weil is missing."
  explanation: >-
    weil starts a subordinate clause: the conjugated verb goes to the end, and a comma separates the clauses:
    …, weil ich das Zertifikat brauche.

- id: a2-u08-gap-weil
  type: gap
  skill: grammar
  variety: de
  grammar: [weil-clause]
  prompt: "Put the verb in brackets at the end of the weil-clause."
  text: Tom ist nervös, weil er morgen eine Prüfung ___ (haben). Ich lerne Deutsch, weil ich in Zürich ___ (arbeiten).
  answers: [["hat"], ["arbeite"]]
  explanation: >-
    In a weil-clause the verb is conjugated as usual (er hat, ich arbeite), but it goes to the very end.

- id: a2-u08-gap-weil-modal
  type: gap
  skill: grammar
  variety: de
  grammar: [weil-clause, separable-verbs]
  prompt: "Complete the weil-clauses with the verbs in brackets."
  text: Ich gehe nach Hause, weil ich noch lernen ___ (müssen). Ich bin müde, weil ich um sechs ___ (aufstehen).
  answers: [["muss"], ["aufstehe"]]
  explanation: >-
    Modal verb: the infinitive comes first, the modal last (lernen muss). Separable verb: prefix and verb join
    at the end (aufstehe).

- id: a2-u08-mcq-weil-perfekt
  type: mcq
  skill: grammar
  variety: de
  grammar: [weil-clause, perfekt-haben]
  prompt: Choose the correct end of the sentence.
  question: Ich habe die Prüfung bestanden, weil ich viel ___.
  options: ["habe gelernt", "gelernt", "lerne habe", "gelernt habe"]
  answer: 3
  rationales:
    - "In a weil-clause the auxiliary goes last, after the participle."
    - "The auxiliary habe is missing."
    - "Perfekt needs the participle gelernt."
    - "Correct. Participle, then the auxiliary at the very end."
  explanation: >-
    Perfekt in a subordinate clause: …, weil ich viel gelernt habe. The conjugated verb (habe) always goes
    last.

- id: a2-u08-mcq-warum
  type: mcq
  skill: grammar
  variety: de
  grammar: [weil-clause, denn-weil]
  prompt: "Warum lernst du Deutsch? – Choose the best short answer."
  options: ["Weil ich in der Schweiz wohne.", "Denn ich wohne in der Schweiz.", "Weil ich wohne in der Schweiz.", "Denn ich in der Schweiz wohne."]
  answer: 0
  rationales:
    - "Correct. A short answer to Warum? starts with weil, verb at the end."
    - "denn can't start an answer on its own."
    - "After weil the verb goes to the end."
    - "denn keeps normal word order – and can't start the answer."
  explanation: >-
    Warum? is answered with Weil … + verb at the end. denn only joins two main clauses inside one sentence.

- id: a2-u08-transform-weil
  type: transform
  skill: grammar
  variety: de
  grammar: [weil-clause]
  prompt: "Join the two sentences with weil."
  from: de
  to: de
  source: Ich lerne am Abend. Ich arbeite am Tag.
  answers: ["Ich lerne am Abend, weil ich am Tag arbeite.", "Weil ich am Tag arbeite, lerne ich am Abend."]
  explanation: >-
    The reason goes into the weil-clause with the verb at the end: weil ich am Tag arbeite. If it comes first,
    the main verb follows the comma: Weil …, lerne ich …

- id: a2-u08-gap-sek
  type: gap
  skill: grammar
  variety: ch-std
  grammar: [weil-clause]
  prompt: "Put the verbs in brackets at the end."
  text: Die meisten machen eine Lehre, weil sie Geld verdienen ___ (wollen). Martin hat eine Lehre gemacht, weil er gern praktisch ___ ___ (arbeiten, Perfekt).
  answers: [["wollen"], ["gearbeitet"], ["hat"]]
  explanation: >-
    Modal at the very end (verdienen wollen), and in the Perfekt the auxiliary last (gearbeitet hat).

# ---------- grammar: dass ----------
- id: a2-u08-mcq-dass
  type: mcq
  skill: grammar
  variety: de
  grammar: [dass-clause]
  prompt: Choose the correct sentence.
  options: ["Ich finde, dass Deutsch ist wichtig.", "Ich finde dass Deutsch wichtig ist.", "Ich finde, dass Deutsch wichtig ist.", "Ich finde, das Deutsch wichtig ist."]
  answer: 2
  rationales:
    - "After dass the verb goes to the end."
    - "German needs a comma before dass."
    - "Correct. Comma, dass, verb at the end."
    - "das (one s) is the article; the conjunction is dass."
  explanation: >-
    dass works like weil: comma, dass, subject, … verb at the end. Write the conjunction with double s.

- id: a2-u08-gap-dass-das
  type: gap
  skill: grammar
  variety: de
  grammar: [dass-clause]
  prompt: "Fill in das or dass."
  text: Ich glaube, ___ ___ System gut ist. Ich hoffe, ___ ich die Prüfung bestehe.
  answers: [["dass"], ["das"], ["dass"]]
  explanation: >-
    dass (double s) is the conjunction after glauben, hoffen, finden. das (one s) is the article: das System.

- id: a2-u08-mcq-hoffe
  type: mcq
  skill: grammar
  variety: de
  grammar: [dass-clause, separable-verbs]
  prompt: Choose the correct end of the sentence.
  question: Ich hoffe, dass du morgen ___.
  options: ["kommst mit", "mit kommst", "mitkommen", "mitkommst"]
  answer: 3
  rationales:
    - "At the end of a dass-clause the separable verb joins up again."
    - "The prefix and verb are written as one word."
    - "The verb must be conjugated (du → mitkommst)."
    - "Correct. Separable verb at the end, as one word."
  explanation: >-
    In a subordinate clause a separable verb is not split: dass du mitkommst, weil ich früh aufstehe.

- id: a2-u08-match-opinions
  type: match
  skill: grammar
  variety: de
  grammar: [dass-clause]
  prompt: Match the beginnings with the endings.
  pairs:
    - ["Ich hoffe,", "dass ich die Prüfung bestehe."]
    - ["Es ist wichtig,", "dass man jeden Tag übt."]
    - ["Ich weiß,", "dass die Matur schwierig ist."]
    - ["Martin glaubt,", "dass Tom gut Deutsch spricht."]
  explanation: >-
    All four dass-clauses end with the conjugated verb: bestehe, übt, ist, spricht.

- id: a2-u08-order-dass
  type: order
  skill: grammar
  variety: ch-std
  grammar: [dass-clause]
  prompt: Put the words in order.
  tokens: ["Viele", "sagen,", "dass", "das", "System", "gut", "ist"]
  answers: ["Viele sagen, dass das System gut ist."]
  explanation: >-
    Main clause (Viele sagen), comma, dass + subject (das System) + rest + verb at the end (ist).

- id: a2-u08-order-weil-first
  type: order
  skill: grammar
  variety: de
  grammar: [weil-clause, subordinate-first]
  prompt: "Put the words in order. Start with Weil."
  tokens: ["Weil", "ich", "am", "Tag", "arbeite,", "lerne", "ich", "am", "Abend"]
  answers: ["Weil ich am Tag arbeite, lerne ich am Abend."]
  explanation: >-
    The weil-clause is position 1, so the main verb (lerne) comes right after the comma: verb – comma – verb.

- id: a2-u08-mcq-first
  type: mcq
  skill: grammar
  variety: de
  grammar: [subordinate-first]
  prompt: Choose the correct sentence.
  options: ["Weil die Prüfung morgen ist, ich bin nervös.", "Weil die Prüfung morgen ist, bin ich nervös.", "Weil ist die Prüfung morgen, bin ich nervös.", "Weil die Prüfung ist morgen, ich bin nervös."]
  answer: 1
  rationales:
    - "When the weil-clause comes first, the main verb must follow the comma."
    - "Correct. Verb at the end of the weil-clause, then the main verb."
    - "After weil the verb goes to the end."
    - "Both verbs are in the wrong place."
  explanation: >-
    A subordinate clause in first position counts as one element, so the main clause starts with the verb:
    Weil …, bin ich nervös.

# ---------- grammar: denn or weil ----------
- id: a2-u08-gap-denn-weil
  type: gap
  skill: grammar
  variety: de
  grammar: [denn-weil]
  prompt: "Fill in denn or weil. Look at the verb position."
  text: Ich bleibe zu Hause, ___ ich habe morgen eine Prüfung. Ich bleibe zu Hause, ___ ich morgen eine Prüfung habe.
  answers: [["denn"], ["weil"]]
  explanation: >-
    denn + normal order (verb in position 2: ich habe …); weil + verb at the end (… habe).

- id: a2-u08-transform-denn
  type: transform
  skill: grammar
  variety: de
  grammar: [denn-weil, weil-clause]
  prompt: "Rewrite the sentence with weil instead of denn."
  from: de
  to: de
  source: Luca macht eine Lehre, denn er möchte Geld verdienen.
  answers: ["Luca macht eine Lehre, weil er Geld verdienen möchte."]
  explanation: >-
    With weil the conjugated verb (here the modal möchte) moves to the end: weil er Geld verdienen möchte.

- id: a2-u08-translate-because
  type: translate
  skill: writing
  variety: de
  grammar: [weil-clause]
  prompt: Translate into German. Use weil.
  source: I'm learning German because I want to stay in Switzerland.
  answers: ["Ich lerne Deutsch, weil ich in der Schweiz bleiben will.", "Ich lerne Deutsch, weil ich in der Schweiz bleiben möchte.", "Weil ich in der Schweiz bleiben will, lerne ich Deutsch.", "Weil ich in der Schweiz bleiben möchte, lerne ich Deutsch."]
  explanation: >-
    weil + modal: the infinitive (bleiben) and then the modal (will / möchte) at the end. in der Schweiz: die
    Schweiz always has the article.

- id: a2-u08-translate-think
  type: translate
  skill: writing
  variety: de
  grammar: [dass-clause]
  prompt: Translate into German. Use dass.
  source: I think that mistakes are normal.
  answers: ["Ich finde, dass Fehler normal sind.", "Ich glaube, dass Fehler normal sind.", "Ich denke, dass Fehler normal sind.", "Ich meine, dass Fehler normal sind."]
  explanation: >-
    I think that … = Ich finde / glaube / denke, dass … + verb at the end (sind).

- id: a2-u08-mcq-opinion
  type: mcq
  skill: speaking
  variety: de
  grammar: [dass-clause, weil-clause]
  prompt: A classmate asks "Ist Deutsch schwierig?". Which answer gives an opinion and a reason correctly?
  options: ["Ich finde, Deutsch ist schwierig, weil die Artikel ich nie weiß.", "Ich finde, dass Deutsch ist schwierig, weil viele Artikel.", "Ich finde, dass Deutsch schwierig ist, weil man viele Artikel lernen muss.", "Ich finde dass schwierig, denn die Artikel."]
  answer: 2
  rationales:
    - "The first part is fine, but in the weil-clause the subject comes first and the verb last: weil ich die Artikel nie weiß."
    - "After dass the verb goes to the end, and the weil-clause needs a verb."
    - "Correct. dass + verb at the end, weil + modal at the end."
    - "Both clauses are incomplete."
  explanation: >-
    Opinion: Ich finde, dass … ist. Reason: …, weil man … lernen muss. In both clauses the conjugated verb is
    at the end.

