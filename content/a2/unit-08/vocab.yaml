# A2 unit 8 – Schule und Lernen

# ---------- the school system ----------
- id: schule
  de: Schule
  en: school
  pos: noun
  gender: f
  plural: Schulen
  example: { de: "Wie lange geht man in der Schweiz zur Schule?", en: "How long do people go to school in Switzerland?" }
  gswZh: Schuel
  gswBe: Schuel
  tags: [school]

- id: kindergarten
  de: Kindergarten
  en: kindergarten
  pos: noun
  gender: m
  plural: Kindergärten
  example: { de: "Die Kinder beginnen mit vier Jahren im Kindergarten.", en: "Children start kindergarten at four." }
  gswZh: Chindsgi / Kindergarte
  tags: [school, switzerland]

- id: primarschule
  de: Grundschule
  en: primary school
  pos: noun
  gender: f
  plural: Grundschulen
  example: { de: "Die Grundschule dauert in Deutschland vier Jahre.", en: "Primary school lasts four years in Germany." }
