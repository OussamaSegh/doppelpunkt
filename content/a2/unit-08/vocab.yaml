- id: gymnasium
  de: Gymnasium
  en: academic secondary school (grammar school)
  pos: noun
  gender: n
  plural: Gymnasien
  example: { de: "Luca geht ab August ins Gymnasium.", en: "Luca is going to the Gymnasium from August." }
