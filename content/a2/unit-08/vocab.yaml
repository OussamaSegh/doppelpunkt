  tags: [school, helvetism]

- id: sekundarschule
  de: Sekundarschule
  en: lower secondary school
  pos: noun
  gender: f
  plural: Sekundarschulen
  example: { de: "Nach der Primarschule gehen alle in die Sekundarschule.", en: "After primary school everyone goes to lower secondary school." }
  chStd: die Sekundarschule / die Sek
