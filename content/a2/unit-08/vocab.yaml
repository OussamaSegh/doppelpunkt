- id: studieren
  de: studieren
  en: to study (at university)
  pos: verb
  example: { de: "Meine Schwester studiert Medizin in Bern.", en: "My sister is studying medicine in Bern." }
  gswZh: studiere
  tags: [studies]

- id: student
  de: Student / Studentin
  en: (university) student
  pos: noun
  gender: m
  plural: Studenten / Studentinnen
  example: { de: "Viele Studenten arbeiten Teilzeit.", en: "Many students work part-time." }
