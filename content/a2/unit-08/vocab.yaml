# ---------- reasons and opinions ----------
- id: weil
  de: weil
  en: because (verb at the end)
  pos: conj
  example: { de: "Ich lerne Deutsch, weil ich in Zürich arbeite.", en: "I'm learning German because I work in Zurich." }
  gswZh: wil
  gswBe: wüu
  tags: [conjunctions, reasons]

- id: denn
  de: denn
  en: because (normal word order)
  pos: conj
  example: { de: "Ich habe eine Lehre gemacht, denn ich habe gern praktisch gearbeitet.", en: "I did an apprenticeship, because I liked practical work." }
  gswZh: wil (denn is rare in dialect)
  tags: [conjunctions, reasons]

- id: dass
  de: dass
  en: that (verb at the end)
  pos: conj
  example: { de: "Ich hoffe, dass ich die Prüfung bestehe.", en: "I hope that I pass the exam." }
  gswZh: dass
  tags: [conjunctions, opinions]

- id: warum
  de: warum
  en: why
  pos: adv
  example: { de: "Warum brauchst du das Zertifikat?", en: "Why do you need the certificate?" }
  gswZh: wieso / werum
  tags: [questions, reasons]

- id: glauben
  de: glauben
  en: to believe, to think
  pos: verb
  example: { de: "Ich glaube, dass das System sehr gut ist.", en: "I think the system is very good." }
  gswZh: glaube
  tags: [opinions]

- id: hoffen
  de: hoffen
  en: to hope
  pos: verb
  example: { de: "Ich hoffe, dass ich bestehe.", en: "I hope I pass." }
  gswZh: hoffe
  tags: [opinions]

- id: meinen
  de: meinen
  en: to think, to mean
  pos: verb
  example: { de: "Was meinst du? Ist die Matur schwierig?", en: "What do you think? Is the Matura difficult?" }
  gswZh: meine
  tags: [opinions]
