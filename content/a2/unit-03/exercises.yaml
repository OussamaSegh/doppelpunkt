# ---------- Swiss lane (gsw-zh) ----------
- id: a2-u03-ch-mcq-sit-waenn
  type: mcq
  skill: listening
  variety: gsw-zh
  grammar: [seit-present]
  prompt: Listen to Sandra. What does she want to know?
  transcript: |-
    Sandra: Gärn. Sit wänn schaffsch du eigentlich im Kafi?
  options: ["When Reto finishes work today", "How long Reto has been working at the café", "Whether Reto likes coffee", "Where the café is"]
  answer: 1
  rationales:
    - "That would be Wänn häsch Fiirabig?"
    - "Correct. Sit wänn …? = Seit wann …?"
    - "Kafi here is the café, not the drink."
    - "Wo would ask where."
  explanation: >-
    sit wänn = seit wann, schaffsch = arbeitest (schaffe = arbeiten), im Kafi = im Café. Present tense with
    sit, as in Standard German.

- id: a2-u03-ch-transform-lehr
  type: transform
  skill: reading
  variety: gsw-zh
  grammar: [perfekt-haben]
  prompt: What does Reto say? Write it in Standard German.
  from: gsw-zh
  to: de
  source: Vorher han ich e Lehr als Koch gmacht.
  answers: ["Vorher habe ich eine Lehre als Koch gemacht.", "Davor habe ich eine Lehre als Koch gemacht.", "Vorher habe ich eine Ausbildung als Koch gemacht."]
  explanation: >-
    han ich = habe ich (han before a vowel / after an inverted verb), e Lehr = eine Lehre, gmacht = gemacht.
    No article before the job: als Koch.

- id: a2-u03-ch-match-work
  type: match
  skill: vocabulary
  variety: gsw-zh
  prompt: Match the Zurich German work words with Standard German.
  pairs:
    - ["schaffe", "arbeiten"]
    - ["d Büez", "die Arbeit"]
    - ["streng", "anstrengend"]
    - ["de Fiirabig", "der Feierabend"]
    - ["e Lehr", "eine Lehre"]
  explanation: >-
    schaffe is the everyday verb for work (arbeite is understood but sounds formal); Büez is colloquial.
    streng = tiring, not strict. Fiirabig: ei → ii, -end → -ig.

- id: a2-u03-ch-mcq-mit-em
  type: mcq
  skill: grammar
  variety: gsw-zh
  grammar: [dative-articles]
  prompt: "What is \"mit em Velo\" in Standard German?"
  options: ["mit einem Velo", "mit den Velos", "mit dem Velo", "mit ihm Velo"]
  answer: 2
  rationales:
    - "The indefinite form would be mit emene / eme Velo."
    - "Plural would be mit de Velos."
    - "Correct. em = dem (masculine and neuter dative)."
    - "em is the article here, not the pronoun."
  explanation: >-
    The Zurich dative article is short: em for dem (mit em Velo, bi em Chef → bim Chef), de for der
    (feminine) and den (plural): bi de Arbet, mit de Kollege.

- id: a2-u03-ch-mcq-kaefeli
  type: mcq
  skill: listening
  variety: gsw-zh
  prompt: Listen to Reto. What does he offer Sandra?
  transcript: |-
    Reto: Ja, Znünipause, zäh Minute. Wottsch es Käfeli?
  options: ["A coffee", "A croissant", "A day off", "A small cake"]
  answer: 0
  explanation: >-
    es Käfeli = ein Kaffee, a friendly diminutive of Kafi with -li (neuter, like s Gipfeli). It doesn't have
    to be a small coffee – -li often just sounds friendly. Znünipause = the morning break.

- id: a2-u03-ch-gap-dative
  type: gap
  skill: grammar
  variety: gsw-zh
  grammar: [dative-articles, dative-prepositions]
  prompt: "Guided production: fill in the Zurich dative article em (dem) or de (der)."
  text: Ich chume mit ___ Velo. Ich bi no bi ___ Arbet.
  answers: [["em"], ["de"]]
  explanation: >-
    das Velo → mit em Velo (neuter: em), die Arbet → bi de Arbet (feminine: de). Two short articles cover the
    whole dative in Zurich German: em and de.

- id: a2-u03-ch-transform-de-gsw
  type: transform
  skill: vocabulary
  variety: gsw-zh
  prompt: "Recognition: how do you say this in Zurich German? (Common spellings are accepted.)"
  from: de
  to: gsw-zh
  source: Ich arbeite gern.
  answers: ["Ich schaffe gärn.", "Ich schaff gärn.", "Ich schaffe gern.", "Ich schaff gern."]
  explanation: >-
    arbeiten → schaffe, gern → gärn. The first person often drops the -e: ich schaff.

- id: a2-u03-roleplay-reto
  type: roleplay
  skill: listening
  variety: gsw-zh
  grammar: [seit-present, dative-prepositions, perfekt-haben]
  tutor: reto
  prompt: "Listening roleplay with Reto: Znüni break at the café."
  scenario: >-
    You drop in at Reto's café during his Znüni break. He asks about your job in Zurich German and tells you
    about his. You answer in Standard German.
  goals:
    - Understand Was schaffsch du? and Sit wänn …?
    - Understand Reto's answers (sit drü Jahr, e Lehr als Koch, de Chef, d Kollege).
    - Tell Reto your job, since when and how you get to work.
  model: |
    Reto: Hoi! Wottsch es Käfeli? Und was schaffsch du eigentlich?
    Du: Gern, danke! Ich bin Lehrerin. Ich arbeite an einer Schule in Oerlikon.
    Reto: Ah, lässig! Sit wänn?
    Du: Seit einem Jahr. Und du? Seit wann arbeitest du hier?
    Reto: Sit drü Jahr. Vorher han ich e Lehr als Koch gmacht.
    Du: Und wie ist dein Chef?
    Reto: De Chef isch nett, und d Kollege sind super.
  explanation: >-
    Decoding: schaffsch = arbeitest, sit wänn = seit wann, sit drü Jahr = seit drei Jahren, e Lehr = eine
    Lehre, d Kollege = die Kollegen.

# ---------- Bernese (gsw-be, recognition) ----------
- id: a2-u03-ch-be-mcq-bueez
  type: mcq
  skill: listening
  variety: gsw-be
  prompt: Listen to Sandra's mother. What does she ask?
  transcript: |-
    Mami: Sandra, wie geit's bi dr Büez?
  options: ["Where Sandra works", "How work is going", "When Sandra finishes work", "Whether Sandra has a new job"]
  answer: 1
  explanation: >-
    Wie geit's? = Wie geht's?, bi dr Büez = bei der Arbeit (berndeutsch.ch: Büez f.). Bernese dr is the
    feminine dative article, Zurich de.

- id: a2-u03-ch-be-transform
  type: transform
  skill: reading
  variety: gsw-be
  prompt: What does Sandra answer? Write it in Standard German.
  from: gsw-be
  to: de
  source: I ha viu z tüe. Morn hani frei.
  answers: ["Ich habe viel zu tun. Morgen habe ich frei.", "Ich habe viel zu tun. Morgen hab ich frei."]
  explanation: >-
    i = ich, viu = viel (l → u in Bernese), z tüe = zu tun, morn = morgen, hani = habe ich.

- id: a2-u03-ch-be-match
  type: match
  skill: vocabulary
  variety: gsw-be
  prompt: Match the Bernese words with Standard German.
  pairs:
    - ["d Pouse", "die Pause"]
    - ["schaffe", "arbeiten"]
    - ["viu", "viel"]
    - ["d Stifti", "die Lehre"]
  explanation: >-
    From berndeutsch.ch: Pouse (f.), schaffe (participle gschaffet), Stifti (f., apprenticeship). viu shows
    the Bernese l → u (Miuch, aues).
