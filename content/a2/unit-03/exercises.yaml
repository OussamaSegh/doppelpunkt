- id: a2-u03-translate-reading
  type: translate
  skill: reading
  variety: ch-std
  prompt: Translate into English.
  source: Wir bieten ein freundliches Team, einen guten Lohn und fünf Wochen Ferien.
  answers: ["We offer a friendly team, a good wage and five weeks' holiday.", "We offer a friendly team, a good salary and five weeks of holiday.", "We offer a friendly team, good pay and five weeks of vacation."]
  explanation: >-
    bieten = to offer. einen guten Lohn: der Lohn, accusative after bieten. Ferien = holidays (Swiss Standard
    for Urlaub).

