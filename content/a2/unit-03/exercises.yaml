# ---------- grammar: dative articles ----------
- id: a2-u03-mcq-mit-dem
  type: mcq
  skill: grammar
  variety: ch-std
  grammar: [dative-articles, dative-prepositions]
  prompt: Choose the correct article.
  question: Ich fahre mit ___ Velo zur Arbeit.
  options: ["das", "dem", "den", "der"]
  answer: 1
  rationales:
    - "That's the nominative / accusative. mit takes the dative."
    - "Correct. das Velo → mit dem Velo."
    - "den is accusative masculine or dative plural."
    - "der is dative feminine – but Velo is neuter."
  explanation: >-
    mit always takes the dative. Neuter (and masculine) dative: dem. das Velo → mit dem Velo, das Tram → mit
    dem Tram, der Bus → mit dem Bus.

- id: a2-u03-gap-dative-articles
  type: gap
  skill: grammar
  variety: de
  grammar: [dative-articles, dative-prepositions]
  prompt: "Fill in the dative article: dem – der – den."
  text: Ich arbeite bei ___ Post. Ich fahre mit ___ Bus zur Arbeit. Um zehn trinke ich Kaffee mit ___ Kollegen.
  answers: [["der"], ["dem"], ["den"]]
  explanation: >-
    die Post → bei der Post (feminine), der Bus → mit dem Bus (masculine), die Kollegen → mit den Kollegen
    (plural, the noun ends in -n).

- id: a2-u03-gap-indefinite
  type: gap
  skill: grammar
  variety: de
  grammar: [dative-articles, seit-present]
  prompt: "Fill in einer or einem."
  text: Martin hat bei ___ Bank gearbeitet. Er wohnt seit ___ Monat in Zürich. Tom arbeitet in ___ Büro in Oerlikon.
  answers: [["einer"], ["einem"], ["einem"]]
  explanation: >-
    die Bank → bei einer Bank; der Monat → seit einem Monat; das Büro → in einem Büro. The dative endings of ein
    match der / dem: -er (f), -em (m, n).

- id: a2-u03-mcq-kindern
  type: mcq
  skill: grammar
  variety: de
  grammar: [dative-articles]
  prompt: Choose the correct form.
  question: Am Wochenende spiele ich mit den ___.
  options: ["Kind", "Kinder", "Kindern", "Kinden"]
  answer: 2
  rationales:
    - "After den we need the plural."
    - "Plural, but the dative plural adds -n."
    - "Correct. Dative plural: den Kindern."
    - "The plural is Kinder, + -n: Kindern."
  explanation: >-
    In the dative plural the noun adds -n: die Kinder → mit den Kindern, die Freunde → mit den Freunden.
    Plurals that end in -n or -s don't change: mit den Kollegen, mit den Autos.

- id: a2-u03-mcq-meinem
  type: mcq
  skill: grammar
  variety: de
  grammar: [dative-articles, possessives]
  prompt: Choose the correct form.
  question: Ich wohne zurzeit bei ___ Bruder.
  options: ["mein", "meinen", "meiner", "meinem"]
  answer: 3
  rationales:
    - "Nominative – bei needs the dative."
    - "Accusative masculine – bei needs the dative."
    - "meiner is feminine (meiner Schwester)."
    - "Correct. der Bruder → bei meinem Bruder."
  explanation: >-
    Possessives take the endings of ein: bei einem → bei meinem Bruder, bei einer → bei meiner Schwester, bei
    meinen Eltern (plural). zurzeit = at the moment.

- id: a2-u03-transform-zum
  type: transform
  skill: grammar
  variety: de
  grammar: [dative-prepositions, dative-articles]
  prompt: "Join the preposition and the article (use the short form)."
  from: de
  to: de
  source: Ich gehe zu + der Chef.
  answers: ["Ich gehe zum Chef."]
  explanation: >-
    zu + dative: der Chef → dem Chef, and zu dem contracts to zum. In the same way zu der → zur (zur Arbeit),
    bei dem → beim, von dem → vom.

# ---------- grammar: dative prepositions ----------
- id: a2-u03-gap-prepositions
  type: gap
  skill: grammar
  variety: ch-std
  grammar: [dative-prepositions, seit-present]
  prompt: "Fill in aus, seit or mit."
  text: Martin kommt ___ Bern. Er wohnt ___ einem Monat in Zürich. Er fährt ___ dem Velo zur Arbeit.
  answers: [["aus"], ["seit"], ["mit"]]
  explanation: >-
    aus = from (origin), seit = for / since (still going on, with the present), mit = by (transport). All
    three take the dative: seit einem Monat, mit dem Velo.

- id: a2-u03-mcq-nach-hause
  type: mcq
  skill: grammar
  variety: de
  grammar: [dative-prepositions]
  prompt: Choose the right word.
  question: Um fünf habe ich Feierabend, dann fahre ich ___ Hause.
  options: ["zu", "nach", "bei", "in"]
  answer: 1
  rationales:
    - "zu Hause = at home (no movement)."
    - "Correct. nach Hause = (going) home."
    - "bei is not used with Hause."
    - "in is not used with Hause."
  explanation: >-
    A fixed pair: nach Hause (going home, movement) – zu Hause (at home, location). Ich fahre nach Hause. Ich
    bin zu Hause.

- id: a2-u03-mcq-zum-arzt
  type: mcq
  skill: grammar
  variety: de
  grammar: [dative-prepositions]
  prompt: Choose the right preposition.
  question: Ich habe Fieber. Ich gehe heute ___ Arzt.
  options: ["nach", "bei", "zu", "zum"]
  answer: 3
  rationales:
    - "nach is for towns and countries."
    - "beim Arzt = at the doctor's (location), not going there."
    - "zu needs the article: zu dem → zum."
    - "Correct. zu dem Arzt → zum Arzt."
  explanation: >-
    Going to a person or a place: zu + dative, usually contracted: zum Arzt, zum Chef, zur Post. Being there:
    beim Arzt, bei der Post.

- id: a2-u03-match-contractions
  type: match
  skill: grammar
  variety: de
  grammar: [dative-prepositions]
  prompt: Match the long forms with the contractions.
  pairs:
    - ["bei dem", "beim"]
    - ["von dem", "vom"]
    - ["zu dem", "zum"]
    - ["zu der", "zur"]
  explanation: >-
    Only dem and der (feminine) contract, and only with these prepositions. In everyday German the long
    forms sound wrong: zum Chef, zur Arbeit, beim Arzt, vom Büro.

- id: a2-u03-order-velo
  type: order
  skill: grammar
  variety: ch-std
  grammar: [dative-prepositions]
  prompt: Put the words in order.
  tokens: ["Ich", "fahre", "jeden", "Tag", "mit", "dem", "Velo", "zur", "Arbeit"]
  answers: ["Ich fahre jeden Tag mit dem Velo zur Arbeit.", "Jeden Tag fahre ich mit dem Velo zur Arbeit."]
  explanation: >-
    Time – manner – place: jeden Tag (when), mit dem Velo (how), zur Arbeit (where to). The verb stays in
    position 2.

- id: a2-u03-order-seit
  type: order
  skill: grammar
  variety: de
  grammar: [seit-present, dative-prepositions]
  prompt: Put the words in order.
  tokens: ["Nadine", "arbeitet", "seit", "fünf", "Jahren", "bei", "einer", "Bank"]
  answers: ["Nadine arbeitet seit fünf Jahren bei einer Bank.", "Seit fünf Jahren arbeitet Nadine bei einer Bank."]
  explanation: >-
    seit + present tense: arbeitet, not hat gearbeitet. Two dative phrases: seit fünf Jahren (plural + -n), bei
    einer Bank (feminine).

# ---------- grammar: seit + present ----------
- id: a2-u03-mcq-seit-present
  type: mcq
  skill: grammar
  variety: de
  grammar: [seit-present]
  prompt: "How do you say \"I have been working here for two years\"?"
  options: ["Ich arbeite seit zwei Jahren hier.", "Ich habe hier seit zwei Jahren gearbeitet.", "Ich arbeite für zwei Jahre hier.", "Ich bin hier seit zwei Jahre."]
  answer: 0
  rationales:
    - "Correct. Still true → present tense + seit."
    - "A word-for-word translation of the English tense: German uses the present."
    - "für + time is for plans: I'm working here for two years (then I leave)."
    - "seit needs the dative plural: seit zwei Jahren – and the verb arbeite is missing."
  explanation: >-
    When something started in the past and is still going on, German uses the present tense with seit:
    Ich arbeite seit zwei Jahren hier. Seit wann …? = How long …?

- id: a2-u03-gap-seit-vor
  type: gap
  skill: grammar
  variety: de
  grammar: [seit-present, past-time-markers]
  prompt: "Fill in seit or vor."
  text: Ich arbeite ___ drei Jahren bei der Firma. ___ zwei Wochen habe ich einen neuen Kollegen kennengelernt. ___ wann wohnst du in Zürich?
  answers: [["seit"], ["Vor", "vor"], ["Seit", "seit"]]
  explanation: >-
    seit + present: still going on (arbeite, wohnst). vor + Perfekt: a finished moment in the past, ago (habe
    … kennengelernt). Both take the dative: seit drei Jahren, vor zwei Wochen.

- id: a2-u03-translate-seit
  type: translate
  skill: writing
  variety: de
  grammar: [seit-present]
  prompt: Translate into German.
  source: I have lived in Zurich for a year.
  answers: ["Ich wohne seit einem Jahr in Zürich.", "Seit einem Jahr wohne ich in Zürich.", "Ich lebe seit einem Jahr in Zürich.", "Seit einem Jahr lebe ich in Zürich."]
  explanation: >-
    have lived … for a year (still true) = present tense + seit einem Jahr (dative: das Jahr → einem Jahr).

# ---------- grammar: dative pronouns ----------
- id: a2-u03-gap-pronouns
  type: gap
  skill: grammar
  variety: de
  grammar: [dative-pronouns]
  prompt: "Fill in the dative pronoun of ich, du and er."
  text: Kommst du mit ___ in die Kantine? – Ja, gern, ich komme mit ___. Und Martin? – Ich spreche später mit ___.
  answers: [["mir"], ["dir"], ["ihm"]]
  explanation: >-
    mit + dative: ich → mir, du → dir, er → ihm. Not mit mich / mit dich – those are accusative forms.

- id: a2-u03-mcq-ihnen
  type: mcq
  skill: grammar
  variety: de
  grammar: [dative-pronouns, du-sie]
  prompt: You meet your new boss, Frau Steiner. What do you ask?
  options: ["Wie geht es Sie, Frau Steiner?", "Wie geht es dir, Frau Steiner?", "Wie geht es ihr, Frau Steiner?", "Wie geht es Ihnen, Frau Steiner?"]
  answer: 3
  rationales:
    - "Sie is nominative / accusative; es geht needs the dative."
    - "dir is the du form – too informal for a new boss."
    - "ihr = her: you'd be asking about another woman."
    - "Correct. Formal dative: Ihnen."
  explanation: >-
    Wie geht es Ihnen? (formal) / Wie geht es dir? (informal): the person is in the dative. Ihnen with a
    capital I is formal you; ihnen = them.

- id: a2-u03-transform-ihnen
  type: transform
  skill: grammar
  variety: de
  grammar: [dative-pronouns]
  prompt: "Replace the names with a pronoun."
  from: de
  to: de
  source: Ich arbeite gern mit Nadine und Martin.
  answers: ["Ich arbeite gern mit ihnen."]
  explanation: >-
    Nadine und Martin = sie (they); after mit the dative plural pronoun is ihnen (small i: not the formal
    Ihnen).

- id: a2-u03-translate-help
  type: translate
  skill: writing
  variety: de
  grammar: [dative-pronouns]
  prompt: Translate into German (informal).
  source: Can you help me?
  answers: ["Kannst du mir helfen?", "Kannst du mir bitte helfen?", "Kannst du mir mal helfen?"]
  explanation: >-
    helfen takes the dative: jemandem helfen → Kannst du mir helfen? (not mich). Verbs with the dative are
    unit 4; learn this one as a chunk now.

