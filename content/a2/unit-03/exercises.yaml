# ---------- speaking ----------
- id: a2-u03-speak-frame
  type: speak
  skill: speaking
  variety: de
  grammar: [seit-present, dative-prepositions]
  prompt: "Read aloud, then talk about your own job (or your studies)."
  target: Ich bin Informatiker. Ich arbeite seit zwei Jahren bei einer Firma in Zürich. Ich fahre mit dem Zug zur Arbeit.
  explanation: >-
    Three frames for any job: Ich bin … (no article), Ich arbeite seit … bei …, Ich fahre mit dem … zur Arbeit.

- id: a2-u03-speak-shadow-tom
  type: speak
  skill: speaking
  variety: de
  grammar: [dative-pronouns, dative-prepositions]
  prompt: "Shadowing: speak along with Tom's line from the intro dialogue, then say it alone."
  target: Klar! Und um zwölf essen wir zusammen in der Kantine. Komm, jetzt gehen wir zum Chef. Er möchte dir Hallo sagen.
  explanation: >-
    Friendly and quick: stress KLAR, ZWÖLF, KAN-tine, CHEF. The z in zwölf, zusammen and zum is ts. See the
    drill z [ts] and pf.

- id: a2-u03-speak-shadow-marco
  type: speak
  skill: speaking
  variety: ch-std
  grammar: [dative-prepositions, perfekt-haben]
  prompt: "Shadowing: speak along with Martin, then say it alone."
  target: Ich habe eine Lehre als Kaufmann gemacht, bei einer Bank in Bern.
  explanation: >-
    Swiss Standard German: the ch in gemacht is the back ach-sound, the r in Lehre and Bern is tapped, and
    -er in einer is not reduced to a. See the drill The Swiss Standard German accent.

- id: a2-u03-speak-intonation
  type: speak
  skill: speaking
  variety: de
  grammar: [seit-present]
  prompt: "Intonation: a W-question falls; the short answer stresses the new information."
  target: Seit wann arbeitest du hier? – Seit zwei Jahren.
  explanation: >-
    Seit WANN arbeitest du hier? falls at the end. In the answer the number is new: seit ZWEI Jahren.

- id: a2-u03-speak-pron-z
  type: speak
  skill: speaking
  variety: de
  grammar: [dative-prepositions]
  prompt: "Pronunciation: z = ts. Read aloud slowly."
  target: Meine Arbeitszeit ist Teilzeit, zwanzig Stunden, von zehn bis zwölf, zum Glück im Zentrum.
  explanation: >-
    Every z is ts: Arbeitszeit, Teilzeit, zwanzig, zehn, zwölf, zum, Zentrum. The ts- in Arbeitszeit comes
    from s + z. See the drill z [ts] and pf.

# ---------- roleplay and writing ----------
- id: a2-u03-roleplay-lena
  type: roleplay
  skill: speaking
  variety: de
  grammar: [dative-prepositions, dative-articles, seit-present, dative-pronouns]
  tutor: lena
  prompt: "Roleplay with Lena: talking about work."
  scenario: >-
    Lena wants to know about your job (or your studies). Tell her what you do, where and since when, how you
    get there and what your day looks like. Ask her about her job too.
  goals:
    - Say your job without an article (Ich bin …) and where you work (bei …).
    - Say since when with seit + present (Ich arbeite seit … ).
    - Say how you get to work (mit dem Bus / Velo / Zug) and with whom you work (mit …).
    - Ask Lena a question about her job (Was machst du? Seit wann …?).
  model: |
    Lena: Was machst du eigentlich beruflich?
    Du: Ich bin Verkäuferin. Ich arbeite in einer Buchhandlung in Winterthur.
    Lena: Seit wann?
    Du: Seit einem Jahr. Vorher habe ich in einem Café gearbeitet.
    Lena: Und wie kommst du zur Arbeit?
    Du: Mit dem Zug, das dauert zwanzig Minuten. Und du? Was machst du?
    Lena: Ich bin Lehrerin. Ich arbeite mit Kindern.
    Du: Schön! Gefällt dir die Arbeit?
    Lena: Ja, sehr!
  explanation: >-
    Dative everywhere: in einer Buchhandlung, seit einem Jahr, in einem Café, mit dem Zug, zur Arbeit, mit
    Kindern. seit + present: Ich arbeite seit …

- id: a2-u03-write-job
  type: write
  skill: writing
  variety: de
  grammar: [dative-prepositions, dative-articles, seit-present, perfekt-haben]
  prompt: Describe your job.
  task: >-
    Write a short text (6–8 sentences) for your company's newsletter: "Neu im Team". Say your name and job,
    where you worked before, since when you have worked here, how you get to work, what you do in a normal day
    and with whom you work.
  minWords: 50
  model: >-
    Hallo zusammen! Ich heiße Priya Shah und bin Informatikerin. Ich komme aus London. Vorher habe ich vier
    Jahre bei einer Bank gearbeitet. Seit Januar arbeite ich hier im Team von Tom und Nadine. Ich fahre jeden
    Tag mit dem Tram zur Arbeit. Am Morgen habe ich oft eine Sitzung mit dem Chef, und am Nachmittag
    programmiere ich mit den Kollegen. Am Mittag esse ich gern mit euch in der Kantine. Ich freue mich auf die
    Arbeit mit euch!
  checklist:
    - I say my job without an article (Ich bin Informatikerin).
    - I use seit + present for my current job and the Perfekt for my old job.
    - After mit, bei, von, zu, aus and seit I use the dative (mit dem Tram, bei einer Bank, mit den Kollegen).
    - I use zum / zur, beim, vom where the article contracts.
    - Each sentence has the verb in position 2.
  explanation: >-
    A work profile uses all three A2 tools of the unit: seit + present (Seit Januar arbeite ich hier), the
    dative after prepositions, and the Perfekt for what you did before.

