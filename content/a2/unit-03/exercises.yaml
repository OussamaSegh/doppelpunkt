- id: a2-u03-mcq-reading-pensum
  type: mcq
  skill: reading
  variety: ch-std
  prompt: What does "80–100 %" in the title of the ad mean?
  options: ["The pay rises by 80–100 francs.", "You need 80–100 % in your exams.", "The bakery has a sale.", "The job is part-time or full-time: 80 to 100 per cent of a full week."]
  answer: 3
  explanation: >-
    Swiss job ads give the workload (das Pensum) as a percentage of a full-time job: 100 % = Vollzeit (about
