# A2 unit 3 – Arbeit und Beruf

# ---------- jobs ----------
- id: beruf
  de: Beruf
  en: job, profession
  pos: noun
  gender: m
  plural: Berufe
  example: { de: "Was sind Sie von Beruf?", en: "What do you do for a living?" }
  gswZh: Bruef
  tags: [work]

- id: arbeit
  de: Arbeit
  en: work
  pos: noun
  gender: f
  plural: Arbeiten
  example: { de: "Ich fahre mit dem Bus zur Arbeit.", en: "I go to work by bus." }
  gswZh: Arbet / Büez (colloquial)
  gswBe: Büez (d Büez)
  tags: [work]

- id: informatiker
  de: Informatiker / Informatikerin
  en: IT specialist, computer scientist
  pos: noun
  gender: m
  plural: Informatiker / Informatikerinnen
  example: { de: "Tom ist Informatiker.", en: "Tom is an IT specialist." }
  gswZh: Informatiker / Informatikerin
  tags: [work, jobs]

- id: kaufmann
  de: Kaufmann / Kauffrau
  en: business administrator, commercial employee
  pos: noun
  gender: m
  plural: Kaufleute
  example: { de: "Martin hat eine Lehre als Kaufmann gemacht.", en: "Martin did an apprenticeship as a business administrator." }
  chStd: Kaufmann EFZ / Kauffrau EFZ (s KV = the commercial apprenticeship)
  gswZh: Kaufmaa / Kauffrau (s KV mache)
  tags: [work, jobs, helvetism]

- id: verkaeufer
  de: Verkäufer / Verkäuferin
  en: sales assistant
  pos: noun
  gender: m
  plural: Verkäufer / Verkäuferinnen
  example: { de: "Die Bäckerei sucht eine Verkäuferin.", en: "The bakery is looking for a sales assistant." }
  gswZh: Verchäufer / Verchäuferin
  tags: [work, jobs]

- id: koch
  de: Koch / Köchin
  en: cook, chef
  pos: noun
  gender: m
  plural: Köche / Köchinnen
  example: { de: "Reto hat eine Lehre als Koch gemacht.", en: "Reto did an apprenticeship as a cook." }
  gswZh: Koch / Köchin
  tags: [work, jobs]

- id: pflegefachfrau
  de: Pflegefachfrau / Pflegefachmann
  en: nurse
  pos: noun
  gender: f
  plural: Pflegefachfrauen / Pflegefachmänner
  example: { de: "Sandra ist Pflegefachfrau im Spital.", en: "Sandra is a nurse at the hospital." }
  gswZh: Pflegfachfrau / Pflegfachmaa
  tags: [work, jobs]

- id: lehrer
  de: Lehrer / Lehrerin
  en: teacher
  pos: noun
  gender: m
  plural: Lehrer / Lehrerinnen
  example: { de: "Frau Keller ist Lehrerin.", en: "Frau Keller is a teacher." }
  gswZh: Lehrer / Lehreri
