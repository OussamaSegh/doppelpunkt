  gender: f
  plural: Ausbildungen
  example: { de: "Die Ausbildung dauert drei Jahre.", en: "The training takes three years." }
  gswZh: Uusbildig
  tags: [work, education]

- id: stelle
  de: Stelle
  en: job, position
  pos: noun
  gender: f
  plural: Stellen
  example: { de: "Ich suche eine neue Stelle.", en: "I'm looking for a new job." }
