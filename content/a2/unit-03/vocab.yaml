# ---------- working time and pay ----------
- id: arbeitszeit
  de: Arbeitszeit
  en: working hours
  pos: noun
  gender: f
  plural: Arbeitszeiten
  example: { de: "Meine Arbeitszeit ist von acht bis fünf.", en: "My working hours are from eight to five." }
  gswZh: Arbetsziit
  tags: [work, time]

- id: teilzeit
  de: Teilzeit
  en: part-time
  pos: noun
  gender: f
  plural: "-"
  example: { de: "Anna arbeitet Teilzeit, 60 Prozent.", en: "Anna works part-time, 60 per cent." }
  chStd: "das Pensum (ein Pensum von 60 %)"
  gswZh: Teilziit
  tags: [work, time, helvetism]

- id: schicht
  de: Schicht
  en: shift
  pos: noun
  gender: f
  plural: Schichten
  example: { de: "Diese Woche habe ich die Nachtschicht.", en: "This week I'm on the night shift." }
  gswZh: Schicht / Dienscht (Nachtdienscht)
  tags: [work, time]

- id: feierabend
  de: Feierabend
  en: end of the working day, time off after work
  pos: noun
  gender: m
  plural: Feierabende
  example: { de: "Um fünf habe ich Feierabend.", en: "I finish work at five." }
  gswZh: Fiirabig
  tags: [work, time]

- id: lohn
  de: Lohn
  en: wage, pay
  pos: noun
  gender: m
  plural: Löhne
  example: { de: "Die Firma bezahlt einen guten Lohn.", en: "The company pays a good wage." }
  gswZh: Lohn
  tags: [work, money]

- id: verdienen
  de: verdienen
  en: to earn
  pos: verb
  example: { de: "Wie viel verdient ein Koch in der Schweiz?", en: "How much does a cook earn in Switzerland?" }
  gswZh: verdiene
  tags: [work, money, inseparable]

- id: selbststaendig
  de: selbstständig
  en: self-employed; independent
  pos: adj
  example: { de: "Meine Schwester ist selbstständig. Sie hat ein Café.", en: "My sister is self-employed. She has a café." }
  gswZh: sälbständig
  tags: [work]

- id: streng
  de: streng
  en: strict; (Switzerland) tough, hard work
  pos: adj
  example: { de: "Der Chef ist streng.", en: "The boss is strict." }
  chStd: streng = anstrengend (Die Woche war streng.)
  gswZh: sträng / streng (= anstrengend)
  tags: [work, describing, helvetism]

# ---------- dative prepositions ----------
- id: bei
  de: bei
  en: at (a company, someone's place), near
  pos: prep
  example: { de: "Ich arbeite bei einer Bank.", en: "I work for a bank." }
  gswZh: bi (bim = beim)
  tags: [prepositions, dative]

- id: mit
  de: mit
  en: with; by (transport)
  pos: prep
  example: { de: "Ich fahre mit dem Tram zur Arbeit.", en: "I go to work by tram." }
  gswZh: mit (mit em Velo)
  tags: [prepositions, dative]

- id: seit
  de: seit
  en: since, for (still going on)
  pos: prep
  example: { de: "Ich wohne seit einem Jahr in Zürich.", en: "I've been living in Zurich for a year." }
  gswZh: sit (sit drü Jahr)
  tags: [prepositions, dative]

- id: von
  de: von
  en: from, of
  pos: prep
  example: { de: "Ich arbeite von Montag bis Freitag.", en: "I work from Monday to Friday." }
  gswZh: vo (vom)
  tags: [prepositions, dative]
