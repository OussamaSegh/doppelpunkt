# ---------- training and the job hunt ----------
- id: lehre
  de: Lehre
  en: apprenticeship
  pos: noun
  gender: f
  plural: Lehren
  example: { de: "Nach der Schule habe ich eine Lehre gemacht.", en: "After school I did an apprenticeship." }
