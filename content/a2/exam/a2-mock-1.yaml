  # ===================================================================== SCHREIBEN (30 min, 20 points)
  - id: schreiben-1
    skill: writing
    title: "Schreiben, Teil 1"
    minutes: 12
    instructions: >-
      **Schreiben, Teil 1.** *Sie sind mit Ihrer Freundin Julia zum Kino verabredet. Sie kommen zu spät.
      Schreiben Sie Julia eine SMS. Schreiben Sie etwa 20–30 Wörter zu allen drei Punkten.* Write a short text
      message of about 20–30 words that covers all three points. Scored 0–10 for task fulfilment (all three
      points) and language.
    points: [10]
    exercises:
      - id: a2-mock1-s1-sms
        type: write
        skill: writing
        variety: de
        grammar: [connectors-deshalb-trotzdem, review-a2-subordinate, planning-together]
        prompt: Write a text message to Julia.
        task: >-
          Sie sind mit Julia um 19.30 Uhr vor dem Kino verabredet. Sie kommen zu spät. Schreiben Sie Julia eine SMS:
          (1) Entschuldigen Sie sich. (2) Warum kommen Sie zu spät? (3) Machen Sie einen Vorschlag: Was soll Julia
          machen?
        minWords: 20
        model: >-
          Hallo Julia, es tut mir leid, ich komme etwa zwanzig Minuten zu spät, weil mein Zug Verspätung hat. Kannst
          du schon die Billette kaufen? Wir treffen uns dann drinnen. Bis gleich! Tom
        checklist:
          - "Point 1: I apologise (Es tut mir leid / Entschuldigung)."
          - "Point 2: I give a reason (weil … / … , deshalb …)."
          - "Point 3: I suggest what Julia should do (Kannst du …? Geh doch schon …)."
          - I start with Hallo / Liebe Julia and end with a short closing and my name.
          - I write about 20–30 words with the verb in the right place (weil → verb last).
        explanation: >-
          The official criteria are task fulfilment (all three points, right register: du to a friend) and language.
          Three short sentences, one per point, are enough. weil + verb at the end, or … , deshalb + verb.

  - id: schreiben-2
    skill: writing
    title: "Schreiben, Teil 2"
    minutes: 18
    instructions: >-
      **Schreiben, Teil 2.** *Ihr Deutschlehrer, Herr Wyss, organisiert am Samstag einen Ausflug für den Kurs.
      Schreiben Sie Herrn Wyss eine E-Mail. Schreiben Sie etwa 30–40 Wörter zu allen drei Punkten.* Write a
      formal email of about 30–40 words covering all three points, with a suitable opening and closing. Scored
      0–10.
    points: [10]
    exercises:
      - id: a2-mock1-s2-email
        type: write
        skill: writing
        variety: ch-std
        grammar: [messages-register, indirect-questions, review-a2-subordinate]
        prompt: Write an email to your German teacher, Herr Wyss.
        task: >-
          Herr Wyss organisiert am Samstag einen Ausflug nach Luzern für den Deutschkurs. Sie können leider nicht
          mitkommen. Schreiben Sie ihm eine E-Mail: (1) Bedanken Sie sich für die Einladung. (2) Sagen Sie, warum Sie
          nicht kommen können. (3) Fragen Sie nach den Hausaufgaben für Montag.
        minWords: 30
        model: >-
          Sehr geehrter Herr Wyss,


          vielen Dank für die Einladung zum Ausflug nach Luzern. Leider kann ich am Samstag nicht mitkommen, weil meine
          Schwester heiratet. Können Sie mir bitte sagen, welche Hausaufgaben wir für Montag machen sollen?


          Freundliche Grüsse

          Sarah Miller
        checklist:
          - "Point 1: I thank him for the invitation (Vielen Dank für …)."
          - "Point 2: I say why I can't come (weil … / leider …)."
          - "Point 3: I ask about the homework (Können Sie mir sagen, …? / Welche Hausaufgaben …?)."
          - I use Sie and a formal opening and closing (Sehr geehrter Herr Wyss / Freundliche Grüsse).
          - I write about 30–40 words.
        explanation: >-
          A teacher is a Sie-contact: Sehr geehrter Herr Wyss, Sie / Ihnen, Freundliche Grüsse (or Mit freundlichen
          Grüssen). An indirect question (Können Sie mir sagen, welche …?) is polite; the verb goes to the end.

  # ===================================================================== SPRECHEN (15 min, 20 points)
  - id: sprechen-1
    skill: speaking
    title: "Sprechen, Teil 1"
    minutes: 3
    instructions: >-
      **Sprechen, Teil 1: Fragen zur Person.** *Sie bekommen vier Karten. Fragen Sie Ihre Partnerin / Ihren
      Partner und antworten Sie.* You get four cards with a key word each. Ask your partner a question with each
      word and answer your partner's questions. In the real exam this is a pair exam with two examiners; here
      Lena is your partner. Scored 0–4.
    points: [4]
    exercises:
      - id: a2-mock1-sp1-person
        type: roleplay
        skill: speaking
        variety: de
        tutor: lena
        grammar: [w-questions, review-a2-perfekt, dates-festivals]
        prompt: "Your cards: Geburtstag? – Wohnort? – Sprachen? – Wochenende?"
        scenario: >-
          Lena is your exam partner. Ask her four questions, one with each card word (Geburtstag, Wohnort, Sprachen,
          Wochenende), and answer her four questions about you in full sentences.
        goals:
          - Ask a correct question with each of the four card words.
          - Answer Lena's questions in full, correct sentences.
          - Add one extra detail to at least two answers (why, since when, with whom).
        model: |
          Du: Wann haben Sie Geburtstag?
          Lena: Am 3. Juli. Und wo wohnen Sie?
          Du: Ich wohne seit zwei Jahren in Zürich, in Oerlikon. Wo wohnen Sie?
          Lena: In Hamburg. Welche Sprachen sprechen Sie?
          Du: Englisch, Spanisch und ein bisschen Deutsch. Und Sie?
          Lena: Deutsch und Englisch. Was haben Sie letztes Wochenende gemacht?
          Du: Ich bin mit Freunden auf den Üetliberg gewandert. Und Sie?
          Lena: Ich habe meine Eltern besucht.
        explanation: >-
          The card word must be in your question: Wann haben Sie Geburtstag? Wo wohnen Sie? Welche Sprachen sprechen
          Sie? Was machen / haben Sie am Wochenende (gemacht)? A short extra detail (seit zwei Jahren, mit Freunden)
          shows A2 level.

  - id: sprechen-2
    skill: speaking
    title: "Sprechen, Teil 2"
    minutes: 5
    instructions: >-
      **Sprechen, Teil 2: Über das eigene Leben erzählen.** *Sie bekommen eine Karte und erzählen etwas über Ihr
      Leben.* You get a card with a topic and four prompts. Talk for about 1–2 minutes, then answer one question
      from the examiner (Frau Keller). Scored 0–8.
    points: [8]
    exercises:
      - id: a2-mock1-sp2-wohnen
        type: roleplay
        skill: speaking
        variety: de
        tutor: keller
        grammar: [two-way-prepositions, review-a2-subordinate, comparative]
        prompt: "Thema: Wohnen. Wo? – Wie viele Zimmer? – Mit wem? – Was gefällt Ihnen (nicht)?"
        scenario: >-
          Frau Keller is the examiner. Talk about where you live, using the four prompts on the card. Then she asks you
          one question (for example: Möchten Sie lieber in der Stadt oder auf dem Land wohnen?). Answer with a reason.
        goals:
          - Talk about all four prompts in connected sentences (dann, aber, deshalb, weil).
          - Describe your flat with the right prepositions (im Zentrum, neben dem Bahnhof, im dritten Stock).
          - Answer Frau Keller's question with a reason (weil …).
        model: |
          Du: Ich wohne in Zürich, im Kreis 6, nicht weit vom Bahnhof. Meine Wohnung hat drei Zimmer und einen kleinen Balkon. Ich wohne dort mit meinem Partner und unserer Katze. Mir gefällt die Wohnung sehr, weil sie hell und ruhig ist. Nicht so gut ist die Miete – sie ist ziemlich teuer. Deshalb suchen wir vielleicht bald etwas Günstigeres.
          Frau Keller: Möchten Sie lieber in der Stadt oder auf dem Land wohnen?
          Du: Lieber in der Stadt, weil ich mit dem Velo zur Arbeit fahren kann und weil es viele Cafés gibt.
        explanation: >-
          Cover all four prompts and link your sentences: weil (verb last), deshalb (verb next), aber. Wo? + dative (im
          Kreis 6, vom Bahnhof). Comparatives (lieber, günstiger) are a plus.

  - id: sprechen-3
    skill: speaking
    title: "Sprechen, Teil 3"
    minutes: 7
    instructions: >-
      **Sprechen, Teil 3: Gemeinsam etwas planen.** *Sie möchten mit Ihrer Partnerin / Ihrem Partner am Samstag
      ein Geschenk für eine Kollegin kaufen. Finden Sie einen Termin.* You and your partner want to buy a present
      for a colleague on Saturday. Each of you has a different diary. Find a time when you are both free. Scored
      0–8.
    points: [8]
    exercises:
      - id: a2-mock1-sp3-geschenk
        type: roleplay
        skill: speaking
        variety: de
        tutor: lena
        grammar: [planning-together, review-a2-subordinate, dative-verbs]
        prompt: "Gemeinsam planen: ein Geschenk für Marta kaufen (Samstag)."
        scenario: >-
          Your diary for Saturday: 8–9 Uhr joggen · 9.30 Uhr Frühstück mit Anna · 11–13 Uhr frei · 13 Uhr Mittagessen
          bei den Eltern · 15–16 Uhr Velo reparieren · ab 17 Uhr frei. Lena has her own diary (she's free 11.30–13.00
          and after 18 Uhr). Suggest times, react to Lena's suggestions, agree on a time and decide what to buy and
          where to meet.
        goals:
          - Suggest times and react (Wie wäre es um …? / Da kann ich leider nicht, weil …).
          - Find a time you are both free and say it clearly.
          - Agree on the present and the meeting point.
          - Use polite planning chunks (Wollen wir …? Passt dir …? Einverstanden!).
        model: |
          Du: Wann wollen wir das Geschenk für Marta kaufen? Passt es dir um neun?
          Lena: Um neun kann ich leider nicht, da gehe ich zum Friseur. Wie wäre es um elf?
          Du: Um elf ist gut, aber um 13 Uhr muss ich bei meinen Eltern sein. Ist halb zwölf okay?
          Lena: Ja, ab halb zwölf habe ich Zeit. Was schenken wir ihr?
          Du: Marta liest gern. Wie wäre es mit einem Buch und Blumen?
          Lena: Gute Idee! Treffen wir uns vor der Buchhandlung am Bahnhof?
          Du: Einverstanden! Also Samstag um halb zwölf vor der Buchhandlung.
        explanation: >-
          The task is scored on interaction: suggest, react with a reason (… kann ich nicht, weil / da …), agree, and
          summarise the result at the end. Wie wäre es mit + dative (mit einem Buch). schenken + dative person: Was
          schenken wir ihr?
