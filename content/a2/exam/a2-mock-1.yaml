        rationales: ["She wanted to cook (wollte), but didn't.", "Correct: ins Möbelhaus gefahren und ein Regal gekauft.", "That was Thursday.", "Volleyball is normally on Tuesday."]
        explanation: >-
          "Am Montag wollte ich eigentlich kochen, aber …" – wollte + aber means she didn't. What she did is in the
          Perfekt: habe ein Regal gekauft.

