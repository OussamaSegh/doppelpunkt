        options: ["Ja", "Nein"]
        answer: 0
        rationales: ["Correct: Seit zwölf Jahren.", "She says seit zwölf Jahren."]
        explanation: >-
          "Wie lange machen Sie das schon? – Seit zwölf Jahren." seit + present (A2.3). The hotel job was before.

