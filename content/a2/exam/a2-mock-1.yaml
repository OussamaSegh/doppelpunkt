# Doppelpunkt A2 Modelltest 1 – original items in the format of the Goethe-Zertifikat A2 (Lesen, Hören,
# Schreiben, Sprechen). Format sources and scoring notes: docs/EXAMS.md. No item, text or audio script is
# copied or adapted from a publisher; only the task types, timing and point structure follow the public exam
# description and the publisher's model paper (read for structure only). Vocabulary and grammar: A1 and A2
# units 1–12.
id: a2-mock-1
level: A2
title: "A2 Modelltest 1 (Goethe-Zertifikat A2 format)"
format: goethe
passMark: 0.6
sections:
  # ===================================================================== LESEN (30 min, 20 points)
  - id: lesen-1
    skill: reading
    title: "Lesen, Teil 1"
    minutes: 7
    instructions: >-
      **Doppelpunkt practice test – not an official exam.** It follows the format of the Goethe-Zertifikat A2;
      all texts and items are our own. The real exam starts with Lesen, then Hören and Schreiben (90 minutes
      without a break); Sprechen is a separate 15-minute pair exam.


      **Lesen, Teil 1.** *Sie lesen in einer Zeitung diesen Text. Wählen Sie für die Aufgaben 1 bis 5 die
      richtige Lösung a, b oder c.* Read the newspaper article and choose the right answer for each question.
    stimulus:
      title: "Reparieren statt wegwerfen: Das Repair-Café in Winterthur"
      variety: ch-std
      text: >-
        Jeden ersten Samstag im Monat ist im Quartierzentrum Töss viel los. Von 10 bis 16 Uhr findet dort das
        Repair-Café statt. Die Idee ist einfach: Man bringt kaputte Sachen mit – eine Lampe, ein Velo, einen
        Toaster oder eine Hose – und repariert sie zusammen mit Helferinnen und Helfern. Die Reparatur kostet
        nichts, aber wer möchte, kann etwas Geld in eine Kasse legen.


        Ruth Meier hat das Café vor fünf Jahren eröffnet. Sie war lange Elektrikerin und ist heute pensioniert.
        «Früher haben die Leute viel mehr repariert», sagt sie. «Heute wirft man ein Gerät weg, wenn es nicht
        mehr funktioniert, und kauft ein neues. Das ist schlecht für die Umwelt und auch für das Portemonnaie.»


        Am Anfang waren es nur fünf Helferinnen und Helfer. Heute sind es über zwanzig: Elektriker,
        Schneiderinnen, Velomechaniker und auch Studenten. Nicht alles kann man reparieren. «Bei etwa zwei von
        drei Sachen klappt es», erzählt Ruth Meier. Wenn man warten muss, kann man Kaffee trinken und Kuchen
        essen – den Kuchen backen die Helferinnen selbst. Viele Besucher kommen deshalb auch einfach, weil sie
        gern mit anderen Leuten reden. Wer mithelfen möchte, schreibt eine Mail an das Quartierzentrum.
    points: [1, 1, 1, 1, 1]
    exercises:
      - id: a2-mock1-l1-wann
        type: mcq
        skill: reading
        variety: ch-std
        grammar: [dates-festivals]
        prompt: Aufgabe 1
        question: Das Repair-Café ist …
        options: ["jeden Samstag.", "einmal im Monat.", "nur im Sommer."]
        answer: 1
        rationales: ["Not every Saturday – only the first one of the month.", "Correct: jeden ersten Samstag im Monat.", "No season is mentioned."]
        explanation: >-
          "Jeden ersten Samstag im Monat" = on the first Saturday of every month, so once a month. The distractor
          jeden Samstag takes a word from the text but leaves out ersten.

      - id: a2-mock1-l1-kosten
        type: mcq
        skill: reading
        variety: ch-std
        prompt: Aufgabe 2
        question: Für eine Reparatur …
        options: ["muss man nichts bezahlen.", "bezahlt man zehn Franken.", "braucht man einen Termin."]
        answer: 0
        rationales: ["Correct: Die Reparatur kostet nichts.", "No price is mentioned; you may give money if you want.", "No appointment is mentioned."]
        explanation: >-
          "Die Reparatur kostet nichts, aber wer möchte, kann etwas Geld in eine Kasse legen." Giving money is
          optional.

      - id: a2-mock1-l1-meier
        type: mcq
        skill: reading
        variety: ch-std
        grammar: [perfekt-haben]
        prompt: Aufgabe 3
        question: Ruth Meier …
        options: ["arbeitet noch als Elektrikerin.", "repariert nur Velos.", "hat das Repair-Café eröffnet."]
        answer: 2
        rationales: ["She was an electrician and is now retired (pensioniert).", "Bikes are repaired by the Velomechaniker.", "Correct: Ruth Meier hat das Café vor fünf Jahren eröffnet."]
        explanation: >-
          "Sie war lange Elektrikerin und ist heute pensioniert" – she no longer works. "Ruth Meier hat das Café vor
          fünf Jahren eröffnet."

      - id: a2-mock1-l1-helfer
        type: mcq
        skill: reading
        variety: ch-std
        prompt: Aufgabe 4
        question: Heute helfen im Repair-Café …
        options: ["fünf Personen.", "mehr als zwanzig Personen.", "nur Studenten."]
        answer: 1
        rationales: ["Five was the number at the beginning (am Anfang).", "Correct: Heute sind es über zwanzig.", "Students are only one group among many."]
        explanation: >-
          "Am Anfang waren es nur fünf … Heute sind es über zwanzig." über = more than. Listen and read for the time
          word: am Anfang vs heute.

      - id: a2-mock1-l1-reden
        type: mcq
        skill: reading
        variety: ch-std
        grammar: [review-a2-subordinate]
        prompt: Aufgabe 5
        question: Viele Besucher kommen auch, …
        options: ["weil das Essen gratis ist.", "weil sie dort Geld verdienen.", "weil sie gern mit anderen Leuten reden."]
        answer: 2
        rationales: ["The text doesn't say that the cake is free.", "Nobody earns money there.", "Correct: weil sie gern mit anderen Leuten reden."]
        explanation: >-
          "Viele Besucher kommen deshalb auch einfach, weil sie gern mit anderen Leuten reden." Coffee and cake are
          mentioned, but not that they are free.

  - id: lesen-2
    skill: reading
    title: "Lesen, Teil 2"
    minutes: 7
    instructions: >-
      **Lesen, Teil 2.** *Sie sind in einem Kaufhaus. Lesen Sie die Aufgaben 6 bis 10 und den Wegweiser. In
      welches Stockwerk gehen Sie? Wählen Sie die richtige Lösung a, b oder c.* You are in a department store.
      Read the store guide: which floor do you go to? c (anderes Stockwerk) means "another floor".
    stimulus:
      title: "Kaufhaus Seetor, Luzern – Wegweiser"
      variety: ch-std
      text: |
        4. Stock: Elektronik · Handys und Zubehör · Computer · Spielwaren · Bücher · Restaurant «Seeblick» · Toiletten
        3. Stock: Haushalt · Küche und Geschirr · Bettwäsche · Lampen
        2. Stock: Herrenmode · Kindermode · Sportbekleidung
        1. Stock: Damenmode · Schuhe · Socken und Strümpfe
        Erdgeschoss: Kosmetik · Schmuck · Taschen · Zeitschriften · Information · Konzertbillette
        Untergeschoss: Lebensmittel · Getränke · Bäckerei · Schlüsselservice
    points: [1, 1, 1, 1, 1]
    exercises:
      - id: a2-mock1-l2-tasche
        type: mcq
        skill: reading
        variety: ch-std
        prompt: Aufgabe 6
        question: Sie möchten Ihrer Mutter eine Handtasche schenken.
        options: ["Erdgeschoss", "1. Stock", "anderes Stockwerk"]
        answer: 0
        rationales: ["Correct: Taschen are on the ground floor.", "The 1st floor has women's clothes and shoes – not bags.", "The bags are on one of the given floors."]
        explanation: >-
          Handtasche → Taschen, Erdgeschoss. The trap: a present for your mother makes you think of Damenmode (1.
          Stock).

      - id: a2-mock1-l2-ladegeraet
        type: mcq
        skill: reading
        variety: ch-std
        prompt: Aufgabe 7
        question: Ihr Handy ist leer, und Sie brauchen ein neues Ladekabel.
        options: ["2. Stock", "Untergeschoss", "anderes Stockwerk"]
        answer: 2
        rationales: ["The 2nd floor has clothes for men and children.", "The basement has food and drinks.", "Correct: Handys und Zubehör are on the 4th floor."]
        explanation: >-
          A charging cable is Zubehör (accessories) for a phone: 4. Stock. That floor is not among a and b, so the
          answer is c.

      - id: a2-mock1-l2-sporthose
        type: mcq
        skill: reading
        variety: ch-std
        prompt: Aufgabe 8
        question: Ihr Sohn ist acht Jahre alt. Er braucht eine Hose für den Turnunterricht.
        options: ["1. Stock", "2. Stock", "anderes Stockwerk"]
        answer: 1
        rationales: ["The 1st floor is women's fashion.", "Correct: Kindermode and Sportbekleidung are on the 2nd floor.", "The 2nd floor is one of the options."]
        explanation: >-
          A sports trousers for a child: Kindermode or Sportbekleidung – both on the 2nd floor. der Turnunterricht =
          PE lessons.

      - id: a2-mock1-l2-konzert
        type: mcq
        skill: reading
        variety: ch-std
        prompt: Aufgabe 9
        question: Sie möchten Billette für ein Konzert am Samstag kaufen.
        options: ["4. Stock", "Erdgeschoss", "anderes Stockwerk"]
        answer: 1
        rationales: ["The 4th floor has electronics and books, not tickets.", "Correct: Konzertbillette, Erdgeschoss.", "The tickets are on the ground floor."]
        explanation: >-
          Konzertbillette are sold on the ground floor next to the information desk. Billett is the Swiss word for
          a ticket.

      - id: a2-mock1-l2-teller
        type: mcq
        skill: reading
        variety: ch-std
        prompt: Aufgabe 10
        question: Sie sind umgezogen und brauchen neue Teller.
        options: ["Untergeschoss", "4. Stock", "anderes Stockwerk"]
        answer: 2
        rationales: ["The basement has food, not plates.", "The 4th floor has a restaurant with plates – but you can't buy them there.", "Correct: Küche und Geschirr are on the 3rd floor."]
        explanation: >-
          Teller (plates) are Geschirr: 3. Stock. The restaurant on the 4th floor is a typical distractor.

  - id: lesen-3
    skill: reading
    title: "Lesen, Teil 3"
    minutes: 8
    instructions: >-
      **Lesen, Teil 3.** *Sie lesen eine E-Mail. Wählen Sie für die Aufgaben 11 bis 15 die richtige Lösung a, b
      oder c.* Read the email and choose the right answer for each question.
    stimulus:
      title: "E-Mail von Lena"
      variety: de
      text: >-
        Liebe Sarah,


        wie geht es dir? Ich habe tolle Neuigkeiten: Ich habe eine neue Stelle! Ab dem 1. März arbeite ich als
        Grafikerin bei einer Firma in Basel. Ich freue mich sehr, weil wir dann nicht mehr so weit voneinander
        wohnen. Von Basel nach Zürich ist es nur eine Stunde mit dem Zug.


        Leider habe ich noch keine Wohnung. In Basel sind die Wohnungen teuer, und es gibt nicht viele. Am
        Wochenende vom 14. und 15. Februar möchte ich nach Basel fahren und drei Wohnungen anschauen. Am Samstag
        um 10 Uhr habe ich den ersten Termin, am Sonntag um 14 Uhr den letzten.


        Darf ich am Samstagabend bei dir in Zürich übernachten? Ich könnte nach dem letzten Termin am Samstag
        mit dem Zug zu dir kommen und am Sonntagmorgen wieder nach Basel fahren. Ich bringe auch einen Kuchen
        aus Hamburg mit!


        Schreib mir bitte bald, ob das für dich passt.


        Liebe Grüße

        Lena
    points: [1, 1, 1, 1, 1]
    exercises:
      - id: a2-mock1-l3-warum
        type: mcq
        skill: reading
        variety: de
        prompt: Aufgabe 11
        question: Lena zieht nach Basel, weil …
        options: ["sie dort studieren möchte.", "ihr Freund dort wohnt.", "sie dort eine neue Stelle hat."]
        answer: 2
        rationales: ["Studying is not mentioned.", "No boyfriend is mentioned.", "Correct: Ich habe eine neue Stelle … bei einer Firma in Basel."]
        explanation: >-
          "Ich habe eine neue Stelle! Ab dem 1. März arbeite ich als Grafikerin bei einer Firma in Basel."

      - id: a2-mock1-l3-beginn
        type: mcq
        skill: reading
        variety: de
        grammar: [dates-festivals]
        prompt: Aufgabe 12
        question: Lena beginnt mit der neuen Arbeit …
        options: ["am 1. März.", "am 14. Februar.", "am 15. Februar."]
        answer: 0
        rationales: ["Correct: Ab dem 1. März arbeite ich …", "14 February is the flat-hunting weekend.", "15 February is the Sunday of that weekend."]
        explanation: >-
          "Ab dem 1. März arbeite ich als Grafikerin." The February dates are for the flat viewings – a typical date
          distractor.

      - id: a2-mock1-l3-problem
        type: mcq
        skill: reading
        variety: de
        prompt: Aufgabe 13
        question: Lenas Problem ist, dass …
        options: ["sie kein Schweizerdeutsch versteht.", "sie noch keine Wohnung hat.", "der Zug nach Zürich zu lange fährt."]
        answer: 1
        rationales: ["Swiss German is not mentioned.", "Correct: Leider habe ich noch keine Wohnung.", "She says it's only an hour – a positive point."]
        explanation: >-
          "Leider habe ich noch keine Wohnung. In Basel sind die Wohnungen teuer, und es gibt nicht viele." leider
          signals the problem.

      - id: a2-mock1-l3-wochenende
        type: mcq
        skill: reading
        variety: de
        prompt: Aufgabe 14
        question: Am Wochenende vom 14. und 15. Februar möchte Lena …
        options: ["in Basel Wohnungen anschauen.", "ihre Eltern in Hamburg besuchen.", "mit Sarah Ski fahren."]
        answer: 0
        rationales: ["Correct: … nach Basel fahren und drei Wohnungen anschauen.", "Hamburg is only mentioned because of the cake.", "Skiing is not mentioned."]
        explanation: >-
          "Am Wochenende vom 14. und 15. Februar möchte ich nach Basel fahren und drei Wohnungen anschauen."

      - id: a2-mock1-l3-sarah
        type: mcq
        skill: reading
        variety: de
        grammar: [indirect-questions]
        prompt: Aufgabe 15
        question: Was soll Sarah machen?
        options: ["Lena am Bahnhof in Basel abholen.", "Eine Wohnung für Lena suchen.", "Antworten, ob Lena bei ihr übernachten kann."]
        answer: 2
        rationales: ["Lena travels to Zurich herself by train.", "Lena looks for the flat herself.", "Correct: Darf ich … bei dir übernachten? … Schreib mir bitte bald, ob das für dich passt."]
        explanation: >-
          Lena asks "Darf ich am Samstagabend bei dir in Zürich übernachten?" and ends with "Schreib mir bitte bald,
          ob das für dich passt." – an indirect question with ob.

  - id: lesen-4
    skill: reading
    title: "Lesen, Teil 4"
    minutes: 8
    instructions: >-
      **Lesen, Teil 4.** *Sechs Personen suchen im Internet nach Angeboten. Lesen Sie die Aufgaben 16 bis 20 und
      die Anzeigen a bis f. Welche Anzeige passt zu welcher Person? Für eine Aufgabe gibt es keine passende
      Anzeige. Wählen Sie dann X.* Five people look for offers on the internet. Which ad fits each person? For
      one person there is no suitable ad: choose X.
    stimulus:
      title: Anzeigen
      variety: ch-std
      text: |
        a) Kochkurs «Thai-Küche»: vier Abende, jeweils Mittwoch von 18.30 bis 21.30 Uhr, in Zürich-Altstetten. Fr. 280.– inklusive Essen.
        b) Kletterhalle Winterthur: Schnupperkurs für Kinder von 8 bis 12 Jahren, jeden Samstag von 9 bis 11 Uhr. Material gibt es bei uns.
        c) Velobörse Bern: Kaufen und verkaufen Sie gebrauchte Velos! Samstag, 18. April, 9 bis 13 Uhr, auf dem Waisenhausplatz.
        d) Sprachtandem: Ich bin Spanierin (30) und suche eine Tandempartnerin oder einen Tandempartner Deutsch–Spanisch. Treffen einmal pro Woche in einem Café in Zürich. Gratis!
        e) Yoga am Morgen: Montag bis Freitag, 6.30 bis 7.30 Uhr, im Studio Kleinbasel. Probelektion gratis.
        f) Wandergruppe 60+ Zürcher Oberland: Wir wandern jeden zweiten Sonntag zusammen, 3–4 Stunden, gemütliches Tempo. Neue Mitglieder sind willkommen!
    points: [1, 1, 1, 1, 1]
    exercises:
      - id: a2-mock1-l4-marco
        type: mcq
        skill: reading
        variety: ch-std
        prompt: Aufgabe 16
        question: Marco möchte sein Spanisch verbessern, aber er hat nicht viel Geld.
        options: ["Anzeige a", "Anzeige b", "Anzeige c", "Anzeige d", "Anzeige e", "Anzeige f", "X (keine Anzeige)"]
        answer: 3
        rationales: ["a is a cooking course.", "b is for children.", "c is about bikes.", "Correct: a free German–Spanish language tandem.", "e is yoga.", "f is a hiking group.", "There is a suitable ad: d."]
        explanation: >-
          d: Sprachtandem Deutsch–Spanisch, "Gratis!" – it matches both conditions (Spanish, little money).

      - id: a2-mock1-l4-kunz
        type: mcq
        skill: reading
        variety: ch-std
        prompt: Aufgabe 17
        question: Frau Kunz ist 70 Jahre alt. Sie wandert gern, aber nicht allein.
        options: ["Anzeige a", "Anzeige b", "Anzeige c", "Anzeige d", "Anzeige e", "Anzeige f", "X (keine Anzeige)"]
        answer: 5
        rationales: ["a is a cooking course.", "b is for children.", "c is about bikes.", "d is a language tandem.", "e is yoga.", "Correct: a hiking group for people over 60.", "f fits."]
        explanation: >-
          f: Wandergruppe 60+, "Wir wandern … zusammen", gemütliches Tempo – a group, so she isn't alone.

      - id: a2-mock1-l4-jonas
        type: mcq
        skill: reading
        variety: ch-std
        prompt: Aufgabe 18
        question: Jonas sucht für seine Tochter (10) einen Sportkurs am Wochenende.
        options: ["Anzeige a", "Anzeige b", "Anzeige c", "Anzeige d", "Anzeige e", "Anzeige f", "X (keine Anzeige)"]
        answer: 1
        rationales: ["a is a cooking course on Wednesdays.", "Correct: climbing for children aged 8–12 on Saturdays.", "c is a bike sale.", "d is a language tandem.", "e is yoga on weekdays.", "f is for people over 60.", "b fits."]
        explanation: >-
          b: Kletterhalle, Schnupperkurs für Kinder von 8 bis 12 Jahren, jeden Samstag – a sport, the right age and
          the weekend.

      - id: a2-mock1-l4-aylin
        type: mcq
        skill: reading
        variety: ch-std
        prompt: Aufgabe 19
        question: Aylin arbeitet jeden Tag bis 19 Uhr. Sie möchte am Abend asiatisch kochen lernen.
        options: ["Anzeige a", "Anzeige b", "Anzeige c", "Anzeige d", "Anzeige e", "Anzeige f", "X (keine Anzeige)"]
        answer: 6
        rationales: ["The Thai course starts at 18.30 – Aylin works until 19.00.", "b is for children.", "c is about bikes.", "d is a language tandem.", "e is yoga.", "f is a hiking group.", "Correct: no ad fits."]
        explanation: >-
          Ad a is an Asian cooking course in the evening, but it starts at 18.30 and Aylin works until 19 Uhr. So no ad
          fits: X. In every Teil 4 one person has no ad – read the times carefully.

      - id: a2-mock1-l4-brunner
        type: mcq
        skill: reading
        variety: ch-std
        prompt: Aufgabe 20
        question: Herr Brunner hat ein neues E-Bike. Sein altes Velo möchte er verkaufen.
        options: ["Anzeige a", "Anzeige b", "Anzeige c", "Anzeige d", "Anzeige e", "Anzeige f", "X (keine Anzeige)"]
        answer: 2
        rationales: ["a is a cooking course.", "b is a climbing course.", "Correct: a market for selling used bikes.", "d is a language tandem.", "e is yoga.", "f is a hiking group.", "c fits."]
        explanation: >-
          c: Velobörse – "Kaufen und verkaufen Sie gebrauchte Velos!" gebraucht = used, second-hand.

  # ===================================================================== HÖREN (30 min, 20 points)
  - id: hoeren-1
    skill: listening
    title: "Hören, Teil 1"
    minutes: 8
    instructions: >-
      **Hören, Teil 1.** *Sie hören fünf kurze Texte. Sie hören jeden Text zweimal. Wählen Sie für die Aufgaben 1
      bis 5 die richtige Lösung a, b oder c.* You hear five short texts – messages and announcements. Choose the
      right answer. In the real exam you hear each text **twice**.
    stimulus:
      title: Fünf kurze Texte
      variety: ch-std
      text: |
        Sprecher: Text 1.
        Frau Graf: Guten Tag, Herr Okafor, hier ist Frau Graf von der Praxis Dr. Huber. Ihr Termin am Dienstag um 14.30 Uhr geht leider nicht, Frau Doktor Huber ist an diesem Tag nicht da. Können Sie am Donnerstag kommen, auch um 14.30 Uhr? Bitte rufen Sie uns kurz zurück. Danke und auf Wiederhören.

        Sprecher: Text 2.
        Sprecherin: Gleisänderung: Der Intercity nach Bern, Abfahrt 10.32 Uhr, fährt heute nicht auf Gleis 5, sondern auf Gleis 7. Der Zug hat etwa fünf Minuten Verspätung. Wir bitten um Entschuldigung.

        Sprecher: Text 3.
        Sprecher: Und jetzt das Wetter für die Region Zürich. Am Morgen gibt es noch Nebel, am Nachmittag scheint dann überall die Sonne, bei 18 Grad. Morgen wird es kühler, und es regnet den ganzen Tag.

        Sprecher: Text 4.
        Sprecherin: Liebe Kundinnen und Kunden, nur heute in unserer Gemüseabteilung: Schweizer Erdbeeren zum halben Preis! Das Kilo kostet nur 6 Franken. Das Angebot gilt bis 18 Uhr.

        Sprecher: Text 5.
        Sandra: Hoi Anna, hier ist Sandra. Der Film beginnt erst um 20.15 Uhr, nicht um 19.30 Uhr. Wir essen also nicht vorher im Restaurant. Treffen wir uns um 20 Uhr direkt vor dem Kino? Bis später!
    points: [1, 1, 1, 1, 1]
    exercises:
      - id: a2-mock1-h1-termin
        type: mcq
        skill: listening
        variety: ch-std
        grammar: [dates-festivals, telling-time]
        prompt: "Text 1 – listen and choose the right answer."
        transcript: |-
          Frau Graf: Guten Tag, Herr Okafor, hier ist Frau Graf von der Praxis Dr. Huber. Ihr Termin am Dienstag um 14.30 Uhr geht leider nicht, Frau Doktor Huber ist an diesem Tag nicht da. Können Sie am Donnerstag kommen, auch um 14.30 Uhr? Bitte rufen Sie uns kurz zurück. Danke und auf Wiederhören.
        question: Wann ist der neue Termin?
        options: ["Am Dienstag um 14.30 Uhr", "Am Donnerstag um 14.30 Uhr", "Am Donnerstag um 16.30 Uhr"]
        answer: 1
        rationales: ["Tuesday was the old appointment.", "Correct: am Donnerstag, auch um 14.30 Uhr.", "The time stays the same: 14.30."]
        explanation: >-
          The old appointment (Dienstag) doesn't work; the new one is "am Donnerstag …, auch um 14.30 Uhr". auch
          tells you the time doesn't change.

      - id: a2-mock1-h1-gleis
        type: mcq
        skill: listening
        variety: ch-std
        grammar: [connectors-deshalb-trotzdem]
        prompt: "Text 2 – listen and choose the right answer."
        transcript: |-
          Sprecherin: Gleisänderung: Der Intercity nach Bern, Abfahrt 10.32 Uhr, fährt heute nicht auf Gleis 5, sondern auf Gleis 7. Der Zug hat etwa fünf Minuten Verspätung. Wir bitten um Entschuldigung.
        question: Von welchem Gleis fährt der Zug nach Bern?
        options: ["Von Gleis 7", "Von Gleis 5", "Von Gleis 17"]
        answer: 0
        rationales: ["Correct: nicht auf Gleis 5, sondern auf Gleis 7.", "Gleis 5 is the usual platform – not today.", "17 is not mentioned."]
        explanation: >-
          "nicht auf Gleis 5, sondern auf Gleis 7" – the first number is corrected. A classic distractor in
          announcements: listen for nicht … sondern.

      - id: a2-mock1-h1-wetter
        type: mcq
        skill: listening
        variety: ch-std
        grammar: [weather-forecast]
        prompt: "Text 3 – listen and choose the right answer."
        transcript: |-
          Sprecher: Und jetzt das Wetter für die Region Zürich. Am Morgen gibt es noch Nebel, am Nachmittag scheint dann überall die Sonne, bei 18 Grad. Morgen wird es kühler, und es regnet den ganzen Tag.
        question: Wie ist das Wetter heute am Nachmittag?
        options: ["Es regnet.", "Es ist neblig.", "Es ist sonnig."]
        answer: 2
        rationales: ["The rain is tomorrow.", "The fog is in the morning.", "Correct: am Nachmittag scheint überall die Sonne."]
        explanation: >-
          Three times of day, three kinds of weather: am Morgen Nebel, am Nachmittag Sonne, morgen Regen. The question
          asks about this afternoon.

      - id: a2-mock1-h1-erdbeeren
        type: mcq
        skill: listening
