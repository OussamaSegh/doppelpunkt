# A2 unit 7 – Gesund leben

# ---------- vocabulary ----------
- id: a2-u07-match-health
  type: match
  skill: vocabulary
  variety: de
  prompt: Match the health words with English.
  pairs:
    - ["die Ernährung", "diet"]
    - ["das Gemüse", "vegetables"]
    - ["der Schlaf", "sleep"]
    - ["der Rücken", "back"]
    - ["der Schnupfen", "cold (runny nose)"]
    - ["die Bewegung", "exercise"]
  explanation: >-
    Gemüse and Obst are uncountable (no plural). der Schnupfen is a runny nose; a heavier cold is eine
    Erkältung (A1.11).

- id: a2-u07-match-reflexive
  type: match
  skill: vocabulary
  variety: de
  prompt: Match the reflexive verbs with English.
  pairs:
    - ["sich ausruhen", "to rest"]
    - ["sich beeilen", "to hurry"]
    - ["sich erholen", "to recover"]
    - ["sich anziehen", "to get dressed"]
    - ["sich entspannen", "to relax"]
    - ["sich treffen", "to meet"]
  explanation: >-
    In English these verbs have no 'myself', but in German the reflexive pronoun is part of the verb: Ich ruhe
    mich aus. Beeil dich! Wir treffen uns.

# ---------- grammar: reflexive pronouns ----------
- id: a2-u07-mcq-mich
  type: mcq
  skill: grammar
  variety: ch-std
  grammar: [reflexive-verbs, reflexive-pronouns]
  prompt: Choose the correct pronoun.
  question: Jetzt fühle ich ___ viel fitter.
  options: ["mich", "mir", "sich", "ich"]
  answer: 0
  rationales:
    - "Correct. ich → mich."
    - "mir is dative – only with another object (Ich wasche mir die Hände)."
    - "sich is for er / sie / es / sie / Sie."
    - "ich is already the subject."
  explanation: >-
    The reflexive pronoun matches the subject: ich → mich, du → dich, er / sie / es → sich, wir → uns, ihr →
    euch, sie / Sie → sich. After inversion it follows the subject: Jetzt fühle ich mich …

- id: a2-u07-gap-pronouns
  type: gap
  skill: grammar
  variety: de
  grammar: [reflexive-pronouns]
  prompt: "Fill in the reflexive pronoun."
  text: Du bewegst ___ zu wenig. Wir treffen ___ um sieben. Freut ihr ___ auf die Ferien?
  answers: [["dich"], ["uns"], ["euch"]]
  explanation: >-
    du → dich, wir → uns, ihr → euch. Only the third person (and formal Sie) uses sich.

- id: a2-u07-gap-sich
  type: gap
  skill: grammar
  variety: de
  grammar: [reflexive-pronouns]
  prompt: "Fill in the reflexive pronoun."
  text: Nadine ruht ___ am Wochenende aus. Fühlen Sie ___ besser, Frau Keller? Die Kinder ziehen ___ an.
  answers: [["sich"], ["sich"], ["sich"]]
  explanation: >-
    er / sie / es, sie (plural) and formal Sie all take sich – always with a small s, even with formal Sie.

- id: a2-u07-mcq-sie-sich
  type: mcq
  skill: grammar
  variety: de
  grammar: [reflexive-pronouns, du-sie]
  prompt: You ask your doctor's receptionist. Which is correct?
  options: ["Fühlen Sie Sie besser?", "Fühlen Sie Sich besser?", "Fühlen Sie sich besser?", "Fühlen Sie Ihnen besser?"]
  answer: 2
  rationales:
    - "The reflexive pronoun of Sie is sich, not Sie."
    - "The reflexive sich is never capitalised."
    - "Correct. Formal Sie → sich (small s)."
    - "Ihnen is dative; fühlen needs the accusative reflexive."
  explanation: >-
    Formal Sie has the reflexive pronoun sich, written with a small s: Fühlen Sie sich besser? Ruhen Sie sich
    aus!

- id: a2-u07-mcq-perfekt
  type: mcq
  skill: grammar
  variety: de
  grammar: [reflexive-verbs, perfekt-haben]
  prompt: Choose the correct Perfekt.
  question: In den Ferien ___ gut erholt.
  options: ["bin ich mich", "habe mich ich", "bin ich", "habe ich mich"]
  answer: 3
  rationales:
    - "Reflexive verbs take haben, not sein."
    - "The subject comes before the pronoun."
    - "Reflexive verbs take haben – and the pronoun mich is missing."
    - "Correct. haben + subject + reflexive pronoun … participle."
  explanation: >-
    Reflexive verbs form the Perfekt with haben: Ich habe mich erholt. After inversion: In den Ferien habe ich
    mich gut erholt (verb – subject – pronoun).

- id: a2-u07-transform-perfekt
  type: transform
  skill: grammar
  variety: de
  grammar: [reflexive-verbs, perfekt-haben]
  prompt: "Put the sentence into the Perfekt."
  from: de
  to: de
  source: Wir treffen uns am See.
  answers: ["Wir haben uns am See getroffen."]
  explanation: >-
    treffen is irregular: getroffen. Reflexive verbs take haben, and the pronoun uns stays after the
    auxiliary: Wir haben uns … getroffen.

- id: a2-u07-gap-separable
  type: gap
  skill: grammar
  variety: ch-std
  grammar: [reflexive-verbs, separable-verbs]
  prompt: "Separable reflexive verbs: fill in the pronoun and the prefix."
  text: Ich stehe um sechs auf und ziehe ___ ___. Am Sonntag ruhe ich mich ___.
  answers: [["mich"], ["an"], ["aus"]]
  explanation: >-
    sich anziehen and sich ausruhen are separable: the prefix goes to the end, the pronoun stays after the
    verb: Ich ziehe mich an. Ich ruhe mich aus.

# ---------- grammar: reflexive verbs ----------
- id: a2-u07-mcq-freuen-auf
  type: mcq
  skill: grammar
  variety: de
  grammar: [reflexive-verbs]
  prompt: "How do you say \"I'm looking forward to the weekend\"?"
  options: ["Ich freue mich über das Wochenende.", "Ich freue mich auf das Wochenende.", "Ich freue auf das Wochenende.", "Ich bin froh auf das Wochenende."]
  answer: 1
  rationales:
    - "sich freuen über = to be happy about something that has happened or is here."
    - "Correct. sich freuen auf + accusative = to look forward to."
    - "freuen needs the reflexive pronoun mich."
    - "froh sein doesn't take auf."
  explanation: >-
    sich freuen auf (the future): Ich freue mich auf das Wochenende. sich freuen über (now / the past): Ich
    freue mich über das Geschenk.

- id: a2-u07-mcq-waschen
  type: mcq
  skill: grammar
  variety: de
  grammar: [reflexive-verbs]
  prompt: "Which sentence means \"I'm having a wash\"?"
  options: ["Ich wasche.", "Ich wasche das Auto.", "Ich wasche mir.", "Ich wasche mich."]
  answer: 3
  rationales:
    - "waschen needs an object."
    - "That's washing the car."
    - "mir needs another object (mir die Hände)."
    - "Correct. You wash yourself: mich."
  explanation: >-
    waschen can have any object (das Auto, das Kind). When you wash yourself it is reflexive: Ich wasche mich.
    With another object the pronoun becomes dative: Ich wasche mir die Hände.

- id: a2-u07-match-situations
  type: match
  skill: grammar
  variety: de
  grammar: [reflexive-verbs, reflexive-pronouns]
  prompt: Match the beginnings with the endings.
  pairs:
    - ["Nach dem Sport dusche ich", "mich."]
    - ["Wie fühlst du", "dich heute?"]
    - ["Am Samstag treffen wir", "uns im Park."]
    - ["Der Zug fährt gleich – beeilt", "euch!"]
  explanation: >-
    Each pronoun matches its subject: ich – mich, du – dich, wir – uns, ihr – euch (the ihr imperative beeilt
    euch!).

- id: a2-u07-order-ausruhen
  type: order
  skill: grammar
  variety: ch-std
  grammar: [reflexive-verbs, reflexive-pronouns, separable-verbs]
  prompt: Put the words in order.
  tokens: ["Am", "Wochenende", "ruhe", "ich", "mich", "richtig", "aus"]
  answers: ["Am Wochenende ruhe ich mich richtig aus.", "Ich ruhe mich am Wochenende richtig aus."]
  explanation: >-
    Verb in position 2, then subject, then the reflexive pronoun; the prefix aus goes to the end.

- id: a2-u07-order-treffen
  type: order
  skill: grammar
  variety: de
  grammar: [reflexive-verbs, modal-koennen-wollen]
  prompt: Put the words in order.
  tokens: ["Wir", "können", "uns", "am", "Donnerstag", "treffen"]
  answers: ["Wir können uns am Donnerstag treffen.", "Am Donnerstag können wir uns treffen."]
  explanation: >-
    With a modal verb the infinitive goes to the end; the reflexive pronoun stays near the front, after the
    modal (and after the subject if it is inverted).

- id: a2-u07-mcq-position
  type: mcq
  skill: grammar
  variety: de
  grammar: [reflexive-pronouns]
  prompt: Choose the correct word order.
  options: ["Heute ich fühle mich gut.", "Heute fühle mich ich gut.", "Heute fühle ich mich gut.", "Heute mich fühle ich gut."]
  answer: 2
  rationales:
    - "The verb must be in position 2."
    - "A pronoun subject comes before the reflexive pronoun."
    - "Correct. Verb – subject – reflexive pronoun."
    - "The verb must be in position 2."
  explanation: >-
    After a time word the verb comes second, then the subject, then the reflexive pronoun: Heute fühle ich
    mich gut.

# ---------- grammar: sich + dative, advice ----------
- id: a2-u07-gap-dative-body
  type: gap
  skill: grammar
  variety: de
  grammar: [reflexive-dative-body]
  prompt: "Preview: fill in mir or mich."
  text: Ich wasche ___. Dann putze ich ___ die Zähne und ziehe ___ eine Jacke an.
  answers: [["mich"], ["mir"], ["mir"]]
  explanation: >-
    No other object → accusative mich. With another object (die Zähne, eine Jacke) the reflexive pronoun is
    dative: mir.

- id: a2-u07-translate-teeth
  type: translate
  skill: writing
  variety: de
  grammar: [reflexive-dative-body]
  prompt: Translate into German.
  source: I brush my teeth in the morning.
  answers: ["Ich putze mir am Morgen die Zähne.", "Am Morgen putze ich mir die Zähne.", "Ich putze mir morgens die Zähne.", "Morgens putze ich mir die Zähne."]
  explanation: >-
    German says mir die Zähne (dative reflexive + the article), not meine Zähne. Time before the object: mir
    am Morgen die Zähne.

- id: a2-u07-gap-advice
  type: gap
  skill: grammar
  variety: de
  grammar: [giving-advice, imperative, reflexive-pronouns]
  prompt: "Give advice to a friend (du): fill in the imperative and the pronoun."
  text: Du bist so müde. ___ dich doch aus! Und morgen ___ du mehr schlafen.
  answers: [["Ruh", "Ruhe"], ["musst"]]
  explanation: >-
    The du imperative of sich ausruhen: Ruh dich aus! (the pronoun stays). müssen for strong advice: Du musst
    mehr schlafen.

- id: a2-u07-mcq-advice
  type: mcq
  skill: speaking
  variety: de
  grammar: [giving-advice]
  prompt: Your colleague can't sleep. Which piece of advice sounds friendly and natural?
  options: ["Am besten legst du das Handy eine Stunde vor dem Schlafen weg.", "Du schläfst schlecht.", "Leg weg das Handy!", "Du musst nicht schlafen."]
  answer: 0
  rationales:
    - "Correct. Am besten … is a friendly way to give advice."
    - "This only states the problem."
    - "The prefix weg goes to the end: Leg das Handy weg!"
    - "This says the opposite."
  explanation: >-
    Am besten + verb + subject is a soft way to advise. Also: Leg das Handy doch weg! Du kannst auch Yoga
    machen.

- id: a2-u07-transform-imperative
  type: transform
  skill: grammar
  variety: de
  grammar: [giving-advice, imperative, reflexive-pronouns]
  prompt: "Make it an imperative for a friend (du)."
  from: de
  to: de
  source: Du musst dich beeilen.
  answers: ["Beeil dich!", "Beeile dich!", "Beeil dich doch!"]
  explanation: >-
    du beeilst dich → Beeil dich! The verb comes first, -st and du disappear, the pronoun dich stays.

- id: a2-u07-translate-rest
  type: translate
  skill: writing
  variety: de
  grammar: [giving-advice, reflexive-verbs]
  prompt: Translate into German (informal).
  source: You look tired. Have a rest!
  answers: ["Du siehst müde aus. Ruh dich aus!", "Du siehst müde aus. Ruhe dich aus!", "Du siehst müde aus. Ruh dich doch aus!", "Du siehst müde aus. Ruh dich mal aus!"]
  explanation: >-
    aussehen (to look) is separable: du siehst … aus. Have a rest = Ruh dich aus! (sich ausruhen, imperative).

