- id: a2-u07-speak-shadow-tom
  type: speak
  skill: speaking
  variety: de
  grammar: [reflexive-verbs]
  prompt: "Shadowing: speak along with Tom's line from the intro dialogue, then say it alone."
  target: Doch, aber ich bin total gestresst. Ich schlafe schlecht und bewege mich zu wenig.
  explanation: >-
    DOCH answers a negative question (Fühlst du dich nicht gut?). Stress toTAL geSTRESST and WE-nig. ich and
    mich have the soft ich-sound. See the drill The ich-Laut (soft ch).

- id: a2-u07-speak-shadow-nadine
  type: speak
  skill: speaking
  variety: ch-std
  grammar: [reflexive-verbs, separable-verbs]
  prompt: "Shadowing: speak along with Nadine, then say it alone."
  target: Am Morgen, vor der Arbeit. Ich stehe um sechs auf, ziehe mich an und jogge eine halbe Stunde am See.
  explanation: >-
    Swiss Standard German: the r is tapped and -er in der is not reduced; ch in mich and ich is the back sound
    for many Swiss speakers. See the drill The Swiss Standard German accent.

- id: a2-u07-speak-intonation
  type: speak
  skill: speaking
  variety: de
  grammar: [giving-advice]
  prompt: "Intonation: friendly advice with doch falls gently; stress the verb prefix."
  target: Ruh dich doch mal aus!
  explanation: >-
    In Ruh dich doch mal AUS! the stress is on the prefix aus, and the voice falls at the end. doch and mal
    are unstressed and make it friendly, not an order.

- id: a2-u07-speak-pron-ich
  type: speak
  skill: speaking
  variety: de
  grammar: [reflexive-pronouns]
  prompt: "Pronunciation: the ich-Laut. Read aloud slowly."
  target: Ich fühle mich richtig fit, und ich freue mich, dass sich alle so viel bewegen.
  explanation: >-
    ich, mich, sich, richtig: the soft ch after i (and e, ä, ö, ü, ei, eu) – smile and whisper the y of
    yes. Don't say k or sh. See the drill The ich-Laut (soft ch).

# ---------- roleplay and writing ----------
- id: a2-u07-roleplay-lena
  type: roleplay
  skill: speaking
  variety: de
  grammar: [reflexive-verbs, reflexive-pronouns, giving-advice]
  tutor: lena
  prompt: "Roleplay with Lena: feeling stressed."
  scenario: >-
    Lena has been very stressed lately and sleeps badly. Ask her how she feels and what her day is like,
    then give her two or three pieces of advice. Tell her what you do to relax.
  goals:
    - Ask how she feels with sich fühlen (Wie fühlst du dich?).
    - Use at least three reflexive verbs with the right pronoun.
    - Give advice with an imperative, müssen / können or am besten.
    - Say what you do to relax (Ich entspanne mich beim …).
  model: |
    Du: Hallo Lena! Wie fühlst du dich?
    Lena: Nicht so gut. Ich bin total gestresst und schlafe schlecht.
    Du: Bewegst du dich genug?
    Lena: Nein, ich sitze den ganzen Tag am Computer.
    Du: Dann geh doch in der Mittagspause spazieren! Und am besten legst du am Abend das Handy weg.
    Lena: Gute Idee. Und was machst du gegen Stress?
    Du: Ich mache Yoga. Dabei entspanne ich mich gut. Am Wochenende treffe ich mich mit Freunden.
    Lena: Das klingt gut. Ich freue mich schon aufs Wochenende!
  explanation: >-
    Reflexive verbs: fühlst du dich, bewegst du dich, entspanne ich mich, treffe ich mich, freue mich. Advice:
    imperative with doch, am besten.

- id: a2-u07-write-routine
  type: write
  skill: writing
  variety: de
  grammar: [reflexive-verbs, reflexive-pronouns, giving-advice, perfekt-haben]
  prompt: Write about your healthy (or unhealthy) week.
  task: >-
    A friend asks how you keep fit. Write a message (6–8 sentences): describe your normal day, what you do for
    sport, sleep and food, how you felt last week, and give your friend one tip.
  minWords: 50
  model: >-
    Hallo Sam! Unter der Woche stehe ich um sieben auf, dusche mich und ziehe mich schnell an. Ich fahre mit
    dem Velo zur Arbeit, so bewege ich mich jeden Tag ein bisschen. Am Mittwoch gehe ich ins Fitnessstudio.
    Letzte Woche habe ich mich aber nicht gut gefühlt: Ich hatte einen Schnupfen und habe mich viel
    ausgeruht. Jetzt esse ich mehr Gemüse und trinke viel Wasser. Mein Tipp für dich: Am besten triffst du dich
    am Wochenende mit Freunden zum Wandern. Liebe Grüße, Alex
  checklist:
    - I use at least four reflexive verbs with the right pronoun (mich, dich, sich …).
    - In questions and after inversion the pronoun comes after the subject (habe ich mich …).
    - I use the Perfekt with haben for reflexive verbs (habe mich gefühlt).
    - I give advice with an imperative, müssen, können or am besten.
  explanation: >-
    Reflexive verbs in the present (dusche mich), with separable prefixes (ziehe mich an), in the Perfekt
    (habe mich ausgeruht), and advice with am besten.

# ---------- Swiss Standard German ----------
- id: a2-u07-chstd-match
  type: match
  skill: vocabulary
  variety: ch-std
  prompt: Match the Swiss Standard German words with the words used in Germany.
  pairs:
    - ["das Fitness", "das Fitnessstudio"]
    - ["die Früchte", "das Obst"]
    - ["Das tönt gut.", "Das klingt gut."]
    - ["regelmässig", "regelmäßig"]
  explanation: >-
    tönen in the sense of klingen is Swiss (Duden: schweizerisch). Swiss shops and menus often say Früchte for
    Obst, and a gym is often just das Fitness. Swiss spelling: ss for ß.

# ---------- Swiss lane (gsw-zh) ----------
- id: a2-u07-ch-mcq-muued
  type: mcq
  skill: listening
  variety: gsw-zh
  prompt: Listen to Reto. Why is he tired?
  transcript: |-
    Reto: Ich bi total gstresst. Im Kafi isch so vill los, und ich schlaf schlächt.
  options: ["He has been jogging.", "He has a cold.", "He is stressed, it's busy at the café and he sleeps badly.", "He went out late last night."]
  answer: 2
  rationales:
    - "Sandra suggests jogging later."
    - "He doesn't mention being ill."
    - "Correct. gstresst = gestresst, vill los = viel los, schlächt = schlecht."
    - "He says nothing about going out."
  explanation: >-
    Ich bi total gstresst = Ich bin total gestresst. es isch vill los = es ist viel los (it's busy). ich schlaf
    schlächt = ich schlafe schlecht.

- id: a2-u07-ch-transform-go
  type: transform
  skill: reading
  variety: gsw-zh
  prompt: What does Sandra say? Write it in Standard German.
  from: gsw-zh
  to: de
  source: Ich gang am Abig go jogge – chunnsch mit?
  answers: ["Ich gehe am Abend joggen – kommst du mit?", "Ich gehe heute Abend joggen – kommst du mit?", "Ich gehe am Abend joggen. Kommst du mit?"]
  explanation: >-
    go + infinitive: Ich gang go jogge = Ich gehe joggen. Standard German has no word for go. chunnsch mit? =
    kommst du mit? (the du is dropped).

- id: a2-u07-ch-match-go
  type: match
  skill: vocabulary
  variety: gsw-zh
  prompt: Match the Zurich German phrases with Standard German.
  pairs:
    - ["Ich gang go jogge.", "Ich gehe joggen."]
    - ["Mir gönd go poschte.", "Wir gehen einkaufen."]
    - ["Gömmer go schwümme?", "Gehen wir schwimmen?"]
    - ["Ich bi go jogge.", "Ich bin joggen gegangen."]
  explanation: >-
    go stands before the infinitive after gaa (gehen). In the past gange disappears: Ich bi go jogge. poschte =
    einkaufen, gömmer = gehen wir.

- id: a2-u07-ch-mcq-froei
  type: mcq
  skill: grammar
  variety: gsw-zh
  grammar: [reflexive-verbs]
  prompt: "What is \"Ich fröi mich!\" in Standard German?"
  options: ["Ich bin froh.", "Ich freue mich!", "Ich fühle mich gut.", "Ich ruhe mich aus."]
  answer: 1
  rationales:
    - "Close in meaning, but fröie is the verb freuen."
    - "Correct. sich fröie = sich freuen (eu → öi)."
    - "That would be Ich füel mich guet."
    - "That would be Ich ruebe mich uus / ich ruhe mich uus."
  explanation: >-
    Standard eu often becomes öi in Swiss German: freuen → fröie, neu → nöi (Bernese). The reflexive pronoun works as in Standard German: ich fröi mich.

