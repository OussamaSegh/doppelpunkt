# ---------- roleplay and writing ----------
- id: a2-u05-roleplay-lena
  type: roleplay
  skill: speaking
  variety: de
  grammar: [two-way-prepositions, position-verbs, preposition-contractions]
  tutor: lena
  prompt: "Roleplay with Lena: moving day."
  scenario: >-
    Lena is moving and you are helping. She tells you where the furniture goes, and you ask and say where
    you put things. Then describe the living room together.
  goals:
    - Ask where things go with Wohin? and answer with an accusative (in die Küche, an die Wand).
    - Say where things are with Wo? and a dative (im Flur, auf dem Tisch).
    - Use stellen / legen / hängen for movement and stehen / liegen / hängen for position.
    - Use im / ins and am / ans.
  model: |
    Lena: Danke, dass du mir hilfst! Der Schrank ist sehr schwer.
    Du: Kein Problem. Wohin kommt der Schrank?
    Lena: Ins Schlafzimmer, an die Wand neben dem Fenster.
    Du: Okay. Und wo sind die Bücher?
    Lena: Sie sind im Karton im Flur. Stell sie bitte ins Regal.
    Du: Mache ich. Wohin hängen wir den Spiegel?
    Lena: An die Tür im Bad.
    Du: Fertig! Der Spiegel hängt jetzt an der Tür, und die Bücher stehen im Regal.
  explanation: >-
    Wohin? → accusative (ins Schlafzimmer, an die Wand, an die Tür); Wo? → dative (im Flur, neben dem Fenster,
    an der Tür). Books stand in a shelf (stehen), so stellen.

- id: a2-u05-write-room
  type: write
  skill: writing
  variety: de
  grammar: [two-way-prepositions, position-verbs, preposition-contractions, perfekt-haben]
  prompt: Describe your new room.
  task: >-
    You have just moved. Write a message to a friend (6–8 sentences): say when you moved and who helped,
    describe one room (what is where), say what is still in boxes, and invite your friend.
  minWords: 50
  model: >-
    Hallo Leo! Seit Samstag wohne ich in der neuen Wohnung. Meine Schwester hat mir beim Umzug geholfen. Mein
    Zimmer ist klein, aber sehr hell. Das Bett steht an der Wand, und neben dem Bett steht ein Regal. Über dem
    Schreibtisch hängt ein Bild von London. Auf dem Boden liegt ein grüner Teppich. Die Bücher sind noch im
    Karton im Flur, aber morgen stelle ich sie ins Regal. Komm doch am Wochenende vorbei! Liebe Grüße, Maya
  checklist:
    - I use stehen, liegen and hängen for things that are somewhere.
    - After Wo? I use the dative (an der Wand, neben dem Bett, im Karton).
    - After Wohin? I use the accusative (ins Regal, in die Küche).
    - I use the contractions im, ins, am.
    - I use the Perfekt for the move (hat mir geholfen).
  explanation: >-
    A room description is a chain of position verbs + dative. Plans use movement verbs + accusative (morgen
    stelle ich sie ins Regal).

# ---------- Swiss Standard German ----------
- id: a2-u05-chstd-match
  type: match
  skill: vocabulary
  variety: ch-std
  prompt: Match the Swiss Standard German words with the words used in Germany.
  pairs:
    - ["zügeln", "umziehen"]
    - ["der Gang", "der Flur"]
    - ["das Gestell", "das Regal"]
    - ["der Estrich", "der Dachboden"]
  explanation: >-
    zügeln is Swiss for moving house (Wiktionary: Schweiz). der Gang is the Swiss hallway, das Gestell a set of
    shelves, and der Estrich the attic (in Germany Estrich is floor screed).

# ---------- Swiss lane (gsw-zh) ----------
- id: a2-u05-ch-mcq-ane
  type: mcq
  skill: listening
  variety: gsw-zh
  grammar: [two-way-prepositions]
  prompt: Listen to Reto. What does he ask?
  transcript: |-
    Reto: Hoi! Ich ha der s Tischli us em Chäller bracht. Wo söll ich s ane stelle?
  options: ["Whether Sandra needs a table", "Where the cellar is", "Where he should put the little table", "Whether he can take the table to the cellar"]
  answer: 2
  rationales:
    - "He has already brought it."
    - "He has just come from the cellar."
    - "Correct. Wo söll ich s ane stelle? = Wohin soll ich es stellen?"
    - "He brought it from the cellar (us em Chäller)."
  explanation: >-
    s Tischli = das kleine Tischchen (-li diminutive), us em Chäller = aus dem Keller, wo … ane = wohin,
    söll = soll.

