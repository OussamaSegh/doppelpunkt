  options: ["Carry the empty boxes down to the cellar", "Bring more boxes up from the cellar", "Throw the boxes away outside", "Unpack the boxes in the living room"]
  answer: 0
  rationales:
    - "Correct. abe = hinunter, in Chäller = in den Keller, träge = tragen."
    - "ufe would be up; he is going down."
