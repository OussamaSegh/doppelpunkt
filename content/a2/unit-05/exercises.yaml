- id: a2-u05-roleplay-reto
  type: roleplay
  skill: listening
  variety: gsw-zh
  grammar: [two-way-prepositions, position-verbs]
  tutor: reto
  prompt: "Listening roleplay with Reto: help him furnish his balcony."
  scenario: >-
    Reto has bought a small table and two chairs for his balcony. He asks you in Zurich German where to put
    them and tells you where things are. You answer in Standard German.
  goals:
    - Understand Wo söll ich … ane stelle? and the direction words ufe, abe, ine, use.
    - Understand the -li words (Tischli, Stüeli, es Bitzeli).
    - Tell Reto where things go with Wohin? + accusative.
  model: |
    Reto: Lueg, es Tischli und zwei Stüeli für de Balkon! Wo söll ich s Tischli ane stelle?
    Du: Stell es in die Ecke, neben die Tür.
    Reto: Guet. Und d Stüeli?
    Du: Die Stühle stellen wir an den Tisch.
    Reto: Perfekt. Chunnsch mit use? Mir trinked es Bier.
    Du: Gern! Wo ist das Bier?
    Reto: Im Chüelschrank, une i de Chuchi.
  explanation: >-
    Decoding: wo … ane = wohin, s Tischli / d Stüeli = the small table / chairs (-li, neuter), use = hinaus
    (on the balcony), une i de Chuchi = unten in der Küche (Wo?, dative de).

