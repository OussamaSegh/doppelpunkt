- id: a2-u05-speak-pron-st
  type: speak
  skill: speaking
  variety: de
  grammar: [position-verbs]
  prompt: "Pronunciation: st and sp at the start of a word. Read aloud slowly."
  target: Stell den Stuhl in die Ecke, der Spiegel steht schon im Flur, und der Schrank ist sehr schwer.
  explanation: >-
    At the start of a word st and sp are scht and schp: Stell, Stuhl, Spiegel, steht. Inside a word st is
