# A2 unit 5 – Umziehen und Einrichten

# ---------- vocabulary ----------
- id: a2-u05-match-furniture
  type: match
  skill: vocabulary
  variety: de
  prompt: Match the furniture with English.
  pairs:
    - ["der Schrank", "cupboard, wardrobe"]
    - ["der Sessel", "armchair"]
    - ["das Regal", "shelves"]
    - ["der Teppich", "rug"]
    - ["der Spiegel", "mirror"]
    - ["der Vorhang", "curtain"]
  explanation: >-
    Most furniture nouns are masculine (der Schrank, der Tisch, der Stuhl, der Sessel); learn them with der.
    Möbel (furniture) is plural only: die Möbel.

- id: a2-u05-match-room
  type: match
  skill: vocabulary
  variety: de
  prompt: Match the room and moving words with English.
  pairs:
    - ["die Wand", "wall"]
    - ["die Decke", "ceiling"]
    - ["der Boden", "floor"]
    - ["die Ecke", "corner"]
    - ["der Umzug", "move"]
    - ["tragen", "to carry"]
  explanation: >-
    die Decke is both the ceiling and a blanket. der Umzug comes from umziehen (to move house); in
    Switzerland people say zügeln.

# ---------- grammar: two-way prepositions ----------
- id: a2-u05-mcq-wo-wohin
  type: mcq
  skill: grammar
  variety: ch-std
  grammar: [two-way-prepositions]
  prompt: Choose the correct article.
  question: Stell das Sofa bitte an ___ Wand.
  options: ["der", "den", "die", "dem"]
  answer: 2
  rationales:
    - "der would be Wo? (an der Wand = on the wall) – but stellen is movement."
    - "den is masculine; die Wand is feminine."
    - "Correct. Wohin? → accusative: an die Wand."
    - "dem is masculine or neuter dative."
  explanation: >-
    stellen describes movement to a place (Wohin?), so an takes the accusative: an die Wand. The result is
    a position (Wo?): Das Sofa steht an der Wand.

- id: a2-u05-gap-wo
  type: gap
  skill: grammar
  variety: de
  grammar: [two-way-prepositions]
  prompt: "Where is it? Fill in dem or der (Wo? + dative)."
  text: Der Karton steht hinter ___ Tür. Die Lampe hängt über ___ Tisch. Die Katze schläft unter ___ Bett.
  answers: [["der"], ["dem"], ["dem"]]
  explanation: >-
    Position (Wo?) takes the dative: die Tür → hinter der Tür, der Tisch → über dem Tisch, das Bett → unter
    dem Bett.

- id: a2-u05-gap-wohin
  type: gap
  skill: grammar
  variety: de
  grammar: [two-way-prepositions]
  prompt: "Where does it go? Fill in den, die or das (Wohin? + accusative)."
  text: Ich stelle den Sessel in ___ Ecke. Leg das Buch auf ___ Tisch. Häng die Jacke über ___ Sofa.
  answers: [["die"], ["den"], ["das"]]
  explanation: >-
    Movement (Wohin?) takes the accusative: in die Ecke (f), auf den Tisch (m – the only form that changes
    from the nominative), über das Sofa (n).

- id: a2-u05-mcq-liegt-auf
  type: mcq
  skill: grammar
  variety: de
  grammar: [two-way-prepositions, position-verbs]
  prompt: Choose the correct phrase.
  question: Wo ist mein Handy? – Es liegt ___.
  options: ["auf dem Tisch", "auf den Tisch", "auf der Tisch", "auf Tisch"]
  answer: 0
  rationales:
    - "Correct. Wo? → dative: auf dem Tisch."
    - "den is accusative (Wohin?): Ich lege es auf den Tisch."
    - "der Tisch is masculine; the dative is dem."
    - "German needs the article here."
  explanation: >-
    liegen is a position (Wo?), so auf takes the dative: auf dem Tisch. With legen (movement) it would be
    auf den Tisch.

- id: a2-u05-mcq-ins
  type: mcq
  skill: grammar
  variety: de
  grammar: [preposition-contractions, two-way-prepositions]
  prompt: Choose the right form.
  question: Es ist spät. Ich gehe jetzt ___ Bett.
  options: ["im", "am", "in den", "ins"]
  answer: 3
  rationales:
    - "im = in dem: a position (Ich liege im Bett)."
    - "am = an dem: next to / at the bed."
    - "das Bett is neuter, so not den."
    - "Correct. Movement: in das → ins Bett."
  explanation: >-
    ins Bett gehen is movement (Wohin?): in das → ins. Once you are there: Ich liege im Bett (in dem → im).

- id: a2-u05-transform-wohin-wo
  type: transform
  skill: grammar
  variety: de
  grammar: [two-way-prepositions, position-verbs]
  prompt: "Say where the picture is now. Use hängt."
  from: de
  to: de
  source: Ich hänge das Bild an die Wand.
  answers: ["Das Bild hängt an der Wand.", "Jetzt hängt das Bild an der Wand.", "Es hängt an der Wand."]
  explanation: >-
    After the movement (an die Wand, accusative) comes the position (an der Wand, dative). hängen is used
    for both, but the case changes.

- id: a2-u05-gap-zwischen
  type: gap
  skill: grammar
  variety: ch-std
  grammar: [two-way-prepositions]
  prompt: "Fill in the article (Wo? = dative)."
  text: Im Gang steht das Velo zwischen ___ Schrank und ___ Tür.
  answers: [["dem"], ["der"]]
  explanation: >-
    stehen = position, so zwischen takes the dative: der Schrank → dem Schrank, die Tür → der Tür. Swiss
    Standard German keeps the Velo in the Gang (hallway).

# ---------- grammar: stellen / stehen, legen / liegen, hängen ----------
- id: a2-u05-mcq-stellen-legen
  type: mcq
  skill: grammar
  variety: de
  grammar: [position-verbs]
  prompt: Choose the right verb for the bottle.
  question: Ich ___ die Flasche Wein in den Kühlschrank.
  options: ["lege", "stelle", "stehe", "liege"]
  answer: 1
  rationales:
    - "legen is for things put flat (a book, a phone)."
    - "Correct. A bottle stands upright: stellen + accusative."
    - "stehen has no object: Die Flasche steht im Kühlschrank."
    - "liegen = to lie (no object)."
  explanation: >-
    German chooses the verb by position: upright → stellen / stehen, flat → legen / liegen. A bottle stands:
    Ich stelle die Flasche in den Kühlschrank. Now it steht im Kühlschrank.

- id: a2-u05-mcq-steht
  type: mcq
  skill: grammar
  variety: de
  grammar: [position-verbs, two-way-prepositions]
  prompt: Choose the correct sentence.
  options: ["Der Tisch stellt in der Küche.", "Der Tisch steht in die Küche.", "Der Tisch stellt in die Küche.", "Der Tisch steht in der Küche."]
  answer: 3
  rationales:
    - "stellen needs a person who puts something somewhere."
    - "Position takes the dative: in der Küche."
    - "A table can't put itself anywhere."
    - "Correct. Position verb + dative."
  explanation: >-
    The table is simply there: stehen + Wo? + dative (in der Küche). stellen would need a subject who does
    it: Nadine stellt den Tisch in die Küche.

- id: a2-u05-match-verb-pairs
  type: match
  skill: grammar
  variety: de
  grammar: [position-verbs]
  prompt: Match each movement with the position that results.
  pairs:
    - ["Ich stelle die Lampe auf den Tisch.", "Die Lampe steht auf dem Tisch."]
    - ["Ich lege das Buch ins Regal.", "Das Buch liegt im Regal."]
    - ["Ich hänge den Spiegel an die Wand.", "Der Spiegel hängt an der Wand."]
    - ["Ich lege den Teppich vor das Sofa.", "Der Teppich liegt vor dem Sofa."]
  explanation: >-
    Movement verbs (stellen, legen, hängen) + accusative → position verbs (stehen, liegen, hängen) + dative:
    auf den → auf dem, ins → im, an die → an der, vor das → vor dem.

- id: a2-u05-order-sofa
  type: order
  skill: grammar
  variety: ch-std
  grammar: [two-way-prepositions, position-verbs]
  prompt: Put the words in order.
  tokens: ["Das", "Sofa", "steht", "unter", "dem", "Fenster"]
  answers: ["Das Sofa steht unter dem Fenster.", "Unter dem Fenster steht das Sofa."]
  explanation: >-
    Position: stehen + unter dem Fenster (dative). The place can also go first; then the verb stays in
    position 2 and the subject follows.

- id: a2-u05-order-glaeser
  type: order
  skill: grammar
  variety: de
  grammar: [two-way-prepositions, position-verbs, imperative]
  prompt: Put the words in order.
  tokens: ["Stell", "die", "Gläser", "bitte", "in", "den", "Schrank"]
  answers: ["Stell die Gläser bitte in den Schrank.", "Stell bitte die Gläser in den Schrank."]
  explanation: >-
    Imperative (du): the verb comes first. Glasses stand upright, so stellen. in den Schrank: masculine
    accusative, because the glasses move into the cupboard.

- id: a2-u05-mcq-haengen
  type: mcq
  skill: grammar
  variety: de
  grammar: [position-verbs, perfekt-haben]
  prompt: Choose the correct Perfekt.
  question: Gestern ___ ich das Bild über das Sofa ___.
  options: ["habe … gehangen", "bin … gehängt", "habe … gehängt", "bin … gehangen"]
  answer: 2
  rationales:
    - "gehangen is the participle of the position verb (Das Bild hat dort gehangen)."
    - "Movement verbs with an object take haben."
    - "Correct. hängen + object (movement) is regular: habe … gehängt."
    - "This mixes sein with the position participle."
  explanation: >-
    hängen with an object (I hang something) is regular: hat gehängt. hängen as a position (it hangs) is
    irregular: hat gehangen. Compare stellen – hat gestellt, stehen – hat gestanden.

- id: a2-u05-gap-verbs
  type: gap
  skill: grammar
  variety: de
  grammar: [position-verbs]
  prompt: "Fill in liegt, steht or hängt."
  text: Der Teppich ___ auf dem Boden. Die Lampe ___ an der Decke. Der Sessel ___ in der Ecke.
  answers: [["liegt"], ["hängt"], ["steht"]]
  explanation: >-
    A rug lies flat (liegt), a ceiling light hangs (hängt), an armchair stands (steht). All three describe
    a position, so the prepositions take the dative.

- id: a2-u05-translate-put
  type: translate
  skill: writing
  variety: de
  grammar: [position-verbs, two-way-prepositions]
  prompt: Translate into German (informal). You are talking about a bag.
  source: Put the bag on the chair, please.
  answers: ["Stell die Tasche bitte auf den Stuhl.", "Stell bitte die Tasche auf den Stuhl.", "Leg die Tasche bitte auf den Stuhl.", "Leg bitte die Tasche auf den Stuhl.", "Stell die Tasche auf den Stuhl, bitte.", "Leg die Tasche auf den Stuhl, bitte."]
  explanation: >-
    English put = stellen (upright) or legen (flat); a bag can be either. auf den Stuhl: movement, so
    accusative (der Stuhl → den Stuhl).

# ---------- grammar: contractions ----------
- id: a2-u05-gap-contractions
  type: gap
  skill: grammar
  variety: de
  grammar: [preposition-contractions]
  prompt: "Fill in im, ins, am or ans."
  text: Das Bett steht ___ Schlafzimmer. Stell das Sofa ___ Wohnzimmer! Der Spiegel hängt ___ Schrank.
  answers: [["im"], ["ins"], ["am"]]
  explanation: >-
    Wo? → im (in dem), am (an dem). Wohin? → ins (in das), ans (an das). Use the contraction: im Schlafzimmer,
    not in dem Schlafzimmer.

- id: a2-u05-mcq-im-zentrum
  type: mcq
  skill: grammar
  variety: de
  grammar: [preposition-contractions, two-way-prepositions]
  prompt: Choose the right form.
  question: Unsere neue Wohnung ist ___ Zentrum, direkt am See.
  options: ["im", "ins", "in", "in das"]
  answer: 0
  rationales:
    - "Correct. Position: in dem → im Zentrum."
    - "ins is movement (Wohin?)."
    - "das Zentrum needs an article here."
    - "in das is movement – and would contract to ins."
  explanation: >-
    sein + place is a position (Wo?): im Zentrum. am See (an dem See) is the same pattern. Movement would be
    Wir ziehen ins Zentrum.

- id: a2-u05-transform-wohin
  type: transform
  skill: grammar
  variety: de
  grammar: [two-way-prepositions, position-verbs]
  prompt: "Say where you put it. Start with Ich stelle …"
  from: de
  to: de
  source: Der Stuhl steht in der Ecke.
  answers: ["Ich stelle den Stuhl in die Ecke."]
  explanation: >-
    stehen (position, Wo? + dative) → stellen (movement, Wohin? + accusative): der Stuhl becomes the object
    den Stuhl, and in der Ecke becomes in die Ecke.

- id: a2-u05-translate-moved
  type: translate
  skill: writing
  variety: ch-std
  grammar: [two-way-prepositions, perfekt-sein]
  prompt: Translate into Swiss Standard German. Use zügeln.
  source: We moved into a new flat in May.
  answers: ["Wir sind im Mai in eine neue Wohnung gezügelt.", "Im Mai sind wir in eine neue Wohnung gezügelt.", "Wir haben im Mai in eine neue Wohnung gezügelt.", "Im Mai haben wir in eine neue Wohnung gezügelt."]
  explanation: >-
    in eine neue Wohnung: movement, so accusative. zügeln (= umziehen) takes sein like umziehen (Wir sind
    umgezogen); with haben is also heard (Wiktionary). im Mai = in dem Mai.

