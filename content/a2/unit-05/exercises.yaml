- id: a2-u05-ch-be-mcq-zuegle
  type: mcq
  skill: listening
  variety: gsw-be
  prompt: Listen to Sandra. What news does she give about Mia?
  transcript: |-
    Sandra: Ja, Mami! Es isch so härzig. Und d Mia züglet im Mai uf Thun.
  options: ["Mia is getting a kitten in May.", "Mia is moving to Thun in May.", "Mia is visiting Thun in May.", "Mia is getting married in Thun."]
  answer: 1
  explanation: >-
    zügle = umziehen (berndeutsch.ch: zügle, PP. züglet; Swiss Standard zügeln). uf Thun = nach Thun. härzig =
    herzig (cute) is about Sandra's kitten.

