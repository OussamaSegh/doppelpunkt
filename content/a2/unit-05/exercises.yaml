- id: a2-u05-ch-match-li
  type: match
  skill: vocabulary
  variety: gsw-zh
  prompt: Match the -li words with their meaning.
  pairs:
    - ["s Tischli", "a small table"]
    - ["s Hüsli", "a little house"]
    - ["s Chätzli", "a kitten"]
    - ["s Müsli", "a little mouse"]
    - ["es Bitzeli", "a little bit"]
  explanation: >-
    -li makes words small or friendly, and every -li word is neuter (d Chatz → s Chätzli). Vowels get an
    umlaut: Huus → Hüsli, Muus → Müsli. Don't confuse s Müsli (mouse) with s Müesli (cereal).

- id: a2-u05-ch-mcq-neuter
  type: mcq
  skill: grammar
  variety: gsw-zh
  prompt: "What is the article of Chätzli (kitten), the -li form of d Chatz?"
  options: ["d (feminine, like d Chatz)", "de (masculine)", "it has no article", "s / es (neuter)"]
  answer: 3
  rationales:
    - "The base word is feminine, but -li changes the gender."
    - "No -li word is masculine."
    - "Diminutives have an article like other nouns: es Chätzli."
    - "Correct. Every -li word is neuter: s Chätzli, es Chätzli."
  explanation: >-
    Diminutives are always neuter, in dialect (s Tischli, s Chätzli) and in Standard German (das Tischchen,
    das Kätzchen, das Mädchen).

- id: a2-u05-ch-mcq-abe
