- id: a2-u11-roleplay-reto
  type: roleplay
  skill: listening
  variety: gsw-zh
  grammar: [indefinite-pronouns, wuerde-koennte]
  tutor: reto
  prompt: "Listening roleplay with Reto: at the recycling point."
  scenario: >-
    You meet Reto at the recycling point. He explains in Zurich German where everything goes and suggests a hike.
    You answer in Standard German and ask him to help you with something.
  goals:
    - Understand Reto's recycling tips (s PET, s Altglas, s Grüengut, de Güselsack).
    - Understand öpper, niemert, öppis, nüt.
    - Ask Reto politely for help (Könntest du mir …?) and answer his suggestion.
  model: |
    Reto: Hoi! Häsch au so vill Altglas?
    Du: Ja! Könntest du mir sagen, wo das braune Glas hinkommt?
    Reto: Dete, in mittlere Container. Und s PET bringsch in Lade zrugg.
    Du: Danke! Und das Papier?
    Reto: S Papier holt d Stadt ab. Aber lueg: Da hät öpper Güsel anegstellt, und niemert nimmt en mit!
    Du: Das finde ich nicht gut.
    Reto: Gömmer am Sunntig go wandere?
    Du: Gern! Ich bringe etwas zu essen mit.
  explanation: >-
    Decoding: dete = dort, in mittlere Container = in den mittleren Container, holt d Stadt ab = holt die Stadt ab,
    öpper = jemand, anegstellt = hingestellt, niemert = niemand.

