# A2 unit 11 – Natur und Umwelt

# ---------- vocabulary ----------
- id: a2-u11-match-nature
  type: match
  skill: vocabulary
  variety: de
  prompt: Match the nature words with English.
  pairs:
    - ["der Wald", "forest"]
    - ["der Fluss", "river"]
    - ["die Wiese", "meadow"]
    - ["der Gipfel", "summit"]
    - ["der Vogel", "bird"]
    - ["die Kuh", "cow"]
  explanation: >-
    Plurals with umlaut: der Wald → die Wälder, der Fluss → die Flüsse, der Vogel → die Vögel, die Kuh → die Kühe.
    der Gipfel doesn't change (die Gipfel) – and in Switzerland s Gipfeli is a croissant!

- id: a2-u11-match-recycling
  type: match
  skill: vocabulary
  variety: de
  prompt: Match the recycling words with English.
  pairs:
    - ["das Altglas", "glass for recycling"]
    - ["das Altpapier", "waste paper"]
    - ["der Biomüll", "green waste"]
    - ["die Dose", "can"]
    - ["trennen", "to sort, to separate"]
    - ["wegwerfen", "to throw away"]
  explanation: >-
    alt- in compounds means "used, for recycling": Altglas, Altpapier. wegwerfen is separable and irregular: Ich
    werfe die Flasche weg – Ich habe sie weggeworfen.

# ---------- grammar: könnte / würde ----------
- id: a2-u11-mcq-koenntest
  type: mcq
  skill: grammar
  variety: de
  grammar: [wuerde-koennte, dative-pronouns]
  prompt: You need help with the heavy bags. What is the most polite?
  options: ["Könntest du mir bitte helfen?", "Hilf mir!", "Du hilfst mir.", "Kannst du mich helfen?"]
  answer: 0
  rationales:
    - "Correct. könnte + bitte + infinitive at the end: very polite."
    - "An imperative without bitte sounds like an order."
    - "A statement, not a request."
    - "Two problems: helfen takes the dative (mir), and kannst is less polite."
  explanation: >-
    Könntest du (mir) bitte …? is the polite request: könnte in position 1, the infinitive helfen at the end.
    helfen always takes the dative: mir, not mich.

- id: a2-u11-gap-koennte-wuerde
  type: gap
  skill: grammar
  variety: ch-std
  grammar: [wuerde-koennte]
  prompt: "Fill in the right form of könnte or würde (the word in brackets)."
  text: ___ (könnte) Sie bitte langsamer sprechen? ___ (würde) du mir die Route schicken? Ich ___ (würde) gern auf den Pilatus wandern.
  answers: [["Könnten"], ["Würdest"], ["würde"]]
  explanation: >-
    Sie → könnten (like the plural), du → würdest, ich → würde (no -t, like ich möchte). The infinitive is at the
    end: sprechen, schicken, wandern.

- id: a2-u11-mcq-wuerde-form
  type: mcq
  skill: grammar
  variety: de
  grammar: [wuerde-koennte]
  prompt: Choose the correct sentence.
  options: ["Würdest du mir die Route schickst?", "Würdest du mir die Route schicken?", "Würdest du schicken mir die Route?", "Würdest du mir die Route zu schicken?"]
  answer: 1
  rationales:
    - "After würde the second verb is an infinitive: schicken."
    - "Correct. würde in position 1 (question), infinitive at the end."
    - "The infinitive goes to the end, after the objects."
    - "No zu after würde."
  explanation: >-
    würde works like a modal verb: würde + infinitive at the end, no zu. Würdest du mir die Route schicken? =
    Would you send me the route?

- id: a2-u11-transform-polite
  type: transform
  skill: grammar
  variety: de
  grammar: [wuerde-koennte, imperative]
  prompt: "Make the request polite. Start with: Könnten Sie bitte …"
  from: de
  to: de
  source: Schließen Sie das Fenster!
  answers: ["Könnten Sie bitte das Fenster schließen?", "Könnten Sie bitte das Fenster schliessen?", "Könnten Sie das Fenster bitte schließen?", "Könnten Sie das Fenster bitte schliessen?"]
  explanation: >-
    Imperative → Könnten Sie (bitte) + object + infinitive at the end + question mark. schließen = to close
    (Swiss spelling schliessen).

- id: a2-u11-translate-wuerde-gern
  type: translate
  skill: writing
  variety: de
  grammar: [wuerde-koennte]
  prompt: Translate into German.
  source: I'd like to have a picnic by the lake.
  answers:
    - "Ich würde gern am See ein Picknick machen."
    - "Ich würde gerne am See ein Picknick machen."
    - "Ich würde gern ein Picknick am See machen."
    - "Ich würde gerne ein Picknick am See machen."
    - "Ich möchte am See ein Picknick machen."
    - "Ich möchte ein Picknick am See machen."
  explanation: >-
    I'd like to … = Ich würde gern … (or Ich möchte …) + infinitive at the end. am See = an dem See (Wo? → dative).

# ---------- grammar: man, jemand, niemand, etwas, nichts ----------
- id: a2-u11-mcq-man-verb
  type: mcq
  skill: grammar
  variety: ch-std
  grammar: [indefinite-pronouns]
  prompt: Choose the right verb form.
  question: In der Schweiz ___ man den Abfall.
  options: ["trennen", "trennst", "trennt", "getrennt"]
  answer: 2
  rationales:
    - "man is singular, not plural."
    - "That is the du form."
    - "Correct. man takes the er/sie/es form: man trennt."
    - "A participle needs haben: man hat … getrennt."
  explanation: >-
    man = people in general. The verb is always in the er/sie/es form: man trennt, man darf, man weiss. Don't write
    it like der Mann.

- id: a2-u11-gap-indefinite
  type: gap
  skill: grammar
  variety: de
  grammar: [indefinite-pronouns]
  prompt: "Fill in jemand, niemand, etwas or nichts."
  text: Hat ___ meinen Schlüssel gesehen? – Nein, leider ___. Möchtest du ___ trinken? – Nein danke, ich möchte ___.
  answers: [["jemand"], ["niemand"], ["etwas", "was"], ["nichts"]]
  explanation: >-
    jemand (someone) – niemand (nobody); etwas (something; colloquially was) – nichts (nothing). niemand and
    nichts are already negative: no extra nicht.

- id: a2-u11-mcq-nichts
  type: mcq
  skill: grammar
  variety: de
  grammar: [indefinite-pronouns, nicht-kein]
  prompt: "How do you say \"I haven't forgotten anything\"?"
  options: ["Ich habe nicht nichts vergessen.", "Ich habe etwas nicht vergessen.", "Ich habe niemand vergessen.", "Ich habe nichts vergessen."]
  answer: 3
  rationales:
    - "Two negatives – in German that is wrong."
    - "That means there is one thing I didn't forget."
    - "niemand = nobody – a person, not a thing."
    - "Correct. not … anything = nichts."
  explanation: >-
    English not … anything = German nichts (one word). not … anyone = niemand. Don't add nicht.

- id: a2-u11-transform-man
  type: transform
  skill: grammar
  variety: ch-std
  grammar: [indefinite-pronouns, modal-muessen-duerfen]
  prompt: "Rewrite the rule with man."
  from: ch-std
  to: ch-std
  source: "Hier dürfen Sie nicht grillieren."
  answers: ["Hier darf man nicht grillieren.", "Man darf hier nicht grillieren."]
  explanation: >-
    Signs and rules often use man: Sie dürfen → man darf (er/sie/es form). grillieren is Swiss Standard for
    grillen (Duden: schweizerisch).

- id: a2-u11-translate-jemand
  type: translate
  skill: writing
  variety: de
  grammar: [indefinite-pronouns, perfekt-haben]
  prompt: Translate into German.
  source: Has anyone read the weather forecast?
  answers:
    - "Hat jemand den Wetterbericht gelesen?"
    - "Hat schon jemand den Wetterbericht gelesen?"
    - "Hat jemand schon den Wetterbericht gelesen?"
    - "Hat jemand die Wettervorhersage gelesen?"
  explanation: >-
    anyone in a question = jemand. Perfekt: hat … gelesen (lesen → gelesen). der Wetterbericht = the weather
    report.

- id: a2-u11-match-requests
  type: match
  skill: grammar
  variety: de
  grammar: [wuerde-koennte]
  prompt: Match the polite requests with English.
  pairs:
    - ["Könntest du mir helfen?", "Could you help me?"]
    - ["Würden Sie langsamer sprechen?", "Would you speak more slowly?"]
    - ["Ich würde gern wandern.", "I'd like to go hiking."]
    - ["Könnten wir eine Pause machen?", "Could we take a break?"]
  explanation: >-
    könnte = could, würde = would. Both send the infinitive to the end. Ich würde gern … is a wish, like Ich
    möchte …

- id: a2-u11-gap-man-rules
  type: gap
  skill: grammar
  variety: ch-std
  grammar: [indefinite-pronouns, modal-muessen-duerfen]
  prompt: "Signs in a park: fill in the verb for man (darf – muss – kann)."
  text: Hier ___ man nicht grillieren. Den Abfall ___ man wieder mitnehmen. Im See ___ man im Sommer baden.
  answers: [["darf"], ["muss"], ["kann", "darf"]]
  explanation: >-
    man + er/sie/es form: man darf (allowed), man muss (must), man kann (can). nicht dürfen = not allowed. baden =
    to swim, to bathe.

# ---------- grammar: dative review ----------
- id: a2-u11-gap-dative-review
  type: gap
  skill: grammar
  variety: ch-std
  grammar: [dative-review, dative-articles, dative-prepositions]
  prompt: "Fill in the dative article: dem, der or den."
  text: Der PET-Sack steht neben ___ Kühlschrank. Wir fahren mit ___ Zug nach Luzern. Oben auf ___ Alp gibt es ein Restaurant. Ich gehe gern mit ___ Kindern in den Wald.
  answers: [["dem"], ["dem"], ["der"], ["den"]]
  explanation: >-
    der Kühlschrank, der Zug → dem (m); die Alp → der (f); die Kinder → den Kindern (plural + -n). neben and auf
    take the dative for Wo?, mit always.

- id: a2-u11-mcq-wo-wohin
  type: mcq
  skill: grammar
  variety: de
  grammar: [dative-review]
  prompt: Choose the right article.
  question: Leg die Flasche bitte in ___ Sack. – Sie ist schon in ___ Sack.
  options: ["den … den", "dem … dem", "den … dem", "dem … den"]
  answer: 2
  rationales:
    - "The second sentence asks Wo? – that needs the dative."
    - "The first sentence is a movement (Wohin?) – accusative."
    - "Correct. Wohin? → in den Sack (accusative); Wo? → in dem / im Sack (dative)."
    - "It's the other way round."
  explanation: >-
    Two-way prepositions: movement to a place (Wohin?) = accusative, location (Wo?) = dative. in dem contracts to
    im: Sie ist schon im Sack.

- id: a2-u11-mcq-gehoert
  type: mcq
  skill: grammar
  variety: de
  grammar: [dative-review]
  prompt: Choose the right pronoun.
  question: Wem gehört die Trinkflasche? – Sie gehört ___.
  options: ["mir", "mich", "ich", "mein"]
  answer: 0
  rationales:
    - "Correct. gehören takes the dative: mir."
    - "mich is the accusative."
    - "ich is the nominative."
    - "mein is a possessive and needs a noun."
  explanation: >-
    gehören, helfen, gefallen, schmecken take the dative: Das gehört mir. Die Aussicht gefällt mir. Wem? = to whom
    (dative question word).

- id: a2-u11-order-dative
  type: order
  skill: grammar
  variety: ch-std
  grammar: [dative-review, wuerde-koennte]
  prompt: Put the words in order to make a polite question.
  tokens: ["Könntest", "du", "mir", "die", "Karte", "geben"]
  answers: ["Könntest du mir die Karte geben?"]
  explanation: >-
    Dative person (mir) before the accusative thing (die Karte), infinitive geben at the end. Könntest du … ?
    makes it polite.

- id: a2-u11-order-man
  type: order
  skill: grammar
  variety: de
  grammar: [indefinite-pronouns, dative-review]
  prompt: Put the words in order.
  tokens: ["Vom", "Gipfel", "hat", "man", "eine", "tolle", "Aussicht"]
  answers: ["Vom Gipfel hat man eine tolle Aussicht.", "Man hat vom Gipfel eine tolle Aussicht.", "Man hat eine tolle Aussicht vom Gipfel."]
  explanation: >-
    vom = von dem (dative). With Vom Gipfel in position 1, the verb hat comes next and then man.

# ---------- reading ----------
- id: a2-u11-mcq-reading-pet
  type: mcq
  skill: reading
  variety: ch-std
  grammar: [indefinite-pronouns]
  prompt: Read the leaflet from Wädenswil. What do you do with PET bottles?
  options: ["Put them in the rubbish bag", "Take them back to the shop", "Take them to the station on Sunday", "Tie them together with string"]
  answer: 1
  explanation: >-
    "PET-Flaschen bringt man in den Laden zurück." man = you / people. String (eine Schnur) is for paper and
    cardboard.

- id: a2-u11-mcq-reading-glas
  type: mcq
  skill: reading
  variety: ch-std
  prompt: Read the leaflet again. When mustn't you throw glass into the containers?
  options: ["Before 7 a.m.", "On the first Wednesday of the month", "On Sundays and after 8 p.m.", "On Tuesdays"]
  answer: 2
  explanation: >-
    "Am Sonntag und nach 20 Uhr darf man dort kein Glas einwerfen, denn es ist sehr laut." 7 a.m. on Tuesday is for
    the rubbish bags; the first Wednesday is the paper collection.

- id: a2-u11-translate-reading
  type: translate
  skill: reading
  variety: ch-std
  prompt: Translate into English.
  source: Die Gemeinde sammelt Papier und Karton jeden ersten Mittwoch im Monat.
  answers:
    - "The municipality collects paper and cardboard on the first Wednesday of every month."
    - "The municipality collects paper and cardboard every first Wednesday of the month."
    - "The council collects paper and cardboard on the first Wednesday of each month."
    - "The town collects paper and cardboard on the first Wednesday of every month."
  explanation: >-
    die Gemeinde = the municipality (local council), sammeln = to collect, jeden ersten Mittwoch im Monat = on the
    first Wednesday of every month (accusative of time: jeden).

