  answers: ["Niemand hat heute angerufen.", "Heute hat niemand angerufen."]
  explanation: >-
    jemand → niemand. niemand already means not anyone, so you don't add nicht: Niemand hat heute angerufen.

# ---------- speaking ----------
- id: a2-u11-speak-frame
  type: speak
  skill: speaking
  variety: de
  grammar: [perfekt-sein, wuerde-koennte]
  prompt: "Read aloud, then talk about your last day outdoors."
  target: Letzten Sonntag bin ich auf den Üetliberg gewandert. Oben war die Aussicht wunderschön. Nächstes Mal würde ich gern an einen See fahren.
  explanation: >-
    Frame: Letzten … bin ich … gewandert / gefahren. Oben / Dort war … Nächstes Mal würde ich gern … Change the
    place and what you saw.

- id: a2-u11-speak-shadow-tom
  type: speak
  skill: speaking
  variety: de
  grammar: [wuerde-koennte]
  prompt: "Shadowing: speak along with Tom's lines from the intro dialogue, then say them alone."
  target: Super! Würdest du mir die Route schicken?
  explanation: >-
    A polite yes/no question rises at the end: … die ROUte schicken? ↗ The ü in würdest is rounded: say ee with
    pursed lips.

- id: a2-u11-speak-shadow-martin
  type: speak
  skill: speaking
  variety: ch-std
  grammar: [indefinite-pronouns]
  prompt: "Shadowing: speak along with Martin, then say it alone."
  target: Ja, es soll sonnig sein. Aber in den Bergen weiss man nie!
  explanation: >-
    Swiss Standard German: the r in Bergen is tapped, the s in sonnig and sein is voiceless (a Swiss feature), and
    weiss has a short, clear s. See the drill The Swiss Standard German accent.

- id: a2-u11-speak-intonation
  type: speak
  skill: speaking
  variety: de
  grammar: [wuerde-koennte]
  prompt: "Intonation: a polite request rises at the end; bitte is unstressed."
  target: Könnten Sie mir bitte helfen?
  explanation: >-
    KÖNNten Sie mir bitte HELfen? ↗ Stress the first and the last verb; bitte stays light. A falling end would sound
    impatient.

- id: a2-u11-speak-pron-ue
  type: speak
  skill: speaking
  variety: de
  grammar: [wuerde-koennte]
  prompt: "Pronunciation: ü vs u and i. Read aloud slowly."
  target: Würdest du die Flüsse und die grünen Hügel fotografieren? Die Kühe stehen hinter dem Wald.
  explanation: >-
    ü in würdest, Flüsse, grünen, Hügel, Kühe: lips rounded as for u, tongue forward as for i. Compare Kuh (u) –
    Kühe (ü). der Hügel = hill. See the drill ü vs u and i.

# ---------- roleplay and writing ----------
- id: a2-u11-roleplay-lena
  type: roleplay
  skill: speaking
  variety: de
  grammar: [wuerde-koennte, indefinite-pronouns, perfekt-sein]
  tutor: lena
  prompt: "Roleplay with Lena: a weekend outdoors."
  scenario: >-
    Lena wants to go to the mountains with you next weekend. Talk about where you were last time, suggest a place
    with Ich würde gern …, and ask her politely to do something (Könntest du …?). Talk about rubbish on the trip.
  goals:
    - Tell where you were outdoors last time (Perfekt with sein for wandern / fahren).
    - Make a suggestion with Ich würde gern …
    - Ask Lena politely with Könntest du …? or Würdest du …?
    - Use man or niemand / nichts once (Man darf …, Niemand …).
  model: |
    Lena: Wollen wir nächstes Wochenende in die Berge?
    Du: Gern! Letzten Monat bin ich auf den Pilatus gewandert. Die Aussicht war toll.
    Lena: Und wohin möchtest du dieses Mal?
    Du: Ich würde gern an einen Bergsee wandern und dort ein Picknick machen.
    Lena: Super Idee. Was nehmen wir mit?
    Du: Könntest du Brot und Käse mitbringen? Ich nehme Wasser in Trinkflaschen mit, dann haben wir kein Plastik.
    Lena: Und den Abfall?
    Du: Den nehmen wir wieder mit nach Hause. In den Bergen gibt es oft keinen Abfalleimer, man darf nichts liegen lassen.
  explanation: >-
    würde gern for a wish, Könntest du …? for a polite request, man for a rule. liegen lassen = to leave lying around.

- id: a2-u11-write-tipps
  type: write
  skill: writing
  variety: ch-std
  grammar: [indefinite-pronouns, wuerde-koennte, dative-review]
  prompt: Write recycling tips for a new neighbour.
  task: >-
    A new neighbour from abroad has moved into your building. Write a short note (6–8 sentences): explain where the
    rubbish, PET, glass and paper go (with man), and ask him or her politely to do one thing (Könnten Sie / Würden
    Sie …?). Offer help.
  minWords: 50
  model: >-
    Liebe Frau Okafor,


    herzlich willkommen im Haus! Hier ein paar Tipps zum Abfall. Den normalen Abfall wirft man in den offiziellen
    Abfallsack. Die Säcke stellt man am Dienstagmorgen an die Strasse. PET-Flaschen bringt man in den Supermarkt
    zurück, und das Glas kommt in die Container beim Bahnhof. Altpapier sammelt die Gemeinde einmal im Monat.
    Könnten Sie bitte die Kartons klein machen? Sonst ist der Keller schnell voll. Wenn Sie Fragen haben, helfe ich
    Ihnen gern!


    Freundliche Grüsse

    Anna Weber
  checklist:
    - I explain at least three kinds of rubbish with man (Man bringt …, … wirft man …).
    - I ask politely with Könnten Sie bitte …? or Würden Sie bitte …?
    - I use the dative after prepositions where needed (beim Bahnhof, in den Containern / Wo?).
    - I open and close the note correctly (Liebe Frau … / Freundliche Grüsse).
  explanation: >-
    Rules sound friendly with man (Man bringt die Flaschen zurück) and polite requests with könnten. Liebe Frau
    Okafor is friendly but still uses Sie – right for a new neighbour. Check your own municipality's rules.

# ---------- Swiss Standard German ----------
- id: a2-u11-chstd-match
  type: match
  skill: vocabulary
  variety: ch-std
  prompt: Match the Swiss Standard German words with the words used in Germany.
  pairs:
    - ["rezyklieren", "recyceln"]
    - ["der Kehricht", "der Müll"]
    - ["das Grüngut", "der Biomüll"]
    - ["die Alp", "die Alm"]
  explanation: >-
    Duden marks rezyklieren and Kehricht (in the sense of Müll) as Swiss. Grüngut is the Swiss word for green
    waste; die Alp is the Swiss form of Alm (a summer mountain pasture).

# ---------- Swiss lane (gsw-zh) ----------
- id: a2-u11-ch-mcq-glas
  type: mcq
  skill: listening
  variety: gsw-zh
  prompt: Listen to Sandra. When can't you bring glass?
  transcript: |-
    Sandra: Ja, aber nöd am Sunntig und nöd z Nacht. Lueg, s staat uf em Schild.
  options: ["On Saturdays", "In the morning", "On Sundays and at night", "Never – glass goes in the rubbish bag"]
  answer: 2
  rationales:
    - "Sandra says yes for Saturday."
    - "The morning is not mentioned."
    - "Correct. nöd am Sunntig und nöd z Nacht."
    - "Glass is recycled, not thrown away."
  explanation: >-
    nöd am Sunntig = nicht am Sonntag, z Nacht = in der Nacht, s staat uf em Schild = es steht auf dem Schild
    (dative em).

