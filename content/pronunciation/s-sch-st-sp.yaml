sentences:
  - { text: "Ich spreche ein bisschen Deutsch.", en: I speak a little German. }
  - { text: "Um sieben stehe ich auf.", en: I get up at seven. }
  - { text: "Sport macht Spaß!", en: "Sport is fun!" }
  - { text: "Die Schweiz ist schön.", en: Switzerland is beautiful. }
commonMistakes:
  - "*Stadt* with English st: at the start of a word, st is scht."
  - "*Fenschter*: in the middle of a word, st stays st in Standard German. (In Swiss German it's *Feischter* – that's dialect.)"
  - "Unvoiced s in *sieben* (*see-ben* with a hiss): before a vowel at the start, s buzzes."
