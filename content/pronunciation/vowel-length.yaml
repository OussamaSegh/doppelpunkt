sentences:
  - { text: "Die Miete ist hoch, aber die Wohnung ist in der Mitte der Stadt.", en: "The rent is high, but the flat is in the middle of the city." }
  - { text: "Mein Sohn trinkt Tee, mein Mann trinkt Kaffee.", en: "My son drinks tea, my husband drinks coffee." }
  - { text: "Das Bett ist im Schlafzimmer.", en: The bed is in the bedroom. }
  - { text: "Wir wohnen in der Stadt.", en: We live in the city. }
commonMistakes:
  - "*Stadt* said long (*Staat*): the dt makes the a short."
  - "*Tee* said *tay*: keep the e pure, no glide to ee."
  - "*Miete* said short (*Mitte*): ie is always long."
  - "Double consonants said twice (*Wass-ser*): the double letter only marks the short vowel."
