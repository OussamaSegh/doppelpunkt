id: vowel-length
title: Long and short vowels
ipa: ["aː", "a", "eː", "ɛ", "iː", "ɪ", "oː", "ɔ", "uː", "ʊ"]
level: A1
variety: de
explanation: >-
  In German, vowel length changes meaning: *Staat* (state) – *Stadt* (city), *Miete* (rent) – *Mitte*
  (middle), *Ofen* (oven) – *offen* (open). Long vowels are also **tense** (the mouth is tighter), short
  vowels are **lax** and clipped.


  **The spelling tells you the length:**

  - **short** before a double consonant or two consonants: *Mann, Bett, kommen, Butter, Wasser*; before
  *ck* and *tz*: *Zucker, jetzt*.

  - **long** with a doubled vowel (*Tee, Boot, Staat*), with a silent **h** (*Bahn, Uhr, Sohn, wohnen*),
  with **ie** (*Miete, viel*), and usually at the end of a syllable (*Ta-ge, le-sen*).


  **The trap for English speakers:** English long vowels glide. *Tee* is not *tay*, *so* is not *sow*.
  Hold German long e and o steady, like a note on a piano. And don't swallow short vowels into *uh*:
  *Butter* has a clear short u.
tips:
  - "Clap the rhythm: long vowels take about twice as long as short ones – *Staaat* vs *Stat*."
  - "For a long e or o, keep your jaw still until the sound stops. No glide."
  - "A double consonant in the spelling is a signal: the vowel before it is short and the consonant is not said twice."
