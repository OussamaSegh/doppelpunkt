id: ei-ie-eu
title: ei vs ie, and eu/äu
ipa: ["aɪ̯", "iː", "ɔʏ̯", "aʊ̯"]
level: A1
variety: de
explanation: >-
  German has three diphthongs (two vowels in one syllable), and one spelling that looks like a diphthong
  but isn't.


  - **ei** (also *ai*) = English *eye* [aɪ̯]: *mein, drei, heißen, Zeit, Wein, Mai*.

  - **ie** = English *ee* [iː], one long vowel: *Bier, vier, sieben, wie, lieb*.

  - **eu** and **äu** = English *oy* in *boy* [ɔʏ̯]: *neu, neun, heute, Leute, Häuser*.

  - **au** = English *ow* in *how* [aʊ̯]: *Haus, auch, Frau*.


  **The trick for ei and ie:** say the English name of the **second** letter. *ei* → "i" → *eye*. *ie* →
  "e" → *ee*. So *Wein* is *vine*-like, *Wien* (Vienna) is *veen*.


  Mixing them up changes words: *leider* (unfortunately) vs *Lieder* (songs), *Reise* (journey) vs *Riese*
  (giant), and *neun* (nine) vs *nein* (no).
tips:
  - "The second letter rule: ei sounds like the English letter i, ie like the English letter e."
  - "eu/äu: start with an open o as in *hot*, glide to a short ü. English *oy* is close enough."
  - "au/äu belong together: Haus – Häuser, Maus – Mäuse."
