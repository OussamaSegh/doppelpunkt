commonMistakes:
  - "*Wien* for *Wein* (or the other way round): use the second-letter rule."
  - "*nein* for *neun*: eu is *oy*, not *eye*. Nine and no are a classic mix-up at the till."
  - "*Bier* said as *bee-er* with two syllables: ie is one long vowel; the r is a light *uh* glide."
