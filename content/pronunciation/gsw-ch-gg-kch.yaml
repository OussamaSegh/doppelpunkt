sentences:
  - { text: "S Chind isch i de Chuchi.", en: The child is in the kitchen. }
  - { text: "Ich chume grad.", en: "I'm coming right away." }
  - { text: "Es isch chalt hüt.", en: "It's cold today." }
  - { text: "Ich hett gärn en Kafi und e Schoggi.", en: "I'd like a coffee and a chocolate." }
commonMistakes:
  - "*Kind* with a German or English k in a dialect sentence: in Zurich German it's *Chind* with a rasping ch."
  - "A soft German ich-Laut in *ich* or *nicht*: Swiss ch is always the back sound."
  - "*Schoggi* with an English puffed k (*Shock-ee*): gg has no puff of air."
  - "Saying ch as *h* (*Hind*) – too weak. Swiss ch has friction you can clearly hear."
