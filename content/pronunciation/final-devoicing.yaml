id: final-devoicing
title: Final devoicing (Auslautverhärtung)
ipa: ["p", "t", "k", "s", "f"]
level: A1
variety: de
explanation: >-
  At the **end of a word or syllable**, German **b, d, g, s, v** lose their voice and sound like
  **p, t, k, s, f**: *Tag* [taːk], *Hund* [hʊnt], *halb* [halp], *Haus* [haʊ̯s], *aktiv* [akˈtiːf]. This is
  called *Auslautverhärtung* ("final hardening").


  English keeps the difference: *dog* and *dock*, *bad* and *bat* sound different. German doesn't:
  *Rad* (wheel) and *Rat* (advice) sound the same, and so do *seid* (you are) and *seit* (since).


  When an ending is added, the consonant starts the next syllable and gets its voice back: *Tag* [k] –
  *Ta-ge* [g], *Hund* [t] – *Hun-de* [d], *Haus* [s] – *Häu-ser* [z]. So the spelling shows the family of
  the word, and the plural or a verb form shows you the "real" consonant.


  Also inside words before a consonant: *Abendessen* (*Abent-*), *Freundin* (*Freunt-*), *gibt*
  (*gipt*). Speakers in southern Germany, Austria and Switzerland make these final sounds weaker
  (lenis), but they are never voiced like English *d* in *dog*.
tips:
  - "Whisper the last consonant: *Hund* ends like English *hunt*, *Tag* like *talk* without the l."
  - "Check the plural: if the consonant is voiced in *Tage*, it is devoiced in *Tag*."
  - "Don't add a little vowel after the consonant (*Tag-uh*). Just stop."
pairs:
