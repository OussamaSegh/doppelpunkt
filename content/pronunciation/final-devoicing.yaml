commonMistakes:
  - "*Hund* with a voiced English d: it sounds foreign. End it like *hunt*."
  - "*Tag* with a voiced g (*tahg*): German says *tahk*."
  - "Devoicing in the plural too (*Tache* or *Hunte*): when a vowel follows, the consonant is voiced again: *Tage, Hunde*."
