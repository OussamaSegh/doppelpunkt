sentences:
  - { text: "Ich habe heute leider keine Zeit.", en: "Unfortunately I don't have time today." }
  - { text: "Das Billett kostet zwanzig Franken.", en: The ticket costs twenty francs. }
  - { text: "Der Zug nach Bern fährt auf Perron drei.", en: The train to Bern leaves from platform three. }
  - { text: "Merci vielmals, das ist sehr nett.", en: "Thanks a lot, that's very kind." }
  - { text: "Am Abend fahre ich mit dem Velo nach Hause.", en: In the evening I ride my bike home. }
commonMistakes:
  - "Thinking Swiss Standard German is \"wrong\" German: it is a standard variety with its own norms."
  - "Mixing accents in one sentence (Swiss back ch, then a German uvular r and vocalised -er): pick one model."
  - "Stressing Billett on the second syllable while using the Swiss word: in Switzerland it is *BIL-lett*."
