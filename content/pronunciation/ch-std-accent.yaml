  - { text: "nicht", en: not }
  - { text: "Milch", en: milk }
  - { text: "richtig", en: correct }
  - { text: "zwanzig", en: twenty }
  - { text: "Kind", en: child }
  - { text: "Käse", en: cheese }
  - { text: "Vater", en: father }
  - { text: "Lehrer", en: teacher }
  - { text: "Abend", en: evening }
  - { text: "Billett", en: ticket }
  - { text: "Perron", en: (railway) platform }
  - { text: "Trottoir", en: pavement }
  - { text: "Velo", en: bicycle }
