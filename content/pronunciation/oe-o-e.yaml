sentences:
  - { text: "Ich möchte zwölf Brötchen, bitte.", en: "I'd like twelve rolls, please." }
  - { text: "Das ist aber schön!", en: "That's really nice!" }
  - { text: "Können Sie mich hören?", en: "Can you hear me?" }
  - { text: "Meine Töchter wohnen in Köln.", en: My daughters live in Cologne. }
commonMistakes:
  - "*schon* for *schön*: the tongue went back to o. Keep it forward as for e."
  - "*kennen* for *können*: the lips stayed spread. Round them."
  - "*shown* for *schön*: English *o* glides to *w*. German ö is one steady sound."
  - "American *r* colour (*shurn*): there is no r in ö."
