  - { text: "hören", en: to hear }
  - { text: "möchte", en: would like }
  - { text: "können", en: can }
  - { text: "zwölf", en: twelve }
  - { text: "Brötchen", en: bread roll }
  - { text: "Töchter", en: daughters }
  - { text: "Söhne", en: sons }
  - { text: "Österreich", en: Austria }
  - { text: "Öl", en: oil }
  - { text: "Köln", en: Cologne }
