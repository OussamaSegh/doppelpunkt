sentences:
  - { text: "Ich habe jetzt keine Zeit.", en: "I don't have time now." }
  - { text: "Der Zug nach Zürich fährt um zehn.", en: The train to Zurich leaves at ten. }
  - { text: "Zwei Äpfel, bitte.", en: "Two apples, please." }
  - { text: "Salz und Pfeffer sind in der Küche.", en: Salt and pepper are in the kitchen. }
commonMistakes:
  - "*Zoo* with English z (buzzing): German z starts with a t – *tsoo*."
  - "*Fund* for *Pfund* or *Ferd* for *Pferd*: keep the p."
  - "*Apfel* with a separate p and f (*Ap-fel*): pf is one sound."
