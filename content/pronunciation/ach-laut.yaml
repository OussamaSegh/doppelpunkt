id: ach-laut
title: The ach-Laut (back ch)
ipa: ["x", "χ"]
level: A1
variety: de
explanation: >-
  After **a, o, u** and **au**, German ch is the **ach-Laut** [x]: *acht, Nacht, doch, Woche, Buch,
  Kuchen, auch, Bauch*. Scottish English has it in *loch*; Spanish *j* (*José*) is similar.


  **How to make it:** say *k* and notice where the back of your tongue touches the soft palate. Now
  don't let it touch – leave a narrow gap and push air through it, a steady rasp. If it rattles a
  little further back in the throat, that's fine too ([χ]).


  The two ch sounds swap when the vowel changes. Listen to singular and plural: *Buch* (ach-Laut) –
  *Bücher* (ich-Laut), *Nacht* – *Nächte*, *Tochter* – *Töchter*. The vowel **before** ch decides.


  **The trap:** English speakers say *k*. *Nacht* (night) then becomes *nackt* (naked)!
tips:
  - "Start from *k*, then open a tiny gap and let the air rasp through."
  - "Gargle lightly without water – the same place, but no voice."
  - "Look at the vowel before ch: a, o, u, au → ach-Laut; everything else → ich-Laut."
