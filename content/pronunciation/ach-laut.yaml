commonMistakes:
  - "*Nackt* for *Nacht*: the tongue closed completely. Leave a gap and let the air flow."
  - "A weak *h* (*Nah-t*): the rasp is too soft. Push more air through a narrower gap."
  - "The soft ich-Laut after a, o, u (*Buch* like *Büch*): after back vowels the ch moves back too."
