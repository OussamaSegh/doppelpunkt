commonMistakes:
  - "English r (tongue tip curled back) in *rot* or *drei*: move the r to the back of the mouth, or tap the tip once."
  - "A hard r at the end (*Vaterrr*, *vierrr*): after a vowel the r becomes a vowel."
  - "*Vatah* with a big open a: -er is a short, relaxed *uh*."
  - "Dropping the r after a consonant (*Fau* for *Frau*, *dei* for *drei*): here it is a consonant."
