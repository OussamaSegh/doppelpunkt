id: ich-laut
title: The ich-Laut (soft ch)
ipa: ["ç"]
level: A1
variety: de
explanation: >-
  German **ch** has two sounds. This drill is the soft one, the **ich-Laut** [ç]. It comes after
  **i, e, ä, ö, ü, ei, eu, äu**, after **l, n, r**, in the diminutive **-chen**, and (in Germany) in the
  ending **-ig**: *ich, nicht, sprechen, Küche, leicht, euch, Milch, München, durch, Mädchen, zwanzig*.


  **How to make it:** say the *h* at the start of English *huge* or *hue* and stretch it: *hhhuge*. That
  hiss is the ich-Laut. Another way: say *yes* and whisper the *y* hard, without voice. The middle of
  the tongue is close to the hard palate, the tip rests behind the lower teeth, and the lips are
  **not** rounded.


  It is **not** *sh* (lips rounded, tongue tip up: *misch* means "mix!") and **not** *k* (a full stop
  of the air: *Teig*, dough). The air never stops.


  In southern Germany, Austria and Switzerland **-ig** is said with a [k]-like sound: *zwanzig* =
  *zwanzik*. That is also correct Standard German. Swiss speakers often use the back ach-Laut
  everywhere – see the drills on Swiss ch and on the Swiss Standard accent.
tips:
  - "Start from *huge*: hold the first sound – that is the ich-Laut."
  - "Smile slightly. If your lips round, it turns into *sh*."
  - "*ich* rhymes with nothing in English. Don't say *ish* or *ick*; say *i* + whispered *y*."
pairs:
  - [{ text: "mich", en: me }, { text: "misch", en: "mix!" }]
  - [{ text: "Kirche", en: church }, { text: "Kirsche", en: cherry }]
  - [{ text: "Teich", en: pond }, { text: "Teig", en: dough }]
  - [{ text: "Fichte", en: spruce }, { text: "fischte", en: fished }]
  - [{ text: "Bücher", en: books }, { text: "Büsche", en: bushes }]
  - [{ text: "Gerücht", en: rumour }, { text: "gerückt", en: moved (a little) }]
words:
  - { text: "ich", en: I }
  - { text: "nicht", en: not }
  - { text: "mich", en: me }
  - { text: "Milch", en: milk }
  - { text: "Küche", en: kitchen }
  - { text: "Mädchen", en: girl }
  - { text: "Brötchen", en: bread roll }
  - { text: "sprechen", en: to speak }
  - { text: "leicht", en: "easy, light" }
  - { text: "euch", en: you (plural) }
  - { text: "München", en: Munich }
  - { text: "Kirche", en: church }
  - { text: "richtig", en: correct }
  - { text: "zwanzig", en: twenty }
