sentences:
  - { text: "Ich spreche nicht viel Deutsch.", en: "I don't speak much German." }
  - { text: "Ich möchte bitte ein Brötchen und Milch.", en: "I'd like a roll and milk, please." }
  - { text: "Ist das richtig?", en: "Is that right?" }
  - { text: "Das Mädchen ist zwölf.", en: The girl is twelve. }
commonMistakes:
  - "*ish* for *ich*: the lips rounded and the tongue tip rose. Keep the lips spread, tip down."
  - "*ick* for *ich*: the air stopped. Keep it flowing like a hiss."
  - "The harsh ach-Laut after i or e (*ich* with a throat sound): this sounds Swiss. In Germany it's the soft hiss."
  - "*Mädchen* with English *ch* as in *church*: -chen is always the soft hiss."
