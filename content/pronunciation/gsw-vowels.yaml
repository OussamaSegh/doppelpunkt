id: gsw-vowels
title: "Swiss German long vowels and ie, ue, üe"
ipa: ["iə̯", "uə̯", "yə̯", "iː", "uː", "yː"]
level: A1
variety: gsw-zh
explanation: >-
  A **listening and imitation** drill for two features that make Swiss German sound so different.


  **1. ie, ue, üe are real diphthongs.** In Standard German *ie* is just a long *ee*. In Swiss German you
  hear **both** letters: the vowel glides into a short *uh* (schwa). *lieb* = *lee-ub*, *guet* (gut) =
  *goo-ut*, *müed* (müde) = *mü-ud*, *Muetter, Brueder, Chue* (cow). Standard German long *u* and *ü*
  often correspond to Swiss *ue* and *üe*: *gut → guet, Bruder → Brueder, Brüder → Brüeder, müde → müed*.
  The first part is stressed and the *e* is short and light.


  **2. Long ii, uu, üü where Standard German has ei, au, eu.** Swiss German kept the old long vowels:
  *Zeit → Ziit, Wein → Wii, Haus → Huus, Leute → Lüüt, neun → nüün*. The doubled letter means
  **long**, nothing else: *Huus* is a long *oo*, not *ow*. Long and short also change meaning: *Füür*
  (fire, long) vs *für* (for, short).


  In Swiss German, vowel length works independently of the consonants – a long vowel can stand before
  a double consonant, so trust the doubled vowel letters in Dieth spelling. (Bernese often shortens
  them: *Zyt, Lüt*.)
tips:
  - "ie, ue, üe: say the first vowel, then let your jaw drop slightly for a quick *uh*: *gu-et*."
  - "Doubled vowels: hold them. *Ziit* is twice as long as *isch*."
  - "Don't read Swiss *ie* like Standard German: *lieb* in Zurich has two sounds, *lieb* in Hamburg one."
  - "Map the patterns: Standard ei → ii, au → uu, eu → üü; Standard long u, ü → ue, üe."
