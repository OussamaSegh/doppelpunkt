commonMistakes:
  - "*guet* said like Standard *gut* (one long u): you must hear the glide *gu-et*."
  - "*Huus* said *house* (*ow*): it's a long *oo*."
  - "*Ziit* said *Zeit*: Swiss German keeps the long *ii*."
  - "Two full syllables in *guet* (*gu-ETT*): the e is a short, unstressed *uh*."
