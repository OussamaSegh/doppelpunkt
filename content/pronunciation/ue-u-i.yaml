id: ue-u-i
title: ü vs u and i
ipa: ["yː", "ʏ", "uː", "ʊ", "iː", "ɪ"]
level: A1
variety: de
explanation: >-
  English has no **ü**, so English speakers replace it with *oo* (u) or *ee* (i) – and both change the
  meaning: *Mutter* (mother) vs *Mütter* (mothers), *Tier* (animal) vs *Tür* (door).


  **How to make it:** say a long English *ee* as in *see* and hold it. Keep your tongue exactly where it
  is – high and at the front, the tip touching your lower teeth – and now round and push your lips
  forward as if you were going to say *oo* or whistle. That is a long **ü** [yː]: *Tür, für, müde, früh*.


  The **short ü** [ʏ] (before two consonants: *fünf, Glück, Müll*) starts from the *i* in English *sit*,
  again with rounded lips. It is shorter and a little more relaxed.


  Compare: for **u** [uː] the tongue pulls *back* (as in *food*); for **i** [iː] the lips are *spread*
  (as in *see*). **ü** combines the front tongue of *i* with the round lips of *u*. Spelling: *ü*, and
  *y* in some loanwords (*Typ, Physik*). If you can't type ü, write *ue* (*Zuerich*).
tips:
  - "Mirror test: say *ee*, then round your lips without moving your tongue. If your tongue slides back, you are saying *oo*."
  - "Put a finger on your lips: for ü they push forward, for i they stay flat."
  - "Never put a *y* glide in front: *Tür* is not *tyoor* (as in English *tutor*). Start the ü sound straight away."
  - "French *tu* and *rue* have the same sound – if you speak some French, use it."
