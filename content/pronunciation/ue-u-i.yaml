commonMistakes:
  - "*Mutter* for *Mütter*: the tongue went back. Keep it forward as for *ee* and only round the lips."
  - "*Tier* for *Tür*: the lips stayed flat. Round and push them forward."
  - "*tyoor* for *Tür*: English adds a *y* before *oo* (as in *music*). German ü has no glide."
  - "Short ü said long: *fünf* is short and crisp, *für* is long."
