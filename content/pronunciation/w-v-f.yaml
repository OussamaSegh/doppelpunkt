id: w-v-f
title: w, v and f
ipa: ["v", "f"]
level: A1
variety: de
explanation: >-
  Two simple rules, and one trap.


  **German w = English v** [v]: the lower lip touches the upper teeth and the sound is voiced. *wir,
  was, wo, Wasser, Woche, Wein, warm*. English *w* (round lips, no teeth) doesn't exist in German:
  *Wein* is not *wine*.


  **German v = English f** [f] in native German words: *Vater, viel, vier, von, vor, Vogel*, and the
  prefixes *ver-* and *vor-* (*verstehen, Vorname*). So *vier* (four) and *für* (for) start with the
  same sound.


  **The trap:** in many **loanwords**, v is a [v] again: *Video, Vase, Klavier, Universität, November*.
  When in doubt: short, old, everyday words → f; Latin, French or English words → v.


  Also: **qu** = [kv]: *Quittung* is *kvittung*.
tips:
  - "For w, bite your lower lip lightly and hum: *vvv*. Your lips must not round."
  - "Read v as f in the words you learn first: Vater, viel, vier, von, verstehen."
  - "Learn the loanwords with v = [v] as a small list: Video, Klavier, November, Vase."
