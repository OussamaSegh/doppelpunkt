name = "doppelpunkt-billing"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

# Don't keep request logs: they would contain IP addresses. The worker itself never logs.
[observability]
enabled = false

[vars]
# The app's public URL with a trailing slash. Stripe sends buyers back to <APP_URL>unlock/done.
APP_URL = "https://example.org/doppelpunkt/"
# Comma-separated app origins allowed to call the API from a browser, e.g. "https://example.org".
ALLOWED_ORIGINS = ""
# sku -> Stripe Price id (Stripe dashboard → Product catalog). SKUs: packages/license/src/catalog.ts.
STRIPE_PRICES = '{"level-a2":"price_REPLACE_ME","level-b1":"price_REPLACE_ME","pass-year":"price_REPLACE_ME"}'
# Key id of LICENSE_PRIVATE_KEY; the app build lists the public key under the same id.
LICENSE_KEY_ID = "REPLACE_ME"
# Requests per client per hour on checkout, claim, redeem and restore.
RATE_LIMIT_PER_HOUR = "30"

# Secrets (never in this file):
#   npx wrangler secret put STRIPE_SECRET_KEY       # sk_live_... (or a restricted key: Checkout Sessions write)
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET   # whsec_... of the endpoint <worker>/v1/webhook
#   npx wrangler secret put LICENSE_PRIVATE_KEY     # from: npm run keygen -w @doppelpunkt/license
#   npx wrangler secret put HASH_SECRET             # openssl rand -hex 32; keep it stable (book codes and restore depend on it)
# For `wrangler dev`, copy .dev.vars.example to .dev.vars.

[[d1_databases]]
binding = "DB"
database_name = "doppelpunkt-billing"
# Replace with the id printed by `npx wrangler d1 create doppelpunkt-billing --location weur`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
