name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, unit tests, content lint, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Content lint
        run: npm run content:lint

      - name: Audio manifests up to date
        run: npm run audio:scripts -- --check

      - name: Build (content packs + web app)
        run: npm run build

      - name: Performance budget (initial JS < 200 KB gzip)
        run: npm run budget -w @doppelpunkt/web

      # Beta variant for e2e/beta (playwright.beta.config.ts): VITE_COLLECTOR_URL points at a mock
      # collector the specs serve with page.route. Same budget as the regular build.
      - name: Build the beta variant (dist-beta)
        run: npm run build:e2e-beta -w @doppelpunkt/web

      - name: Performance budget, beta variant
        run: npm run budget -w @doppelpunkt/web -- --dist dist-beta

      # Payments variant for e2e/billing (playwright.billing.config.ts): VITE_BILLING_URL points at a
      # mock billing Worker the specs serve with page.route; trusts only the public TEST key.
      - name: Build the payments variant (dist-billing)
        run: npm run build:e2e-billing -w @doppelpunkt/web

      - name: Performance budget, payments variant
        run: npm run budget -w @doppelpunkt/web -- --dist dist-billing

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (regular build, then the beta and payments builds)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/playwright-report-beta/
            apps/web/test-results-beta/
            apps/web/playwright-report-billing/
            apps/web/test-results-billing/
          retention-days: 14
